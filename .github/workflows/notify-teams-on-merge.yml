name: Notify Teams on merge to new-connection

on:
  push:
    branches:
      - new-connection

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Teams DMs
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          USER_ID_MIKE: ${{ secrets.TEAMS_USER_ID_MIKE }}
          USER_ID_VOLODIA: ${{ secrets.TEAMS_USER_ID_VOLODIA }}
          USER_ID_TOBIAS: ${{ secrets.TEAMS_USER_ID_TOBIAS }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Access Token holen
          TOKEN=$(curl -s -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${CLIENT_ID}&client_secret=${CLIENT_SECRET}&scope=https://graph.microsoft.com/.default&grant_type=client_credentials" \
            | jq -r '.access_token')

          # Nachricht
          MESSAGE="✅ <b>Merge in new-connection</b><br><br><b>Repo:</b> ${REPO}<br><b>Autor:</b> ${COMMIT_AUTHOR}<br><b>Commit:</b> ${COMMIT_SHA:0:7}<br><b>Message:</b> ${COMMIT_MSG}<br><br>🔗 https://github.com/${REPO}/commit/${COMMIT_SHA}"

          # DM senden Funktion
          send_dm() {
            RECIPIENT_ID=$1

            # 1:1 Chat erstellen (oder bestehenden abrufen)
            CHAT_ID=$(curl -s -X POST \
              "https://graph.microsoft.com/v1.0/chats" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"chatType\": \"oneOnOne\",
                \"members\": [
                  {
                    \"@odata.type\": \"#microsoft.graph.aadUserConversationMember\",
                    \"roles\": [\"owner\"],
                    \"user@odata.bind\": \"https://graph.microsoft.com/v1.0/users('${USER_ID_TOBIAS}')\"
                  },
                  {
                    \"@odata.type\": \"#microsoft.graph.aadUserConversationMember\",
                    \"roles\": [\"owner\"],
                    \"user@odata.bind\": \"https://graph.microsoft.com/v1.0/users('${RECIPIENT_ID}')\"
                  }
                ]
              }" | jq -r '.id')

            # Nachricht senden
            curl -s -X POST \
              "https://graph.microsoft.com/v1.0/chats/${CHAT_ID}/messages" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"body\": {
                  \"contentType\": \"html\",
                  \"content\": \"${MESSAGE}\"
                }
              }"
          }

          send_dm "${USER_ID_MIKE}"
          send_dm "${USER_ID_VOLODIA}"
