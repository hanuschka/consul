<!-- BlockID: N13 Externe Einbettung - Kopfzeile mit Link zum Öffnen in neuem Fenster und eingebetteter Fremdinhalt -->
<!-- Geeignet für: Geoportal, QGIS-Webkarte, 3D-Stadtmodell, Umfrage- oder App-Ansicht eines anderen Anbieters -->
<!-- ANPASSEN: Adresse im Einbettungs-Element (Attribut src) und im Button „In neuem Fenster öffnen“ ersetzen, Attribut title passend benennen. Nur eine schlichte Adresse in src eintragen: Consul stellt eingebettete Inhalte selbst auf Zwei-Klick um. Nie data-src oder einen eigenen Zustimmungs-Rahmen von Hand schreiben, sonst bleibt die Einbettung leer. Icon nur im Code-Modus tauschbar. -->
<!-- Umbruch: Titel und Satz stehen links, der Button rutscht am Handy unter den Satz; die Einbettung ist immer volle Breite und am Handy 360 px, am Desktop bis 600 px hoch. Eigene Fläche, funktioniert mit ausgeschaltetem Seitenhintergrund. -->
<!-- Typo v3: Blocktitel = Theme-H3, Satz und Button = 1rem -->

      </div>
    </div>
    <div style="flex: 1 1 12rem; max-width: 18rem; min-width: 0;"><a href="https://example.org/geoportal" target="_blank" class="button hollow" style="width: 100%; text-decoration: none; margin: 0; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; font-weight: 700;"><i class="fas fa-external-link-alt" aria-hidden="true"></i> In neuem Fenster öffnen</a></div>

</div>
