<!-- BlockID: C07 Image Slider – Vollbreite mit Lightbox -->
<!-- Foundation Orbit-Slider: navigiert ueber Pfeile und Dots -->
<!-- Lightbox: Klick auf das Hauptbild oeffnet GLightbox (durchblaetterbar) -->
<!-- ANPASSEN: src/href + alt + figcaption ersetzen -->

<div class="orbit" role="region" aria-label="Projektphasen" data-orbit>
  <div class="orbit-wrapper">
    <div class="orbit-controls">
      <button class="orbit-previous"><span class="show-for-sr">Previous Slide</span>&#9664;&#xFE0E;</button>
      <button class="orbit-next"><span class="show-for-sr">Next Slide</span>&#9654;&#xFE0E;</button>
    </div>
    <ul class="orbit-container" style="height: 500px !important">

      <li class="is-active orbit-slide">
        <figure class="orbit-figure" style="position: relative;">
          <a class="glightbox" href="https://placehold.co/1600x900/1a365d/ffffff?text=Slide+1" data-gallery="gallery-c07" data-glightbox="type: image" data-title="Auftakt-Workshop im Rathaus" data-description="Ueber 80 Buergerinnen und Buerger diskutierten Ideen fuer den Westpark." target="_blank" style="display: block; text-decoration: none;">
            <img class="orbit-image" style="height: 500px !important" referrerpolicy="no-referer" src="https://placehold.co/1200x500/1a365d/ffffff?text=Slide+1" alt="Auftakt-Workshop im Rathaus">
            <span style="position: absolute; top: 12px; right: 12px; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; width: 47px; height: 47px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: white; font-size: 30px; line-height: 1;" aria-hidden="true">
              <i class="fas fa-magnifying-glass-plus"></i>
            </span>
          </a>
          <figcaption class="orbit-caption">Phase 1 | Abgeschlossen &mdash; Auftakt-Workshop im Rathaus</figcaption>
        </figure>
      </li>

      <li class="orbit-slide">
        <figure class="orbit-figure" style="position: relative;">
          <a class="glightbox" href="https://placehold.co/1600x900/0d7e6d/ffffff?text=Slide+2" data-gallery="gallery-c07" data-glightbox="type: image" data-title="Online-Beteiligung geoeffnet" data-description="Bis 30. September koennen Ideen und Anmerkungen digital eingereicht werden." target="_blank" style="display: block; text-decoration: none;">
            <img class="orbit-image" style="height: 500px !important" referrerpolicy="no-referer" src="https://placehold.co/1200x500/0d7e6d/ffffff?text=Slide+2" alt="Online-Beteiligung geoeffnet">
            <span style="position: absolute; top: 12px; right: 12px; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; width: 47px; height: 47px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: white; font-size: 30px; line-height: 1;" aria-hidden="true">
              <i class="fas fa-magnifying-glass-plus"></i>
            </span>
          </a>
          <figcaption class="orbit-caption">Phase 2 | Laufend &mdash; Online-Beteiligung geoeffnet</figcaption>
        </figure>
      </li>

      <li class="orbit-slide">
        <figure class="orbit-figure" style="position: relative;">
          <a class="glightbox" href="https://placehold.co/1600x900/1a5c3a/ffffff?text=Slide+3" data-gallery="gallery-c07" data-glightbox="type: image" data-title="Ergebnispraesentation im Stadtrat" data-description="Im November werden die Ergebnisse oeffentlich vorgestellt und beraten." target="_blank" style="display: block; text-decoration: none;">
            <img class="orbit-image" style="height: 500px !important" referrerpolicy="no-referer" src="https://placehold.co/1200x500/1a5c3a/ffffff?text=Slide+3" alt="Ergebnispraesentation im Stadtrat">
            <span style="position: absolute; top: 12px; right: 12px; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; width: 47px; height: 47px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: white; font-size: 30px; line-height: 1;" aria-hidden="true">
              <i class="fas fa-magnifying-glass-plus"></i>
            </span>
          </a>
          <figcaption class="orbit-caption">Phase 3 | Geplant &mdash; Ergebnispraesentation im Stadtrat</figcaption>
        </figure>
      </li>

    </ul>
  </div>
  <nav class="orbit-bullets">
    <button class="is-active" data-slide="0">
      <span class="show-for-sr">First slide details.</span>
      <span class="show-for-sr" data-slide-active-label>Current Slide</span>
    </button>
    <button data-slide="1"><span class="show-for-sr">Second slide details.</span></button>
    <button data-slide="2"><span class="show-for-sr">Third slide details.</span></button>
  </nav>
</div>
