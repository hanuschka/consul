<!-- BlockID: Projekt Karten - Karte vollflächig mit Titelleiste -->
<!-- Geeignet für: Planungsgebiete, Übersichtskarten, Standorte eines Projekts -->
<!-- Der Kartenbereich wird auf der Projektseite zur echten interaktiven Karte; Platzhalter, Klassen und Kartenhöhe im Kartenbereich nicht ändern (die Höhe stellt der Editor ein). -->
<!-- Umbruch: der Titel bricht neben dem Ortssymbol um, die Karte nutzt immer die volle Breite. Eigene Fläche, funktioniert mit ausgeschaltetem Seitenhintergrund. -->
<!-- Typo v3: Titelleiste 1rem fett, keine weiteren Größen -->

<div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; margin: 0; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 14px 36px -16px rgba(16,24,40,0.18);">
  <div style="padding: 14px 20px; padding: clamp(12px, 2.5vw, 16px) clamp(16px, 4vw, 24px); display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e8edf3; background: #ffffff;">
    <span aria-hidden="true" class="js-content-block-element-not-editable" style="flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: var(--brand-color, #1779ba); color: #ffffff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 10px -4px rgba(16,24,40,0.4);"><i class="fas fa-map-marker-alt" style="font-size: 17px;"></i></span>
    <span style="flex: 1 1 auto; min-width: 0; font-size: 1rem; line-height: 1.6; font-weight: 700; hyphens: auto; overflow-wrap: break-word;">Planungsgebiet Innenstadt</span>
  </div>
  <div class="projekt-map-embed js-projekt-map-embed js-content-block-element-not-editable" data-controller="projekt-map-embed" style="height: 500px; border-radius: 0 0 12px 12px;">
    <span class="projekt-map-embed--placeholder" aria-hidden="true">
      <i class="fas fa-map-marker-alt projekt-map-embed--pin"></i>
      <span class="projekt-map-embed--label">Kartenansicht</span>
    </span>
    {{projekt_map}}
  </div>
</div>
