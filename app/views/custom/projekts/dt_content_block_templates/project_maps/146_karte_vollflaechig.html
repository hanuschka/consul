<div style="border: 1px solid #e6e9ed; border-radius: 14px; overflow: hidden; background: #ffffff;">
  <div style="padding: 14px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid #eef1f5;">
    <i class="fas fa-map-marker-alt" style="color: var(--brand-color, #1779ba); font-size: 16px;"></i>
    <span style="color: #1f2a37; font-size: 16px; font-weight: 600;">Planungsgebiet Innenstadt</span>
  </div>
  <div class="projekt-map-embed js-projekt-map-embed js-content-block-element-not-editable" data-controller="projekt-map-embed" style="height: 500px; border-radius: 0 0 14px 14px;">
    <span class="projekt-map-embed--placeholder" aria-hidden="true">
      <i class="fas fa-map-marker-alt projekt-map-embed--pin"></i>
      <span class="projekt-map-embed--label">Kartenansicht</span>
    </span>
    {{projekt_map}}
  </div>
</div>
