<div style="border: 1px solid #e6e9ed; border-radius: 14px; overflow: hidden; background: #ffffff;">
  <div style="display: flex; flex-wrap: wrap;">
    <div class="projekt-map-embed js-projekt-map-embed js-content-block-element-not-editable" data-controller="projekt-map-embed" style="flex: 1 1 320px; height: 380px; border-radius: 14px 0 0 14px;">
      <span class="projekt-map-embed--placeholder" aria-hidden="true">
        <i class="fas fa-map-marker-alt projekt-map-embed--pin"></i>
        <span class="projekt-map-embed--label">Kartenansicht</span>
      </span>
      {{projekt_map}}
    </div>
    <div style="flex: 1 1 360px; padding: 28px; display: flex; flex-direction: column; justify-content: center;">
      <div style="color: var(--brand-color, #1779ba); font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px;">Planungsgebiet Innenstadt</div>
      <h3 style="color: #1f2a37; font-size: 21px; font-weight: 700; line-height: 1.3; margin: 0 0 12px;">So verändert sich Ihr Stadtviertel</h3>
      <p style="color: #5b6573; font-size: 16px; line-height: 1.6; margin: 0 0 20px;">Die Karte zeigt geplante Maßnahmen zu Überflutungsschutz, Begrünung und Hitzeentlastung — und wo Ihre Anregungen besonders gefragt sind.</p>
      <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 22px; padding-top: 16px; border-top: 1px solid #eef1f5;">
        <div>
          <div style="color: #1f2a37; font-size: 18px; font-weight: 700; line-height: 1;">8,4 km²</div>
          <div style="color: #8a94a6; font-size: 14px; margin-top: 4px;">Planungsgebiet</div>
        </div>
        <div>
          <div style="color: #1f2a37; font-size: 18px; font-weight: 700; line-height: 1;">12.400</div>
          <div style="color: #8a94a6; font-size: 14px; margin-top: 4px;">Betroffene Adressen</div>
        </div>
      </div>
      <a href="#" class="button" style="margin: 0; align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; gap: 8px;">Karte erkunden</a>
    </div>
  </div>
</div>
