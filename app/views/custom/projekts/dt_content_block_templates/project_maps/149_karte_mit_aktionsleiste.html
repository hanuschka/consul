<!-- BlockID: Projekt Karten - Karte mit Aktionsleiste (Aufruf und Button darunter) -->
<!-- Geeignet für: Beteiligungskarten, Standortmeldungen, Kartenaufrufe mit Frist -->
<!-- Der Kartenbereich wird auf der Projektseite zur echten interaktiven Karte; Platzhalter, Klassen und Kartenhöhe im Kartenbereich nicht ändern (die Höhe stellt der Editor ein). -->
<!-- Umbruch: Aufruf und Button nebeneinander auf breiten Bildschirmen, am Handy steht der Button in voller Breite unter dem Aufruf. Eigene Fläche, funktioniert mit ausgeschaltetem Seitenhintergrund. -->
<!-- Typo v3: Aufruf 1rem fett, Hinweis und Button 1rem -->

<div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; margin: 0; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 14px 36px -16px rgba(16,24,40,0.18);">
  <div class="projekt-map-embed js-projekt-map-embed js-content-block-element-not-editable" data-controller="projekt-map-embed" style="height: 440px; border-radius: 12px 12px 0 0;">
    <span class="projekt-map-embed--placeholder" aria-hidden="true">
      <i class="fas fa-map-marker-alt projekt-map-embed--pin"></i>
      <span class="projekt-map-embed--label">Kartenansicht</span>
    </span>
    {{projekt_map}}
  </div>
  <div style="padding: 18px 20px; padding: clamp(16px, 3vw, 24px) clamp(16px, 4vw, 28px); display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; background: #eef4fa; background: linear-gradient(100deg, #e3eef8 0%, #f5f8fb 75%); background: linear-gradient(100deg, color-mix(in srgb, var(--brand-color, #1779ba) 14%, #ffffff) 0%, color-mix(in srgb, var(--brand-color, #1779ba) 4%, #ffffff) 75%); border-top: 1px solid #e8edf3;">
    <div style="flex: 999 1 16rem; min-width: 0; display: flex; align-items: center; gap: 14px;">
      <span aria-hidden="true" class="js-content-block-element-not-editable" style="flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 14px; background: var(--brand-color, #1779ba); color: #ffffff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 10px -4px rgba(16,24,40,0.4);"><i class="fas fa-map-marked-alt" style="font-size: 20px;"></i></span>
      <div style="flex: 1 1 auto; min-width: 0;">
        <span style="display: block; font-size: 1rem; line-height: 1.6; font-weight: 700;">Wo sehen Sie Handlungsbedarf?</span>
        <span style="display: block; font-size: 1rem; line-height: 1.6;">Tragen Sie Ihren Standort auf der Karte ein – Beteiligung möglich bis 15. August 2026.</span>
      </div>
    </div>
    <div style="flex: 1 1 16rem; max-width: 18rem; min-width: 0;"><a href="#" class="button" style="width: 100%; text-decoration: none; margin: 0; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; font-weight: 700; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 6px 14px -6px rgba(16,24,40,0.45);"><i class="fas fa-map-marker-alt" aria-hidden="true"></i> Vorschlag einreichen</a></div>
  </div>
</div>
