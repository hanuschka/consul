<div style="border: 1px solid #e6e9ed; border-radius: 14px; overflow: hidden; background: #ffffff;">
  <div class="projekt-map-embed js-projekt-map-embed js-content-block-element-not-editable" data-controller="projekt-map-embed" style="height: 440px; border-radius: 14px 14px 0 0;">
    <span class="projekt-map-embed--placeholder" aria-hidden="true">
      <i class="fas fa-map-marker-alt projekt-map-embed--pin"></i>
      <span class="projekt-map-embed--label">Kartenansicht</span>
    </span>
    {{projekt_map}}
  </div>
  <div style="padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: #f7f8fa; border-top: 1px solid #eef1f5;">
    <div style="flex: 1 1 240px;">
      <div style="color: #1f2a37; font-size: 16px; font-weight: 600; line-height: 1.3; margin-bottom: 4px;">Wo sehen Sie Handlungsbedarf?</div>
      <div style="color: #5b6573; font-size: 14px; line-height: 1.4;">Tragen Sie Ihren Standort auf der Karte ein — Beteiligung möglich bis 15. August 2026.</div>
    </div>
    <a href="#" class="button" style="margin: 0; flex-shrink: 0; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;">
      <i class="fas fa-map-marker-alt"></i>
      Vorschlag einreichen
    </a>
  </div>
</div>
