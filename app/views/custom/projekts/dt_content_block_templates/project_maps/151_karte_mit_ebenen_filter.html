<div style="border: 1px solid #e6e9ed; border-radius: 14px; overflow: hidden; background: #ffffff;">
  <div style="padding: 16px 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid #eef1f5;">
    <span style="color: #8a94a6; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-right: 4px;">Ebene:</span>
    <span style="display: inline-flex; align-items: center; min-height: 34px; padding: 6px 16px; border-radius: 999px; background: var(--brand-color, #1779ba); color: #ffffff; font-size: 14px; font-weight: 600;">Alle Maßnahmen</span>
    <span style="display: inline-flex; align-items: center; min-height: 34px; padding: 6px 16px; border-radius: 999px; border: 1px solid #d8dde3; color: #5b6573; font-size: 14px;">Hochwasserschutz</span>
    <span style="display: inline-flex; align-items: center; min-height: 34px; padding: 6px 16px; border-radius: 999px; border: 1px solid #d8dde3; color: #5b6573; font-size: 14px;">Begrünung</span>
    <span style="display: inline-flex; align-items: center; min-height: 34px; padding: 6px 16px; border-radius: 999px; border: 1px solid #d8dde3; color: #5b6573; font-size: 14px;">Beschattung</span>
  </div>
  <div class="projekt-map-embed js-projekt-map-embed js-content-block-element-not-editable" data-controller="projekt-map-embed" style="height: 440px; border-radius: 0 0 14px 14px;">
    <span class="projekt-map-embed--placeholder" aria-hidden="true">
      <i class="fas fa-map-marker-alt projekt-map-embed--pin"></i>
      <span class="projekt-map-embed--label">Kartenansicht</span>
    </span>
    {{projekt_map}}
  </div>
</div>
