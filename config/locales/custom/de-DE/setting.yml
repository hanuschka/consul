de:
  custom:
    settings:
      ai:
        llm_provider: KI-Anbieter
        llm_provider_description: Legt fest, welcher KI-Dienstanbieter für alle KI-gestützten Funktionen der Plattform genutzt wird. Unterstützt werden unter anderem OpenAI, Anthropic, Google Gemini, DeepSeek, Mistral und weitere Anbieter. Die Auswahl bestimmt, über welche Schnittstelle Anfragen verarbeitet werden. Änderungen wirken sich auf alle aktiven KI-Funktionen aus.
        llm_model: KI-Modell
        llm_model_description: Bestimmt, welches Sprachmodell des gewählten Anbieters für die Verarbeitung von KI-Anfragen verwendet wird. Unterschiedliche Modelle variieren in Qualität, Geschwindigkeit und Kosten. Wählen Sie ein leistungsstarkes Modell für komplexe Analysen oder ein schnelleres für einfache Aufgaben wie Texterstellung und Zusammenfassungen.
        llm_custom_model: Benutzerdefiniertes Modell
        llm_custom_model_description: Benutzerdefinierter Modellname (für Ollama oder bei benutzerdefiniertem API-Endpunkt)
        llm_api_endpoint: API-Endpunkt
        llm_api_endpoint_description: Benutzerdefinierte API-Endpunkt-URL für OpenAI-kompatible Dienste (z. B. Azure OpenAI, Proxy-Dienste)
        evaluation_context: Globaler KI-Kontext
        evaluation_context_description: Hier hinterlegen Sie einmalig Hintergrundinformationen zu Ihrer Kommune, zum Beispiel Name und Größe, die gewünschte Anrede, Namen von Ortsteilen, Schreibweisen und thematische Schwerpunkte. Der Text wird nirgends öffentlich angezeigt, sondern fließt in alle KI-Auswertungen ein, die danach auf dieser Plattform erzeugt werden. Füllen Sie das Feld aus, damit KI-Auswertungen von Anfang an zu Ihrer Kommune passen.
        llm_api_key: API-Schlüssel
        llm_api_key_description: Der API-Schlüssel authentifiziert Ihre Plattform gegenüber dem gewählten KI-Anbieter. Den Schlüssel erhalten Sie im Entwicklerportal des jeweiligen Anbieters. Er wird verschlüsselt gespeichert und ist nach dem Speichern aus Sicherheitsgründen nicht mehr im Klartext einsehbar. Ohne gültigen Schlüssel sind keine KI-Funktionen verfügbar.
