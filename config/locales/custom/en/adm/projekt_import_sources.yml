            blank: Please enter the address of a projekt.
            invalid: This address could not be read.
            unreachable: The projekt could not be fetched from this address.
            empty: No projekt was found at this address.
            unsupported_format: This projekt is in format %{version}, which this platform cannot read.
            bundle_missing: The fetched projekt data is no longer available. Please start over.
