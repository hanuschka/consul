            blank: Please enter an address.
            invalid: This address could not be read.
            scheme: Please enter a full address starting with http:// or https://.
            private_address: This address points into an internal network and cannot be fetched.
            unreachable: The page could not be reached.
            timeout: The page did not answer in time.
            tls: The encrypted connection to this page could not be established.
            not_found: No page was found at this address.
            http_status: The page answered with error %{status}.
            too_many_redirects: This address redirects too many times.
            content_type: There is no readable web page at this address.
            empty: This page contains no text.
            unreadable: No usable text could be read from this page.
