  projekt_phase_setting:
    proposal_phase:
      feature:
        resource:
          create_proposal_with_ai: Vorschlag mit KI erstellen
          create_proposal_with_ai_description: Aktiviert die Schaltfläche "Vorschlag mit KI erstellen" im Frontend. Nutzer können dann mithilfe eines KI-Assistenten Vorschläge formulieren lassen, indem sie ihr Anliegen in eigenen Worten beschreiben. Die KI unterstützt bei Titel, Zusammenfassung und Beschreibung. Der entstandene Entwurf bleibt vor dem Einreichen vollständig editierbar.
    budget_phase:
      feature:
        resource:
          create_proposal_with_ai: Vorschlag mit KI erstellen
          create_proposal_with_ai_description: Aktiviert die Schaltfläche "Vorschlag mit KI erstellen" im Frontend. Nutzer können dann mithilfe eines KI-Assistenten Vorschläge formulieren lassen, indem sie ihr Anliegen in eigenen Worten beschreiben. Die KI unterstützt bei Titel, Zusammenfassung und Beschreibung. Der entstandene Entwurf bleibt vor dem Einreichen vollständig editierbar.
          create_investment_with_ai: Investitionsvorschlag mit KI erstellen
          create_investment_with_ai_description: Aktiviert die Schaltfläche "Investitionsvorschlag mit KI erstellen" im Frontend. Nutzer können mithilfe eines KI-Assistenten einen Investitionsvorschlag formulieren lassen, indem sie ihr Anliegen in eigenen Worten beschreiben. Die KI unterstützt bei Titel, Zusammenfassung und Beschreibung. Der Entwurf bleibt vor dem Einreichen vollständig editierbar.
