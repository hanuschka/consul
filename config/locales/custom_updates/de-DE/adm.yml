          empty_description: Diese Funktion muss zunächst durch demokratie.today für Ihre Plattform freigeschaltet werden. Bitte wenden Sie sich an Ihren Ansprechpartner bei demokratie.today, um den KI Sprachassistenten zu aktivieren.
          questions: Welche Fragen sollen den Bürgern gestellt werden?
          questions_hint: Definieren Sie die Fragen, die der KI-Sprachassistent den Bürgern bei der Eingabe ihrer Beiträge stellt. Diese Fragen leiten Nutzer durch die Erstellung ihres Vorschlags. Lassen Sie das Feld leer, um die im Platzhalter angezeigten Standardfragen zu verwenden. Mehrere Fragen können zeilenweise aufgelistet werden.
          criteria: Welche Kriterien müssen die Vorschläge erfüllen?
          criteria_hint: Legen Sie die Kriterien fest, anhand derer der KI-Sprachassistent eingereichte Beiträge prüft und einordnet. Lassen Sie das Feld leer, um die im Platzhalter angezeigten Standardkriterien zu verwenden. Klare und präzise Kriterien verbessern die Analysequalität.
          parting_words: Welche Abschiedsworte soll der KI-Assistent mitgeben?
          parting_words_hint: Die Abschiedsworte werden vom KI-Sprachassistenten am Ende des Dialogs ausgegeben. Lassen Sie das Feld leer, um die im Platzhalter angezeigten Standardformulierungen zu verwenden.
