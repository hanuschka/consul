de:
  custom:
    deficiency_reports:
      mailers:
        closing: Freundliche Grüße
        signature: Ihre Stadtverwaltung Rastatt
        contact_info: Bei inhaltlichen Fragen wenden Sie sich bitte an <a href="mailto:%{email}">%{email}</a> Gerne auch telefonisch unter 07222/972-1103.
        notify_author_about_status_change:
          subject: Statusänderung Ihres Mangels
          hi: Hallo
          p1: der Status des von Ihnen eingereichten Mangels wurde geändert.
        notify_officer:
          subject: Neue Meldung %{identifier}
          hi: Liebe/r Sachbearbeiter*in,
          p1: Ihnen wurde eine Meldung vom Admin zugewiesen.
          adm_page: "Zur Bearbeitung gelangen Sie hier:"
          adm_page_link_text: Meldung im Verwaltungsbereich öffnen
          public_page: "Das Anliegen ist öffentlich einsehbar:"
          public_page_link_text: Öffentliche Ansicht
        send_feedback_form_link:
          subject: Feedback zu Ihrem Anliegen
          hi: Guten Tag %{username},
          p1: "Ihr Anliegen %{deficiency_report_link} wurde mit folgendem Status abgeschlossen: <strong>%{status}.</strong>"
          p2: Wir hoffen, dass Sie mit der Bearbeitung zufrieden sind.
          p3: "Um unseren Service weiter zu verbessern, freuen wir uns über Ihr kurzes Feedback: %{feedback_form_link}."
          feedback_form_link_text: Feedback-Formular
          p4: Vielen Dank für Ihre Unterstützung!
        notify_author_about_submission:
          subject: Eingangsbestätigung Ihrer Meldung
          hi: "Hallo %{username},"
          p1: "vielen Dank für Ihre %{deficiency_report_link}. Ihr Beitrag wurde erfolgreich übermittelt."
          deficiency_report_link_text: Mängelmeldung
          p2_pending_review: "Bitte beachten Sie, dass Ihre Meldung derzeit <strong>noch nicht öffentlich sichtbar ist</strong>. Unser Anliegenmanagement prüft den Inhalt zunächst, bevor er freigegeben und veröffentlicht werden kann."
          p2_published: "Ihre Meldung ist ab sofort öffentlich sichtbar."
          p3: "Sie erhalten automatisch eine E‑Mail, sobald sich der Status Ihrer Meldung ändert."
          p4: "In Ihrem %{account_link} können Sie jederzeit nachvollziehen, welche Beiträge Sie eingereicht haben."
          account_link_text: Benutzerkonto

