    images:
      index:
        title: Admin-Bilder
        description: Zeigt alle Bilder, die von Administratoren und Projektmanagern hochgeladen wurden — z. B. über den Dateimanager im Inhaltsblock-Editor oder auf der Projekt-Bearbeitungsseite. Nutzen Sie diese Seite, um Bilddateien hochzuladen, zu prüfen, umzubenennen oder zu löschen.
    documents:
      index:
        title: Übersicht aller Dokumente
        description: Zeigt alle Dokumente, die von Administratoren und Projektmanagern hochgeladen wurden — z. B. über den Dateimanager im Inhaltsblock-Editor oder auf der Projekt-Bearbeitungsseite. Nutzen Sie diese Seite, um Dokumente hochzuladen, zu prüfen, umzubenennen oder zu löschen.
    resource_images:
      index:
        title: Übersicht aller Ressourcen-Bilder
        description: Zeigt alle Bilder, die mit Inhalten der Plattform verknüpft sind — z. B. Projekte, Vorschläge, Seiten und Umfragen. Benutzer-Avatare werden nicht angezeigt. Nutzen Sie diese Seite, um Bilddateien systemweit zu prüfen, umzubenennen oder zu löschen.
    resource_documents:
      index:
        title: Übersicht aller Ressourcen-Dokumente
        description: Zeigt alle Dokumente, die mit Inhalten der Plattform verknüpft sind — z. B. Dateien, die Autoren zu Vorschlägen oder zu Projekt-Meilensteinen hinzugefügt haben. Diese Dokumente werden über die Formulare der Inhalte hochgeladen, nicht über den Dateimanager. Nutzen Sie diese Seite, um Dokumente systemweit zu prüfen, umzubenennen oder zu löschen.
    empty:
      images:
        title: Noch keine Bilder
        description: Hier sind noch keine Bilder vorhanden. Laden Sie eine Datei hoch, um zu beginnen.
      documents:
