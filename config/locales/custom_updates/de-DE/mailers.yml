      reason: "Begründung:"
      text3: "Sollten Sie dazu Fragen haben, kontaktieren Sie uns gerne."
      projekt_link_text: Projekts
      sincerely: Mit freundlichen Grüßen
    manual_verification_confirmation:
      subject: Ihr Konto wurde soeben verifiziert.
      p1: Ihr Konto wurde soeben verifiziert.
      p2: Vielen Dank für Ihre Teilhabe.
    formular_answer_confirmation:
      subject: Vielen Dank! Ihr Formular wurde erfolgreich eingereicht.
      p1: Herzlichen Dank für die Einreichung Ihres Formulars. Wir werden die Daten jetzt intern prüfen und ggf. wieder auf Sie zukommen.
    formular_follow_up_letter:
      button_text: Zum Formular
    budget_investment_feasible:
      subject: "Herzlichen Glückwunsch, Ihr Vorschlag entspricht den Kriterien."
      title: "Herzlichen Glückwunsch, Ihr Vorschlag entspricht den Kriterien."
      hi: "Hallo %{username},"
      projekt_link_1_text: Kriterien
      projekt_link_2_text: Projekts
      text: "wir haben Ihren Vorschlag %{proposal_link} geprüft: Ihr Vorschlag entspricht den %{projekt_link_1}. Damit wird er zur nächsten Phase des %{projekt_link_2} zugelassen."
      sincerely: Mit freundlichen Grüßen
    newsletter_subscription_for_existing_user:
      subject: Anmeldung zum Newsletter
      p1_html: Es gab einen Versuch, sich mit Ihrer E-Mail-Adresse für unseren Newsletter anzumelden. Da Sie bereits über ein Consul-Konto verfügen, möchten wir Sie bitten, sich einzuloggen und die Option zum Empfang des Newsletters in Ihren <a href=%{link}>Konto-Einstellungen</a> zu aktivieren.
    csv_download_ready:
      subject: Daten-Export
      p1_html: 'Sie haben einen Export beantragt. Die Daten wurden exportiert und stehen zum Download bereit: <a href="%{url}">CSV herunterladen</a>'
    file_ready:
      subject: Daten-Export
      p1_html: Sie haben einen Export beantragt. Die Daten wurden nun exportiert und sind im Anhang anbei.
    individual_group_value_users_added:
      subject: Upload der CSV-Daten erfolgreich abgeschlossen.
      p1_html: "Ihre Daten wurden erfolgreich hinzugefügt: <a href=\"%{url}\">%{url}</a>"
    resource_hidden:
      subject: Ihr Vorschlag verstößt gegen die Zulassungsbedingungen.
      hi: "Hallo %{username},"
      text1_html: "wir haben Ihren Themenvorschlag %{text_link} geprüft."
      text2: "Leider verstößt er gegen die Zulassungsbedingungen unserer Themenwahl. Wir haben Ihren Vorschlag daher entfernt."
      text3: Die Zulassungsbedingungen können Sie %{netiquette_link} nachlesen.
      netiquette_link_text: hier
      text4: Sollten Sie dazu Fragen haben, kontaktieren Sie uns gerne. Sie sind herzlich eingeladen, einen neuen Beitrag zu erstellen, der die Zulassungsbedingungen einhält.
      sincerely: Mit freundlichen Grüßen
      signature: Ihr Team von ABSTIMMUNG21
    comment:
      subject: Ihr Vorschlag wurde kommentiert.
      title: Ihr Vorschlag wurde kommentiert.
      hi: "Hallo %{username},"
      text: Ihr Vorschlag wurde kommentiert. Schauen Sie sich den Kommentar %{comment_link} an. 
      comment_link_text: hier
      sincerely: Mit freundlichen Grüßen
    reply:
      subject: Es wurde auf Ihren Kommentar geantwortet.
      title: Es wurde auf Ihren Kommentar geantwortet.
      hi: Hallo %{username},
      text: "Ein anderer Nutzer hat auf Ihren Kommentar geantwortet. Sehen Sie sich die Antwort hier an: %{comment_link}"
      comment_link_text: hier
      sincerely: Mit freundlichen Grüßen
    budget_investment_preselected:
      subject: Herzlichen Glückwunsch, Ihr Vorschlag geht in die nächste Runde!
      title: Herzlichen Glückwunsch, Ihr Vorschlag geht in die nächste Runde!
      hi: "Hallo %{username},"
      text1: Ihr Vorschlag %{proposal_link} hat ausreichend Stimmen erhalten und wird nun fachlich geprüft.
      text2: Das Ergebnis der Prüfung wird zu Beginn der nächsten Phase des %{projekt_link} veröffentlicht.
      projekt_link_text: Projekts
      sincerely: Mit freundlichen Grüßen
    budget_investment_not_preselected:
      subject: Schade, Ihr Vorschlag hat es leider nicht in die nächste Runde geschafft.
      title: Schade, Ihr Vorschlag hat es leider nicht in die nächste Runde geschafft.
      hi: "Hallo %{username},"
      text1: Ihr Vorschlag %{proposal_link} hat leider nicht genügend Stimmen erhalten.
      text2: Er wird daher nicht zur nächsten Phase des %{projekt_link} zugelassen.
      projekt_link_text: Projekts
      sincerely: Mit freundlichen Grüßen
    proposal_created:
      subject: "Vielen Dank für Ihren eingereichten Vorschlag!"
      hi: "Hallo %{username},"
      intro_html: "Ihr Vorschlag ist erfolgreich eingegangen: %{proposal_link}"
      thanks: "Vielen Dank für Ihr Engagement – wir freuen uns sehr, dass Sie sich an der Themenwahl beteiligen!"
      next_steps_title: "Wie es jetzt weitergeht"
      next_steps_intro: "Die Themenwahl verläuft in drei Stufen:"
      stage1_title: "1. Stufe: 10 Unterstützungsstimmen sammeln"
      stage1_p1: "Zunächst ist Ihr Thema noch nicht öffentlich. Nur wer den obigen Link von Ihnen bekommt, kann den Vorschlag sehen und unterstützen."
      stage1_tip: "Tipp: Damit Ihr Vorschlag schnell die ersten 10 Stimmen erreicht, hilft es sehr, wenn Sie ihn direkt mit Freundinnen, Freunden und Bekannten teilen – zum Beispiel über WhatsApp, Signal oder in sozialen Medien. Nutzen Sie dafür einfach den Link zu Ihrem Vorschlag oder die Teilen-Symbole auf Ihrer Themenseite."
      stage1_template_intro: "Unten finden Sie einen kurzen Textvorschlag, den Sie dafür verwenden können."
      stage2_title: "2. Stufe: Themenwahl"
      stage2_p1: "Sobald Sie für Ihr Thema 10 Stimmen gesammelt haben, erscheint es in der Gesamtübersicht und alle Besucherinnen und Besucher können es unterstützen."
      stage2_p2: "Die 20 Themen mit den meisten Stimmen ziehen in die Finalrunde vom 1. bis 15. April ein."
      stage2_p3_html: "Kurz vor Beginn der Finalrunde prüfen wir die aussichtsreichen Themen genauer darauf, ob sie unseren Zulassungskriterien entsprechen (z.B. Zuständigkeit des Bundestages, konkrete Forderung vorhanden). Um spätere Überraschungen zu vermeiden, empfehlen wir Ihnen, Ihren Vorschlag noch einmal durchzugehen und ihn gegebenenfalls bis zum 31. März anzupassen (%{faq_link})."
      stage3_title: "3. Stufe: Finalrunde im April"
      stage3_p1: "Erreicht Ihr Thema am Ende einen Platz unter den Top 3, erscheint es auf dem Stimmzettel für die Volksabstimmung im Herbst. Für die weitere Ausarbeitung der Abstimmungsvorlage setzen wir uns persönlich mit Ihnen in Verbindung."
      contact_html: "Bei Fragen stehen wir Ihnen gerne unter %{email_link} zur Verfügung."
      closing: "Viel Erfolg und herzliche Grüße"
      signature: "Ihr Team von ABSTIMMUNG21"
      share_title: "Textvorschlag zum Teilen"
      share_greeting: "Hallo,"
      share_text: "ich habe mein Thema \u201E%{proposal_title}\u201C bei ABSTIMMUNG21 eingereicht, damit er die Chance hat, auf den Stimmzettel für die fünfte bundesweite Volksabstimmung im Herbst 2026 zu kommen. Dafür braucht es die Unterstützung vieler Menschen, denn nur die drei Themen mit den meisten Unterzeichnungen schaffen es in die Volksabstimmung."
      share_link_text: "Hier kannst du mehr über das Thema und die Themenwahl erfahren – und meinen Vorschlag unterzeichen:"
      share_closing: "Viele Grüße"
      share_signature: "Ihr Name"
    new_valuator_assignment:
      subject: Ihnen wurde ein Vorschlag zur Begutachtung zugewiesen
      hi: "Hallo %{username},"
      text1: "Ihnen wurde ein Vorschlag zur Begutachtung zugewiesen: %{valuation_link}"
    existing_stamp_notify_existing_user:
      subject: Verifizierungsversuch über eine andere E-Mail-Adresse
      hi: "Hallo %{username},"
      p1: soeben wurde ein Verifizierungsversuch mit Ihren Daten über eine andere E-Mail-Adresse unternommen. Bitte verwenden Sie weiterhin diese E-Mail-Adresse für Ihren Zugang zu Consul.
      p2: Wenn Sie Ihre E-Mail-Adresse ändern möchten, loggen Sie sich bitte mit dieser E-Mail Adresse bei Consul ein und nehmen die Änderung in Ihren Kontoeinstellungen vor.
    existing_stamp_notify_new_user:
      subject: Verwendung der bestehenden E-Mail-Adresse
      hi: "Hallo,"
      p1: bitte nutzen Sie die E-Mail-Adresse, mit der Sie sich ursprünglich registriert haben, um sich in Ihren Account einzuloggen.
      p2: Wenn Sie Ihre ursprünglich hinterlegte E-Mail-Adresse ändern möchten, loggen Sie sich bitte mit der bestehenden Adresse bei Consul ein und nehmen die Änderung in Ihren Kontoeinstellungen vor. Sollten Sie den Verifizierungsversuch nicht initiiert haben, dann wenden Sie sich bitte an die Administratoren der Beteiligungssoftware.
    projekt_event_registration_confirmation:
      body: "Hallo %{name}, bitte bestätigen Sie Ihre Anmeldung zur Veranstaltung \"%{event}\", indem Sie auf den folgenden Link klicken."
      confirm_link: "Anmeldung bestätigen"
    user_verification_failed:
      subject: Verifizierungsversuch fehlgeschlagen
      hi: "Hallo %{username},"
      p1: bei der Verifizierung über das Melderegister gab es leider keinen Treffer. Das passiert gelegentlich – meist aus formalen Gründen.
      b1_title: Häufige Ursachen
      b1_item1: Schreibweise weicht ab (Umlaute, Bindestriche, Zweitnamen, Reihenfolge der Vornamen).
      b1_item2: Adresse nicht exakt wie im Melderegister (Hausnummer-Zusätze, Treppenhaus/Etage, PLZ/Ortsteil).
      b1_item3: Vor kurzem umgemeldet – Datenbank noch nicht aktualisiert.
      b1_item4: Geburtsdatum oder -ort weicht ab.
      b1_item5: Auskunfts- oder Übermittlungssperre beim Einwohnermeldeamt.
      b1_item6: Tippfehler (z. B. „ß/ss“, Leerzeichen, führende Nullen).
      b1_item7: Es besteht bereits ein verifiziertes Nutzerkonto mit einer anderen E-Mail-Adresse von Ihnen.
      b2_title: So lösen Sie das Problem
      b2_item1: "Öffnen Sie Ihre Verifizierung erneut: %{link}"
      b2_item2: "Übernehmen Sie Namen und Adresse exakt wie im Ausweis/Meldebescheinigung. – Mehrteilig? Bitte vollständig angeben (z. B. „Müller-Schmidt“)."
      b2_item3: "Wenn Sie sich kürzlich umgemeldet haben: Warten Sie 1–2 Werktage und versuchen Sie es erneut."
      b2_item4: "Bei Auskunfts-/Übermittlungssperre: Kontaktieren Sie uns direkt"
      b2_item5: "Bereits verifiziertes Nutzerkonto: Melden Sie sich mit Ihrem alten Nutzerkonto (Ihrer anderen E-Mail-Adresse) an. Nutzen Sie ggf. die „Passwort vergessen“ Funktion. Anschließend können Sie Ihr Nutzerkonto verwalten (z.B. Konto löschen). Wenn Sie Hilfe benötigen, kontaktieren Sie uns direkt."
