        p2_html: <strong>Sie sind innerhalb des Stadtgebietes wohnhaft?</strong><br>Unter <a href="%{base_url}/account">%{base_url}/account</a> können Sie Ihre persönlichen Daten überprüfen und sich erneut verifizieren. Achten Sie hierbei auf die exakt richtige Schreibweise Ihrer persönlichen Daten.
        p3_html: <strong>Sie sind weggezogen?</strong><br>Auch als Auswärtiger können Sie weiterhin an vielen Beteiligungsprojekten auf der Mitmachen-Plattform teilnehmen. Ändern Sie bitte Ihren Wohnort unter <a href="%{base_url}/account">%{base_url}/account</a>.
        p4_html: Für Rückfragen stehen wir Ihnen jederzeit gerne zur Verfügung.
        signature_html: Vielen Dank für Ihre Teilhabe.
