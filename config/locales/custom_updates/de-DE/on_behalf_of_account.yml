de:
  attributes:
    company_name: Firma
    on_behalf_of_company_name: Firma
    on_behalf_of_email: E-Mail-Adresse
  custom:
    on_behalf_of_account:
      company_name:
        label: Firma
        placeholder: z. B. Musterbau GmbH
      email:
        label: E-Mail-Adresse
        placeholder: z. B. maria.musterfrau@example.com
        description: >
          Optional. Der Beitrag wird dem Benutzerkonto mit dieser E-Mail-Adresse zugeordnet.
          Existiert noch kein Konto, wird eines angelegt, sofort freigeschaltet und per E-Mail
          darüber informiert. Ein bereits vorhandenes Konto wird nur verknüpft.
      errors:
        blocked_account: Für diese E-Mail-Adresse existiert ein gesperrtes Benutzerkonto. Bitte wenden Sie sich an die Administration.
      mailers:
        closing: Freundliche Grüße
        signature: Ihr Beteiligungsteam
        account_created:
          subject: Ihr Benutzerkonto wurde angelegt
          hi: "Hallo %{username},"
          p1: >
            für Sie wurde ein Benutzerkonto mit der E-Mail-Adresse %{email} angelegt, weil ein
            Beitrag in Ihrem Namen eingereicht wurde. Das Konto ist bereits freigeschaltet.
          p2: >
            Um sich anzumelden, vergeben Sie bitte zunächst ein Passwort: %{password_link}.
          password_link_text: Passwort vergeben
          p3: >
            Der Link ist aus Sicherheitsgründen nur begrenzt gültig. Ist er bereits abgelaufen,
            können Sie sich hier einen neuen zusenden lassen: %{password_reset_link}.
          password_reset_link_text: neuen Link anfordern
