            show_follow_button_in_proposal_sidebar: Folgen
            show_follow_button_in_proposal_sidebar_description: Aktivieren Sie die Funktion “Vorschlag folgen”
            show_community_button_in_proposal_sidebar: Arbeitskreise
            show_community_button_in_proposal_sidebar_description: Aktivieren Sie die Funktion “Arbeitskreise” für Vorschläge
            show_related_content: Verwandte Inhalte
            show_related_content_description: Aktivieren Sie die Funktion “Verwandte Inhalte” für Vorschläge
