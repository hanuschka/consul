          form:
            allow_attached_image: Titelbild
            allow_attached_image_description: Ermöglicht es den Bürger*innen ein Titelbild hinzuzufügen.
            enable_summary: "\"Zusammenfassung\" anzeigen"
            enable_summary_description: "Zeigt das Feld \"Zusammenfassung\" in den Vorschlägen an"
            labels: Labels
            labels_description: Aktivieren Sie Labels, um Ihr Projekt zusätzlich zu strukturieren
            sentiments: Sentiments
            sentiments_description: Aktivieren Sie Sentimente, um den Nutzer zu ermöglichen Gefühle auszurücken
            show_map: Karte
            show_map_description: Zeigt die Karte für Vorschläge in diesem Projekt an
            enable_geoman_controls_in_maps: Polygone in Karte
            enable_geoman_controls_in_maps_description: Ermöglicht es den Nutzer*innen Rechtecke, Kreise etc. einzuzeichnen.
            allow_attached_documents: Dokumente
            allow_attached_documents_description: Ermöglicht es den Nutzer:innen Dokumente den Vorschlägen anzuhängen
