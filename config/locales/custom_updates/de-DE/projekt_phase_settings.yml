de:
  custom:
    projekt_phase_settings:
      debates:
        feature:
          general:
            only_admins_create_debates: Nur Admins können neue Diskussionen erstellen
            only_admins_create_debates_description: Die Erstellung von neuen Diskussionen ist auf Admins beschränkt
          form:
            allow_attached_image: Titelbild hinzufügen
            allow_attached_image_description: Ermöglicht es den Bürger*innen ein Titelbild hinzuzufügen.
            allow_attached_documents: Zusätzliche Dokumente
            allow_attached_documents_description: Ermöglicht es den Nutzer:innen Dokumente der Diskussion anzuhängen
