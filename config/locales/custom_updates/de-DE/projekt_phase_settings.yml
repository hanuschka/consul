            anonimize_authors: Beiträge anonym erstellen
            anonimize_authors_description: Autorenkacheln werden im Frontend nicht angezeigt.
          resource:
            users_can_create_proposals: Vorschläge einreichen
            users_can_create_proposals_description: Nutzer können Vorschläge erstellen
            create_proposal_with_ai: Vorschlag mit KI erstellen
