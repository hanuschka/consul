            allow_voting: Unterstützung von Diskussionen
            allow_voting_description: Aktivieren Sie die Unterstützung von Diskussionen mit Daumen hoch und runter
            allow_downvoting: Downvotes aktivieren
            allow_downvoting_description: Aktivieren Sie den "Daumen nach unten"-Button
            show_report_button_in_sidebar: Diskussion melden
            show_report_button_in_sidebar_description: Aktivieren Sie die Melden-Funktion für Diskussionen
            show_related_content: Verwandte Inhalte
            show_related_content_description: Aktivieren Sie die Funktion “Verwandte Inhalte” für Diskussionen
            show_comments: Kommentare
            show_comments_description: Aktivieren Sie "Kommentare" für das Diskussionsmodul
      comments:
        feature:
          general:
            public_kpi_stats: Kennzahlen öffentlich anzeigen
            public_kpi_stats_description: Zeigt die Kennzahlen (KPI) auch für nicht-administrative Nutzer an
            public_ai_stats: KI-Analyse öffentlich anzeigen
            public_ai_stats_description: Zeigt die KI-Analyse auch für nicht-administrative Nutzer an
      proposals:
        feature:
          general:
            browse_mode_in_phase_footer: Blättern Modus im Vorschlags-Footer
            browse_mode_in_phase_footer_description: Ermöglicht es einzeln durch die Vorschläge zu blättern
            browse_mode_in_phase_footer_by_default: Blättern Modus als Standard festlegen
            browse_mode_in_phase_footer_by_default_description: Nutzer, die auf die Seite kommen starten direkt im Blättern-Modus
