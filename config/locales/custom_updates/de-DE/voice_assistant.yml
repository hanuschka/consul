de:
  custom:
    voice_assistant:
      title: "KI-Sprachassistent"
      dock_name: "KI-Sprachassistent"
      open: "KI-Sprachassistent öffnen"
      ai_notice: "Sie sprechen mit einem KI-Assistenten."
      ai_notice_details_label: "Mehr über den KI-Assistenten"
      ai_notice_details:
        title: "Sie sprechen mit einer künstlichen Intelligenz"
        text: "Der Assistent ist ein KI-Sprachmodell und kein Mensch. Er hört zu, während Sie Ihre Idee schildern, und formuliert daraus einen Entwurf."
        voice_term: "Ihre Spracheingabe"
        voice_text: "Solange das Gespräch läuft, wird Ihre Stimme zur Verarbeitung an einen KI-Dienst übertragen."
        draft_term: "Der Entwurf"
        draft_text: "Titel und Beschreibung werden automatisch ausgefüllt, je nach Formular auch Kategorie, Ort, Schlagworte und ein Bild."
        note_label: "Sie behalten die Kontrolle"
        note_text: "Es wird nichts automatisch eingereicht. Prüfen und ändern Sie den Entwurf, bevor Sie ihn absenden."
      starting: "Verbinden…"
      listening: "Hört zu…"
      muted: "Mikrofon stummgeschaltet"
      mic_start: "Gespräch starten"
      mic_stop: "Mikrofon stummschalten"
      mic_unmute: "Stummschaltung aufheben"
      close: "Schließen"
