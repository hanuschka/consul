          hate: Der Text richtet sich herabwürdigend gegen Menschen oder Gruppen.
          violence: Der Text enthält Drohungen oder ruft zu Gewalt auf.
          harassment: Der Text greift eine einzelne Person persönlich an.
          sexual: Der Text enthält sexuelle Inhalte.
          illegal: Der Text ruft zu strafbaren Handlungen auf oder verbreitet solche Inhalte.
