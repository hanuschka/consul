            📣 Es gibt ein neues Beteiligungsprojekt bei %{portal_name}.
            %{url}
          deadline_approaching: |-
            ⏳ Nur noch wenige Tage: Die Frist für Vorschläge läuft bald ab.
            %{url}
          deadline_passed: |-
            🏁 Die Frist ist abgelaufen. Hier ist das Ergebnis:
            %{url}
          status_change: |-
            🔔 Es gibt eine Neuigkeit zu Ihrem Vorschlag.
            %{url}
      proposal:
        prompt: '🏗️ Neues Projekt: %{projekt}. Haben Sie dazu eine konkrete Idee?'
