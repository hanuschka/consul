de:
  whatsapp:
    account:
      title: WhatsApp
      not_linked: >-
        Deine WhatsApp-Nummer ist noch nicht mit diesem Konto verbunden. Schreibe dem
        Beteiligungs-Bot auf WhatsApp, um die Verbindung zu starten.
      subscribed: "Verbundene Nummer: %{phone}. Du erhältst Benachrichtigungen zu neuen Projekten."
      opted_out: "Verbundene Nummer: %{phone}. Du erhältst derzeit keine Benachrichtigungen."
      opt_in: Benachrichtigungen aktivieren
      opt_out: Keine Benachrichtigungen mehr erhalten
    link:
      success: Deine WhatsApp-Nummer ist jetzt mit deinem Konto verbunden.
      failure: >-
        Dieser Link ist nicht mehr gültig. Schreibe dem Bot erneut auf WhatsApp, um einen
        neuen Link zu erhalten.
      page:
        title: WhatsApp-Nummer verbinden
        intro: >-
          Sobald deine Nummer verbunden ist, werden Vorschläge, die du per WhatsApp einreichst,
          deinem Konto zugeordnet.
        number_label: WhatsApp-Nummer
        broadcast_consent: >-
          Ich möchte per WhatsApp benachrichtigt werden, wenn ein neues Beteiligungsprojekt
          startet.
        consent_note: >-
          Ohne dieses Häkchen kannst du weiterhin Vorschläge per WhatsApp einreichen, erhältst
          aber keine Benachrichtigungen. Du kannst die Auswahl jederzeit in deinem Konto oder
          mit der Nachricht STOPP ändern.
        confirm: Nummer verbinden
    subscription:
      opted_in: Du erhältst wieder WhatsApp-Benachrichtigungen.
      opted_out: Du erhältst keine WhatsApp-Benachrichtigungen mehr.
      not_linked: Für dein Konto ist keine WhatsApp-Nummer verbunden.
    bot:
      link_invitation: >-
        Hallo! Damit dein Vorschlag deinem Konto zugeordnet werden kann, verbinde bitte einmalig
        deine Nummer mit dem Beteiligungsportal. Der Link ist eine Stunde gültig.
      link_invitation_with_url: >-
        Hallo! Damit dein Vorschlag deinem Konto zugeordnet werden kann, verbinde bitte einmalig
        deine Nummer mit dem Beteiligungsportal: %{url}

        Der Link ist eine Stunde gültig.
      link_invitation_button: Konto verbinden
      link_confirmed: "Danke, %{name}! Deine Nummer ist jetzt mit deinem Konto verbunden."
      welcome_greeting: >-
        Willkommen! Hier kannst du Vorschläge zu den laufenden Beteiligungsprojekten einreichen.
        Zu welchem möchtest du etwas beitragen?
      choose_projekt_button: Projekte anzeigen
      projekt_row_description: "%{phase} bis %{end_date}"
      menu:
        body: >-
          Willkommen! Hier findest du alles rund um die Beteiligung in deiner Region.
          Was möchtest du tun?
        button: Auswählen
        nothing_here: Hier gibt es gerade nichts zu sehen.
        sections:
          participate: Mitmachen
          discover: Entdecken
          account: Mein Konto
          service: Hilfe
        rows:
          portal:
            create:
              title: Idee einreichen
              description: Vorschlag zu einem laufenden Projekt
            polls:
              title: Abstimmungen
              description: Umfragen, bei denen du mitentscheiden kannst
            projekts:
              title: Projekte ansehen
              description: Laufende Beteiligungsprojekte
            events:
              title: Termine
              description: Kommende Veranstaltungen
            milestones:
              title: Projektfortschritt
              description: Was sich zuletzt getan hat
            results:
              title: Ergebnisse
              description: Auswertungen abgeschlossener Phasen
            contributions:
              title: Meine Beiträge
              description: Was du bereits eingereicht hast
            notifications:
              title: Benachrichtigungen
              description: Nachrichten und gefolgte Projekte
            help:
              title: So funktioniert's
              description: Kurz erklärt
            contact:
              title: Kontakt
              description: Das Team erreichen
          projekt:
            phases:
              title: Beteiligungsphasen
              description: Was in diesem Projekt läuft
            contributions:
              title: Beiträge
              description: Was andere eingereicht haben
            events:
              title: Termine
              description: Kommende Veranstaltungen
            milestones:
              title: Projektfortschritt
              description: Was sich zuletzt getan hat
            results:
              title: Ergebnisse
              description: Auswertungen abgeschlossener Phasen
            follow:
              title: Projekt folgen
              description: Bei Neuigkeiten benachrichtigt werden
          phase:
            participate:
              title: Hier mitmachen
              description: Eigenen Vorschlag einreichen
            contributions:
              title: Beiträge ansehen
              description: Was andere hier eingereicht haben
            results:
              title: Ergebnisse
              description: Auswertung dieser Phase
            page:
              title: Seite öffnen
              description: Diese Phase im Beteiligungsportal
        phase:
          until: "bis %{end_date}"
        digest:
          more: "Und %{count} weitere: %{url}"
          more_plain: "Und %{count} weitere."
        contributions:
          intro: "Das hast du bisher eingereicht:"
          entry: "*%{title}*\n%{url}"
          empty: >-
            Du hast bisher noch nichts eingereicht. Über das Menü kannst du jederzeit einen
            Vorschlag zu einem laufenden Projekt schreiben.
        projekt_contributions:
          intro: "Diese Beiträge gibt es zu „%{projekt}“:"
          empty: Zu diesem Projekt wurde bisher noch nichts eingereicht.
        phase_contributions:
          intro: "Das wurde bei „%{phase}“ eingereicht:"
          empty: In dieser Phase gibt es bisher noch keine Beiträge.
        phase_participation:
          unsupported: >-
            In dieser Phase kann ich hier im Chat nichts für dich einreichen. Auf der Projektseite
            geht es: %{url}
        projekts:
          body: "Diese Beteiligungsprojekte laufen gerade. Welches möchtest du dir ansehen?"
          button: Projekt wählen
          empty: >-
            Gerade läuft kein Beteiligungsprojekt. Schreib mir wieder, wenn ein neues startet.
        phases:
          body: "Das läuft bei „%{projekt}“:"
          button: Phase wählen
          closed: bereits beendet
          empty: In diesem Projekt gibt es derzeit keine Phasen zu sehen.
        events:
          intro: "Diese Termine stehen an:"
          empty: Es sind derzeit keine Termine geplant.
        polls:
          intro: "Bei diesen Abstimmungen kannst du gerade mitmachen:"
          until: "noch bis %{end_date}"
          empty: Gerade läuft keine Abstimmung.
        milestones:
          intro: "Das hat sich zuletzt getan:"
          empty: Es gibt noch keine Fortschritte zu berichten.
        results:
          body: "Für diese Phasen gibt es bereits Ergebnisse. Welche möchtest du sehen?"
          button: Ergebnis wählen
          link_body: "Die Auswertung zu „%{phase}“ findest du hier:"
          empty: >-
            Es sind noch keine Ergebnisse veröffentlicht. Sobald eine Phase ausgewertet ist,
            findest du sie hier.
        notifications:
          state_on: Du erhältst Nachrichten von uns.
          state_off: Du erhältst derzeit keine Nachrichten von uns.
          follows: "Du folgst diesen Projekten:"
          no_follows: Du folgst bisher keinem Projekt.
        follow:
          followed: "Du folgst jetzt „%{projekt}“ und wirst bei Neuigkeiten benachrichtigt."
          unfollowed: "Du folgst „%{projekt}“ nicht mehr."
        help:
          intro: |-
            *Was ich kann*

            *Vorschlag einreichen*
            Schreib mir deine Idee als Text oder schick sie als Sprachnachricht. Ich formuliere daraus einen Vorschlag, zeige ihn dir und reiche ihn erst ein, wenn du zustimmst. Ändern kannst du ihn so oft du möchtest.

            *Informieren*
            Laufende Projekte, Termine, Abstimmungen, Projektfortschritt und Ergebnisse abgeschlossener Phasen.

            *Dein Konto*
            Deine eigenen Beiträge ansehen, Projekten folgen und Nachrichten jederzeit abstellen.

            Du kannst mir auch einfach schreiben, was du suchst — ich bringe dich hin.
          currently_empty: "Gerade ohne Inhalte: %{items}."
          more: "Mehr zur Beteiligung: %{url}"
          body: "So funktioniert die Beteiligung:"
          button: Hilfe öffnen
          missing: >-
            Zu diesem Portal gibt es noch keine Hilfeseite. Schreib mir einfach, was du wissen
            möchtest.
        contact:
          body: "Hier erreichst du das Team:"
          button: Kontakt öffnen
          missing: >-
            Zu diesem Portal ist keine Kontaktseite hinterlegt. Schreib mir, worum es geht.
        link:
          body: "„%{title}“ kannst du hier im Beteiligungsportal öffnen:"
          gone: >-
            Das ist leider nicht mehr verfügbar. Schau im Menü, was gerade offen ist.
      commands:
        default: |-
          menu|Alle Möglichkeiten anzeigen
          hilfe|Was dieser Chat kann
          projekte|Laufende Beteiligungsprojekte
          stopp|Keine Nachrichten mehr erhalten
      ice_breakers:
        default_1: Welche Projekte laufen gerade?
        default_2: Ich habe eine Idee für meine Stadt
        default_3: Wie funktioniert das Einreichen?
        default_4: Keine Nachrichten mehr erhalten
      ask_idea: |-
        Du bist beim Projekt „%{projekt}“:
        %{url}

        Hast du konkrete Ideen oder Vorschläge? Schreibe sie mir als Text oder schicke mir eine Sprachnachricht.
      idea_missing: Bitte beschreibe deine Idee als Text oder als Sprachnachricht.
      choose_phase: >-
        Im Projekt „%{projekt}“ laufen mehrere Beteiligungsphasen. Zu welcher möchtest du etwas
        einreichen?
      choose_phase_button: Phase wählen
      phase_row_description: "bis %{end_date}"
      no_projekt: >-
        Gerade nimmt kein Beteiligungsprojekt Vorschläge an. Schreib mir wieder, wenn ein neues
        startet, oder scanne den QR-Code eines Projekts.
      drafting: Danke! Ich formuliere daraus einen Vorschlag – das dauert einen Moment.
      draft_summary: |-
        Das ist mein Vorschlag:

        *%{title}*

        %{description}
      draft_failed: >-
        Das hat leider nicht funktioniert. Schicke mir deine Idee gerne noch einmal.
      ask_revision: Was soll ich ändern oder ergänzen?
      transcription_failed: >-
        Ich konnte die Sprachnachricht nicht verstehen. Schreibe deine Idee bitte als Text.
      published: "Dein Vorschlag ist veröffentlicht: %{url}"
      published_pending_moderation: >-
        Danke! Dein Vorschlag wurde eingereicht und wird noch geprüft, bevor er öffentlich
        sichtbar ist: %{url}
      publish_failed: >-
        Beim Veröffentlichen ist etwas schiefgegangen. Bitte versuche es später noch einmal.
      criteria_failed: |-
        Dein Vorschlag erfüllt eine Vorgabe dieses Projekts noch nicht: %{criterion}

        %{feedback}

        Schreibe mir, was ich ändern soll.
      too_fast: Einen Moment noch – ich arbeite gerade an deinem Vorschlag.
      opted_out: >-
        Du erhältst keine Nachrichten mehr von uns. Schreibe START, um dich wieder anzumelden.
      opted_in: Du erhältst wieder Nachrichten von uns.
      verification_link: "Hier kannst du dein Konto verifizieren: %{url}"
      cancelled: Abgebrochen. Es wurde nichts eingereicht.
      buttons:
        publish: Veröffentlichen
        revise: Ändern
        retry: Nochmal versuchen
        cancel: Abbrechen
        menu: Hauptmenü
        open_projekt: Projekt öffnen
        projekt_menu: Mehr zum Projekt
        follow: Folgen
        unfollow: Nicht mehr folgen
        messages_off: Keine Nachrichten
        messages_on: Nachrichten an
      refused:
        generic: Für dieses Projekt kann ich derzeit keinen Vorschlag einreichen.
        phase_missing: Ich konnte das Projekt nicht finden. Scanne bitte den QR-Code erneut.
        phase_not_supported: In dieser Phase können per WhatsApp keine Vorschläge eingereicht werden.
        budget_heading_missing: >-
          Für dieses Budget ist noch kein Bereich eingerichtet, dem ich deinen Vorschlag zuordnen
          könnte.
        creation_disabled: In dieser Phase können derzeit keine Vorschläge eingereicht werden.
        ai_flow_disabled: Die Einreichung per WhatsApp ist für dieses Projekt nicht aktiviert.
        phase_not_active: Diese Beteiligungsphase ist derzeit nicht aktiv.
        phase_expired: Diese Beteiligungsphase ist bereits beendet.
        phase_not_current: Diese Beteiligungsphase läuft derzeit nicht.
        not_verified: Für die Einreichung muss dein Konto verifiziert sein.
        submissions_limit_exceeded: >-
          Du hast für dieses Projekt bereits so viele Vorschläge eingereicht, wie erlaubt sind.
        no_open_phase: >-
          In diesem Projekt läuft derzeit keine Phase, in der Vorschläge eingereicht werden
          können.
