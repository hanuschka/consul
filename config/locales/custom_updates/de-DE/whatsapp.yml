        choose_category: Kategorie wählen
        choose_sentiment: Auswählen
        submit_proposal: Vorschlag einreichen
        my_contributions: Meine Beiträge
        view_projekt: Projekt ansehen
        idea_start: Idee einreichen
        draft_publish: Ja, einreichen
        draft_revise: Ändern
