        followed: ✅ Sie folgen jetzt „%{projekt}“ und werden benachrichtigt.
        unfollowed: >-
          Sie erhalten keine Benachrichtigungen mehr zu „%{projekt}“. Mit „Abonnieren %{projekt}“
