      compliance:
        disclosure: 👋 Ich bin ein KI-Bot für %{portal_name} — hier antwortet Ihnen kein Mensch direkt.
        help:
          linked: >-
            Das kann ich: 📝 Vorschlag einreichen · 👍 Vorschlag unterstützen · 🔔 Benachrichtigungen
            verwalten · 🔗 Konto trennen. Sagen Sie einfach, was Sie möchten.
          unlinked: >-
            Das kann ich: 📝 Vorschlag einreichen · 👍 Vorschlag unterstützen · 🔔 Benachrichtigungen
            verwalten · 🔗 Jetzt verknüpfen. Sagen Sie einfach, was Sie möchten.
        out_of_scope: >-
          Das kann ich hier nicht beantworten — hier geht es nur um %{portal_name}. Mehr unter %{help_url}.
        opted_out: Verstanden, Sie erhalten keine Nachrichten mehr von uns.
