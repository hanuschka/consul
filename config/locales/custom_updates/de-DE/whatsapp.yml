      free_text_hint: >-
        Ich kann noch mehr — schreiben Sie mir einfach, was Sie brauchen.
      no_open_phase_notice: >-
        Gerade ist keine Phase offen, in der Beiträge eingereicht werden können. Sobald ein neues
        Beteiligungsprojekt startet, melde ich mich bei Ihnen.
      contributions:
        intro: 'Das haben Sie bisher eingereicht:'
        entry: |-
          *%{title}* (%{status})
          %{url}
        entry_without_url: '*%{title}* (%{status})'
        status:
