de:
  whatsapp:
    account:
      title: WhatsApp
      not_linked: >-
        Ihre WhatsApp-Nummer ist noch nicht mit diesem Konto verbunden. Schreiben Sie dem
        Beteiligungs-Bot auf WhatsApp, um die Verbindung zu starten.
      subscribed: 'Verbundene Nummer: %{phone}. Sie erhalten Benachrichtigungen zu neuen Projekten.'
      opted_out: 'Verbundene Nummer: %{phone}. Sie erhalten derzeit keine Benachrichtigungen.'
      opt_in: Benachrichtigungen aktivieren
      opt_out: Keine Benachrichtigungen mehr erhalten
    link:
      success: Ihre WhatsApp-Nummer ist jetzt mit Ihrem Konto verbunden.
      failure: >-
        Dieser Link ist nicht mehr gültig. Schreiben Sie dem Bot erneut auf WhatsApp, um einen neuen
        zu erhalten.
      page:
        title: WhatsApp-Nummer verbinden
        intro: >-
          Sobald Ihre Nummer verbunden ist, werden Vorschläge, die Sie per WhatsApp einreichen,
          Ihrem Konto zugeordnet.
        number_label: WhatsApp-Nummer
        broadcast_consent: Ich möchte per WhatsApp benachrichtigt werden, wenn ein neues Beteiligungsprojekt
          startet.
        consent_note: >-
          Ohne dieses Häkchen können Sie weiterhin Vorschläge per WhatsApp einreichen, erhalten aber
          keine Benachrichtigungen. Sie können die Auswahl jederzeit in Ihrem Konto oder mit der
          Nachricht STOPP ändern.
        confirm: Nummer verbinden
      expired: >-
        Dieser Link ist nicht mehr gültig. Schreiben Sie dem Bot erneut auf WhatsApp, um einen neuen
        zu erhalten.
      already_linked: Ihr Konto ist bereits mit einer anderen WhatsApp-Nummer verknüpft.
      number_taken: >-
        Diese WhatsApp-Nummer ist bereits mit einem anderen Konto verknüpft. Die Verknüpfung lässt
        sich nur im WhatsApp-Chat dieser Nummer lösen.
    subscription:
      opted_in: Sie erhalten wieder WhatsApp-Benachrichtigungen.
      opted_out: Sie erhalten keine WhatsApp-Benachrichtigungen mehr.
      not_linked: Für Ihr Konto ist keine WhatsApp-Nummer verbunden.
    bot:
      welcome_greeting: 👋 Willkommen zurück! Was möchten Sie tun?
      free_text_hint: >-
        Ich kann noch mehr — schreiben Sie mir einfach, was Sie brauchen.
      no_open_phase_notice: >-
        Gerade ist keine Phase offen, in der Vorschläge eingereicht werden können. Sobald ein neues
        Beteiligungsprojekt startet, melde ich mich bei Ihnen.
      contributions:
        intro: 'Das haben Sie bisher eingereicht:'
        entry: |-
          *%{title}* (%{status})
          %{url}
        status:
          published: online
          pending: wird geprüft
        more: Und %{count} weitere.
        empty: >-
          Sie haben bisher nichts eingereicht. Tippen Sie auf „Vorschlag einreichen“, um anzufangen.
      commands:
        default: |-
          hilfe|Was dieser Chat kann
          projekte|Laufende Beteiligungsprojekte
          benachrichtigungen|Auswählen, worüber Sie informiert werden
          stopp|Keine Nachrichten mehr erhalten
      ice_breakers:
        default_1: Welche Projekte laufen gerade?
        default_2: Ich habe eine Idee für meine Stadt
        default_3: Wie funktioniert das Einreichen?
        default_4: Keine Nachrichten mehr erhalten
      idea_missing: Bitte beschreiben Sie Ihre Idee als Text oder als Sprachnachricht.
      no_projekt: >-
        Gerade nimmt kein Beteiligungsprojekt Vorschläge an. Schreiben Sie mir wieder, wenn ein neues
        startet, oder scannen Sie den QR-Code eines Projekts.
      drafting: Danke! Ich formuliere daraus einen Vorschlag – das dauert einen Moment.
      draft_failed: >-
        Das hat gerade nicht geklappt — vermutlich nur vorübergehend. Versuchen Sie es in ein paar
        Minuten noch einmal.
      transcription_failed: >-
        Ich konnte die Sprachnachricht nicht verstehen. Schreiben Sie Ihre Idee bitte als Text.
      publish_failed: >-
        Ich konnte gerade nicht prüfen, ob Ihr Vorschlag die Vorgaben dieses Projekts erfüllt.
        Versuchen Sie es in ein paar Minuten noch einmal — Ihr Entwurf bleibt erhalten.
      draft_invalid: |-
        So kann ich den Vorschlag noch nicht einreichen: %{reason}

        Schreiben Sie mir, was ich ändern soll.
      criteria_failed: |-
        Ihr Vorschlag erfüllt eine Vorgabe dieses Projekts noch nicht: %{criterion}

        %{feedback}

        Schreiben Sie mir, was ich ändern soll.
      too_fast: Einen Moment noch – ich arbeite gerade an Ihrem Vorschlag.
      opted_in: Sie erhalten wieder Nachrichten von uns.
      verification_link: 'Hier können Sie Ihr Konto verifizieren: %{url}'
      buttons:
