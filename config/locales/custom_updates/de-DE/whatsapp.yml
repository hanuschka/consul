        cancelled: Alles klar, abgebrochen. Schreiben Sie mir einfach wieder, wann immer Sie möchten.
        unsafe: So kann ich das nicht einreichen. Möchten Sie es anders formulieren?
        resume: >-
          Sie waren eine Weile weg — möchten Sie Ihren früheren Vorschlag fortsetzen oder neu beginnen?
        ask_image: >-
          Möchten Sie ein Bild zu Ihrem Vorschlag? Sie können mir eines schicken, oder ich erstelle
