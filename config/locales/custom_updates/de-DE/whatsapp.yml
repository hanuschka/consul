        not_logged_in: >-
          Für dieses Projekt brauche ich ein verknüpftes Konto. Schreiben Sie mir „Konto
          verknüpfen“, dann schicke ich Ihnen den Anmeldelink.
        missing_user_data: >-
          Dieses Projekt ist auf bestimmte Personen beschränkt, und dafür fehlen mir Angaben zu
          Ihnen. Reichen Sie den Vorschlag bitte über die Projektseite ein, wo Sie die Angaben
          ergänzen können.
        only_citizens: >-
          An diesem Projekt können nur Personen aus der Kommune teilnehmen. Ihre hinterlegte
          Adresse gehört nicht dazu.
        only_specific_geozones: >-
          Dieses Projekt ist auf bestimmte Stadtteile beschränkt. Ihre hinterlegte Adresse gehört
          nicht dazu.
        no_registered_address: >-
          Für dieses Projekt ist eine hinterlegte Adresse nötig. Ergänzen Sie sie bitte in Ihrem
          Konto auf der Projektseite.
        only_specific_streets: >-
          Dieses Projekt ist auf bestimmte Straßen beschränkt. Ihre hinterlegte Adresse gehört
          nicht dazu.
        only_specific_registered_address_groupings: >-
          Dieses Projekt ist auf einen bestimmten Bereich beschränkt. Ihre hinterlegte Adresse
          gehört nicht dazu.
        only_specific_ages: An diesem Projekt können nur bestimmte Altersgruppen teilnehmen.
      portal_fallback_name: das Beteiligungsportal
      onboarding:
        disclosure: >-
          👋 Willkommen bei %{portal_name}! Ich bin ein KI-Bot und helfe Ihnen dabei, Vorschläge einzureichen,
          sie zu unterstützen und auf dem Laufenden zu bleiben.
        link_question: >-
          Möchten Sie Ihr Konto verknüpfen? Dann können Sie hier direkt mitmachen und persönliche
          Benachrichtigungen erhalten.
        consent: >-
          Mit „Ja“ willigen Sie in die Verarbeitung Ihrer Telefonnummer gemäß unserer Datenschutzerklärung
          ein: %{privacy_url}
        login_prompt: 'Zum Anmelden hier tippen:'
        login_prompt_with_url: 'Zum Anmelden diesen Link öffnen: %{url}'
        linked: >-
          ✅ Verknüpfung erfolgreich! Ab jetzt können Sie hier direkt Vorschläge einreichen, unterstützen
          und Benachrichtigungen erhalten.
        discovery_offer: Möchten Sie sehen, bei welchen Projekten Sie gerade mitmachen können?
        declined: >-
          Kein Problem! Auch ohne Verknüpfung sehen Sie, was gerade läuft — nur eben ohne persönliche
          Benachrichtigungen und ohne direkte Beteiligung.
        no_account: >-
          Für die Verknüpfung brauchen Sie ein Konto. Die Registrierung dauert 2 Minuten: %{register_url}
        expired: >-
          Das hat leider nicht geklappt — der Link ist womöglich abgelaufen. Versuchen Sie es noch
          einmal:
        already_linked: >-
          Ihr Konto ist bereits mit einer anderen WhatsApp-Nummer verknüpft. Lösen Sie diese
          Verknüpfung zuerst, dann klappt es hier.
        number_taken: Diese Nummer ist bereits mit einem anderen Konto verknüpft. Möchten Sie wechseln?
        unlink_confirm: >-
          Möchten Sie die Verknüpfung wirklich aufheben? Sie erhalten dann keine Benachrichtigungen
          mehr und können Vorschläge nicht mehr direkt unterstützen.
        unlinked: >-
          ✅ Verknüpfung aufgehoben. Diese Nummer ist keinem Konto mehr zugeordnet. Nummer und
          Chatverlauf bleiben für die übliche Speicherdauer erhalten. Sie können jederzeit erneut
          verknüpfen.
        welcome_back: 👋 Willkommen zurück! Diese Nummer ist noch nicht verknüpft — möchten Sie das
          (wieder) tun?
        welcome_back_guest_hint: >-
          Bei mindestens einem Projekt können Sie auch ohne Konto etwas einreichen.
      discovery:
        body: Bei diesen Projekten können Sie gerade mitmachen. Welches interessiert Sie?
