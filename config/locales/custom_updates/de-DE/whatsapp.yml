    account:
      title: WhatsApp
      not_linked: >-
        Ihre WhatsApp-Nummer ist noch nicht mit diesem Konto verbunden. Schreiben Sie dem
        Beteiligungs-Bot auf WhatsApp, um die Verbindung zu starten.
      subscribed: 'Verbundene Nummer: %{phone}. Sie erhalten Benachrichtigungen zu neuen Projekten.'
