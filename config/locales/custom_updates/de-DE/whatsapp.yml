        creation_disabled: In dieser Phase können derzeit keine Vorschläge eingereicht werden.
        ai_flow_disabled: Die Einreichung per WhatsApp ist für dieses Projekt nicht aktiviert.
        phase_not_active: Diese Beteiligungsphase ist derzeit nicht aktiv.
        phase_expired: Diese Beteiligungsphase ist bereits beendet.
        phase_not_current: Diese Beteiligungsphase läuft derzeit nicht.
        not_verified: Für die Einreichung muss Ihr Konto verifiziert sein.
