        image_upload_prompt: Schicken Sie mir das Foto jetzt — hängen Sie es einfach an Ihre nächste
          Nachricht an.
        image_received: ✅ Foto erhalten, danke!
        image_failed: >-
          Diese Datei konnte ich nicht verwenden. Versuchen Sie ein anderes Foto, oder machen Sie
          ohne Bild weiter.
        image_generating: Alles klar, ich male etwas — einen Moment.
        image_generate_failed: Das hat nicht geklappt, Ihr Vorschlag geht deshalb ohne Bild hinaus.
      support:
        prompt: '👍 Möchten Sie diesen Vorschlag unterstützen: „%{title}“?'
        thanks: ✅ Danke für Ihre Unterstützung! (bisher %{count} Unterstützende)
        already: Sie haben diesen Vorschlag bereits unterstützt.
        gone: Diesen Vorschlag gibt es leider nicht mehr.
      comment:
