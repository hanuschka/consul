de:
  whatsapp:
    account:
      title: WhatsApp
      not_linked: >-
        Ihre WhatsApp-Nummer ist noch nicht mit diesem Konto verbunden. Schreiben Sie dem
        Beteiligungs-Bot auf WhatsApp, um die Verbindung zu starten.
      subscribed: 'Verbundene Nummer: %{phone}. Sie erhalten Benachrichtigungen zu neuen Projekten.'
      opted_out: 'Verbundene Nummer: %{phone}. Sie erhalten derzeit keine Benachrichtigungen.'
      opt_in: Benachrichtigungen aktivieren
      opt_out: Keine Benachrichtigungen mehr erhalten
    link:
      success: Ihre WhatsApp-Nummer ist jetzt mit Ihrem Konto verbunden.
      failure: >-
        Dieser Link ist nicht mehr gültig. Schreiben Sie dem Bot erneut auf WhatsApp, um einen neuen
        zu erhalten.
      page:
        title: WhatsApp-Nummer verbinden
        intro: >-
          Sobald Ihre Nummer verbunden ist, werden Beiträge, die Sie per WhatsApp einreichen,
          Ihrem Konto zugeordnet.
        number_label: WhatsApp-Nummer
        broadcast_consent: Ich möchte per WhatsApp benachrichtigt werden, wenn ein neues Beteiligungsprojekt
          startet.
        consent_note: >-
          Ohne dieses Häkchen können Sie weiterhin Beiträge per WhatsApp einreichen, erhalten aber
          keine Benachrichtigungen. Sie können die Auswahl jederzeit in Ihrem Konto oder mit der
          Nachricht STOPP ändern.
        confirm: Nummer verbinden
      expired: >-
        Dieser Link ist nicht mehr gültig. Schreiben Sie dem Bot erneut auf WhatsApp, um einen neuen
        zu erhalten.
      already_linked: Ihr Konto ist bereits mit einer anderen WhatsApp-Nummer verknüpft.
      number_taken: >-
        Diese WhatsApp-Nummer ist bereits mit einem anderen Konto verknüpft. Die Verknüpfung lässt
        sich nur im WhatsApp-Chat dieser Nummer lösen.
    subscription:
      opted_in: Sie erhalten wieder WhatsApp-Benachrichtigungen.
      opted_out: Sie erhalten keine WhatsApp-Benachrichtigungen mehr.
      not_linked: Für Ihr Konto ist keine WhatsApp-Nummer verbunden.
    # Only what the assistant does not write. Everything the bot says in
    # conversation is now written per message by the model, so what is left here is
    # the copy that has to exist when no model is involved: the formats a date is
    # rendered in, the WhatsApp-side configuration of the number itself, the
    # notifications the portal pushes on its own initiative, the legal disclosures,
    # and the one sentence that speaks when the assistant cannot.
    bot:
      date:
        absolute_format: "%-d. %B %Y"
        absolute_with_time_format: "%-d. %B %Y, %H:%M Uhr"
        today: heute
        past:
          days:
            one: vor einem Tag
            other: vor %{count} Tagen
          months:
            one: vor einem Monat
            other: vor %{count} Monaten
          years:
            one: vor einem Jahr
            other: vor %{count} Jahren
        future:
          days:
            one: in einem Tag
            other: in %{count} Tagen
          months:
            one: in einem Monat
            other: in %{count} Monaten
          years:
            one: in einem Jahr
            other: in %{count} Jahren
      commands:
        default: |-
          hilfe|Was dieser Chat kann
          projekte|Laufende Beteiligungsprojekte
          benachrichtigungen|Auswählen, worüber Sie informiert werden
          stopp|Keine Nachrichten mehr erhalten
      ice_breakers:
        default_1: Welche Projekte laufen gerade?
        default_2: Ich habe eine Idee für meine Stadt
        default_3: Wie funktioniert das Einreichen?
        default_4: Keine Nachrichten mehr erhalten
      portal_fallback_name: das Beteiligungsportal
      transcription_failed: >-
        Ich konnte die Sprachnachricht nicht verstehen. Schreiben Sie Ihre Idee bitte als Text.
      assistant_unavailable: >-
        Ich kann Ihnen gerade nicht antworten — das ist hoffentlich nur vorübergehend.
        Versuchen Sie es in ein paar Minuten noch einmal.
      cancelled: Alles klar, abgebrochen. Schreiben Sie mir einfach wieder, wann immer Sie möchten.
      opted_in: Sie erhalten wieder Nachrichten von uns.
      compliance:
        disclosure: 👋 Ich bin ein KI-Bot für %{portal_name} — hier antwortet Ihnen kein Mensch direkt.
        opted_out: Verstanden, Sie erhalten keine Nachrichten mehr von uns.
      proposal:
        # A legal notice rather than the bot's voice, which is why it survived the copy
        # that did not: Ai::Tools::WhatsappAiAssistant::RequestPhoto appends it to every
        # request for a photo so the assistant cannot write one without it.
        image_rights_notice: >-
          Bitte senden Sie nur Bilder, für die Sie die Rechte haben und auf denen keine
          Personen erkennbar sind, die damit nicht einverstanden sind.
      onboarding:
        welcome_greeting: 👋 Schön, dass Sie hier sind!
        login_prompt: >-
          Zum Anmelden hier tippen. Mit dem Öffnen des Links willigen Sie in die Verarbeitung
          Ihrer Telefonnummer gemäß unserer Datenschutzerklärung ein: %{privacy_url}
        linked: >-
          ✅ Verknüpfung erfolgreich! Ab jetzt können Sie hier direkt Beiträge einreichen, unterstützen
          und Benachrichtigungen erhalten.
        unlinked: >-
          ✅ Verknüpfung aufgehoben. Diese Nummer ist keinem Konto mehr zugeordnet. Nummer und
          Chatverlauf bleiben für die übliche Speicherdauer erhalten. Sie können jederzeit erneut
          verknüpfen.
        no_account: >-
          Für die Verknüpfung brauchen Sie ein Konto. Die Registrierung dauert 2 Minuten: %{register_url}
        expired: >-
          Das hat leider nicht geklappt — der Link ist womöglich abgelaufen. Versuchen Sie es noch
          einmal:
        already_linked: >-
          Ihr Konto ist bereits mit einer anderen WhatsApp-Nummer verknüpft. Lösen Sie diese
          Verknüpfung zuerst, dann klappt es hier.
        number_taken: Diese Nummer ist bereits mit einem anderen Konto verknüpft. Möchten Sie wechseln?
      buttons:
        retry: Nochmal versuchen
        cancel: Abbrechen
        help: Hilfe
        login: 🔗 Anmelden
        open_page: Seite öffnen
        choose: Auswählen
      notifications:
        types:
          new_projekt:
            short: Neues Projekt
            label: Neues Projekt
          deadline_approaching:
            short: Frist bald
            label: Frist läuft bald ab
          deadline_passed:
            short: Frist vorbei
            label: Frist abgelaufen
          new_supports:
            short: Unterstützung
            label: Neue Unterstützung für meinen Beitrag
          new_comments:
            short: Kommentare
            label: Neue Kommentare zu meinem Beitrag
          moderation_decision:
            short: Moderation
            label: Entscheidung der Moderation
        push:
          new_projekt: |-
            📣 Es gibt ein neues Beteiligungsprojekt bei %{portal_name}.
            %{url}
          deadline_approaching: |-
            ⏳ Nur noch wenige Tage: Die Frist für Beiträge läuft bald ab.
            %{url}
          deadline_passed: |-
            🏁 Die Frist ist abgelaufen. Hier ist das Ergebnis:
            %{url}
          status_change: |-
            🔔 Es gibt eine Neuigkeit zu Ihrem Beitrag.
            %{url}
