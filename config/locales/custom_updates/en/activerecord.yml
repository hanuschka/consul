    errors:
      messages:
        too_many_lines: must contain at most %{count} lines
      models:
        setting:
          attributes:
            value:
              whatsapp_template_name_invalid: >-
                must match the template name at 360dialog: lowercase letters, digits and
                underscores only, no spaces
              whatsapp_template_language_invalid: >-
                must be a language code, e.g. "de" or "de_DE"
              whatsapp_address_form_invalid: >-
                must be "sie" or "du"
        deficiency_report:
          attributes:
            map_location:
              blank: Please select a location on the map
        proposal:
          attributes:
            description:
              too_long: 'is too long'
        projekt:
          attributes:
            color:
              invalid: Please provide color in HEX format
        user:
          attributes:
            password:
              low_complexity: "must include minimum three of the following four cretiria: uppercase letter lower, case letter, digit, special symbol (e.g. ! or @)"
        unregistered_newsletter_subscriber:
          attributes:
            email:
              invalid: Please enter a valid email format
        deficiency_report/feedback_form:
          attributes:
            overall_satisfaction:
              blank: Please select an option.
        projekt_point_of_interest_category:
          attributes:
            icon_image:
              invalid_content_type: must be SVG, PNG or JPEG
              too_large: is too large (max 512 KB)
              unsafe_svg: SVG contains disallowed content
        projekt_event_registration:
          attributes:
            email:
              taken: has already been used
        recipient_group_filter:
          attributes:
            operator:
              must_be_include_for_first_filter: must be "Include" while no other filter exists yet
        site_customization/image:
          attributes:
            image:
              min_image_width: "Image width must be at least %{required_min_width}px"
              min_image_height: "Image height must be at least %{required_min_height}px"
