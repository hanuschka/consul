en:
  custom:
    deficiency_reports:
      mailers:
        closing: Best regards
        signature: Your team
        contact_info: With any qustions please contact us at <a href="mailto:%{email}">%{email}</a>
        unwatch_hint: "No longer want notifications about this report?"
        unwatch_link_text: Unsubscribe from notifications for this report
        notify_shared_report:
          subject: A report was shared with you %{identifier}
          hi: "Hello %{username},"
          p1: "a report has been shared with you:"
          p1_by: "%{name} shared a report with you:"
          p2: You will now receive notifications about changes to this report.
        notify_watcher_about_change:
          subject: Change to a report you are watching %{identifier}
          hi: "Hello %{username},"
          p1: "there has been a change to a report you are watching:"
          current_status: "Current status:"
        notify_author_about_status_change:
          subject: Status change of your deficiency report
          hi: Hi
          p1: Status of your a deficiency report you submitted earlier, was changed.
        notify_officer:
          subject: New deficiency report %{identifier}
          hi: Dear Officer,
          p1: Admin has assigned you one of the new deficiency reports.
          adm_page: "To process the report, use the following link:"
          adm_page_link_text: Open report in the administration area
          public_page: "The report is publicly visible:"
          public_page_link_text: Public page
        notify_author_about_submission:
          subject: Confirmation of your report
          hi: "Dear %{username},"
          p1: "thank you for your %{deficiency_report_link}. Your submission has been successfully received."
          deficiency_report_link_text: deficiency report
          p2_pending_review: "Please note that your report is <strong>not yet publicly visible</strong>. Our team will review the content before it can be approved and published."
          p2_published: "Your report is now publicly visible."
          p3: "You will automatically receive an email as soon as the status of your report changes."
          p4: "In your %{account_link} you can track which submissions you have made at any time."
          account_link_text: user account
