    images:
      index:
        title: Admin images
        description: Lists all images uploaded by administrators and project managers — e.g. via the file manager or content editors. Images attached to platform content by users are managed under Maintenance → Resource images. Use this page to upload, review, rename or delete image files.
    documents:
      index:
        title: Overview of all documents
        description: Lists all documents uploaded by administrators and project managers — e.g. via the file manager or content editors. Documents uploaded by users to platform content are managed under Maintenance → Resource documents. Use this page to upload, review, rename or delete document files.
    resource_images:
      index:
        title: Overview of all resource images
        description: Lists every image attached to platform content — e.g. projekts, proposals, pages and polls. User avatars are not shown. Use this page to review, rename or delete image files across the whole system.
    resource_documents:
      index:
        title: Overview of all resource documents
        description: Lists every document uploaded by users to platform content — e.g. proposals and ideas. Documents uploaded by administrators are managed under Files → Documents. Use this page to review, rename or delete document files across the whole system.
