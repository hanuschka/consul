en:
  mailers:
    shared:
      sincerely: Kind	regards
      signature: Your Consul Team
    budget_investment_unfeasible:
      subject: "Unfortunately, your proposal does not meet the criteria."
      title: "Unfortunately, your proposal does not meet the criteria."
      hi: "Hello %{username},"
      text1: "We have checked your proposal %{proposal_link}: Unfortunately, it does not meet the criteria."
      text2: "It will therefore not be admitted to the next phase of the %{project_link}."
      reason: "Reason:"
      text3: "If you have any questions, please contact us. You are welcome to submit a new proposal."
      project_link_text: Project
      sincerely: "Sincerely"
    manual_verification_confirmation:
      subject: Your account has just been verified.
      p1: Your account has just been verified.
      p2: If you have already voted, you can now view your votes in the overview.
      p3: You can change your vote at any time up to the end of the process.
    formular_follow_up_letter:
      button_text: To the form
    budget_investment_feasible:
      subject: "Congratulations, your proposal meets the criteria."
      title: "Congratulations, your proposal meets the criteria."
      hi: "Hello %{username},"
      project_link_1_text: criteria
      project_link_2_text: project
      text: "We have reviewed your proposal %{proposal_link}: your proposal meets %{project_link_1}. This means it will be accepted for the next phase of %{project_link_2}."
      sincerely: Best regards
    newsletter_subscription_for_existing_user:
      subject: Subscribe to the newsletter
      p1_html: There was an attempt to sign up for our newsletter using your email address. Since you already have a Consul account, we would like to ask you to log in and activate the option to receive the newsletter in your <a href=%{link}>Account Settings</a>.
    csv_download_ready:
      subject: Data Export
      p1_html: 'You have requested an export. The data has been exported and is ready for download: <a href="%{url}">Download CSV</a>'
    file_ready:
      subject: Data-Export
      p1_html: You have requested an export. The data has now been exported and is attached.
    individual_group_value_users_added:
      subject: Upload of CSV data completed successfully.
      p1_html: "Your data was added successfully: <a href=\"%{url}\">%{url}</a>"
    resource_hidden:
      subject: Your proposal violates the admission conditions.
      hi: "Hello %{username},"
      text1: "We have checked your topic proposal: %{text}."
      text2: "Unfortunately, it violates the admission conditions of our topic selection. We have therefore removed your proposal."
      text3: You can read the admission conditions %{netiquette_link}.
      netiquette_link_text: here
      text4: If you have any questions, please contact us. You are cordially invited to create a new post that complies with the admission conditions.
      sincerely: Kind regards
      signature: Your ABSTIMMUNG21 Team
    comment:
      subject: Your	proposal  has been  commented on.
      title: Your proposal has been commented on.
      hi: "Hello %{username},"
      text: Your proposal has been commented on. Check out the comment %{comment_link}.
      comment_link_text: here
      sincerely: Kind regards
    reply:
      subject: A reply has been made to your comment.
      title: A reply has been made to your comment.
      hi: Hello %{username},
      text: "Another user has replied to your comment. Check out the reply here: %{comment_link}"
      comment_link_text: here
      sincerely: Kind regards
    budget_investment_preselected:
      subject: Congratulations, your proposal is going to the next round!
      title: Congratulations, your proposal is going to the next round!
      hi: "Hello %{username},"
      text1: Your proposal %{proposal_link} has received enough votes and will now be reviewed.
      text2: The result of the review will be published at the beginning of the next phase of the %{project_link}.
      projekt_link_text: Project
      sincerely: Kind regards
    budget_investment_not_preselected:
      subject: Unfortunately, your proposal did not make it to the next round.
      title: Unfortunately, your proposal did not make it to the next round.
      hi: "Hello %{username},"
      text1: Your proposal %{proposal_link} has unfortunately not received enough votes.
      text2: It will therefore not be admitted to the next phase of the %{project_link}.
      projekt_link_text: Project
      sincerely: Kind regards
    proposal_created:
      hi: "Hello %{username},"
      text1: "Your proposal has been successfully submitted: %{proposal_link}"
    proposal_official_answer:
      subject: "There is an official answer to your proposal"
      hi: "Hello %{username},"
      text1: "An official answer from the administration is available for your proposal %{proposal_link}:"
    new_valuator_assignment:
      subject: New valuation assignment
      hi: "Hello %{username},"
      text1: "You have been assigned a proposal for evaluation: %{valuation_link}"
    existing_stamp_notify_existing_user:
      subject: Verification attempt using a different email address
      hi: "Hello %{username},"
      p1: This is to inform you that a verification attempt was made using your details with a different email address. Please continue to use this email address to access Consul.
      p2: If you would like to change your email address, please log in to Consul using this address and make the change in your account settings.
    existing_stamp_notify_new_user:
      subject: Use of existing email address
      hi: "Hello,"
      p1: Please use the email address you originally registered with to log in to your account.
      p2: If you would like to change your email address, please log in to Consul using this address and make the change in your account settings.
    projekt_event_registration_confirmation:
      body: "Hello %{name}, please confirm your registration for the event \"%{event}\" by clicking the link below."
      confirm_link: "Confirm registration"
    user_verification_failed:
      subject: Verification attempt failed
      hi: "Hello %{username},"
      p1: Unfortunately, there was no match during the verification via the registration office. This happens occasionally – mostly for formal reasons.
      b1_title: Common reasons
      b1_item1: Wrong spelling (umlauts, hyphens, middle names, order of first names).
      b1_item2: Address not exactly as in the registration office (house number additions, staircase/floor, postal code/district).
      b1_item3: Recently moved – database not yet updated.
      b1_item4: Birth date or place differs.
      b1_item5: Blocked information at the registration office.
      b1_item6: Typographical errors (e.g. "ß/ss", spaces, leading zeros).
      b2_title: How to solve the problem
      b2_item1: "Start your verification again: %{link}"
      b2_item2: "Use copy & paste from your ID/registration certificate."
      b2_item3: "If you have recently changed your address: Wait 1-2 business days and try again."
      b2_item4: "If you have a block on information disclosure/transmission: Contact us directly"
