en:
  custom:
    notification_service_mailers:
      shared:
        unsubscribe_html: If you do not want to receive any further notifications about this, click <a href="%{url}" target="_blank">here</a> and click the notification bell (you must be logged in).
      overdue_deficiency_reports:
        subject: Deficiency report without an answer
        p1_s: Two weeks ago you were assigned a deficiency report, which was not processed yet.
        p1_p: Two weeks ago you were assigned multiple deficiency reports, which were not processed yet.
      overdue_deficiency_reports_overview:
        subject: Overview of overdue reports
        p1_s: "one report has been left unprocessed. You receive this overview because you manage all reports:"
        p1_p: "several reports have been left unprocessed. You receive this overview because you manage all reports:"
        fresh_badge: NEW
        fresh_hint: Reports marked "%{label}" became overdue today.
        no_responsible: no officer assigned
      new_comments_for_deficiency_report:
        subject: "Comment on the deficiency report (%{deficiency_report_title}) has not been handled yet"
        p1_initial: You have just been assigned the following comment on a deficiency report for processing.
        p1_reminder: You were recently assigned a comment on a deficiency report that has not yet been processed.
        link_to_report: "(Link to the report)"
      not_assigned_deficiency_reports:
        subject: Deficiency report not assigned yet
        p1_s: There is an outstanding deficiency report, which was not assigned yet.
        p1_p: There are multiple outstanding deficiency reports, which were not assigned yet.
      new_proposal:
        subject: "New proposal on the participation platform"
        p1: New proposal has just been added or edited.
      new_debate:
        subject: "New debate on the participation platform"
        p1: "a new debate has been posted on the participation platform."
      new_comment:
        subject: "New comment on the participation platform"
        title: "New comment on the participation platform"
        p1: "a new comment has been posted on the participation platform."
      new_contribution_comment:
        subject: New comment on a contribution on the participation platform.
        title: New comment on a contribution on the participation platform.
        p1: a new comment on a contribution has been posted on the participation platform.
      new_deficiency_report:
        subject: New Deficiency Report %{identifier}
        p1: "a new report has been submitted on the participation platform."
      new_poll:
        subject: "New poll on the participation platform"
        p1: "a new poll has been added to the participation platform."
      projekt_questions:
        subject: "New short survey on the participation platform"
        link: Short survey
        p1: "a new short survey has been added to the participation platform."
      projekt_arguments:
        subject: "New pro and contra arguments on the participation platform"
        link: Projekt arguments
        p1: "new pro and contra arguments have been added to the participation platform."
      new_budget_investment:
        subject: A new proposal has been submitted!
        title: A new proposal has been submitted!
        p1: "a new proposal has been submitted in %{projekt_link}. Check it out here: %{investment_title}"
        projekt_link_text: Project
        sincerely: Kind regards,
      new_projekt_notification:
        subject: "New project notification on the participation platform"
        link: Projekt notification
        p1: "a new project notification has been added to the participation platform."
      new_projekt_event:
        subject: "New event on the participation platform"
        link: Projekt event
        p1: "a new event has been added to the participation platform."
      new_projekt_milestone:
        subject: "New milestone on the participation platform"
        link: Projekt milestone
        p1: "a new milestone has been added to the participation platform."
      new_projekt_livestream:
        subject: "New livestream on the participation platform"
        link: Projekt livestream
        p1: "a new livestream has been added to the participation platform."
      user_reverification_failed:
        subject: Your account has been de-verified
        p1_html: The verification of your user account on the Participation platform has been canceled. This means that you cannot currently take part in any participation projects that require a verified account (e.g. citizen budget).
        p2_html: <strong>Do you live within the city?</strong><br>At <a href="%{base_url}/account">%{base_url}/account</a> you can check your personal information and verify yourself again. Please ensure that your personal data is spelled correctly.
        p3_html: <strong>Have you moved away?</strong><br>Even as an \"outsider\" you can still take part in many participation projects on the participation platform. Please change your place of residence at <a href="%{base_url}/account">%{base_url}/account</a>.
        p4_html: If you have any questions, please do not hesitate to contact us.
        signature_html: Thank you for your participation.
      user_reverification_succeeded:
        subject: Your account verification has been completed
        p1_html: The verification of your user account on the Participation platform has been completed. This means you can take part in participation projects that require a verified account.
        signature_html: Thank you for your participation.
      new_topic:
        subject: "New topic on the participation platform"
        p1: "a new topic has been added to the participation platform."
      new_proposal_notification:
        subject: "New notification related to Proposal: %{proposal_title}"
        intro_html: "Author of the proposal %{proposal_link} added a new notification"
        unsubscribe_html: If you no longer wish to receive emails about this Proposal notifications, go to the <a href="%{url}" target="_blank">Proposal page</a> and click “Unfollow” (you must be logged in to do this).
      new_projekt:
        subject: Review of the project %{projekt_title}
        p1: The project titled %{link} has been released for your review.
