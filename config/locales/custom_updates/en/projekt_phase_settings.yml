en:
  custom:
    projekt_phase_settings:
      polls:
        feature:
          general:
            public_kpi_stats: Show KPIs for public
            public_kpi_stats_description: Shows key performance indicators (KPI) to non-administrative users
            public_ai_stats: Show AI analysis for public
            public_ai_stats_description: Shows AI analysis to non-administrative users
      comments:
        feature:
          general:
            public_kpi_stats: Show KPIs for public
            public_kpi_stats_description: Shows key performance indicators (KPI) to non-administrative users
            public_ai_stats: Show AI analysis for public
            public_ai_stats_description: Shows AI analysis to non-administrative users
      proposals:
        feature:
          general:
            public_kpi_stats: Show KPIs for public
            public_kpi_stats_description: Shows key performance indicators (KPI) to non-administrative users
            public_ai_stats: Show AI analysis for public
            public_ai_stats_description: Shows AI analysis to non-administrative users
            similar_contributions_check: Check for similar contributions
            similar_contributions_check_description: Checks newly submitted contributions in this phase against existing contributions with similar content, and shows administrators matching contributions from the same projekt while they work. In the frontend a notice with up to three similar contributions, which can be supported instead, appears before submitting. Enable this feature to avoid duplicate submissions and to speed up processing through references to contributions that have already been answered.
          resource:
            create_proposal_with_ai: Create proposal with AI
            create_proposal_with_ai_description: Enables the "Create proposal with AI" button in the frontend. Users can then have an AI assistant help them formulate proposals by describing their concern in their own words. The AI suggests a title, summary, and description text. The resulting draft remains fully editable before the user submits it.
        option:
          resource:
            minimum_supports_to_show: "Minimum supports to show"
            minimum_supports_to_show_description: "Proposals are only shown once they reach this number of supports (0 = always visible)"
            max_submissions_per_user: "Maximum submissions per user"
            max_submissions_per_user_description: "Limits the number of proposals a user can submit in this phase (empty or 0 = no limit)"
            max_supports_per_user: "Maximum supports per user"
            max_supports_per_user_description: "Limits the number of proposals a user can support in this phase (empty or 0 = no limit)"
      budget:
        option:
          resource:
            max_submissions_per_user: "Maximum submissions per user"
            max_submissions_per_user_description: "Limits the number of investment proposals a user can submit in this phase (empty or 0 = no limit)"
            max_supports_per_user: "Maximum supports per user"
            max_supports_per_user_description: "Limits the number of investment proposals a user can support in this phase (empty or 0 = no limit)"
        feature:
          general:
            public_kpi_stats: Show KPIs for public
            public_kpi_stats_description: Shows key performance indicators (KPI) to non-administrative users
            public_ai_stats: Show AI analysis for public
            public_ai_stats_description: Shows AI analysis to non-administrative users
            similar_contributions_check: Check for similar contributions
            similar_contributions_check_description: Checks newly submitted contributions in this phase against existing contributions with similar content, and shows administrators matching contributions from the same projekt while they work. In the frontend a notice with up to three similar contributions, which can be supported instead, appears before submitting. Enable this feature to avoid duplicate submissions and to speed up processing through references to contributions that have already been answered.
          resource:
            create_investment_with_ai: Create investment proposal with AI
            create_investment_with_ai_description: Enables the "Create investment proposal with AI" button in the frontend. Users can have an AI assistant help them formulate an investment proposal by describing their concern in their own words. The AI suggests a title, summary, and description. The resulting draft remains fully editable before submission.
