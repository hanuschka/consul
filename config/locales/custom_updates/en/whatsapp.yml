en:
  whatsapp:
    account:
      title: WhatsApp
      not_linked: >-
        Your WhatsApp number is not linked to this account yet. Message the participation bot on
        WhatsApp to start linking.
      subscribed: "Linked number: %{phone}. You receive notifications about new projects."
      opted_out: "Linked number: %{phone}. You currently receive no notifications."
      opt_in: Enable notifications
      opt_out: Stop receiving notifications
    link:
      success: Your WhatsApp number is now linked to your account.
      failure: >-
        This link is no longer valid. Message the bot on WhatsApp again to get a new one.
      page:
        title: Link your WhatsApp number
        intro: >-
          Once linked, proposals you submit by WhatsApp are attributed to your account.
        number_label: WhatsApp number
        broadcast_consent: >-
          I want to be notified on WhatsApp when a new participation project starts.
        consent_note: >-
          Without this box you can still submit proposals via WhatsApp, you just receive no
          notifications. You can change this any time in your account or by sending STOP.
        confirm: Link number
    subscription:
      opted_in: You will receive WhatsApp notifications again.
      opted_out: You will no longer receive WhatsApp notifications.
      not_linked: No WhatsApp number is linked to your account.
    bot:
      link_invitation: >-
        Hello! So your proposal can be attributed to your account, please link your number to the
        participation platform once. The link is valid for one hour.
      link_invitation_with_url: >-
        Hello! So your proposal can be attributed to your account, please link your number to the
        participation platform once: %{url}

        The link is valid for one hour.
      link_invitation_button: Link account
      link_confirmed: "Thanks, %{name}! Your number is now linked to your account."
      welcome_greeting: >-
        Welcome! You can submit proposals for the running participation projects here. Which one
        would you like to contribute to?
      choose_projekt_button: Show projects
      projekt_row_description: "%{phase} until %{end_date}"
      ice_breakers:
        default_1: Which projects are running right now?
        default_2: I have an idea for my city
        default_3: How does submitting a proposal work?
        default_4: Stop receiving messages
      ask_idea: >-
        You are in the project “%{projekt}”. Do you have concrete ideas or suggestions? Send them
        to me as text or as a voice message.
      idea_missing: Please describe your idea as text or as a voice message.
      choose_phase: >-
        The project “%{projekt}” has several participation phases running. Which one do you want
        to contribute to?
      choose_phase_button: Choose phase
      phase_row_description: "until %{end_date}"
      no_projekt: >-
        There is no participation project accepting proposals at the moment. Write to me again
        when a new one starts, or scan the QR code of a project.
      drafting: Thanks! I am turning this into a proposal — one moment.
      draft_summary: |-
        Here is my proposal:

        *%{title}*

        %{description}
      draft_failed: That did not work. Feel free to send me your idea again.
      ask_revision: What should I change or add?
      transcription_failed: >-
        I could not understand the voice message. Please write your idea as text.
      published: "Your proposal is published: %{url}"
      published_pending_moderation: >-
        Thanks! Your proposal was submitted and will be reviewed before it becomes publicly
        visible: %{url}
      publish_failed: Something went wrong while publishing. Please try again later.
      criteria_failed: |-
        Your proposal does not meet one of this project's requirements yet: %{criterion}

        %{feedback}

        Tell me what I should change.
      too_fast: One moment — I am still working on your proposal.
      opted_out: You will not receive any more messages from us. Send START to subscribe again.
      opted_in: You will receive messages from us again.
      verification_link: "You can verify your account here: %{url}"
      cancelled: Cancelled. Nothing was submitted.
      buttons:
        publish: Publish
        revise: Revise
        retry: Try again
        cancel: Cancel
        menu: View all projects
      refused:
        generic: I cannot submit a proposal for this project right now.
        phase_missing: I could not find the project. Please scan the QR code again.
        phase_not_supported: This phase does not accept submissions via WhatsApp.
        budget_heading_missing: >-
          This budget has no area set up yet that I could file your proposal under.
        creation_disabled: This phase does not accept proposals right now.
        ai_flow_disabled: Submitting via WhatsApp is not enabled for this project.
        phase_not_active: This participation phase is not active right now.
        phase_expired: This participation phase has already ended.
        phase_not_current: This participation phase is not running right now.
        not_verified: Your account must be verified to submit a proposal.
        no_open_phase: >-
          This project currently has no phase that accepts proposals.
