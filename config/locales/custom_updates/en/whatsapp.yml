en:
  whatsapp:
    account:
      title: WhatsApp
      not_linked: >-
        Your WhatsApp number is not linked to this account yet. Message the participation bot on
        WhatsApp to start linking.
      subscribed: "Linked number: %{phone}. You receive notifications about new projects."
      opted_out: "Linked number: %{phone}. You currently receive no notifications."
      opt_in: Enable notifications
      opt_out: Stop receiving notifications
    link:
      success: Your WhatsApp number is now linked to your account.
      failure: >-
        This link is no longer valid. Message the bot on WhatsApp again to get a new one.
      page:
        title: Link your WhatsApp number
        intro: >-
          Once linked, proposals you submit by WhatsApp are attributed to your account.
        number_label: WhatsApp number
        broadcast_consent: >-
          I want to be notified on WhatsApp when a new participation project starts.
        consent_note: >-
          Without this box you can still submit proposals via WhatsApp, you just receive no
          notifications. You can change this any time in your account or by sending STOP.
        confirm: Link number
    subscription:
      opted_in: You will receive WhatsApp notifications again.
      opted_out: You will no longer receive WhatsApp notifications.
      not_linked: No WhatsApp number is linked to your account.
    bot:
      link_invitation: >-
        Hello! So your proposal can be attributed to your account, please link your number to the
        participation platform once. The link is valid for one hour.
      link_invitation_with_url: >-
        Hello! So your proposal can be attributed to your account, please link your number to the
        participation platform once: %{url}

        The link is valid for one hour.
      link_invitation_button: Link account
      link_confirmed: "Thanks, %{name}! Your number is now linked to your account."
      welcome_greeting: >-
        Welcome! You can submit proposals for the running participation projects here. Which one
        would you like to contribute to?
      choose_projekt_button: Show projects
      projekt_row_description: "%{phase} until %{end_date}"
      menu:
        body: >-
          Welcome! Everything about participation in your region is here. What would you like to
          do?
        button: Choose
        nothing_here: There is nothing to see here at the moment.
        sections:
          participate: Take part
          discover: Discover
          account: My account
          service: Help
        rows:
          portal:
            create:
              title: Submit an idea
              description: Contribute to a running project
            polls:
              title: Votes
              description: Polls you can take part in
            projekts:
              title: Browse projects
              description: Current participation projects
            events:
              title: Events
              description: Upcoming dates
            milestones:
              title: Progress
              description: What has moved recently
            results:
              title: Results
              description: Evaluations of completed phases
            contributions:
              title: My contributions
              description: What you have submitted so far
            notifications:
              title: Notifications
              description: Messages and projects you follow
            help:
              title: How it works
              description: Briefly explained
            contact:
              title: Contact
              description: Reach the team
          projekt:
            phases:
              title: Participation phases
              description: What is running in this project
            contributions:
              title: Contributions
              description: What others have submitted
            events:
              title: Events
              description: Upcoming dates
            milestones:
              title: Progress
              description: What has moved recently
            results:
              title: Results
              description: Evaluations of completed phases
            follow:
              title: Follow this project
              description: Be told when something happens
            page:
              title: Open the page
              description: This project in the portal
          phase:
            participate:
              title: Take part here
              description: Submit your own proposal
            contributions:
              title: See contributions
              description: What others submitted here
            results:
              title: Results
              description: Evaluation of this phase
            page:
              title: Open the page
              description: This phase in the portal
        phase:
          until: "until %{end_date}"
        digest:
          more: "And %{count} more: %{url}"
          more_plain: "And %{count} more."
        contributions:
          intro: "This is what you have submitted so far:"
          entry: "*%{title}*\n%{url}"
          empty: >-
            You have not submitted anything yet. You can write a proposal for a running project
            from the menu at any time.
        projekt_contributions:
          intro: "These contributions were made to \"%{projekt}\":"
          empty: Nothing has been submitted to this project yet.
        phase_contributions:
          intro: "This was submitted to \"%{phase}\":"
          empty: There are no contributions in this phase yet.
        phase_participation:
          unsupported: >-
            I cannot submit anything for you in this phase here in the chat. You can do it on the
            project page: %{url}
        projekts:
          body: "These participation projects are running right now. Which one would you like to see?"
          button: Choose project
          empty: >-
            No participation project is running right now. Write to me again when a new one starts.
        phases:
          body: "This is running in \"%{projekt}\":"
          button: Choose phase
          closed: already finished
          empty: There are no phases to see in this project at the moment.
        events:
          intro: "These dates are coming up:"
          empty: No events are planned at the moment.
        polls:
          intro: "You can take part in these votes right now:"
          until: "open until %{end_date}"
          empty: No vote is running at the moment.
        milestones:
          intro: "This is what has happened recently:"
          empty: There is no progress to report yet.
        results:
          body: "Results are already available for these phases. Which one would you like to see?"
          button: Choose result
          link_body: "You can find the evaluation of \"%{phase}\" here:"
          empty: >-
            No results have been published yet. Once a phase has been evaluated you will find it
            here.
        notifications:
          state_on: You receive messages from us.
          state_off: You currently receive no messages from us.
          follows: "You follow these projects:"
          no_follows: You do not follow any project yet.
        follow:
          followed: "You now follow \"%{projekt}\" and will be told when something happens."
          unfollowed: "You no longer follow \"%{projekt}\"."
        help:
          body: "This is how participation works:"
          button: Open help
          missing: >-
            This portal has no help page yet. Just write and tell me what you would like to know.
        contact:
          body: "This is how to reach the team:"
          button: Open contact
          missing: >-
            This portal has no contact page. Write to me and tell me what it is about.
        link:
          body: "You can open \"%{title}\" here in the participation portal:"
          gone: >-
            That is unfortunately no longer available. Check the menu for what is currently open.
      ice_breakers:
        default_1: Which projects are running right now?
        default_2: I have an idea for my city
        default_3: How does submitting a proposal work?
        default_4: Stop receiving messages
      ask_idea: |-
        You are in the project “%{projekt}”:
        %{url}

        Do you have concrete ideas or suggestions? Send them to me as text or as a voice message.
      idea_missing: Please describe your idea as text or as a voice message.
      choose_phase: >-
        The project “%{projekt}” has several participation phases running. Which one do you want
        to contribute to?
      choose_phase_button: Choose phase
      phase_row_description: "until %{end_date}"
      no_projekt: >-
        There is no participation project accepting proposals at the moment. Write to me again
        when a new one starts, or scan the QR code of a project.
      drafting: Thanks! I am turning this into a proposal — one moment.
      draft_summary: |-
        Here is my proposal:

        *%{title}*

        %{description}
      draft_failed: That did not work. Feel free to send me your idea again.
      ask_revision: What should I change or add?
      transcription_failed: >-
        I could not understand the voice message. Please write your idea as text.
      published: "Your proposal is published: %{url}"
      published_pending_moderation: >-
        Thanks! Your proposal was submitted and will be reviewed before it becomes publicly
        visible: %{url}
      publish_failed: Something went wrong while publishing. Please try again later.
      criteria_failed: |-
        Your proposal does not meet one of this project's requirements yet: %{criterion}

        %{feedback}

        Tell me what I should change.
      too_fast: One moment — I am still working on your proposal.
      opted_out: You will not receive any more messages from us. Send START to subscribe again.
      opted_in: You will receive messages from us again.
      verification_link: "You can verify your account here: %{url}"
      cancelled: Cancelled. Nothing was submitted.
      buttons:
        publish: Publish
        revise: Revise
        retry: Try again
        cancel: Cancel
        menu: Main menu
        open_projekt: Open project
        projekt_menu: More about it
        follow: Follow
        unfollow: Unfollow
        messages_off: Stop messages
        messages_on: Resume messages
      refused:
        generic: I cannot submit a proposal for this project right now.
        phase_missing: I could not find the project. Please scan the QR code again.
        phase_not_supported: This phase does not accept submissions via WhatsApp.
        budget_heading_missing: >-
          This budget has no area set up yet that I could file your proposal under.
        creation_disabled: This phase does not accept proposals right now.
        ai_flow_disabled: Submitting via WhatsApp is not enabled for this project.
        phase_not_active: This participation phase is not active right now.
        phase_expired: This participation phase has already ended.
        phase_not_current: This participation phase is not running right now.
        not_verified: Your account must be verified to submit a proposal.
        no_open_phase: >-
          This project currently has no phase that accepts proposals.
