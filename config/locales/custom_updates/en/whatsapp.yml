en:
  whatsapp:
    account:
      title: WhatsApp
      not_linked: >-
        Your WhatsApp number is not linked to this account yet. Message the participation bot on WhatsApp
        to start linking.
      subscribed: 'Linked number: %{phone}. You receive notifications about new projects.'
      opted_out: 'Linked number: %{phone}. You currently receive no notifications.'
      opt_in: Enable notifications
      opt_out: Stop receiving notifications
    link:
      success: Your WhatsApp number is now linked to your account.
      failure: This link is no longer valid. Message the bot on WhatsApp again to get a new one.
      page:
        title: Link your WhatsApp number
        intro: Once linked, contributions you submit by WhatsApp are attributed to your account.
        number_label: WhatsApp number
        broadcast_consent: I want to be notified on WhatsApp when a new participation project starts.
        consent_note: >-
          Without this box you can still submit contributions via WhatsApp, you just receive no
          notifications.
          You can change this any time in your account or by sending STOP.
        confirm: Link number
      expired: This link is no longer valid. Message the bot on WhatsApp again to get a new one.
      already_linked: Your account is already linked to a different WhatsApp number.
      number_taken: >-
        This WhatsApp number is already linked to a different account. The link can only be released
        from that number's WhatsApp chat.
    subscription:
      opted_in: You will receive WhatsApp notifications again.
      opted_out: You will no longer receive WhatsApp notifications.
      not_linked: No WhatsApp number is linked to your account.
    # Only what the assistant does not write. Everything the bot says in
    # conversation is now written per message by the model, so what is left here is
    # the copy that has to exist when no model is involved: the formats a date is
    # rendered in, the WhatsApp-side configuration of the number itself, the
    # notifications the portal pushes on its own initiative, the legal disclosures,
    # and the one sentence that speaks when the assistant cannot.
    bot:
      date:
        absolute_format: "%B %-d, %Y"
        absolute_with_time_format: "%B %-d, %Y at %H:%M"
        today: today
        past:
          days:
            one: 1 day ago
            other: '%{count} days ago'
          months:
            one: 1 month ago
            other: '%{count} months ago'
          years:
            one: 1 year ago
            other: '%{count} years ago'
        future:
          days:
            one: in 1 day
            other: in %{count} days
          months:
            one: in 1 month
            other: in %{count} months
          years:
            one: in 1 year
            other: in %{count} years
      commands:
        default: |-
          help|What this chat can do
          projects|Current participation projects
          notifications|Choose what you hear about
          stop|Stop receiving messages
      ice_breakers:
        default_1: Which projects are running right now?
        default_2: I have an idea for my city
        default_3: How does submitting a contribution work?
        default_4: Stop receiving messages
      portal_fallback_name: the participation portal
      transcription_failed: I could not understand the voice message. Please write your idea as text.
      assistant_unavailable: >-
        I can't answer you right now — hopefully only for a moment. Please try again in a
        few minutes.
      assistant_unavailable_retryable: >-
        I can't answer you right now — hopefully only for a moment. Tap "Try again" and I'll
        pick up right where we were.
      cancelled: OK, cancelled. Just message me again whenever you'd like.
      opted_in: You will receive messages from us again.
      compliance:
        disclosure: 👋 I'm an AI bot for %{portal_name} — no human answers you here directly.
        opted_out: Understood, you won't receive any more messages from us.
      # The block Whatsapp::DraftPreview puts in front of a citizen before they
      # confirm a contribution and again once it is online. Only the labels are
      # here: the title and the text are the citizen's own and are copied out of
      # the record untouched.
      # The block Whatsapp::CommentPreview puts in front of a citizen before their
      # comment goes on a public page, and again once it is there. The comment
      # itself is their own and is never translated.
      comment:
        on_proposal: Comment on
        online: "Your comment is now on the page:"
        awaiting_review: >-
          Your comment has arrived and is still being reviewed. It will appear on the page once it
          has been approved — which is why there is no link to it yet.
      # The block Whatsapp::SupportRecap sends once a support has been registered.
      support:
        registered: Supported
        supports: Supports
      preview:
        projekt: Project
        phase: Participation
        attachments: Attached
        photo: Photo
        location: Location
        online: "Your contribution is now online:"
        awaiting_review: >-
          Your contribution has arrived and is now with the municipality for review. It will appear
          on the page once it has been approved — which is why there is no link to it yet.
      proposal:
        # A legal notice rather than the bot's voice, which is why it survived the copy
        # that did not: Ai::Tools::WhatsappAiAssistant::RequestPhoto appends it to every
        # request for a photo so the assistant cannot write one without it.
        image_rights_notice: >-
          Please only send pictures you hold the rights to, and none showing people who
          have not agreed to it.
        location_optional: A location is optional. You can also carry on without one.
      onboarding:
        welcome_greeting: 👋 Good to have you here!
        login_prompt: >-
          Tap below to log in. By opening the link you consent to the processing of your phone
          number under our privacy policy: %{privacy_url}
        linked: >-
          ✅ Successfully linked! From now on you can submit contributions, support them, and receive notifications
          directly here.
        unlinked: >-
          ✅ Account unlinked. This number is no longer tied to an account. The number and the chat
          history are kept for the usual retention period. You can link again at any time.
        no_account: You need an account to link. You can register in 2 minutes at %{register_url}.
        expired: 'That didn''t work — the link may have expired. Try again:'
        already_linked: >-
          Your account is already linked to a different WhatsApp number. Release that link first and
          this will work.
        number_taken: This number is already linked to a different account. Would you like to switch?
      buttons:
        retry: Try again
        link_retry: Try again
        cancel: Cancel
        help: Help
        login: 🔗 Log in
        open_page: Open page
        choose: Choose
        take_part: Take part now
        view_projekt: View project
        my_contributions: My contributions
        location_skip: Continue without
        main_menu: Main menu
        show_more: Show more
        image_upload: Add a photo
        image_generate: Generate a picture
        image_skip: Continue without
      notifications:
        follow_up:
          deadline_approaching: You can still take part here until the deadline passes.
          deadline_passed: The deadline has passed. You can look at what came in.
          status_change: Something has happened to your contribution.
        types:
          new_projekt:
            short: New project
            label: New project
          deadline_approaching:
            short: Deadline soon
            label: Deadline approaching
          deadline_passed:
            short: Deadline passed
            label: Deadline passed
          new_supports:
            short: New supports
            label: New supports on my contribution
          new_comments:
            short: New comments
            label: New comments on my contribution
          moderation_decision:
            short: Moderation
            label: Moderation decision
        push:
          new_projekt: |-
            📣 There's a new participation project on %{portal_name}.
            %{url}
          deadline_approaching: |-
            ⏳ Only a few days left: the contribution submission deadline is coming up soon.
            %{url}
          deadline_passed: |-
            🏁 The deadline has passed. See the result:
            %{url}
          status_change: |-
            🔔 There's an update on your contribution.
            %{url}
