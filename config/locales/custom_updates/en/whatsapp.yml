en:
  whatsapp:
    account:
      title: WhatsApp
      not_linked: >-
        Your WhatsApp number is not linked to this account yet. Message the participation bot on WhatsApp
        to start linking.
      subscribed: 'Linked number: %{phone}. You receive notifications about new projects.'
      opted_out: 'Linked number: %{phone}. You currently receive no notifications.'
      opt_in: Enable notifications
      opt_out: Stop receiving notifications
    link:
      success: Your WhatsApp number is now linked to your account.
      failure: This link is no longer valid. Message the bot on WhatsApp again to get a new one.
      page:
        title: Link your WhatsApp number
        intro: Once linked, contributions you submit by WhatsApp are attributed to your account.
        number_label: WhatsApp number
        broadcast_consent: I want to be notified on WhatsApp when a new participation project starts.
        consent_note: >-
          Without this box you can still submit contributions via WhatsApp, you just receive no
          notifications.
          You can change this any time in your account or by sending STOP.
        confirm: Link number
      expired: This link is no longer valid. Message the bot on WhatsApp again to get a new one.
      already_linked: Your account is already linked to a different WhatsApp number.
      number_taken: >-
        This WhatsApp number is already linked to a different account. The link can only be released
        from that number's WhatsApp chat.
    subscription:
      opted_in: You will receive WhatsApp notifications again.
      opted_out: You will no longer receive WhatsApp notifications.
      not_linked: No WhatsApp number is linked to your account.
    bot:
      welcome_greeting: 👋 Welcome back! What would you like to do?
      free_text_hint: I can do more than this — just tell me what you need.
      no_open_phase_notice: >-
        No phase is open for contributions right now. I will let you know as soon as a new participation
        project starts.
      contributions:
        intro: 'Here is what you have submitted so far:'
        entry: |-
          *%{title}* (%{status})
          %{url}
        status:
          published: online
          pending: under review
        more: And %{count} more.
        empty: You have not submitted anything yet. Tap "Submit a contribution" to get started.
      commands:
        default: |-
          help|What this chat can do
          projects|Current participation projects
          notifications|Choose what you hear about
          stop|Stop receiving messages
      ice_breakers:
        default_1: Which projects are running right now?
        default_2: I have an idea for my city
        default_3: How does submitting a contribution work?
        default_4: Stop receiving messages
      idea_missing: Please describe your idea as text or as a voice message.
      no_projekt: >-
        There is no participation project accepting contributions at the moment. Write to me again when
        a new one starts, or scan the QR code of a project.
      drafting: Thanks! I am taking a quick look — one moment.
      draft_failed: >-
        That did not work just now — most likely a temporary problem. Please try again in a few
        minutes.
      transcription_failed: I could not understand the voice message. Please write your idea as text.
      publish_failed: >-
        I could not check right now whether your contribution meets this project's requirements. Please
        try again in a few minutes — your draft is kept.
      draft_invalid: 'I cannot submit the contribution like this yet: %{reason}'
      criteria_failed: |-
        One of this project's requirements is not met yet: %{criterion}

        %{feedback}
      safety_check_failed: >-
        I could not check right now whether your text may be published. Please try again in a few
        minutes.
      too_fast: One moment — I am still working on your contribution.
      opted_in: You will receive messages from us again.
      verification_link: 'You can verify your account here: %{url}'
      buttons:
        publish: Publish
        revise: Revise
        retry: Try again
        cancel: Cancel
        link_yes: Yes, link it
        link_later: Later
        link_switch: Switch account
        login: 🔗 Log in
        login_again: Log in again
        show_projekts: Show projects
        show_current_projekts: Current projects
        no_thanks: No thanks
        got_it: OK, got it
        unlink_yes: Yes, unlink
        done: Done
        choose_notifications: Choose
        choose_category: Choose category
        choose_sentiment: Choose
        submit_proposal: Submit contribution
        my_contributions: My contributions
        view_projekt: View project
        idea_start: Yes, I have an idea
        draft_publish: Yes, that works
        draft_revise: Edit
        resume: Continue
        restart: Start over
        support: 👍 Support
        help: Help
        main_menu: Main menu
        choose_help: Choose
        open_page: Open page
        image_upload: Upload a photo
        image_generate: Create one for me
        image_skip: Submit without one
        location_share: Share location
        location_skip: Submit without one
        submit_final: Submit it now
        submit_anyway: Own contribution
      help_menu:
        body: 'Happy to help. Choose what I can help you with:'
        rows:
          submit:
            description: Contribute an idea to a running project
          support:
            title: Support one
            description: Support an existing contribution
          comment:
            title: Comment
            description: Add a comment to a contribution
          projekts:
            title: Browse projects
            description: See the running participation projects
          contributions:
            description: See what you have submitted
          notifications:
            title: Notifications
            description: Change your message settings
          unlink:
            title: Unlink account
            description: Release the link to your account
          link:
            title: Link account
            description: Connect this number to your account
        prompts:
          support: >-
            Which contribution would you like to support? Send me its title or a few words from
            it.
          comment: >-
            Which contribution would you like to comment on? Send me its title or a few words
            from it.
      refused_content:
        intro: I'm afraid I cannot submit that.
        retry_hint: >-
          Feel free to write your concern again in different words — plain criticism is expressly
          welcome here.
        reasons:
          generic: The text breaks the rules for published contributions.
          hate: The text demeans people or groups.
          violence: The text contains threats or calls for violence.
          harassment: The text personally attacks an individual.
          sexual: The text contains sexual content.
          illegal: The text calls for or spreads criminal content.
          personal_data: The text contains other people's personal data, which cannot be published.
          spam: The text is advertising or has no recognisable concern.
      refused:
        generic: I cannot submit a contribution for this project right now.
        phase_missing: I could not find the project. Please scan the QR code again.
        phase_not_supported: This phase does not accept submissions via WhatsApp.
        budget_heading_missing: This budget has no area set up yet that I could file your contribution
          under.
        creation_disabled: This phase does not accept contributions right now.
        ai_flow_disabled: Submitting via WhatsApp is not enabled for this project.
        phase_not_active: This participation phase is not active right now.
        phase_expired: This participation phase has already ended.
        phase_not_current: This participation phase is not running right now.
        not_verified: Your account must be verified to submit a contribution.
        submissions_limit_exceeded: You have already submitted as many contributions to this project as
          are allowed.
        no_open_phase: This project currently has no phase that accepts contributions.
        not_logged_in: >-
          This project needs a linked account, so that I can attribute your contribution to you.
        organization: Organisations cannot submit contributions here.
        missing_user_data: >-
          This project is limited to certain people, and I am missing the details that decide it.
          Please submit through the project page, where you can add them.
        only_citizens: >-
          Only residents of the municipality can take part in this project, and your registered
          address is not one of them.
        only_specific_geozones: >-
          This project is limited to certain districts, and your registered address is not in one
          of them.
        no_registered_address: >-
          This project needs a registered address. Please add one to your account on the project
          page.
        only_specific_streets: >-
          This project is limited to certain streets, and your registered address is not on one of
          them.
        only_specific_registered_address_groupings: >-
          This project is limited to a specific area, and your registered address is not in it.
        only_specific_ages: Only certain age groups can take part in this project.
        only_specific_individual_group_values: >-
          Taking part in this project is limited to: %{individual_group_values}.
      portal_fallback_name: the participation portal
      resource_nouns:
        Proposals: Contributions
        proposals: contributions
        Proposal: Contribution
        proposal: contribution
      onboarding:
        welcome_greeting: 👋 Good to have you here!
        disclosure: >-
          👋 Welcome to %{portal_name}! I'm an AI bot that helps you submit contributions, support them,
          and stay up to date.
        link_question: >-
          Would you like to link your account? Then you can participate directly here and get personal
          notifications.
        consent: >-
          By tapping "Yes" you consent to the processing of your phone number under our privacy policy:
          %{privacy_url}
        login_prompt: 'Tap below to log in:'
        login_prompt_with_url: 'Tap the link to log in: %{url}'
        linked: >-
          ✅ Successfully linked! From now on you can submit contributions, support them, and receive notifications
          directly here.
        discovery_offer: Want to see which projects you can currently participate in?
        declined: >-
          No problem! Even without linking you can see what's currently happening — just without personal
          notifications and direct participation.
        no_account: You need an account to link. You can register in 2 minutes at %{register_url}.
        expired: 'That didn''t work — the link may have expired. Try again:'
        already_linked: >-
          Your account is already linked to a different WhatsApp number. Release that link first and
          this will work.
        number_taken: This number is already linked to a different account. Would you like to switch?
        unlink_confirm: >-
          Are you sure you want to unlink your account? You'll no longer receive notifications and
          won't be able to support contributions directly.
        unlinked: >-
          ✅ Account unlinked. This number is no longer tied to an account. The number and the chat
          history are kept for the usual retention period. You can link again at any time.
        welcome_back: 👋 Welcome back! This number isn't linked yet — would you like to link it (again)?
        welcome_back_guest_hint: >-
          At least one project also accepts submissions without an account.
      discovery:
        body: These are the projects you can contribute to right now. Which one would you like?
        guest_body: >-
          These projects accept submissions without an account too. Which one would you like?
        phase_body: >-
          There is more than one thing running in "%{projekt}". Which one do you want to contribute
          to?
        button: Choose project
        empty: Nothing is open for contributions right now. Write to me again when a new project starts.
        row_description: '%{phase} until %{end_date}'
        public_intro: 'This is what''s currently happening:'
        entry: |-
          *%{title}*
          %{url}
        more: 'And %{count} more: %{url}'
      notifications:
        settings_title: 🔔 What would you like to be notified about?
        saved: ✅ Settings saved.
        types:
          new_projekt:
            short: New project
            label: New project
          deadline_approaching:
            short: Deadline soon
            label: Deadline approaching
          deadline_passed:
            short: Deadline passed
            label: Deadline passed
          new_supports:
            short: New supports
            label: New supports on my contribution
          new_comments:
            short: New comments
            label: New comments on my contribution
          moderation_decision:
            short: Moderation
            label: Moderation decision
        push:
          new_projekt: |-
            📣 There's a new participation project on %{portal_name}.
            %{url}
          deadline_approaching: |-
            ⏳ Only a few days left: the contribution submission deadline is coming up soon.
            %{url}
          deadline_passed: |-
            🏁 The deadline has passed. See the result:
            %{url}
          status_change: |-
            🔔 There's an update on your contribution.
            %{url}
      proposal:
        ask_idea: Write me a short summary of what you're thinking — I'll turn it into a contribution.
        ask_category: Which category fits best?
        ask_sentiment: Where do you stand on this topic?
        category_line: 'Category: %{category}'
        sentiment_line: 'Sentiment: %{sentiment}'
        evaluation_line: |-
          Assessment: %{score} out of %{max_score} points
          %{feedback}
        card: |-
          *%{title}*

          %{description}
        draft_intro: 'Great idea! Here''s how I''d phrase it:'
        draft_question: Does that sound right?
        draft_revised_intro: 'Got it:'
        draft_revised_question: Does that work now?
        preview_intro: 'Here''s how your contribution would look:'
        preview_question: Shall I submit it like this?
        ask_revision: Sure, what should I change?
        published: '✅ It''s live now: %{url}'
        next_action: Anything else you'd like to do?
        published_pending_moderation: |-
          Thanks! Your contribution is now being reviewed, we'll get back to you.

          You can view it here once you are logged in to the portal: %{url}
        unclear: I didn't quite understand that — do you mean a new contribution or a comment on an existing
          one?
        cancelled: OK, cancelled. Just message me again whenever you'd like.
        resume: You've been away a while — would you like to continue your earlier contribution or start
          over?
        resume_recap: 'Picking up where you left off with “%{projekt}”.'
        resume_recap_idea: 'This is what you had written: “%{idea}”'
        ask_image: >-
          Would you like a picture for your contribution? You can send me one, or I can create one from
          your text.
        image_upload_prompt: Send me the photo now — just attach it to your next message.
        image_received: ✅ Got the photo, thanks!
        image_failed: I couldn't use that file. Try another photo, or carry on without one.
        image_rights_notice: Please make sure you hold the usage rights to the photo.
        duplicate:
          single: |-
            There is already a contribution about this: "%{title}"

            %{url}

            Would you like to support it, or submit your own contribution?
          multiple: >-
            There are already contributions about this. Would you like to support one of them, or
            submit your own?
          list_label: Choose
          submit_anyway_hint: Submit your own contribution anyway
        image_generating: Alright, I'm creating an image — one moment.
        image_generate_failed: That didn't work, so your contribution goes out without a picture.
        ask_location: >-
          Would you like to mark the place on the map? You can share your location straight from
          WhatsApp.
        location_request: Tap "Send location" and pick the place.
        location_retry: >-
          That was not a location yet. Tap "Send location" — or write me anything and I will submit
          your contribution without one.
        location_received: ✅ Location saved, thanks!
      support:
        prompt: '👍 Would you like to support this contribution: "%{title}"?'
        thanks: ✅ Thanks for your support! (%{count} supporters so far)
        already: You've already supported this contribution.
        gone: That contribution is unfortunately no longer available.
      comment:
        prompt: Would you like to add anything to this contribution?
        published: Thanks, your comment is now on the project page.
        pending: Thanks, your comment is being reviewed and will then appear on the project page.
        invalid: I couldn't save that comment. Try writing it a little differently.
        closed: Comments are closed for this contribution.
      subscription:
        followed: ✅ You're now following "%{projekt}" and will be notified.
        unfollowed: >-
          You'll no longer receive notifications about "%{projekt}". You can resubscribe anytime with
          "Subscribe %{projekt}".
        unknown: I couldn't find a project with that name. Write "projects" to see what's running.
      compliance:
        disclosure: 👋 I'm an AI bot for %{portal_name} — no human answers you here directly.
        out_of_scope: I can't answer that here — this is only about %{portal_name}. More at %{help_url}.
        opted_out: Understood, you won't receive any more messages from us.
    archive:
      menu:
        body: Welcome! Everything about participation in your region is here. What would you like
          to do?
        button: Choose
        nothing_here: There is nothing to see here at the moment.
        sections:
          participate: Take part
          discover: Discover
          account: My account
          service: Help
        rows:
          portal:
            create:
              title: Submit an idea
              description: Contribute to a running project
            polls:
              title: Votes
              description: Polls you can take part in
            projekts:
              title: Browse projects
              description: Current participation projects
            events:
              title: Events
              description: Upcoming dates
            milestones:
              title: Progress
              description: What has moved recently
            results:
              title: Results
              description: Evaluations of completed phases
            contributions:
              title: My contributions
              description: What you have submitted so far
            notifications:
              title: Notifications
              description: Messages and projects you follow
            help:
              title: How it works
              description: Briefly explained
            contact:
              title: Contact
              description: Reach the team
          projekt:
            phases:
              title: Participation phases
              description: What is running in this project
            contributions:
              title: Contributions
              description: What others have submitted
            events:
              title: Events
              description: Upcoming dates
            milestones:
              title: Progress
              description: What has moved recently
            results:
              title: Results
              description: Evaluations of completed phases
            follow:
              title: Follow this project
              description: Be told when something happens
          phase:
            participate:
              title: Take part here
              description: Submit your own proposal
            contributions:
              title: See contributions
              description: What others submitted here
            results:
              title: Results
              description: Evaluation of this phase
            page:
              title: Open the page
              description: This phase in the portal
        phase:
          until: until %{end_date}
        digest:
          more: 'And %{count} more: %{url}'
          more_plain: And %{count} more.
        contributions:
          intro: 'This is what you have submitted so far:'
          entry: |-
            *%{title}*
            %{url}
          empty: >-
            You have not submitted anything yet. You can write a proposal for a running project from
            the menu at any time.
        projekt_contributions:
          intro: 'These contributions were made to "%{projekt}":'
          empty: Nothing has been submitted to this project yet.
        phase_contributions:
          intro: 'This was submitted to "%{phase}":'
          empty: There are no contributions in this phase yet.
        phase_participation:
          unsupported: >-
            I cannot submit anything for you in this phase here in the chat. You can do it on the
            project page: %{url}
        projekts:
          body: These participation projects are running right now. Which one would you like to see?
          button: Choose project
          empty: No participation project is running right now. Write to me again when a new one starts.
        phases:
          body: 'This is running in "%{projekt}":'
          button: Choose phase
          closed: already finished
          empty: There are no phases to see in this project at the moment.
        events:
          intro: 'These dates are coming up:'
          empty: No events are planned at the moment.
        polls:
          intro: 'You can take part in these votes right now:'
          until: open until %{end_date}
          empty: No vote is running at the moment.
        milestones:
          intro: 'This is what has happened recently:'
          empty: There is no progress to report yet.
        results:
          body: Results are already available for these phases. Which one would you like to see?
          button: Choose result
          link_body: 'You can find the evaluation of "%{phase}" here:'
          empty: No results have been published yet. Once a phase has been evaluated you will find
            it here.
        notifications:
          state_on: You receive messages from us.
          state_off: You currently receive no messages from us.
          follows: 'You follow these projects:'
          no_follows: You do not follow any project yet.
        follow:
          followed: You now follow "%{projekt}" and will be told when something happens.
          unfollowed: You no longer follow "%{projekt}".
        help:
          intro: |-
            *What I can do*

            *Submit a proposal*
            Write me your idea, or send it as a voice message. I turn it into a proposal, show it to you, and only submit it once you agree. You can change it as often as you like.

            *Find out what is going on*
            Running projects, events, votes, progress and results of completed phases.

            *Your account*
            See your own contributions, follow projects, and stop messages at any time.

            You can also just write what you are looking for — I will take you there.
          currently_empty: 'Nothing right now for: %{items}.'
          more: 'More about participation: %{url}'
          body: 'This is how participation works:'
          button: Open help
          missing: This portal has no help page yet. Just write and tell me what you would like to
            know.
        contact:
          body: 'This is how to reach the team:'
          button: Open contact
          missing: This portal has no contact page. Write to me and tell me what it is about.
        link:
          body: 'You can open "%{title}" here in the participation portal:'
          gone: That is unfortunately no longer available. Check the menu for what is currently open.
      choose_projekt_button: Show projects
      projekt_row_description: '%{phase} until %{end_date}'
      choose_phase: >-
        The project “%{projekt}” has several participation phases running. Which one do you want to
        contribute to?
      choose_phase_button: Choose phase
      phase_row_description: until %{end_date}
      buttons:
        open_projekt: Open project
        projekt_menu: More about it
        follow: Follow
        unfollow: Unfollow
        messages_off: Stop messages
        messages_on: Resume messages
