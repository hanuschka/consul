        attachment_description: Bild für den Newsletter.
      newsletter:
        recipient_group_id_label: Empfängergruppe
        recipient_group_id_description: An welche Empfängergruppe soll dieser Newsletter gesendet werden?
        from_label: Absender
        from_description: E-Mail-Adresse des Absenders.
        subject_label: Betreff
        subject_description: Betreffzeile der Newsletter-E-Mail.
        title_label: Titel
        title_description: Wird als Überschrift im Newsletter angezeigt.
        title_color_label: Titelfarbe
        title_color_description: Farbe der Titelüberschrift.
        subtitle_label: Untertitel
        subtitle_description: Wird unterhalb des Titels im Newsletter angezeigt.
        subtitle_color_label: Untertitelfarbe
        subtitle_color_description: Farbe des Untertitels.
        greeting_label: Begrüßung
        greeting_description: Begrüßungstext am Anfang des Newsletters.
        body_label: Inhalt
        body_description: Hauptinhalt des Newsletters.
      site_customization/content_block:
        body_label: Newsletter-Fußbereich
        body_description: "Der Footer wird am Ende jeder Newsletter-E-Mail angezeigt. Hier können Sie z. B. Kontaktdaten, Impressum-Links oder Abmeldehinweise hinterlegen. Der Inhalt wird automatisch in alle versendeten Newsletter übernommen und sollte den rechtlichen Anforderungen Ihrer Kommune entsprechen. Änderungen werden sofort für neue Newsletter wirksam."
      site_customization/image:
        header_image_label: Hintergrundbild für Desktop
        header_image_description: "Dieses Bild wird im oberen Bereich der Startseite auf Desktop-Geräten angezeigt. Bitte verwenden Sie ein hochauflösendes Querformat-Bild mit klarem Motiv. Es sollte thematisch zur Beteiligungsplattform passen und auch bei unterschiedlichen Bildschirmgrößen gut wirken. Empfohlenes Format: 1920 × 760 Pixel."
        mobile_header_image_label: Hintergrundbild für Mobile
        mobile_header_image_description: "Dieses Bild wird auf Mobilgeräten im oberen Bereich der Startseite angezeigt. Verwenden Sie ein Bild mit zentriertem Hauptmotiv, da es auf kleinen Bildschirmen zugeschnitten werden kann. Es sollte thematisch zur Plattform passen und auch in kleiner Darstellung klar erkennbar sein. Empfohlenes Format: 470 × 246 Pixel."
        logo_header_label: Logo (weißer Hintergrund)
        logo_header_description: "Dieses Logo wird in der oberen Navigationsleiste angezeigt, sobald der Hintergrund weiß ist – also z. B. nach dem Scrollen auf der Startseite. Es sollte gut lesbar auf hellem Hintergrund sein. Verwenden Sie idealerweise ein PNG mit transparentem Hintergrund. Empfohlenes Format: maximal 80 × 80 Pixel."
        logo_header_for_transparent_label: Logo (transparenter Hintergrund)
        logo_header_for_transparent_description: "Dieses Logo wird in der oberen Navigationsleiste angezeigt, solange der Hintergrund transparent ist – also z. B. über dem Headerbild. Es sollte gut auf wechselnden Hintergründen erkennbar sein. Verwenden Sie idealerweise ein helles PNG mit transparentem Hintergrund. Empfohlenes Format: max. 80 × 80 Pixel."
        logo_newsletter_email_label: Newsletter-Logo
        logo_newsletter_email_description: "Dieses Logo wird im Kopfbereich jeder Newsletter-E-Mail angezeigt und dient als visuelles Erkennungsmerkmal Ihrer Plattform. Verwenden Sie idealerweise ein PNG mit transparentem Hintergrund, das auf hellem Hintergrund gut lesbar ist. Das Logo sollte die Wiedererkennung Ihrer Kommune oder Plattform sicherstellen. Empfohlenes Format: 130 × 45 Pixel."
      site_customization/page:
        projekt:
          title_label: Titel der Startseite
          title_description: "Der Titel der Startseite wird prominent über dem Hintergrundbild auf der Startseite angezeigt. Er sollte kurz und prägnant sein, um die Aufmerksamkeit der Besucher zu gewinnen."
          slug_label: URL-Pfad des Projekts
          slug_description: Legen Sie fest, unter welchem Pfad das Projekt erreichbar ist (z. B. "klimabudget" bei domain.de/klimabudget). Der URL-Pfad darf keine Leer- oder Sonderzeichen enthalten und sollte möglichst kurz und eindeutig sein.
        landing:
          slug_label: URL der Themenseite
          slug_description: 'Definiert den letzten Teil der Webadresse (Slug) dieser Themenseite, z. B. "jugendbeteiligung". Die vollständige URL lautet dann z. B. „ihre-domain.de/jugendbeteiligung“. Die URL darf keine Leer- oder Sonderzeichen enthalten.'
          landing_site_logo_for_transparent_background_label: Logo auf transparentem Hintergrund
          landing_site_logo_for_transparent_background_description: "Wird angezeigt, wenn die Top-Navigation noch vor dem Hintergrundbild liegt (z. B. direkt beim Aufrufen der Seite).
Dieses Logo sollte gut auf hellem und dunklem Hintergrund lesbar sein, da es über dem Hintergrundbild angezeigt wird. Optimal ist ein PNG mit transparentem Hintergrund. Sobald Nutzer scrollen, wechselt die Navigation auf weißen Hintergrund – dafür ist das zweite Logo vorgesehen."
          landing_site_logo_for_white_background_label: Logo auf weißem Hintergrund
          landing_site_logo_for_white_background_description: "Wird angezeigt, sobald die Seite gescrollt wurde und die Top-Navigation einen weißen Hintergrund hat.<br><br>Dieses Logo sollte in dunkler Farbe vor weißem Hintergrund gut sichtbar sein. Es ersetzt das transparente Logo automatisch, sobald die Navigation fixiert wird. Auch hier empfiehlt sich ein PNG, um scharfe Darstellung auf allen Geräten zu gewährleisten."
          landing_desktop_header_image_label: Hintergrundbild für Desktop
          landing_desktop_header_image_description: "Dieses Bild wird im oberen Bereich der Startseite auf Desktop-Geräten angezeigt. Bitte verwenden Sie ein hochauflösendes Querformat-Bild mit klarem Motiv. Es sollte thematisch zur Beteiligungsplattform passen und auch bei unterschiedlichen Bildschirmgrößen gut wirken. Empfohlenes Format: 1920 × 760 Pixel."
          landing_mobile_header_image_label: Hintergrundbild für Mobile
          landing_mobile_header_image_description: "Dieses Bild wird im oberen Bereich der Startseite auf Desktop-Geräten angezeigt. Bitte verwenden Sie ein hochauflösendes Querformat-Bild mit klarem Motiv. Es sollte thematisch zur Beteiligungsplattform passen und auch bei unterschiedlichen Bildschirmgrößen gut wirken. Empfohlenes Format: 1920 × 760 Pixel."
          title_label: Titel der Themenseite
          title_description: "Der Titel der Themenseite wird prominent über dem Hintergrundbild auf der Startseite angezeigt. Er sollte kurz und prägnant sein, um die Aufmerksamkeit der Besucher zu gewinnen."
          subtitle_label: Untertitel der Themenseite
          subtitle_description: "Der Untertitel wird direkt unterhalb des Titels im Hintergrundbild angezeigt. Wenn das Feld leer bleibt, wird kein Untertitel dargestellt."
          landing_hide_title_and_subtitle_label: Titel und Untertitel auf der Themenseite ausblenden
          landing_hide_title_and_subtitle_description: "Blendet den Titel und Untertitel der Themenseite im Frontend aus. Diese Angaben dienen dann ausschließlich der internen Konfiguration und werden nicht über dem Hintergrundbild angezeigt."
          landing_hide_all_top_nav_links_label: Links in der Top-Navigation ausblenden
          landing_hide_all_top_nav_links_description: "Blendet sämtliche Links aus, die in der Top-Navigation der Startseite enthalten sind. So bleibt die Themen- oder Gebietsseite übersichtlich und frei von globalen Navigationspunkten."
          landing_show_projekts_overview_label: Projektübersicht in Hauptnavigation anzeigen
          landing_show_projekts_overview_description: "Zeigt in der Top-Navigation dieser Themenseite eine Projektübersicht – analog zur Startseite. Wenn deaktiviert, wird die Projektübersicht auf allen zugehörigen Projektseiten dieser Themenseite nicht angezeigt."
          landing_site_logo_follow_to_landing_page_label: Klick auf Logo führt zu dieser Zielseite
          landing_site_logo_follow_to_landing_page_description: "Wenn aktiviert, führt ein Klick auf das Logo in der Top-Navigation nicht zur allgemeinen Startseite, sondern zur aktuell konfigurierten Themen- oder Gebietsseite."
          landing_navigation_link_color_label: Farbe der Links in der Top-Navigation
          landing_navigation_link_color_description: "Legen Sie die Schriftfarbe der Links in der oberen Navigationsleiste fest. Das ist wichtig, da das Hintergrundbild auf dieser Themenseite von dem auf der Startseite abweichen kann und die Lesbarkeit sichergestellt sein muss."
