de:
  adm:
    attribute_editor:
      default_description: Ohne Beschreibung
      projekt_phase:
        lock_on_label: Sperrdatum
        lock_on_description: "Ab diesem Datum können keine Offline-Stimmen mehr über Abstimmungshelfer erfasst werden. Bereits abgegebene Stimmen bleiben erhalten. Das Sperrdatum begrenzt die Offline-Stimmabgabe zeitlich, z. B. nach einer Veranstaltung oder am Ende einer Beteiligungsphase. Lassen Sie das Feld leer, wenn keine zeitliche Begrenzung gewünscht ist."
        phase_tab_name_label: Tab-Bezeichnung
        phase_tab_name_description: Bestimmt den Namen des Tabs, der im Frontend in der Tab-Leiste des Projekts für diese Beteiligungsphase angezeigt wird. Wählen Sie eine kurze, aussagekräftige Bezeichnung, die den Inhalt der Phase klar vermittelt – z. B. „Abstimmung", „Vorschläge einreichen" oder „Diskussion". Der Tab-Name ist für alle Nutzer sichtbar.
        cta_button_name_label: Button-Beschriftung auf der Projektseite
        cta_button_name_description: Bestimmt den Text des Beteiligungs-Buttons, der auf der Projektseite angezeigt wird und Nutzer zur aktiven Teilnahme auffordert. Wählen Sie eine handlungsorientierte Formulierung, z. B. „Jetzt abstimmen", „Vorschlag einreichen" oder „Meinung abgeben". Der Button verlinkt direkt auf die jeweilige Beteiligungsphase.
        resource_form_intro_label: Hinweistext beim Start der Beitragserstellung
        resource_form_intro_description: Wird im Frontend oberhalb des Eingabebereichs angezeigt und gibt Nutzern Orientierung beim Erstellen eines Beitrags. Nutzen Sie dieses Feld für Hinweise zum gewünschten Format, zur inhaltlichen Ausrichtung oder für Tipps zur Formulierung. Der Text unterstützt Rich-Text-Formatierung und kann Links oder Hervorhebungen enthalten.
        resource_form_title_label: Überschrift oberhalb des Eingabebereichs
        resource_form_title_description: Wird im Frontend als einleitende Überschrift ganz oben im Bereich zur Beitragserstellung angezeigt. Wählen Sie eine klare, handlungsorientierte Formulierung wie „Neuen Vorschlag erstellen" oder „Ihre Idee einreichen". Die Überschrift hilft Nutzern zu verstehen, was auf dieser Seite von ihnen erwartet wird.
        resource_form_title_placeholder_label: Platzhaltertext für den Titel
        resource_form_title_placeholder_description: Wird im Eingabefeld für den Titel als grauer Platzhaltertext angezeigt, bevor der Nutzer etwas eingibt. Nutzen Sie diesen Text als Orientierungshilfe oder Inspiration – z. B. „Geben Sie Ihrem Vorschlag einen aussagekräftigen Titel". Der Platzhalter verschwindet automatisch, sobald der Nutzer mit der Eingabe beginnt.
        resource_form_description_placeholder_label: Platzhaltertext für die Beschreibung
        resource_form_description_placeholder_description: Wird im Eingabefeld für die Beschreibung als grauer Platzhaltertext angezeigt, bevor der Nutzer etwas eingibt. Nutzen Sie diesen Text, um Nutzern eine Richtung vorzugeben – z. B. „Beschreiben Sie Ihr Anliegen möglichst konkret". Der Platzhalter verschwindet automatisch, sobald der Nutzer mit der Eingabe beginnt.
        labels_name_label: Bezeichnung für Labels
        labels_name_description: Legt fest, unter welcher Bezeichnung Labels im Frontend für die Nutzer sichtbar sind. Standardmäßig wird der Begriff „Labels" verwendet, Sie können ihn jedoch durch eine passendere Bezeichnung ersetzen – z. B. „Kategorien", „Themenbereiche" oder „Schlagwörter". Die Änderung wirkt sich auf alle Stellen im Frontend aus.
        sentiments_name_label: Bezeichnung für Sentiments
        sentiments_name_description: Legt fest, unter welcher Bezeichnung Sentiments im Frontend für die Nutzer sichtbar sind. Standardmäßig wird der Begriff „Sentiments" verwendet, Sie können ihn jedoch durch eine passendere Bezeichnung ersetzen – z. B. „Stimmung", „Bewertung" oder „Gefühlslage". Die Änderung wirkt sich auf alle Stellen im Frontend aus.
        welcome_text_in_show_label: Einleitungstext oberhalb der eingereichten Vorschläge
        welcome_text_in_show_description: Wird im Frontend oberhalb der Liste der veröffentlichten Vorschläge angezeigt. Nutzen Sie dieses Feld, um den Nutzern eine inhaltliche Einführung zu geben, den Kontext der Beteiligung zu erläutern oder auf Besonderheiten hinzuweisen. Der Text unterstützt Rich-Text-Formatierung und kann Links oder Hervorhebungen enthalten.
        support_button_text_label: Text des Unterstützungsbuttons
        support_button_text_description: Bestimmt den Text des Buttons, mit dem Nutzer einen Vorschlag unterstützen können. Wählen Sie eine klare, motivierende Formulierung wie „Unterstützen", „Ich bin dafür" oder „Gefällt mir". Der Button-Text wird im Frontend an jedem Vorschlag angezeigt und sollte zur Tonalität der Beteiligung passen.
        description_label: Beschreibung der Abstimmungsphase
        description_description: Wird im Frontend als einleitender Text oberhalb der Abstimmung angezeigt. Nutzen Sie dieses Feld, um den Teilnehmern den Kontext der Abstimmung zu erläutern – z. B. worum es geht, wie abgestimmt wird und was mit den Ergebnissen geschieht. Der Text kann formatiert werden und unterstützt Rich-Text-Elemente.
        comment_form_title_label: Titel des Kommentarformulars
        comment_form_title_description: Wird als Überschrift oberhalb des Kommentarformulars angezeigt und gibt Nutzern eine Orientierung, was von ihnen erwartet wird. Wählen Sie eine einladende Formulierung, z. B. „Ihre Meinung ist gefragt", „Kommentar verfassen" oder „Feedback hinterlassen". Wenn das Feld leer bleibt, wird kein Titel angezeigt.
        comment_form_button_label: Button-Text des Kommentarformulars
        comment_form_button_description: Bestimmt den Text des Buttons, mit dem Nutzer ihren Kommentar absenden. Wählen Sie eine klare, handlungsorientierte Formulierung wie „Kommentar absenden", „Beitrag veröffentlichen" oder „Absenden". Der Button-Text sollte eindeutig vermitteln, dass der Kommentar damit veröffentlicht wird.
      poll:
        name_label: Name
        name_description: Legt den Namen der Abstimmung fest. Wählen Sie eine prägnante, verständliche Bezeichnung, die den Inhalt klar beschreibt, z. B. „Bürgerbefragung zur Stadtentwicklung" oder „Abstimmung über den Haushaltsplan". Der Name hilft Nutzern, die Abstimmung schnell zu identifizieren.
        closing_note_label: Text der Abschlussseite
        closing_note_description: Wird im Frontend auf der Abschlussseite angezeigt, nachdem Nutzer ihre Stimme abgegeben haben. Nutzen Sie dieses Feld für eine Danksagung, Informationen zum weiteren Verlauf oder einen Hinweis auf nächste Schritte – z. B. wann die Ergebnisse veröffentlicht werden. Der Text unterstützt Rich-Text-Formatierung und kann Links enthalten.
      projekt:
        total_duration_start_label: Startdatum
        total_duration_start_description: Startdatum
        total_duration_end_label: Enddatum
        total_duration_end_description: Enddatum
        show_in_overview_page_label: Projekt auf Projektübersichtsseite
        show_in_overview_page_description: Steuert, ob dieses Projekt auf der allgemeinen Projektübersichtsseite angezeigt wird. Die Projektübersichtsseite listet alle öffentlichen Projekte der Plattform auf und ist für Nutzer der zentrale Einstiegspunkt, um laufende und abgeschlossene Beteiligungsprojekte zu entdecken und zu filtern.
        show_in_homepage_label: Projekt auf der Startseite
        show_in_homepage_description: Blendet das Projekt auf der Startseite der Plattform ein, z. B. im Bereich „Aktuelle Projekte” oder unter weiterführenden Ressourcen. So erhalten besonders relevante oder aktuelle Projekte zusätzliche Aufmerksamkeit direkt beim ersten Besuch der Plattform – unabhängig von der Projektübersichtsseite.
        show_in_individual_list_label: Projekt in individueller Liste
        show_in_individual_list_description: Zeigt das Projekt auf der Projektübersichtsseite in einer eigenständigen, individuellen Liste an – getrennt von den automatisch generierten Listen wie „Laufende Projekte” oder „Abgeschlossene Projekte”. Diese Option eignet sich z. B. für hervorgehobene oder dauerhaft sichtbare Projekte.
        show_in_navigation_label: Projekt im Navigationsmenü
        show_in_navigation_description: Zeigt das Projekt als eigenen Eintrag im Hauptnavigationsmenü der Plattform an. Geeignet für dauerhaft wichtige Projekte, die Nutzer von jeder Seite aus direkt erreichen sollen. Das Navigationsmenü sollte übersichtlich bleiben – nehmen Sie nur wenige, zentrale Projekte auf.
        show_in_overview_page_navigation_label: Projekt in der Dropdown-Navigation
        show_in_overview_page_navigation_description: Zeigt das Projekt in der Dropdownliste des Navigationsmenüs an, die alle Projekte der Übersichtsseite bündelt. So bleibt das Hauptmenü schlank, während das Projekt trotzdem über die Navigation erreichbar ist.
        show_in_sidebar_filter_label: Projekt im Seitenleisten-Filter
        show_in_sidebar_filter_description: Nimmt das Projekt in den Projektfilter der Seitenleiste auf, mit dem Nutzer Vorschläge, Debatten und Abstimmungen nach Projekt einschränken können. Deaktivieren Sie die Option, wenn das Projekt in diesen Filterlisten nicht erscheinen soll.
      image:
        attachment_label: Bild
        attachment_description: "Das Bild wird im oberen Bereich des Newsletters als visueller Aufmacher angezeigt, direkt unterhalb des Logos und oberhalb des Titels. Verwenden Sie ein Querformat-Bild mit klarem Motiv, das thematisch zum Newsletter-Inhalt passt. Empfohlenes Format: mindestens 600 Pixel breit, JPG oder PNG. Das Bild ist ein Pflichtfeld und muss vor dem Versand hochgeladen werden."
      newsletter:
        recipient_group_id_label: Empfängergruppe
        recipient_group_id_description: 'Legt fest, an welche Empfängergruppe dieser Newsletter versendet wird. Empfängergruppen werden unter <a href="/adm/recipient_groups" target="_blank">Benachrichtigungen > Empfängergruppen</a> verwaltet und können z. B. nach Gebiet, Interessengebiet oder Registrierungsstatus zusammengestellt sein. Nur Nutzer, die der gewählten Gruppe zugeordnet sind, erhalten die E-Mail. Wenn Sie alle registrierten Nutzer erreichen möchten, wählen Sie die entsprechende Standardgruppe.'
        respect_newsletter_optout_label: Newsletter-Opt-out berücksichtigen
        respect_newsletter_optout_description: 'Wenn aktiviert, werden Nutzer, die in ihrem Konto „Newsletter und Systemmails" deaktiviert haben, beim Versand übersprungen — auch wenn sie sonst zur gewählten Empfängergruppe gehören würden. Diese Option sollte in der Regel aktiv bleiben, um den Wünschen der Nutzer zu entsprechen. Deaktivieren Sie sie nur in Ausnahmefällen, z. B. bei verpflichtenden Informationen, die alle Empfänger der Gruppe unabhängig von ihrer Newsletter-Einstellung erhalten sollen. Hinweis: Diese Option wirkt nur, wenn dem Newsletter eine Empfängergruppe zugeordnet ist. Bei älteren Newslettern mit Segment-Auswahl wird das Opt-out bereits durch das Segment selbst berücksichtigt.'
        from_label: Absender
        from_description: "Die E-Mail-Adresse, die als Absender im Posteingang der Empfänger angezeigt wird. Wichtig: Die Domain (alles nach dem @) darf nicht geändert werden, da der E-Mail-Versand sonst fehlschlägt. Nur der Teil vor dem @ kann angepasst werden. Antworten der Empfänger werden an diese Adresse gesendet – stellen Sie sicher, dass das Postfach aktiv überwacht wird."
        subject_label: Betreff
        subject_description: "Der Betreff erscheint als erste Zeile im Posteingang der Empfänger und entscheidet maßgeblich, ob die E-Mail geöffnet wird. Wählen Sie einen kurzen, aussagekräftigen Text, der das Thema des Newsletters klar benennt. Empfohlene Länge: 40 bis 60 Zeichen. Vermeiden Sie generische Formulierungen wie Newsletter Nr. 5."
        title_label: Titel
        title_description: "Wird als große Überschrift im oberen Bereich des Newsletters angezeigt, direkt unterhalb des Logos. Der Titel sollte das zentrale Thema der Ausgabe auf den Punkt bringen und visuell Aufmerksamkeit erzeugen. Er kann vom Betreff abweichen – während der Betreff für den Posteingang optimiert ist, darf der Titel im Newsletter ausführlicher oder gestalterisch freier sein."
        title_color_label: Titelfarbe
        title_color_description: "Bestimmt die Schriftfarbe der Hauptüberschrift im Newsletter. Verwenden Sie eine Farbe, die zum Corporate Design Ihrer Kommune passt und auf dem Hintergrund gut lesbar ist. Dunkle Farben auf hellem Hintergrund bieten den besten Kontrast. Geben Sie den Wert als Hex-Code ein (z. B. #1B3A5C). Bei leerem Feld wird die Standardfarbe verwendet."
        subtitle_label: Untertitel
        subtitle_description: Wird direkt unterhalb des Titels im Newsletter angezeigt und bietet Raum für eine ergänzende Erläuterung oder einen Slogan. Nutzen Sie den Untertitel, um den Titel inhaltlich zu vertiefen. Wenn das Feld leer bleibt, wird kein Untertitel dargestellt und der Titel steht allein.
        subtitle_color_label: Untertitelfarbe
        subtitle_color_description: "Bestimmt die Schriftfarbe des Untertitels im Newsletter. Wählen Sie eine Farbe, die sich dezent vom Titel absetzt, aber dennoch gut lesbar ist – z. B. ein etwas hellerer Ton desselben Farbtons. Geben Sie den Wert als Hex-Code ein (z. B. #4A6A8A). Bei leerem Feld wird die Standardfarbe verwendet."
        greeting_label: Begrüßung
        greeting_description: Der Begrüßungstext wird am Anfang des Newsletter-Inhalts angezeigt, vor dem eigentlichen Haupttext. Nutzen Sie eine freundliche, persönliche Anrede. Eine gute Begrüßung schafft Nähe und motiviert zum Weiterlesen. Der Text kann bei Bedarf auch einen kurzen Einstiegssatz enthalten.
        body_label: Inhalt
        body_description: "Der Hauptinhalt des Newsletters. Hier können Sie Texte, Links, Bilder und Formatierungen einfügen, um die Empfänger über aktuelle Beteiligungsprojekte, Ergebnisse oder Veranstaltungen zu informieren. Strukturieren Sie den Inhalt mit Absätzen und Zwischenüberschriften, damit er auch beim Überfliegen gut erfassbar ist. Der Editor unterstützt Rich-Text-Formatierung."
      site_customization/content_block:
        newsletter_email_footer_block_1:
          body_label: Newsletter-Fußbereich
          body_description: "Der Footer wird am Ende jeder Newsletter-E-Mail angezeigt. Hier können Sie z. B. Kontaktdaten, Impressum-Links oder Abmeldehinweise hinterlegen. Der Inhalt wird automatisch in alle versendeten Newsletter übernommen und sollte den rechtlichen Anforderungen Ihrer Kommune entsprechen. Änderungen werden sofort für neue Newsletter wirksam."
        email_footer:
          body_label: E-Mail-Fußzeile (alle E-Mails)
          body_description: "Wird in der Fußzeile jeder System-E-Mail angezeigt, oberhalb des Organisationsnamens und der Abmeldehinweise. Geeignet z. B. für Kontaktdaten, Impressum-Links oder allgemeine Informationen. Bleibt das Feld leer, wird nur die Standard-Fußzeile angezeigt."
        email_footer_deficiency_report:
          body_label: E-Mail-Fußzeile (Mängelmelder)
          body_description: "Wird in Mängelmelder-E-Mails anstelle der allgemeinen E-Mail-Fußzeile angezeigt. Bleibt das Feld leer, wird die allgemeine System-Fußzeile verwendet. Geeignet z. B. für Kontaktdaten oder Hinweise speziell zu Mängelmeldungen."
        auth_page_legend:
          registrations:
            body_label: "Registrierungsseite – linke Spalte"
            body_description: "Wird auf der Registrierungsseite (/users/sign_up) in der linken Spalte neben dem Formular angezeigt. Nutzen Sie diesen Bereich, um Ihre Plattform vorzustellen, den Nutzen einer Registrierung zu erklären oder rechtliche Hinweise zu ergänzen. Bleibt das Feld leer, wird stattdessen ein Standardtext angezeigt."
          sessions:
            body_label: "Anmeldeseite – linke Spalte"
            body_description: "Wird auf der Anmeldeseite (/users/sign_in) in der linken Spalte neben dem Formular angezeigt. Nutzen Sie diesen Bereich, um Nutzer willkommen zu heißen, auf laufende Beteiligungen hinzuweisen oder Hilfetexte einzublenden. Bleibt das Feld leer, wird stattdessen ein Standardtext angezeigt."
        registration_form_hint:
          body_label: "Hinweis über dem Registrierungsformular"
          body_description: "Wird über den Eingabefeldern des Registrierungsformulars auf /users/sign_up angezeigt. Geeignet z. B. für Hinweise zur Datenverarbeitung, zu erforderlichen Angaben oder zu Sonderfällen wie Einladungen. Bleibt das Feld leer, wird kein zusätzlicher Hinweis angezeigt."
        sign_in_hint:
          body_label: "Hinweis über dem Anmeldeformular"
          body_description: "Wird über den Eingabefeldern des Anmeldeformulars auf /users/sign_in angezeigt. Geeignet z. B. für aktuelle Hinweise, Wartungsmeldungen oder Anweisungen für externe Anmeldeverfahren. Bleibt das Feld leer, wird kein zusätzlicher Hinweis angezeigt."
      site_customization/image:
        header_image_label: Hintergrundbild für Desktop
        header_image_description: "Dieses Bild wird im oberen Bereich der Startseite auf Desktop-Geräten angezeigt. Bitte verwenden Sie ein hochauflösendes Querformat-Bild mit klarem Motiv. Es sollte thematisch zur Beteiligungsplattform passen und auch bei unterschiedlichen Bildschirmgrößen gut wirken. Empfohlenes Format: 1920 × 760 Pixel. Wird ignoriert, wenn unten ein Desktop-Hintergrundvideo hochgeladen ist."
        mobile_header_image_label: Hintergrundbild für Mobile
        mobile_header_image_description: "Dieses Bild wird auf Mobilgeräten im oberen Bereich der Startseite angezeigt. Verwenden Sie ein Bild mit zentriertem Hauptmotiv, da es auf kleinen Bildschirmen zugeschnitten werden kann. Es sollte thematisch zur Plattform passen und auch in kleiner Darstellung klar erkennbar sein. Empfohlenes Format: 470 × 246 Pixel. Wird ignoriert, wenn unten ein Mobile-Hintergrundvideo hochgeladen ist."
        logo_header_label: Logo (weißer Hintergrund)
        logo_header_description: "Dieses Logo wird in der oberen Navigationsleiste angezeigt, sobald der Hintergrund weiß ist – also z. B. nach dem Scrollen auf der Startseite. Es sollte gut lesbar auf hellem Hintergrund sein. Verwenden Sie idealerweise ein PNG mit transparentem Hintergrund. Empfohlenes Format: maximal 80 × 80 Pixel."
        logo_header_for_transparent_label: Logo (transparenter Hintergrund)
        logo_header_for_transparent_description: "Dieses Logo wird in der oberen Navigationsleiste angezeigt, solange der Hintergrund transparent ist – also z. B. über dem Headerbild. Es sollte gut auf wechselnden Hintergründen erkennbar sein. Verwenden Sie idealerweise ein helles PNG mit transparentem Hintergrund. Empfohlenes Format: max. 80 × 80 Pixel."
        logo_newsletter_email_label: Newsletter-Logo
        logo_newsletter_email_description: "Dieses Logo wird im Kopfbereich jeder Newsletter-E-Mail angezeigt und dient als visuelles Erkennungsmerkmal Ihrer Plattform. Verwenden Sie idealerweise ein PNG mit transparentem Hintergrund, das auf hellem Hintergrund gut lesbar ist. Das Logo sollte die Wiedererkennung Ihrer Kommune oder Plattform sicherstellen. Empfohlenes Format: 130 × 45 Pixel."
      site_customization/video:
        header_video_label: Hintergrundvideo für Desktop
        header_video_description: "Optionales Video, das im oberen Bereich der Startseite auf Desktop-Geräten anstelle des Hintergrundbilds abgespielt wird. Das Video startet automatisch, ist stumm geschaltet und läuft in Endlosschleife. Verwenden Sie ein kurzes, ruhiges Video im Querformat. Empfohlenes Format: 1920 × 760 Pixel. Wenn Sie sowohl ein Bild als auch ein Video hinzugefügt haben, dann hat das Video immer Vorrang. Erlaubte Formate: MP4, WebM. Maximale Größe: 50 MB."
        mobile_header_video_label: Hintergrundvideo für Mobile
        mobile_header_video_description: "Optionales Video, das im oberen Bereich der Startseite auf Mobilgeräten anstelle des Hintergrundbilds abgespielt wird. Das Video startet automatisch, ist stumm geschaltet und läuft in Endlosschleife. Verwenden Sie ein kurzes Video mit zentriertem Hauptmotiv. Empfohlenes Format: 470 × 246 Pixel. Wenn Sie sowohl ein Bild als auch ein Video hinzugefügt haben, dann hat das Video immer Vorrang. Erlaubte Formate: MP4, WebM. Maximale Größe: 50 MB."
      site_customization/page:
        projekt:
          title_label: Titel der Startseite
          title_description: "Der Titel der Startseite wird prominent über dem Hintergrundbild auf der Startseite angezeigt. Er sollte kurz und prägnant sein, um die Aufmerksamkeit der Besucher zu gewinnen."
          slug_label: URL-Pfad des Projekts
          slug_description: Legen Sie fest, unter welchem Pfad das Projekt erreichbar ist (z. B. "klimabudget" bei domain.de/klimabudget). Der URL-Pfad darf keine Leer- oder Sonderzeichen enthalten und sollte möglichst kurz und eindeutig sein.
        landing:
          slug_label: URL der Themenseite
          slug_description: 'Definiert den letzten Teil der Webadresse (Slug) dieser Themenseite, z. B. "jugendbeteiligung". Die vollständige URL lautet dann z. B. „ihre-domain.de/jugendbeteiligung“. Die URL darf keine Leer- oder Sonderzeichen enthalten.'
          landing_site_logo_for_transparent_background_label: Logo auf transparentem Hintergrund
          landing_site_logo_for_transparent_background_description: "Wird angezeigt, wenn die Top-Navigation noch vor dem Hintergrundbild liegt (z. B. direkt beim Aufrufen der Seite).
Dieses Logo sollte gut auf hellem und dunklem Hintergrund lesbar sein, da es über dem Hintergrundbild angezeigt wird. Optimal ist ein PNG mit transparentem Hintergrund. Sobald Nutzer scrollen, wechselt die Navigation auf weißen Hintergrund – dafür ist das zweite Logo vorgesehen."
          landing_site_logo_for_white_background_label: Logo auf weißem Hintergrund
          landing_site_logo_for_white_background_description: "Wird angezeigt, sobald die Seite gescrollt wurde und die Top-Navigation einen weißen Hintergrund hat.<br><br>Dieses Logo sollte in dunkler Farbe vor weißem Hintergrund gut sichtbar sein. Es ersetzt das transparente Logo automatisch, sobald die Navigation fixiert wird. Auch hier empfiehlt sich ein PNG, um scharfe Darstellung auf allen Geräten zu gewährleisten."
          landing_desktop_header_image_label: Hintergrundbild für Desktop
          landing_desktop_header_image_description: "Dieses Bild wird im oberen Bereich der Themenseite auf Desktop-Geräten angezeigt. Bitte verwenden Sie ein hochauflösendes Querformat-Bild mit klarem Motiv. Es sollte thematisch zur Themenseite passen und auch bei unterschiedlichen Bildschirmgrößen gut wirken. Empfohlenes Format: 1920 × 760 Pixel. Wird ignoriert, wenn unten ein Desktop-Hintergrundvideo hochgeladen ist."
          landing_desktop_header_video_label: Hintergrundvideo für Desktop
          landing_desktop_header_video_description: "Optionales Video, das im oberen Bereich der Themenseite auf Desktop-Geräten anstelle des Hintergrundbilds abgespielt wird. Das Video startet automatisch, ist stumm geschaltet und läuft in Endlosschleife. Verwenden Sie ein kurzes, ruhiges Video im Querformat. Empfohlenes Format: 1920 × 760 Pixel. Wenn Sie sowohl ein Bild als auch ein Video hinzugefügt haben, dann hat das Video immer Vorrang. Erlaubte Formate: MP4, WebM. Maximale Größe: 50 MB."
          landing_mobile_header_image_label: Hintergrundbild für Mobile
          landing_mobile_header_image_description: "Dieses Bild wird auf Mobilgeräten im oberen Bereich der Themenseite angezeigt. Verwenden Sie ein Bild mit zentriertem Hauptmotiv, da es auf kleinen Bildschirmen zugeschnitten werden kann. Empfohlenes Format: 470 × 246 Pixel. Wird ignoriert, wenn unten ein Mobile-Hintergrundvideo hochgeladen ist."
          landing_mobile_header_video_label: Hintergrundvideo für Mobile
          landing_mobile_header_video_description: "Optionales Video, das im oberen Bereich der Themenseite auf Mobilgeräten anstelle des Hintergrundbilds abgespielt wird. Das Video startet automatisch, ist stumm geschaltet und läuft in Endlosschleife. Verwenden Sie ein kurzes Video mit zentriertem Hauptmotiv. Empfohlenes Format: 470 × 246 Pixel. Wenn Sie sowohl ein Bild als auch ein Video hinzugefügt haben, dann hat das Video immer Vorrang. Erlaubte Formate: MP4, WebM. Maximale Größe: 50 MB."
          title_label: Titel der Themenseite
          title_description: "Der Titel benennt die Themenseite und wird in der Navigation, im Browser-Tab sowie in Projekt- und Übersichtskarten verwendet. Er erscheint nicht über dem Hintergrundbild – dafür ist der Kopfzeilentitel zuständig."
          header_title_label: Kopfzeilentitel
          header_title_description: "Der Kopfzeilentitel wird als große Überschrift über dem Hintergrundbild der Themenseite angezeigt. Der Untertitel erscheint direkt darunter. Bleibt das Feld leer, wird keine Überschrift dargestellt."
          subtitle_label: Untertitel der Themenseite
          subtitle_description: "Der Untertitel wird direkt unterhalb des Kopfzeilentitels über dem Hintergrundbild angezeigt. Bleibt das Feld leer, wird kein Untertitel dargestellt."
          landing_hide_title_and_subtitle_label: Titel und Untertitel auf der Themenseite ausblenden
          landing_hide_title_and_subtitle_description: "Blendet den Titel und Untertitel der Themenseite im Frontend aus. Diese Angaben dienen dann ausschließlich der internen Konfiguration und werden nicht über dem Hintergrundbild angezeigt."


          landing_site_logo_follow_to_landing_page_label: Klick auf Logo führt zu dieser Zielseite
          landing_site_logo_follow_to_landing_page_description: "Wenn aktiviert, führt ein Klick auf das Logo in der Top-Navigation nicht zur allgemeinen Startseite, sondern zur aktuell konfigurierten Themen- oder Gebietsseite."
          landing_navigation_link_color_label: Farbe der Links in der Top-Navigation
          landing_navigation_link_color_description: "Legen Sie die Schriftfarbe der Links in der oberen Navigationsleiste fest. Das ist wichtig, da das Hintergrundbild auf dieser Themenseite von dem auf der Startseite abweichen kann und die Lesbarkeit sichergestellt sein muss."
      budget/phase:
        name_label: Bezeichnung der Phase
        name_description: >
          Geben Sie den Namen dieser Budget-Phase ein, der im Frontend und in der Verwaltung angezeigt wird.
          Wählen Sie eine klare Bezeichnung, die den Ablaufschritt eindeutig beschreibt – z. B. „Vorschläge
          einreichen", „Interne Prüfung" oder „Abstimmung". Der Name hilft Nutzern, den aktuellen Stand
          des Bürgerhaushalts einzuordnen.
        starts_at_label: Startdatum
        starts_at_description: >
          Legt fest, ab wann diese Budget-Phase aktiv ist. Ab diesem Datum wird die Phase im Frontend als
          aktuell markiert und die zugehörigen Funktionen (z. B. Einreichung, Abstimmung) werden freigeschaltet.
          Das Startdatum sollte chronologisch nach dem Ende der vorherigen Phase liegen, um einen lückenlosen
          Ablauf zu gewährleisten.
        ends_at_label: Enddatum
        ends_at_description: >
          Legt fest, wann diese Budget-Phase endet. Nach diesem Datum wird die Phase im Frontend als
          abgeschlossen markiert und die zugehörigen Funktionen werden deaktiviert. Das System wechselt
          automatisch zur nächsten aktiven Phase. Stellen Sie sicher, dass das Enddatum vor dem Startdatum
          der folgenden Phase liegt.
      budget:
        voting_style_label: Abstimmungsstil
        voting_style_description: "Legt fest, wie Nutzer in der Abstimmungsphase ihre Stimmen abgeben. 'Knapsack' erlaubt mehrere Stimmen, bis das verfügbare Budget aufgebraucht ist. 'Zustimmung' beschränkt auf eine Stimme pro Vorschlag. 'Mehrere Stimmen' erlaubt eine feste Anzahl an Stimmen, unabhängig vom Budget."
        voting_style_label_options:
          knapsack: Knapsack (Mehrere Stimmen bis Budget aufgebraucht ist)
          approval: Zustimmung (Eine Stimme)
          distributed: Mehrere Stimmen
        currency_symbol_label: Währung
        currency_symbol_description: "Bestimmt das Währungssymbol, das im gesamten Bürgerhaushalt neben Beträgen angezeigt wird – z. B. bei Vorschlagskosten, Budgethöhe und Ergebnissen. Wählen Sie das Symbol, das der tatsächlich verwendeten Währung Ihrer Kommune entspricht. Die Änderung wirkt sich sofort auf alle Anzeigen aus."
        currency_symbol_label_options:
          "€": "€ (Euro)"
          "$": "$ (Dollar)"
          "£": "£ (Pfund)"
          "¥": "¥ (Yen)"
        max_preselected_label: Bestenliste
        max_preselected_description: "Begrenzt die Anzahl der bestbewerteten Vorschläge, die nach der Unterstützungsphase in die Prüfungsphase übernommen werden. Übernommen werden die Vorschläge mit den meisten Unterstützungen. Lassen Sie das Feld leer, wenn alle Vorschläge ohne Vorauswahl in die Prüfung gehen sollen.<br><br><strong>Wichtig:</strong> Sobald Sie hier eine Zahl größer als 0 eintragen, wird beim Abschluss der Unterstützungsphase automatisch eine System-E-Mail an alle Einreichenden versendet – eine Zusage an diejenigen, deren Vorschlag übernommen wurde, und eine Absage an alle übrigen."
        hide_money_label: Geld ausblenden
        hide_money_description: "Blendet sämtliche Geldbeträge im gesamten Bürgerhaushalt aus – sowohl bei einzelnen Vorschlägen als auch in Übersichten und Ergebnissen. Diese Option eignet sich, wenn das Budget nicht in Geldwerten gemessen wird oder wenn die Kosten der Vorschläge für die Teilnehmer nicht relevant sein sollen."
        max_number_of_winners_label: Maximale Anzahl an Gewinnern
        max_number_of_winners_description: "Begrenzt die Anzahl der Vorschläge, die am Ende der Abstimmung als Gewinner ermittelt werden können. Nur die bestbewerteten Vorschläge innerhalb des verfügbaren Budgets werden berücksichtigt. Lassen Sie das Feld leer, wenn alle Vorschläge gewinnen können, die das Budget nicht überschreiten."
        results_enabled_label: Ergebnisse
        results_enabled_description: "Steuert, ob die Ergebnisse des Bürgerhaushalts nach Abschluss der Abstimmung öffentlich einsehbar sind. Wenn aktiviert, werden die Gewinner und die Stimmverteilung auf der Ergebnisseite angezeigt. Deaktivieren Sie diese Option, wenn die Ergebnisse zunächst intern ausgewertet werden sollen."
        show_results_after_first_vote_label: Ergebnisse nach erster Stimme anzeigen
        show_results_after_first_vote_description: "Zeigt Zwischenergebnisse bereits an, sobald die erste Stimme abgegeben wurde. Nutzer können so den aktuellen Stand der Abstimmung in Echtzeit verfolgen. Deaktivieren Sie diese Option, wenn Zwischenergebnisse die Abstimmung beeinflussen könnten und erst nach Abschluss sichtbar sein sollen."
        show_percentage_values_only_label: Prozentuale Werte
        show_percentage_values_only_description: "Zeigt in den Abstimmungsergebnissen ausschließlich prozentuale Werte statt absoluter Stimmzahlen an. Dies kann sinnvoll sein, wenn die Gesamtzahl der Stimmen nicht öffentlich kommuniziert werden soll oder wenn relative Verhältnisse aussagekräftiger sind als absolute Zahlen."
        stats_enabled_label: Statistiken
        stats_enabled_description: "Aktiviert die Statistikseite für den Bürgerhaushalt, auf der demografische Daten und Beteiligungskennzahlen nach Abschluss der Abstimmung angezeigt werden. Die Statistiken umfassen u. a. die Gesamtzahl der Teilnehmer und die Verteilung nach Geschlecht. Deaktivieren, wenn keine Statistiken veröffentlicht werden sollen."
        advanced_stats_enabled_label: Erweiterte Statistiken
        advanced_stats_enabled_description: "Ergänzt die Statistikseite um detaillierte Auswertungen wie Altersverteilung, geografische Verteilung und zeitliche Verläufe der Stimmabgabe. Diese erweiterten Daten bieten tiefere Einblicke in das Beteiligungsverhalten. Voraussetzung ist, dass die Basisstatistiken ebenfalls aktiviert sind."
      budget/investment:
        title_label: Titel
        title_description: Der Titel des Vorschlags.
        description_label: Beschreibung
        description_description: Ausführliche Beschreibung des Vorschlags.
        price_label: Gesamtkosten
        price_description: Geschätzte Gesamtkosten des Vorschlags.
        feasibility_label: Kriterien
        feasibility_description: "Kriterienstatus des Vorschlags."
        feasibility_label_options:
          undecided: Nicht bewertet
          feasible: Entspricht den Kriterien
          unfeasible: Entspricht nicht den Kriterien
        selected_label: Ausgewählt
        selected_description: Wurde der Vorschlag zur Abstimmung ausgewählt?
        winner_label: Gewinner
        winner_description: Hat der Vorschlag die Abstimmung gewonnen?
        incompatible_label: Inkompatibel
        incompatible_description: Ist dieser Vorschlag mit einem anderen inkompatibel?
        visible_to_valuators_label: Sichtbar für Gutachter
        visible_to_valuators_description: Soll dieser Vorschlag für Gutachter sichtbar sein?
        valuator_explanation_label: Gutachter-Erklärung
        valuator_explanation_description: Erläuterung für Gutachter.
        valuation_finished_label: Bewertung beendet
        valuation_finished_description: Vorschlag kann vom Autor nicht mehr geändert werden.
        price_first_year_label: Jährliche Folgekosten (intern)
        price_first_year_description: Jährliche Folgekosten – nur für interne Informationen.
        duration_label: Umsetzungszeitraum (intern)
        duration_description: Geschätzter Zeitraum für die Umsetzung – nur für interne Informationen.
        video_url_label: Video-URL
        on_behalf_of_label: Im Auftrag von
        implementation_performer_label: Umsetzung
        implementation_performer_label_options:
          city: Umsetzung durch die Stadtverwaltung
          user: Ich kann bei der Umsetzung unterstützen
        implementation_contribution_label: Beitrag zur Umsetzung
        user_cost_estimate_label: Geschätzte Kosten (Nutzer)
      budget/heading:
        section_title: Standardüberschrift
        price_label: Budget
        price_description: "Legt das Gesamtbudget fest, das für Vorschläge in diesem Bereich zur Verfügung steht. Dieser Betrag bestimmt, wie viele Vorschläge umgesetzt werden können – die Summe der Gewinnervorschläge darf diesen Wert nicht überschreiten. Geben Sie den Betrag in der oben gewählten Währung ein."
        population_label: Bevölkerung (optional)
        population_description: "Anzahl der Einwohner, die diesem Budgetbereich zugeordnet sind. Der Wert wird für statistische Auswertungen und die Berechnung der Beteiligungsquote herangezogen. Lassen Sie das Feld leer, wenn keine bevölkerungsbezogene Auswertung gewünscht ist oder die Daten nicht vorliegen."
        max_ballot_lines_label: Stimmen erlaubt
        max_ballot_lines_description: "Maximale Anzahl an Vorschlägen, für die ein Nutzer in der Abstimmungsphase stimmen kann. Gilt ausschließlich für Budgets mit dem Abstimmungsstil 'Zustimmung'. Bei 'Knapsack' wird die Stimmabgabe stattdessen durch das verfügbare Budget begrenzt. Lassen Sie das Feld leer für unbegrenzte Stimmen."
