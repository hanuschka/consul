          title: Mängelmelder bearbeiten
        form_fields:
          placeholders:
            title: Titel der Meldung
            video_url: https://www.youtube.com/watch?v=...
            on_behalf_of: z. B. Maria Musterfrau
            on_behalf_of_company_name: z. B. Musterbau GmbH
            on_behalf_of_email: z. B. maria.musterfrau@example.com
            intake_channel: Bitte wählen
            subcategory: Keine Unterkategorie
          labels:
            title: Titel der Meldung
            description: Beschreibung
            image: Titelbild
            documents: Dokumente
            video_url: Video-URL
            category: Kategorie
            map_location: Kartenstandort
            on_behalf_of: Im Auftrag von
            on_behalf_of_company_name: Firma
            on_behalf_of_email: E-Mail-Adresse
            intake_channel: Eingangskanal
            subcategory: Unterkategorie
          hints:
            title: Der Titel des Beitrags wird in der Listenansicht und als Überschrift auf der Detailseite angezeigt. Er sollte das gemeldete Anliegen kurz und präzise beschreiben, damit Sachbearbeiter und Bürger den Inhalt auf einen Blick erfassen können.
            description: Die Beschreibung enthält alle relevanten Details zum gemeldeten Anliegen, wie den genauen Zustand, mögliche Ursachen und Auswirkungen. Dieser Text wird - je nach gewählter Voreinstellung - öffentlich auf der Detailseite des Beitrags angezeigt. Eine präzise Beschreibung erleichtert den Sachbearbeitern die Einschätzung und beschleunigt die Bearbeitung erheblich.
            image: Das Titelbild dokumentiert den gemeldeten Mangel visuell und wird – bei entsprechender Einstellung – auf der öffentlichen Detailseite der Meldung angezeigt. Ein aussagekräftiges Foto hilft den Sachbearbeitern, den Mangel schneller einzuschätzen und die Bearbeitung zu priorisieren. Unterstützt werden gängige Bildformate wie JPG und PNG.
            documents: Hier können ergänzende Dokumente wie Gutachten, Pläne oder Berichte zum Beitrag hinzugefügt werden. Die Dateien werden auf der Detailseite zum Download bereitgestellt und sind für alle Nutzer sichtbar. Mehrere Dokumente können gleichzeitig hochgeladen werden, um den Sachverhalt umfassend zu dokumentieren.
            video_url: Geben Sie die URL eines Videos ein, das das gemeldete Anliegen dokumentiert. Das Video wird auf der öffentlichen Detailseite des Beitrags eingebettet angezeigt. Unterstützt werden Links von gängigen Videoplattformen wie YouTube oder Vimeo. Ein Video kann den Sachverhalt besser veranschaulichen als Fotos allein.
            on_behalf_of: Geben Sie hier den Namen der Person ein, in deren Auftrag der Beitrag erstellt wurde. Dieses Feld wird verwendet, wenn ein Sachbearbeiter oder Administrator einen Beitrag stellvertretend für einen Bürger erfasst. Der Name wird auf der Detailseite angezeigt und hilft bei der Zuordnung des Beitrags.
            on_behalf_of_company_name: Optional. Die Firma oder Organisation, für die die Person das Anliegen meldet. Der Eintrag wird im Profil des verknüpften Benutzerkontos gespeichert, nicht am Anliegen selbst, und nur übernommen, wenn im Konto noch keine Firma hinterlegt ist.
            on_behalf_of_email: Optional. Wenn Sie eine E-Mail-Adresse angeben, wird das Anliegen dem dahinterliegenden Benutzerkonto zugeordnet. Existiert für die Adresse noch kein Konto, wird eines angelegt und erhält eine Bestätigungs-E-Mail (Double-Opt-In). Ein bereits vorhandenes Konto wird nur verknüpft und erhält keine Bestätigungs-E-Mail. Lassen Sie das Feld leer, bleibt das Anliegen Ihnen zugeordnet.
            category: Die Kategorie ordnet den Beitrag einem bestimmten Themenbereich zu, z. B. Straßenschäden, Beleuchtung oder Grünflächen. Sie beeinflusst die automatische Zuweisung an zuständige Sachbearbeiter und wird in der Listenansicht als farbiger Filter angezeigt. Eine korrekte Zuordnung beschleunigt die Bearbeitung.
            intake_channel: Der Weg, auf dem das Anliegen bei der Verwaltung eingegangen ist, z. B. Telefon, E-Mail oder persönlich. Die Angabe ist verpflichtend, sobald Sie ein Anliegen im Namen einer dritten Person erfassen. Anliegen, die Bürgerinnen und Bürger selbst über die Plattform einreichen, erhalten automatisch den konfigurierten Standardkanal.
            subcategory: Die Unterkategorie gliedert das Anliegen innerhalb der gewählten Kategorie feiner, z. B. „Schlaglöcher” unter „Bau & Verkehr”. Zur Auswahl stehen nur Unterkategorien der oben gewählten Kategorie; Kategorien ohne Unterkategorien zeigen kein Auswahlfeld an. Hat die Unterkategorie eine eigene Standard-Zuständigkeit, wird das Anliegen automatisch dorthin zugewiesen.
        administer:
          title: Administrieren
          status: Status
          status_hint: Der Status zeigt den aktuellen Bearbeitungsstand der Meldung an und wird auf der öffentlichen Detailseite sichtbar dargestellt. Eine Statusänderung kann automatisch eine E-Mail-Benachrichtigung an den Ersteller auslösen. Bestimmte Status können die Meldung auch automatisch archivieren, je nach Konfiguration der Statuswerte.
          responsible: Sachbearbeiter
          responsible_hint: Weisen Sie dieser Meldung einen zuständigen Sachbearbeiter oder eine Sachbearbeitergruppe zu. Der zugewiesene Sachbearbeiter erhält E-Mail-Benachrichtigungen bei Änderungen und kann die Meldung direkt bearbeiten. Bei Gruppeneinträgen wird die Standard-E-Mail der Gruppe für Benachrichtigungen verwendet.
          no_status: Kein Status
          no_statuses_title: Keine Statuswerte vorhanden
          no_statuses_description: Erstellen Sie zunächst Statuswerte unter „Status", um Meldungen einen Bearbeitungsstand zuweisen zu können.
          officers: Sachbearbeiter
          officer_groups: Sachbearbeitergruppen
          no_responsible: "-- Kein Sachbearbeiter --"
          no_officers_title: Keine Sachbearbeiter vorhanden
          no_officers_description: Erstellen Sie zunächst Sachbearbeiter unter „Sachbearbeiter", um Meldungen zuweisen zu können.
        audits:
          title: Änderungslog
        feedback_form:
          title: Feedback-Formular
          created_at: Erstellt am
          for_report: Für
      subcategories:
        index:
          title: Unterkategorien
          title_for_category: "Unterkategorien von „%{category}”"
          page_hint: "Hier verwalten Sie die Unterkategorien dieser Kategorie, z. B. „Schlaglöcher” unter „Bau & Verkehr”. Jede Unterkategorie kann eine eigene Standard-Zuständigkeit haben, die bei der Zuweisung neuer Anliegen Vorrang vor der Zuständigkeit der Hauptkategorie hat. Per Drag & Drop bestimmen Sie die Reihenfolge in der Auswahlliste. Kategorien ohne Unterkategorien zeigen im Meldeformular keine Auswahl an."
          new_subcategory: Neue Unterkategorie
          no_items_title: Keine Unterkategorien vorhanden
          no_items_description: Erstellen Sie eine Unterkategorie, um Anliegen innerhalb dieser Kategorie feiner zu gliedern.
          table:
            name: Bezeichnung
            default_responsible: Standard-Zuständigkeit
        new:
          title: Neue Unterkategorie
        create:
          success: Unterkategorie wurde erfolgreich erstellt.
        edit:
          title: Unterkategorie bearbeiten
        update:
          success: Unterkategorie wurde erfolgreich aktualisiert.
        destroy:
          success: Unterkategorie wurde erfolgreich gelöscht.
          cannot_destroy: Unterkategorie kann nicht gelöscht werden, da ihr noch Anliegen zugeordnet sind.
        form:
          name_label: Bezeichnung
          name_hint: Die Bezeichnung der Unterkategorie, wie sie im Meldeformular und in der Anliegenübersicht angezeigt wird, z. B. „Schlaglöcher”, „Straßenbeleuchtung” oder „Wilder Müll”. Wählen Sie Bezeichnungen, die Bürgerinnen und Bürger ohne Vorwissen verstehen.
          default_responsible_label: Standard-Zuständigkeit
          default_responsible_hint: Die Sachbearbeitergruppe oder Person, der Anliegen dieser Unterkategorie automatisch zugewiesen werden. Diese Angabe hat Vorrang vor der Standard-Zuständigkeit der Hauptkategorie, greift aber nur, wenn für das Gebiet des Anliegens keine eigene Zuständigkeit hinterlegt ist. Ohne Angabe gilt die Zuständigkeit der Hauptkategorie.
          officer_groups: Sachbearbeitergruppen
          officers: Sachbearbeitende
          no_responsible: Keine Zuständigkeit
          submit: Speichern
      categories:
        index:
          title: Kategorien
          page_hint: "Hier verwalten Sie die Kategorien für den Mängelmelder. Kategorien ordnen Meldungen thematischen Bereichen zu, z. B. Straßenschäden oder Beleuchtung. Jede Kategorie kann eine eigene Farbe, ein Symbol und einen Standard-Sachbearbeiter haben. Per Drag & Drop passen Sie die Reihenfolge an. Kategorien mit zugewiesenen Meldungen können nicht gelöscht werden."
          new_category: Neue Kategorie
          no_categories: Keine Kategorien vorhanden
          no_items_title: Keine Kategorien vorhanden
          no_items_description: Erstellen Sie eine neue Kategorie, um Meldungen zu klassifizieren.
          table:
            name: Name
            color: Farbe
            icon: Symbol
            default_responsible: Standard-Sachbearbeiter
            subcategories: Unterkategorien
            warning_text: Popup
            actions: Aktionen
          subcategories_link:
            one: 1 Unterkategorie
            other: "%{count} Unterkategorien"
            zero: Keine
          manage_subcategories: Unterkategorien verwalten
        new:
          title: Neue Kategorie
        create:
          success: Kategorie wurde erfolgreich erstellt.
        edit:
          title: Kategorie bearbeiten
        update:
          success: Kategorie wurde erfolgreich aktualisiert.
        destroy:
          success: Kategorie wurde erfolgreich gelöscht.
          cannot_destroy: Kategorie kann nicht gelöscht werden, da sie noch Mängelmelder enthält.
        form:
          name_label: Name
          name_hint: Der Name der Kategorie wird im Frontend bei der Meldungserstellung als Auswahlmöglichkeit angezeigt und dient der thematischen Zuordnung. Wählen Sie einen kurzen, allgemein verständlichen Begriff wie Straßenschäden, Beleuchtung oder Grünflächen. Der Name erscheint auch in der Verwaltungsübersicht und in Statistiken als Filtermerkmal.
          color_label: Farbe
          color_hint: Die Farbe wird als visuelle Kennzeichnung der Kategorie in der Listenansicht und auf der Karte verwendet. Sie hilft Bürgern und Sachbearbeitern, Meldungen verschiedener Kategorien auf einen Blick zu unterscheiden. Wählen Sie kontrastreiche Farben, die sich gut voneinander abheben, um die Übersichtlichkeit zu gewährleisten.
          icon_label: Symbol
          icon_hint: Das Symbol wird neben dem Kategorienamen in der Meldungsübersicht und auf der Karte angezeigt. Es dient als visuelle Unterstützung, um die Kategorie schnell erkennbar zu machen. Wählen Sie ein Symbol, das den Themenbereich inhaltlich widerspiegelt, z. B. eine Glühbirne für Beleuchtung oder einen Baum für Grünflächen.
          default_responsible_label: Standard-Sachbearbeiter
          default_responsible_hint: Der Standard-Sachbearbeiter wird automatisch als Zuständiger zugewiesen, wenn eine neue Meldung in dieser Kategorie eingeht. Dies beschleunigt die Bearbeitung, da keine manuelle Zuweisung nötig ist. Wenn kein Standard-Sachbearbeiter festgelegt ist, wird der Standard-Sachbearbeiter des jeweiligen Gebiets verwendet.
          officer_groups: Sachbearbeitergruppen
          officers: Sachbearbeiter
          no_responsible: "-- Kein Sachbearbeiter --"
          warning_text_label: Popup
          warning_text_hint: Der Popup-Text wird Bürgern als Hinweismeldung angezeigt, wenn sie diese Kategorie bei der Erstellung einer neuen Meldung auswählen. Nutzen Sie dieses Feld, um wichtige Informationen oder Warnungen zu übermitteln, z. B. Hinweise auf alternative Meldewege oder spezielle Zuständigkeiten. Das Popup erscheint direkt nach der Kategorieauswahl.
          submit: Speichern
      statuses:
        index:
          title: Status
          page_hint: "Hier verwalten Sie die Statuswerte für den Mängelmelder. Jeder Status hat einen Titel, eine Farbe und ein optionales Symbol. Sie können festlegen, ob ein Status Meldungen automatisch archiviert und nach wie vielen Tagen eine Erinnerung an den Sachbearbeiter gesendet wird. Per Drag & Drop bestimmen Sie die Reihenfolge der Statuswerte."
          new_status: Neuer Status
          no_statuses: Keine Status vorhanden
          no_items_title: Keine Status vorhanden
          no_items_description: Erstellen Sie einen neuen Status, um den Bearbeitungsfortschritt von Meldungen abzubilden.
          table:
            title: Titel
            icon: Symbol
            color: Farbe
            reminder_delay: Erinnerung (Tage)
            archive_reports: Archivieren
        new:
          title: Neuer Status
        create:
          success: Status wurde erfolgreich erstellt.
        edit:
          title: Status bearbeiten
        update:
          success: Status wurde erfolgreich aktualisiert.
        destroy:
          success: Status wurde erfolgreich gelöscht.
          cannot_destroy: Status kann nicht gelöscht werden, da er noch Mängelmelder enthält.
        form:
          title_label: Titel
          title_hint: Der Titel des Status wird in der Meldungsübersicht und auf der Detailseite als Statusanzeige verwendet. Er sollte den Bearbeitungsstand klar beschreiben, z. B. „In Bearbeitung", „Erledigt" oder „Abgelehnt". Bürger sehen diesen Titel auf der öffentlichen Seite, daher sollte er allgemein verständlich formuliert sein.
          description_label: Erläuterung
          description_hint: Eine kurze Erläuterung, was dieser Status bedeutet. Sie wird Bürgern in der Meldungsübersicht als Tooltip angezeigt, wenn sie den Statushinweis ansteuern. Beschreiben Sie verständlich, was der jeweilige Bearbeitungsstand für die Meldung bedeutet, z. B. „Ihre Meldung wurde eingegangen und wird derzeit geprüft." Bleibt das Feld leer, wird kein Tooltip angezeigt.
          color_label: Farbe
          color_hint: Die Farbe wird als visuelle Kennzeichnung des Status in Listen und auf der Detailseite der Meldung verwendet. Sie hilft dabei, verschiedene Bearbeitungsstände auf einen Blick zu unterscheiden. Wählen Sie kontrastreiche Farben, die sich gut voneinander abheben, um die Übersichtlichkeit in der Listenansicht zu gewährleisten.
          icon_label: Symbol
          icon_hint: Das Symbol wird neben dem Statusnamen in der Meldungsübersicht und auf der Detailseite angezeigt. Es dient als visuelle Unterstützung, um den Bearbeitungsstand schnell erkennbar zu machen. Wählen Sie ein Symbol, das den Status inhaltlich widerspiegelt, z. B. ein Häkchen für erledigte oder eine Uhr für laufende Vorgänge.
          reminder_delay_label: Erinnerung (Tage)
          reminder_delay_hint: Geben Sie die Anzahl der Tage ein, nach denen eine automatische Erinnerung an den zuständigen Sachbearbeiter gesendet wird, wenn die Meldung in diesem Status verbleibt. Der Wert 0 deaktiviert die Erinnerungsfunktion. Diese Einstellung hilft, vergessene oder liegengebliebene Meldungen rechtzeitig nachzuverfolgen.
          archive_reports_label: Archivieren
          archive_reports_hint: Wenn diese Option aktiviert ist, werden Meldungen automatisch archiviert, sobald sie in diesen Status versetzt werden. Archivierte Meldungen erscheinen nicht mehr in der aktiven Listenansicht, bleiben aber im System gespeichert und können über die Archivansicht eingesehen werden. Typisch für Endstatus wie „Erledigt" oder „Abgelehnt".
          notice_text_label: E-Mail-Benachrichtigungstext
          notice_text_hint: Dieser Text wird als Inhalt der E-Mail-Benachrichtigung an den Ersteller der Meldung gesendet, wenn die Meldung in diesen Status wechselt. Formulieren Sie den Text bürgerfreundlich und informativ, damit der Melder den aktuellen Stand seiner Meldung nachvollziehen kann. Lassen Sie das Feld leer, um keine Benachrichtigung zu senden.
          submit: Speichern
      intake_channels:
        index:
          title: Eingangskanäle
          page_hint: "Hier verwalten Sie die Eingangskanäle, über die Anliegen die Verwaltung erreichen – z. B. Telefon, E-Mail oder persönlich. Der als Standard markierte Kanal wird automatisch allen Anliegen zugewiesen, die Bürgerinnen und Bürger selbst über die Plattform einreichen. Per Drag & Drop bestimmen Sie die Reihenfolge in der Auswahlliste."
          new_intake_channel: Neuer Eingangskanal
          no_items_title: Keine Eingangskanäle vorhanden
          no_items_description: Erstellen Sie einen Eingangskanal, um festzuhalten, auf welchem Weg Anliegen eingegangen sind.
          table:
            name: Bezeichnung
            default: Standard
        new:
          title: Neuer Eingangskanal
        create:
          success: Eingangskanal wurde erfolgreich erstellt.
        edit:
          title: Eingangskanal bearbeiten
        update:
          success: Eingangskanal wurde erfolgreich aktualisiert.
        destroy:
          success: Eingangskanal wurde erfolgreich gelöscht.
          cannot_destroy: Eingangskanal kann nicht gelöscht werden, da er noch Anliegen zugeordnet ist.
        form:
          name_label: Bezeichnung
          name_hint: Die Bezeichnung des Eingangskanals, wie sie Sachbearbeitenden im Auswahlfeld angezeigt wird, z. B. „Telefon", „E-Mail", „Persönlich" oder „Brief". Wählen Sie kurze, eindeutige Bezeichnungen, damit der Weg des Anliegens auf einen Blick erkennbar ist.
          default_label: Standardkanal
          default_hint: Der Standardkanal wird automatisch allen Anliegen zugewiesen, die Bürgerinnen und Bürger selbst über die Plattform einreichen – üblicherweise „Plattform". Es kann immer nur ein Kanal als Standard markiert sein; die Markierung wechselt automatisch, sobald Sie einen anderen Kanal als Standard festlegen.
          submit: Speichern
      officers:
        index:
          title: Sachbearbeiter
          page_hint: "Hier verwalten Sie die Sachbearbeiter für den Mängelmelder. Sachbearbeiter können eingereichte Meldungen bearbeiten, den Status aktualisieren und offizielle Antworten verfassen. Suchen Sie über das Suchfeld nach registrierten Nutzern und weisen Sie ihnen die Sachbearbeiter-Rolle zu. Nur bereits registrierte Nutzer können als Sachbearbeiter hinzugefügt werden."
          search_label: Nutzer suchen
          search_description: Suchen Sie per E-Mail oder Nutzername nach registrierten Nutzern, die unter <a href="/adm/users" target="_blank">Nutzer</a> gelistet sind. Nur bereits registrierte Nutzer können als Sachbearbeiter für Mängelmelder hinzugefügt werden. Sachbearbeiter bearbeiten eingereichte Meldungen, kommunizieren mit den Bürgern und aktualisieren den Bearbeitungsstatus.
          no_officers: Keine Sachbearbeiter vorhanden
          no_items_title: Keine Sachbearbeiter vorhanden
          no_items_description: Suchen Sie nach einem Nutzer und weisen Sie die Sachbearbeiter-Rolle zu.
          table:
            name: Name
            email: E-Mail
            manage_all: Alle verwalten
        officer:
          add: Hinzufügen
        search:
          table:
            name: Name
            email: E-Mail
        user_not_found:
          user_not_found: Nutzer nicht gefunden
      districts:
        index:
          title: Gebiete
          page_hint: "Hier sehen Sie die Gebiete, die aus den registrierten Adressen übernommen werden. Jedem Gebiet kann ein Standard-Sachbearbeiter oder eine Sachbearbeitergruppe zugewiesen werden. Wenn eine neue Meldung ohne kategoriespezifischen Sachbearbeiter eingeht, wird automatisch der Standard-Sachbearbeiter des jeweiligen Gebiets zuständig."
          no_districts: Keine Gebiete vorhanden
          no_items_title: Keine Gebiete vorhanden
          no_items_description: Gebiete werden aus den registrierten Adressen übernommen und hier angezeigt.
          table:
            default_responsible: Standard-Sachbearbeiter
        edit:
          title: Bezirk bearbeiten
          default_responsible_label: Standard-Sachbearbeiter
          default_responsible_hint: Legen Sie den Standard-Sachbearbeiter oder die Sachbearbeitergruppe fest, die automatisch für neue Meldungen in diesem Gebiet zuständig ist. Wenn eine Meldung ohne Kategorie oder mit einer Kategorie ohne eigenen Sachbearbeiter erstellt wird, wird dieser Standardwert verwendet. So wird sichergestellt, dass jede Meldung eine Zuordnung hat.
          officer_groups: Sachbearbeitergruppen
          officers: Sachbearbeiter
          no_responsible: "-- Kein Sachbearbeiter --"
          submit: Speichern
        update:
          success: Bezirk wurde erfolgreich aktualisiert.
