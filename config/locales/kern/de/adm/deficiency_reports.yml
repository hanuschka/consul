      ai_settings:
        show:
          title: KI Sprachassistent
          page_hint: "Hier konfigurieren Sie den KI-Assistenten für den Mängelmelder. Die KI analysiert eingehende Meldungen automatisch anhand der definierten Fragen und Kriterien. Passen Sie die Fragen, Bewertungskriterien und Abschlussworte an, um die automatische Analyse auf Ihre Anforderungen zuzuschneiden. Leere Felder verwenden die Standardvorgaben."
          questions: Fragen
          questions_hint: Definieren Sie hier die Fragen, die der KI-Assistent bei der automatischen Analyse eingehender Meldungen berücksichtigen soll. Diese Fragen steuern, welche Informationen aus der Meldung extrahiert und ausgewertet werden. Lassen Sie das Feld leer, um die im Platzhalter angezeigten Standardfragen zu verwenden. Mehrere Fragen können zeilenweise aufgelistet werden.
          criteria: Kriterien
          criteria_hint: Legen Sie die Bewertungskriterien fest, nach denen der KI-Assistent die Meldungen einordnen und priorisieren soll. Die Kriterien bestimmen, wie die KI die Dringlichkeit und Relevanz einer Meldung einschätzt. Lassen Sie das Feld leer, um die im Platzhalter angezeigten Standardkriterien zu verwenden. Klare und präzise Kriterien verbessern die Analysequalität.
          parting_words: Abschlussworte
          parting_words_hint: Die Abschlussworte werden vom KI-Assistenten am Ende jeder automatischen Analyse angefügt. Nutzen Sie dieses Feld, um zusätzliche Hinweise oder Kontextinformationen bereitzustellen, die der KI als Orientierung bei der Zusammenfassung dienen. Lassen Sie das Feld leer, um die im Platzhalter angezeigten Standardformulierungen zu verwenden.
          update_button: Speichern
          not_connected: KI-App ist nicht verbunden
          not_connected_description: Um diese Funktion nutzen zu können, muss die KI-App erst durch demokratie.today aktiviert werden. Bitte wenden Sie sich an Ihren Ansprechpartner bei demokratie.today.
