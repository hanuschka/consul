de:
  adm:
    documents:
      index:
        title: Dokumente
        intro_title: Hinweis zu Dokumenten
        intro_text_p1: >
          In diesem Bereich verwalten Sie Dokumente, die zentral auf der Plattform gespeichert werden.
          Jede hochgeladene Datei erhält eine eindeutige URL, über die sie an beliebiger Stelle auf der
          Plattform verlinkt werden kann – etwa in Inhaltsbausteinen, Projekttexten oder der Navigation.
          So lassen sich Dokumente einmalig hochladen und plattformweit wiederverwenden.
        intro_text_p2: >
          Achten Sie bei der Benennung auf aussagekräftige Titel, da der Dateiname in der Übersicht angezeigt
          wird. Über den Button „Download-Link kopieren" können Sie die direkte Download-URL eines Dokuments
          in die Zwischenablage übernehmen und andernorts einsetzen.
        new_document: Neues Dokument hinzufügen
        empty_title: Keine Dokumente vorhanden
        empty_description: Laden Sie ein Dokument hoch, um es plattformweit verlinken zu können.
        table:
          title: Titel
          format: Format
          size: Größe
          url: URL
          copy_link: Download-Link kopieren
          actions: Aktionen
          delete: Löschen
          delete_confirm: Sind Sie sicher, dass Sie dieses Dokument löschen möchten?
      new:
        title: Neues Dokument hochladen
        form:
          submit: Dokument hochladen
          attachment_label: Datei
          hints:
            attachment: >
              Wählen Sie eine Datei von Ihrem Computer aus. Unterstützte Formate sind PDF, Word (DOCX),
              Excel (XLSX), JPEG und PNG. Der Dateiname wird automatisch als Titel des Dokuments übernommen.
              Nach dem Hochladen erhalten Sie eine eindeutige URL, über die das Dokument plattformweit
              verlinkt werden kann.

