de:
  adm:
    features:
      show:
        title: Funktionen
        intro_text: "Globale Funktionen, die noch keinen eigenen Bereich in der neuen Verwaltungsoberfläche haben. Änderungen wirken sich sofort auf die gesamte Plattform aus."
        oauth_logins_title: "Externe Anmeldedienste"
        oauth_logins_intro: "Jeder Dienst ergänzt die Anmelde- und Registrierungsseite um eine Schaltfläche. Ein Dienst funktioniert erst, wenn seine Zugangsdaten in der Serverkonfiguration hinterlegt sind."
        kobil_title: "KOBIL-Authentifizierung"
        kobil_credentials_incomplete_title: "KOBIL-Zugangsdaten unvollständig"
        kobil_credentials_incomplete_body: "Solange nicht alle erforderlichen Werte in config/secrets.yml hinterlegt sind, schlägt die Anmeldung über KOBIL fehl – auch wenn die Funktion unten aktiviert ist."
        whatsapp_title: "WhatsApp-Bot"
        whatsapp_intro: "Bürger:innen können ihre WhatsApp-Nummer mit ihrem Konto verbinden, per Chat Vorschläge einreichen und Benachrichtigungen zu neuen Projekten erhalten. Der Bot antwortet nur, wenn diese Funktion aktiv ist UND die Zugangsdaten hinterlegt sind."
        whatsapp_credentials_incomplete_title: "WhatsApp-Zugangsdaten unvollständig"
        whatsapp_credentials_incomplete_body: "In config/secrets.yml fehlen unter „whatsapp“ noch: %{keys}. Bis dahin antwortet der Webhook mit 404, auch wenn die Funktion unten aktiviert ist."
        whatsapp_template_missing_title: "Keine Nachrichtenvorlage hinterlegt"
        whatsapp_template_missing_body: "Ohne freigegebene 360dialog-Vorlage können keine Projekt-Benachrichtigungen versendet werden. Den Namen der Vorlage unten unter „whatsapp.broadcast_template“ eintragen."
