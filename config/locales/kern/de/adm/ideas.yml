          labels:
            title: Titel
            title_hint: Der Titel der Idee wird auf der Übersichtsseite und in der Detailansicht angezeigt. Er sollte prägnant und aussagekräftig formuliert sein, damit Bürgerinnen und Bürger den Inhalt der Idee auf einen Blick erfassen können. Änderungen am Titel werden sofort auf der Plattform sichtbar und in Suchergebnissen übernommen.
            description: Beschreibung
            description_hint: Die Beschreibung enthält alle Details zur Idee und wird in der Detailansicht angezeigt. Nutzen Sie die Textformatierung, um die Inhalte übersichtlich zu gliedern. Eine gut strukturierte Beschreibung hilft den Bürgerinnen und Bürgern, den Vorschlag besser zu verstehen und fundiert darüber abzustimmen.
            image: Bild
            image_hint: Das Titelbild wird in der Übersicht und in der Detailansicht der Idee angezeigt. Es dient als visueller Aufhänger und erhöht die Aufmerksamkeit für den Beitrag. Empfohlen werden Bilder im Querformat mit einer Mindestbreite von 800 Pixeln. Unterstützte Formate sind JPG, PNG und WebP. Zu große Dateien werden automatisch komprimiert.
            documents: Dokumente
            documents_hint: Hier können ergänzende Dokumente zur Idee hochgeladen werden, zum Beispiel Gutachten, Pläne oder Stellungnahmen. Die Dateien werden in der Detailansicht der Idee zum Download angeboten. Unterstützte Formate sind PDF, DOC, DOCX, XLS, XLSX, CSV und weitere gängige Dateitypen. Mehrere Dokumente können gleichzeitig hinzugefügt werden.
            video_url: Video-URL
            video_url_hint: Fügen Sie eine Video-URL von YouTube oder Vimeo ein, um ein erklärendes Video in der Detailansicht der Idee einzubetten. Das Video wird automatisch als Player dargestellt und bietet den Bürgerinnen und Bürgern eine zusätzliche Möglichkeit, den Vorschlag visuell nachzuvollziehen. Andere Videoplattformen werden nicht unterstützt.
            category: Kategorie
            category_hint: Die Kategorie ordnet die Idee einem thematischen Bereich zu und ermöglicht die Filterung in der Übersicht. Jede Kategorie verfügt über eine eigene Farbe und ein optionales Symbol zur visuellen Unterscheidung. Falls keine Kategorie passt, kann die Auswahl leer gelassen werden. Die Zuordnung ist jederzeit nachträglich änderbar.
            map_location: Kartenstandort
            on_behalf_of: Im Auftrag von
            on_behalf_of_hint: Dieses Feld gibt an, ob die Idee im Namen einer anderen Person oder Organisation eingereicht wurde. Der eingetragene Name wird in der Detailansicht der Idee öffentlich angezeigt. Lassen Sie das Feld leer, wenn die Idee direkt vom angemeldeten Benutzer eingereicht wurde und keine Vertretung vorliegt.
