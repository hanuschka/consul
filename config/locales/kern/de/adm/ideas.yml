        administer:
          title: Administrieren
          votes_needed_for_success: Benötigte Stimmen
          votes_needed_for_success_hint: Legen Sie fest, wie viele Stimmen eine Idee erreichen muss, um als erfolgreich zu gelten. Sobald die festgelegte Stimmenzahl erreicht ist, wird die Idee als erfolgreich markiert und kann zur weiteren Bearbeitung weitergeleitet werden. Ein Wert von null bedeutet, dass keine Mindeststimmenzahl erforderlich ist.
          timeframe: Zeitrahmen (Tage)
          timeframe_hint: Der Zeitrahmen bestimmt, wie viele Tage die Idee ab Veröffentlichung für Abstimmungen geöffnet bleibt. Nach Ablauf des Zeitraums werden keine weiteren Stimmen angenommen und der Status der Idee wird automatisch aktualisiert. Ein Wert von null bedeutet, dass kein zeitliches Limit für die Abstimmung gesetzt wird.
          officer: Sachbearbeiter
          officer_hint: Der Sachbearbeiter ist die zuständige Person für die Bearbeitung und Beantwortung dieser Idee. Er erhält Benachrichtigungen über neue Kommentare und Statusänderungen und kann eine offizielle Antwort verfassen. Wird kein Sachbearbeiter zugewiesen, greift der Standard-Sachbearbeiter der jeweiligen Kategorie oder des Gebiets.
