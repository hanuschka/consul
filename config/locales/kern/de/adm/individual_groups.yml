      form:
        submit: Speichern
        kinds:
          hard: Stark
          soft: Schwach
        hints:
          name: Name der Gruppe, wie er den Benutzern angezeigt wird.
          kind: Art der Gruppe (stark oder schwach).
          visible: Legt fest, ob die Gruppe für Benutzer sichtbar ist.
