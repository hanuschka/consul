de:
  adm:
    individual_groups:
      index:
        title: Nutzergruppen
        intro_title: Hinweis zu Nutzergruppen
        intro_text_p1: >
          Mit Nutzergruppen lassen sich Nutzer in benutzerdefinierte Segmente einteilen, die über die
          standardmäßige Unterscheidung nach Verifikationsstatus hinausgehen. Nutzergruppen wirken auf
          zwei Ebenen: Auf Projektebene steuern sie die Sichtbarkeit — nur Mitglieder der zugewiesenen
          Gruppe sehen das Projekt. Auf Beteiligungsphasenebene regeln sie die Teilnahme — nur
          Gruppenmitglieder können aktiv an der jeweiligen Phase teilnehmen.
        intro_text_p2: >
          Gruppen vom Typ „Stark" schließen nicht zugeordnete Nutzer explizit von Sichtbarkeit und
          Teilnahme aus. Gruppen vom Typ „Schwach" dienen als weichere Filter ohne harte Ausschlüsse.
          Nutzergruppen eignen sich besonders für verwaltungsinterne Projekte, bei denen nur ein
          definierter Personenkreis Zugang erhalten soll — etwa für Mitarbeiterbeteiligungen oder
          fachbereichsbezogene Abstimmungen.
        new_individual_group: Neue Gruppe erstellen
        empty_title: Keine Nutzergruppen vorhanden
        empty_description: Erstellen Sie eine neue Gruppe, um Nutzer in benutzerdefinierte Segmente einzuteilen.
        table:
          name: Name der Gruppe
          kind: Gruppentyp
          visible: Sichtbarkeit
          actions: Aktionen
          edit: Bearbeiten
          delete: Löschen
          yes: Ja
          "no": Nein
          delete_confirm: Sind Sie sicher, dass Sie diese Gruppe löschen möchten?
          kinds:
            hard: Stark
            soft: Schwach
      new:
        title: Neue Nutzergruppe erstellen
      edit:
        title: Nutzergruppe bearbeiten
      create:
        success: Gruppe erfolgreich erstellt.
      update:
        success: Gruppe erfolgreich aktualisiert.
      destroy:
        success: Gruppe erfolgreich gelöscht.
      form:
        submit: Speichern
        kinds:
          hard: Stark
          soft: Schwach
        hints:
          name: >
            Geben Sie einen aussagekräftigen Namen für die Nutzergruppe ein, z. B. „Fachbereich Stadtplanung"
            oder „Mitarbeiter Bauamt". Dieser Name wird Administratoren bei der Zuweisung von Projekten und
            Beteiligungsphasen angezeigt. Wählen Sie eine Bezeichnung, die den Personenkreis eindeutig
            identifiziert und eine schnelle Zuordnung ermöglicht.
          kind: >
            Wählen Sie den Typ der Gruppe. Gruppen vom Typ „Stark" schließen alle Nutzer, die nicht
            Mitglied der Gruppe sind, explizit von Sichtbarkeit und Teilnahme aus. Gruppen vom Typ „Schwach"
            dienen als weichere Empfehlung ohne harte Ausschlüsse — nicht zugeordnete Nutzer können weiterhin
            auf Projekte und Beteiligungsphasen zugreifen.
          visible: >
            Steuert, ob diese Nutzergruppe in der Benutzeroberfläche sichtbar ist. Deaktivieren Sie diese
            Option, wenn die Gruppe ausschließlich für die interne Steuerung von Sichtbarkeit und
            Teilnahmeberechtigungen verwendet werden soll, ohne dass Nutzer die Gruppenzugehörigkeit
            selbst einsehen können.
