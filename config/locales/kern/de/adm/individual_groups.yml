          Sie können mit Hilfe des CSV-Uploaders mehrere Einträge auf einmal hinzufügen.
          Die CSV benötigt lediglich eine Spalte mit den gewünschten E-Mail-Adressen.
          Der Spaltenname muss "Email" lauten.
          Sie können sich zunächst die <a href="%{sample_url}">Beispieldatei</a> ansehen.
