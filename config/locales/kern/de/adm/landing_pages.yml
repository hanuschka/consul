      settings:
        tabs:
          dashboard: Dashboard-Einstellungen
          contact_persons: Ansprechpartner
      landing_pages:
        index:
          title: Themenseiten
          new_landing_page: Neue Themenseite erstellen
          page_hint: "Themenseiten sind eigenständige Bereiche innerhalb Ihrer Plattform – für Zielgruppen (z. B. Jugendbeteiligung), Themen (z. B. Bauleitplanung) oder Gebiete (z. B. einzelne Gemeinden auf Landkreisebene). Jede Themenseite kann ein eigenes Hintergrundbild, Logo, Navigation und individuelle Texte erhalten. Per Drag & Drop passen Sie die Reihenfolge an."
          no_items_title: Keine Themenseiten vorhanden
          no_items_description: Sobald Themenseiten erstellt werden, werden diese hier angezeigt.
          table:
            header:
              name: Themenseiten
              url: URL
              projekts: Projekte
              status: Status
            no_landing_pages: Es wurden noch keine Themenseiten erstellt.
        new:
          title: Neue Themenseite erstellen
          submit: Themenseite erstellen
          hints:
            title: Der Titel dient als interne Bezeichnung der Themenseite und kann optional als Hauptüberschrift über dem Hintergrundbild angezeigt werden. Die Sichtbarkeit im Frontend lässt sich in den Seiteneinstellungen steuern. Wählen Sie einen aussagekräftigen Titel, der das Thema oder die Zielgruppe klar benennt, z. B. Jugendbeteiligung oder Beteiligung in Musterstadt.
            slug: Der URL-Pfad bestimmt die Webadresse der Themenseite, z. B. ergibt jugendbeteiligung die URL ihre-domain.de/jugendbeteiligung. Verwenden Sie einen kurzen, eindeutigen und gut lesbaren Pfad ohne Leer- oder Sonderzeichen. Nur Kleinbuchstaben, Zahlen und Bindestriche sind erlaubt. Der Pfad kann nach der Erstellung geändert werden.
        create:
          success: Die Themenseite wurde erfolgreich erstellt.
        edit:
          title: Themenseite bearbeiten
          page_hint: "Hier konfigurieren Sie die ausgewählte Themenseite. Sie können Logos, Hintergrundbilder, Titel und Untertitel anpassen sowie Navigationselemente und Inhaltskarten verwalten. Über die Navigationseinstellungen legen Sie fest, welche Links auf der Themenseite angezeigt werden. Inhaltskarten steuern die Darstellung der Projekte auf der Seite."
          managers_title: Themenseiten Manager
          managers_description: Legen Sie fest, welche Themenseiten-Manager Zugriff auf diese Seite erhalten. Ausgewählte Manager können Inhalte, Navigation, Bilder und Texte dieser Themenseite bearbeiten. Manager müssen zuvor unter Themenseiten > Manager angelegt worden sein. Änderungen an der Zuordnung werden sofort wirksam.
          managers_empty_title: Keine Themenseiten-Manager vorhanden
          managers_empty_description: Es sind noch keine Themenseiten-Manager angelegt. Erstellen Sie zunächst einen Manager, um diesen anschließend dieser Themenseite zuzuweisen.
          managers_empty_link: Manager anlegen
          projekts_title: Zugeordnete Projekte
          projekts_description: Diese Projekte sind dieser Themenseite aktuell zugeordnet und werden auf ihr angezeigt. Die Zuordnung erfolgt am Projekt selbst unter Projekte > Details. Beim Löschen dieser Themenseite werden die Projekte wieder der Hauptseite zugeordnet.
          projekts_empty_title: Keine Projekte zugeordnet
          projekts_empty_description: Dieser Themenseite ist noch kein Projekt zugeordnet. Öffnen Sie ein Projekt unter Projekte > Details und wählen Sie dort diese Themenseite aus.
          destroy_title: Themenseite löschen
          destroy_description: Beim Löschen dieser Themenseite werden auch ihre Navigationseinträge und Inhaltskarten entfernt. Dies kann nicht rückgängig gemacht werden.
          destroy_detaches_projekts:
            one: Das zugeordnete Projekt bleibt erhalten und wird wieder der Hauptseite zugeordnet.
            other: Die %{count} zugeordneten Projekte bleiben erhalten und werden wieder der Hauptseite zugeordnet.
          destroy_blocked_description: Diese Themenseite kann nicht gelöscht werden, da sie zu einem Projekt gehört.
        navbar_items:
          title: Navigation
          description: >
            Legen Sie fest, welche Navigationseinträge auf dieser Themenseite angezeigt werden, z. B. Links zu Projekten, externen Seiten oder Ankerpunkten.
            Per Drag & Drop können Sie die Reihenfolge der Einträge anpassen. Über den „Bearbeiten"-Button lassen sich Titel, URL und weitere Optionen konfigurieren.
          new_item: Neuen Eintrag erstellen
        update:
          success: Der Wert wurde erfolgreich aktualisiert.
        destroy:
          success: Die Themenseite wurde erfolgreich gelöscht.
          confirm: "Themenseite „%{title}“ wirklich löschen? Ihre Navigationseinträge und Inhaltskarten werden ebenfalls entfernt, zugeordnete Projekte werden wieder der Hauptseite zugeordnet. Dies kann nicht rückgängig gemacht werden."
          confirm_with_projekts:
            one: "Themenseite „%{title}“ wirklich löschen? Ihre Navigationseinträge und Inhaltskarten werden ebenfalls entfernt. Das zugeordnete Projekt bleibt erhalten und wird wieder der Hauptseite zugeordnet. Dies kann nicht rückgängig gemacht werden."
            other: "Themenseite „%{title}“ wirklich löschen? Ihre Navigationseinträge und Inhaltskarten werden ebenfalls entfernt. Die %{count} zugeordneten Projekte bleiben erhalten und werden wieder der Hauptseite zugeordnet. Dies kann nicht rückgängig gemacht werden."
          cannot_destroy: Die Themenseite kann nicht gelöscht werden, da sie zu einem Projekt gehört.
      managers:
        index:
          title: Themenseiten Manager
          page_hint: Hier verwalten Sie die Themenseiten-Manager. Manager können die ihnen zugewiesenen Themenseiten bearbeiten und deren Inhalte pflegen. Nutzer mit der Option Alle verwalten haben Zugriff auf sämtliche Themenseiten. Fügen Sie neue Manager hinzu, indem Sie registrierte Nutzer über die Schaltfläche Erstellen suchen und zuweisen.
          new_link: Neuen Themenseiten Manager hinzufügen
          manage_all_landing_pages: Alle verwalten
          no_landing_page_managers: Es sind keine Themenseiten Manager vorhanden.
          no_items_title: Keine Themenseiten Manager vorhanden
          no_items_description: Sobald Themenseiten Manager hinzugefügt werden, werden diese hier angezeigt.
        new:
          title: Neues Teammitglied hinzufügen
          search_label: Nutzer suchen
          search_description: Suchen Sie per E-Mail oder Nutzername nach registrierten Nutzern, die unter <a href="/adm/users" target="_blank">Nutzer</a> gelistet sind. Nur bereits registrierte Nutzer können als Themenseiten Manager hinzugefügt werden. Manager können Inhalte ihrer zugewiesenen Themenseiten bearbeiten und verwalten.
