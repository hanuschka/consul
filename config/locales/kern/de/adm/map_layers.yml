      form:
        protocol_label: Protokoll
        submit: Speichern
        labels:
          presentation: Kartendarstellung
          geojson_group: GeoJSON-Ebene
          geojson_file: GeoJSON-Datei
          geojson_file_attached: "Hochgeladene Datei: %{filename}"
          geojson_file_remove: Hochgeladene Datei entfernen
          style: Darstellung (einheitlich)
          fill_color: Füllfarbe
          fill_opacity: Deckkraft der Füllung (0–1)
          stroke_color: Linienfarbe
          stroke_weight: Linienstärke
          label_property: Beschriftungsfeld
          popup_properties: Felder im Popup
          choropleth: Einfärbung nach Wert (Choropleth)
          choropleth_enabled: Einfärbung nach Wert aktivieren
          choropleth_property: Datenfeld
          breaks: Schwellenwerte
          colors: Farben
          legend_title: Titel der Legende
          no_data_color: Farbe für fehlende Werte
        hints:
          name: >
            Bezeichnung der Kartenebene, wie sie im Frontend für die Nutzerinnen und Nutzer im
            Kartenmenü angezeigt wird. Wählen Sie einen kurzen, verständlichen Namen, der den
            Inhalt der Ebene eindeutig beschreibt.
          protocol: >
            Bestimmt die Art der Datenquelle und damit, welche weiteren Felder angezeigt werden:
            WMS-Dienst, Kachelkarte (XYZ) oder hochgeladene GeoJSON-Datei. WMS und XYZ binden
            externe Karten über eine URL ein, GeoJSON wird direkt aus einer Datei im Browser
            dargestellt.
          provider: >
            URL der externen Kartenquelle, über die die Kartenebene eingebunden wird (z. B.
            Basis-URL eines WMS-Dienstes oder Kachelschema einer XYZ-Karte). Achten Sie darauf,
            dass der Dienst öffentlich erreichbar ist und HTTPS unterstützt.
          attribution: >
            Text, der als Quellen- oder Lizenzhinweis unten rechts in der Karte angezeigt wird
            (z. B. ‚© Leaflet‘ oder ‚Daten: OpenStreetMap‘). Die Angabe ist häufig verpflichtend und
            sollte gemäß den Nutzungsbedingungen des Anbieters erfolgen.
          layer_names: >
            Technischer Name der Kartenebene gemäß der Capabilities-Datei des WMS-Dienstes; mehrere
            Ebenen kommagetrennt ohne Leerzeichen. Dieser Name ist nicht die Bezeichnung im
            Kartenmenü – eine falsche Schreibweise verhindert die Darstellung.
          presentation: >
            Legt fest, wie diese Kartenebene beim Laden der Karte dargestellt wird: als Basiskarte
            (Hintergrund), standardmäßig eingeblendet oder als transparenter Layer darüber.
            Transparente Ebenen lassen darunterliegende Inhalte sichtbar.
          opacity: >
            Markiert diese Kartenebene als transparent, sodass darunterliegende Basiskarten oder
            Ebenen sichtbar bleiben. Geeignet für Overlays wie Gebietsgrenzen, die den Hintergrund
            nicht vollständig verdecken sollen.
          geojson_file: >
            GeoJSON-Datei mit den anzuzeigenden Geometrien (max. 20 MB), die beim Aktivieren der
            Ebene direkt im Browser geladen und gerendert wird. Unterstützt werden Punkte, Linien
            und Flächen mit beliebigen Eigenschaften (Properties).
          label_property: >
            Name der Eigenschaft (Property) im GeoJSON, deren Wert als Beschriftung auf den
            Geometrien angezeigt wird (z. B. BEZ_GEM). Die Schreibweise muss exakt mit der
            GeoJSON-Datei übereinstimmen; bleibt das Feld leer, werden keine Beschriftungen
            angezeigt.
          popup_properties: >
            Kommagetrennte Liste der Eigenschaften, die beim Klick auf ein Element im Popup
            angezeigt werden (z. B. name,einwohner,flaeche). Die Namen müssen exakt den Properties
            in der GeoJSON-Datei entsprechen; die Reihenfolge bestimmt die Anzeige im Popup.
          choropleth: >
            Färbt die Flächen automatisch anhand eines numerischen Datenfelds ein und zeigt eine
            Legende an; die einheitliche Füllfarbe wird dabei überschrieben. Nach dem Aktivieren
            legen Sie Datenfeld, Schwellenwerte und Farben fest.
          choropleth_property: >
            Name des numerischen GeoJSON-Datenfelds, nach dessen Werten die Flächen eingefärbt
            werden (z. B. „HTTP Downl“). Das Feld muss numerische Werte enthalten; die Schreibweise
            muss exakt mit der Property in der Datei übereinstimmen.
          breaks: >
            Kommagetrennte, aufsteigend sortierte Schwellenwerte, die die Wertebereiche der
            Einfärbung abgrenzen (z. B. 10,30,50,100). Jeder Bereich zwischen zwei Werten erhält
            eine eigene Farbe; die Anzahl bestimmt die Zahl der Klassen.
          colors: >
            Kommagetrennte Hex-Farben für die Wertebereiche der Einfärbung (z. B.
            #ffffcc,#a1dab4,#41b6c4). Es muss genau eine Farbe mehr als Schwellenwerte angegeben
            werden; die Reihenfolge entspricht den aufsteigenden Wertebereichen.
          no_data_color: >
            Hex-Farbe für Elemente ohne gültigen Wert im ausgewählten Datenfeld (z. B. #cccccc). So
            bleiben Flächen ohne Daten von den eingefärbten Bereichen unterscheidbar; die Farbe
            erscheint auch in der Legende als „keine Daten“.
      map_layers:
        title: Kartenebenen
        description: Hier können zusätzliche Kartenebenen eingebunden werden – über einen WMS-Dienst, eine Kachelkarte (XYZ) oder als hochgeladene GeoJSON-Datei.
        table:
          name: Name der Kartenebene
          type: Typ
          protocol: Protokoll
          layer_names: Layername
          base: Base
          layer: Layer
        actions:
          edit: Bearbeiten
          delete: Löschen
          delete_confirm: Sind Sie sicher, dass Sie diese Kartenebene löschen möchten?
        no_layers: Keine Kartenebenen vorhanden.
        no_layers_title: Keine Kartenebenen vorhanden
        no_layers_description: "Fügen Sie über den Button oben eine Kartenebene hinzu, um zusätzliche Layer auf der Karte darzustellen."
        add_layer: Kartenebene hinzufügen
