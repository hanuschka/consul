      users:
        index:
          title: Nutzer blockieren
          page_hint: "Auf dieser Seite können Sie Nutzer suchen und deren Sichtbarkeit auf der Plattform einschränken. Durch Verstecken wird der Nutzer ausgeblendet, seine Inhalte bleiben jedoch erhalten. Durch Blockieren wird der Nutzer samt aller seiner Inhalte verborgen. Nutzen Sie die Suche, um gezielt nach E-Mail-Adresse oder Nutzername zu filtern."
          search_placeholder: E-Mail oder Nutzername
          search_button: Suchen
          no_items_title: Keine Nutzer gefunden
          no_items_description: Nutzen Sie die Suche, um Nutzer anhand von E-Mail oder Nutzername zu finden.
          statuses:
            hide: Versteckt
            block: Blockiert
          actions:
            hide: Verstecken
            block: Blockieren
          confirm_hide: "Sind Sie sicher? Damit wird der Nutzer \"%{name}\" ausgeblendet, ohne dass sein/ihr Inhalt verborgen wird."
          confirm_block: "Sind Sie sicher? Dadurch wird der Nutzer \"%{name}\" und alle seine/ihre Inhalte ausgeblendet."
        notice_hide: Der Nutzer wurde ausgeblendet. Inhalte, die von diesem Nutzer verfasst wurden, sind weiterhin verfügbar.
        notice_block: Der Nutzer wurde blockiert. Alle Inhalte dieses Nutzers wurden ausgeblendet.
      proposals:
        index:
          title: Vorschläge moderieren
          page_hint: Hier sehen Sie alle Vorschläge, die von Nutzern gemeldet wurden. Unter dem Tab Gemeldet finden Sie neue Meldungen zur Prüfung. Sie können Vorschläge herausmoderieren oder die Meldung als gelesen markieren, wenn kein Handlungsbedarf besteht. Herausmoderierte Vorschläge werden für Bürger unsichtbar, bleiben aber im System erhalten.
          projekt: Projekt
          author: Autor
          flags_count: Meldungen
          no_items_title: Keine Vorschläge vorhanden
          no_items_description: Sobald Vorschläge gemeldet werden, werden diese hier angezeigt.
          tabs:
            pending_flag_review: Gemeldet
            with_ignored_flag: Ignorierte Meldungen
            hidden: Herausmoderiert
            all: Alle
          statuses:
            hide: Herausmoderiert
            ignored: Als gelesen markiert
          actions:
            hide: Herausmoderieren
            ignore_flag: Als gelesen markieren
          confirm_hide: "Sind Sie sicher? Damit wird der Vorschlag \"%{name}\" herausmoderiert."
        notice_hide: Der Vorschlag wurde herausmoderiert.
      budget_investments:
        index:
          title: Vorschläge moderieren
          page_hint: Hier sehen Sie alle Bürgerhaushaltsvorschläge, die von Nutzern gemeldet wurden. Unter dem Tab Gemeldet finden Sie neue Meldungen zur Prüfung. Sie können Vorschläge herausmoderieren oder die Meldung als gelesen markieren. Herausmoderierte Vorschläge werden auf der Plattform nicht mehr angezeigt, bleiben aber zur Nachverfolgung im System gespeichert.
          projekt: Projekt
          author: Autor
          flags_count: Meldungen
          no_items_title: Keine Vorschläge vorhanden
          no_items_description: Sobald Vorschläge gemeldet werden, werden diese hier angezeigt.
          tabs:
            pending_flag_review: Gemeldet
            with_ignored_flag: Ignorierte Meldungen
            hidden: Herausmoderiert
            all: Alle
          statuses:
            hide: Herausmoderiert
            ignored: Als gelesen markiert
          actions:
            hide: Herausmoderieren
            unhide: Wiederherstellen
            ignore_flag: Als gelesen markieren
          confirm_hide: "Sind Sie sicher? Damit wird der Bürgerhaushaltsvorschlag \"%{name}\" herausmoderiert."
        notice_hide: Der Bürgerhaushaltsvorschlag wurde herausmoderiert.
      comments:
        index:
          title: Kommentare moderieren
          page_hint: Hier verwalten Sie gemeldete Kommentare. Unter dem Tab Gemeldet sehen Sie Kommentare, die von Nutzern als unangemessen markiert wurden. Sie können diese herausmoderieren, um sie von der öffentlichen Seite zu entfernen, oder die Meldung als gelesen markieren, wenn der Kommentar den Regeln entspricht. Alle Aktionen werden protokolliert.
          projekt: Projekt
          author: Autor
          flags_count: Meldungen
          no_items_title: Keine Kommentare vorhanden
          no_items_description: Sobald Kommentare gemeldet werden, werden diese hier angezeigt.
          tabs:
            pending_flag_review: Gemeldet
            with_ignored_flag: Ignorierte Meldungen
            hidden: Herausmoderiert
            all: Alle
          actions:
            hide: Herausmoderieren
            unhide: Wiederherstellen
            ignore_flag: Als gelesen markieren
          confirm_hide: "Sind Sie sicher? Damit wird der Kommentar herausmoderiert."
        notice_hide: Der Kommentar wurde herausmoderiert.
