          hints:
            title: Der Titel benennt das Vorhaben so, wie es Bürgerinnen und Bürger in der Vorhabenliste sehen. Wählen Sie eine kurze, verständliche Bezeichnung ohne Aktenzeichen und Abkürzungen.
            short_description: Die Kurzbeschreibung ist der Einstiegstext in der öffentlichen Vorhabenliste und soll das Vorhaben in etwa 420 Zeichen zusammenfassen. Beschreiben Sie in wenigen Sätzen, worum es geht und warum die Stadt das Vorhaben verfolgt.
            further_information: Ergänzende Erläuterungen für Interessierte, zum Beispiel Hintergründe, Planungsstände oder Rahmenbedingungen. Dieses Feld ist optional und wird unterhalb der Kurzbeschreibung angezeigt.
            last_resolution: Der letzte politische Beschluss zu diesem Vorhaben, zum Beispiel Gremium, Datum und Inhalt des Beschlusses. Lassen Sie das Feld leer, wenn noch kein Beschluss vorliegt.
            processing_status: Der aktuelle Bearbeitungsstand beschreibt, wo das Vorhaben gerade steht. Halten Sie ihn aktuell – er ist für Bürgerinnen und Bürger die wichtigste Information und erhöht bei jeder Änderung die Versionsnummer.
            next_steps: Die geplanten nächsten Schritte mit Zeitangabe, soweit absehbar. Grobe Angaben wie „1. Halbjahr 2027" sind ausdrücklich erwünscht, wenn noch kein genaues Datum feststeht.
            costs: Die Kostenangabe ist ein freies Textfeld und reicht von einer konkreten Summe bis zu einer allgemeinen Aussage zur Finanzierung.
            districts: Wählen Sie die Ortsteile aus, die von dem Vorhaben betroffen sind. Es können höchstens vier Ortsteile ausgewählt werden; betrifft das Vorhaben mehr Gebiete, wählen Sie die vier wichtigsten.
            topics: Ordnen Sie das Vorhaben den Themen zu, die schwerpunktmäßig betroffen sind. Die Themen dienen Bürgerinnen und Bürgern als Filter in der Vorhabenliste. Mindestens ein Thema ist erforderlich.
            formal_participation: Eine formelle Bürgerbeteiligung ist gesetzlich vorgeschrieben, zum Beispiel die Offenlage im Bauleitplanverfahren.
            formal_participation_reason: Erläutern Sie kurz, welche formelle Beteiligung vorgesehen ist – oder warum keine stattfindet.
            informal_participation: Eine informelle Bürgerbeteiligung erfolgt freiwillig, zum Beispiel über Workshops, Befragungen oder Beteiligungsverfahren auf dieser Plattform.
            informal_participation_reason: Erläutern Sie kurz, welche informelle Beteiligung vorgesehen ist – oder warum keine stattfindet.
            content_updated_at: Das Aktualisierungsdatum wird automatisch gesetzt, sobald sich inhaltliche Angaben des Vorhabens ändern. Es kann nicht von Hand gepflegt werden.
            version: Die Versionsnummer erhöht sich automatisch bei jeder inhaltlichen Änderung und macht für Bürgerinnen und Bürger nachvollziehbar, dass das Vorhaben fortgeschrieben wurde.
            links: Verweisen Sie auf weiterführende Seiten und Dokumente, zum Beispiel Beschlussvorlagen, Pläne oder das Ratsinformationssystem. Jeder Eintrag benötigt eine Bezeichnung und eine vollständige Adresse.
            contact_name: Name der Ansprechperson, die Bürgerinnen und Bürger bei Rückfragen zu diesem Vorhaben erreichen.
            contact_role: Funktion oder Amtsbezeichnung der Ansprechperson, zum Beispiel „Projektleitung Stadtentwicklung".
            contact_phone: Telefonnummer der Ansprechperson. Verwenden Sie möglichst eine Durchwahl, die auch bei Abwesenheit erreichbar ist.
            contact_email: E-Mail-Adresse der Ansprechperson. Eine Funktionsadresse ist einer persönlichen Adresse vorzuziehen.
            map_location: Setzen Sie die Kartenposition des Vorhabens per Klick in die Karte. Die Position ist erforderlich und wird in der öffentlichen Kartenansicht angezeigt.
            responsible: Legen Sie fest, wer das Vorhaben in der Verwaltung pflegt. Sie können eine einzelne Person aus der Sachbearbeitung oder eine ganze Bearbeitergruppe auswählen.
            system_mailbox_email: An dieses Postfach werden Hinweise von Bürgerinnen und Bürgern zu diesem Vorhaben weitergeleitet. Verwenden Sie eine Funktionsadresse, damit Hinweise auch bei Abwesenheit bearbeitet werden.
            internal_notes: Interne Notizen sind ausschließlich in der Verwaltung sichtbar und werden nie öffentlich angezeigt. Nutzen Sie das Feld für Absprachen, Zuständigkeiten oder Hinweise an Kolleginnen und Kollegen.
            status: Nur veröffentlichte Vorhaben erscheinen in der öffentlichen Vorhabenliste. Entwürfe sind ausschließlich in der Verwaltung sichtbar, archivierte Vorhaben werden aus der aktiven Liste genommen.
          placeholders:
            title: z. B. Neugestaltung des Marktplatzes
            costs: z. B. ca. 50.000 € oder im Haushalt eingeplant
            formal_participation_reason: z. B. Offenlage nach § 3 Abs. 2 BauGB im 2. Quartal 2027
            informal_participation_reason: z. B. Bürgerwerkstatt im Herbst, Ergebnisse fließen in die Planung ein
