      index:
        title: Newsletter
        empty_title: "Keine Newsletter vorhanden"
        empty_description: "Erstellen Sie einen neuen Newsletter, um Nutzer über aktuelle Projekte zu informieren."
        intro_text_p1: >
          Hier verwalten Sie alle Newsletter Ihrer Plattform. Newsletter werden an definierte Empfängergruppen
          versendet und informieren Nutzer über neue Projekte, Beteiligungsmöglichkeiten oder andere Neuigkeiten.
          Bevor Sie einen Newsletter erstellen, müssen zunächst unter „Empfängergruppen" die gewünschten
          Zielgruppen definiert werden – diese stehen dann im Newsletter-Formular zur Auswahl.
        intro_text_p2: >
          Über die weiteren Tabs können Sie nicht registrierte Abonnenten verwalten
          und die Newsletter-Einstellungen (z. B. Absenderadresse und Markenfarbe) anpassen.
