          page_hint: "Mit dem Import legen Sie viele Angebote auf einmal an. Laden Sie dazu eine CSV-Datei hoch, am einfachsten auf Basis der Vorlage. Dabei gilt:"
          rules:
            format: Spalten getrennt durch Semikolon oder Komma, Zeichenkodierung UTF-8 oder Excel-Standard.
            rows: Eine Zeile pro Angebot. Pflichtangaben sind Anbieter, Titel, Kurzbeschreibung sowie mindestens eine Angebotsart und ein Sozialraum.
            provider: Der Anbieter muss bereits angelegt sein und wird über seinen Namen zugeordnet.
            categories: Kategoriewerte müssen bereits existieren und werden über ihren Namen zugeordnet. Mehrere Werte in einer Zelle trennen Sie durch Kommas.
            dates: Ablaufdatum im Format TT.MM.JJJJ. Breitengrad und Längengrad sind optional.
          rules_outro: Gültige Zeilen werden auch dann angelegt, wenn andere Zeilen fehlerhaft sind. Importierte Angebote sind sofort veröffentlicht und gelten als geprüft. Bilder können nicht importiert werden.
          upload_title: CSV-Datei hochladen
          template: Vorlage herunterladen
          file_label: CSV-Datei
          file_hint: "CSV-Datei mit höchstens %{max}. Sehr große Bestände teilen Sie auf mehrere Dateien auf. Nach dem Import sehen Sie für jede Zeile, ob das Angebot angelegt wurde oder warum nicht. Laden Sie dieselbe Datei nicht ein zweites Mal hoch, sonst werden die Angebote doppelt angelegt."
