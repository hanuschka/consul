          name_hint: "Der Name erscheint im Eingabeformular, als Filter in der Angebotsübersicht und bei jedem Angebot, dem der Wert zugeordnet ist. Wählen Sie einen kurzen, allgemein verständlichen Begriff. Eine Umbenennung gilt sofort für alle zugeordneten Angebote. Sofern die automatische Übersetzung aktiv ist, wird der Name in die aktivierten Sprachen übersetzt."
          submit: Speichern
