        form:
          hints:
            name: "Der Name kennzeichnet den Anbieter in der Verwaltung, in der Auswahlliste des Eingabeformulars und in der Erinnerungs-E-Mail. Er wird über die offene Schnittstelle ausgegeben und bei der Suche in der Angebotsübersicht berücksichtigt. Beim CSV-Import wird der Anbieter über genau diesen Namen zugeordnet, deshalb sollte er eindeutig sein."
            email_list: "Eine E-Mail-Adresse pro Zeile. Personen mit diesen Adressen können nach Bestätigung ihres Kontos Angebote für diesen Anbieter einstellen und alle seine Angebote bearbeiten. Adressen von Personen, die noch nicht registriert sind, bleiben gespeichert und gelten automatisch, sobald sich die Person registriert. Wird eine Adresse entfernt, verliert das Konto diese Berechtigung sofort."
          placeholders:
            name: z. B. Jugendzentrum Nord
            email_list: |-
              anna.muster@traeger.example
              ben.beispiel@traeger.example
