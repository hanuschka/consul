de:
  adm:
    projekt_phases:
      index:
        intro_title: Hinweis zu den Beteiligungsphasen
        intro_text: |
          <p>In der nachfolgenden Tabelle verwalten Sie die einzelnen Beteiligungsphasen eines Projekts. Jede Phase ist einem eigenen Tab in der Fußzeile des Projekts zugeordnet und kann individuell ein- oder ausgeblendet werden. Drei zentrale Schieberegler helfen dabei, das Verhalten und die Sichtbarkeit der Phasen zu steuern:</p>
          <dl class="kern-description-list kern-description-list--col">
            <div class="kern-description-list-item">
              <dt class="kern-description-list-item__key">Standard</dt>
              <dd class="kern-description-list-item__value">Es kann immer nur eine Phase als Standard markiert sein. Diese Phase wird für neu ankommende Nutzer automatisch geöffnet und beim Aufruf der Projektseite im Vordergrund angezeigt.</dd>
            </div>
            <div class="kern-description-list-item">
              <dt class="kern-description-list-item__key">Aktiviert</dt>
              <dd class="kern-description-list-item__value">Wenn dieser Regler aktiviert ist, ist die jeweilige Beteiligungsphase technisch aktiv und im Frontend für Nutzer direkt aufrufbar.</dd>
            </div>
            <div class="kern-description-list-item">
              <dt class="kern-description-list-item__key">Sichtbarkeit im Projekt</dt>
              <dd class="kern-description-list-item__value">Steuert, ob die Phase im Projekt-Footer (Tab-Leiste) angezeigt wird. Wenn deaktiviert, bleibt die Phase zwar technisch aktiv und kann direkt über eine URL aufgerufen werden, wird aber nicht über einen sichtbaren Tab beworben. Dies ist z. B. nützlich bei Sonderformaten wie Gewinnspielen nach einer Abstimmung.</dd>
            </div>
          </dl>
          <p>Die Kombination dieser drei Einstellungen erlaubt eine flexible Steuerung von Ablauf, Sichtbarkeit und Nutzerführung innerhalb eines Beteiligungsprojekts.</p>
        title: Beteiligungsphasen
        new_phase: Neue Phase erstellen
        table:
          phase_tab_name: Beteiligungsphasen
          start_date: Start
          end_date: Ende
          restriction: Beschränkung
          default: Standard
          active: Aktiv
          visible: Sichtbar
          actions: Aktionen
      new:
        title: Neue Beteiligungsphase erstellen
        intro_title: Beteiligungsmodul auswählen
        intro_text: |
          <p>Wählen Sie ein Beteiligungsmodul aus, um eine neue Phase für dieses Projekt zu erstellen. Jedes Modul bietet unterschiedliche Funktionen für die Bürgerbeteiligung.</p>
        phase_type_label: Beteiligungsmodul
        phase_type_hint: Wählen Sie das gewünschte Modul für die neue Beteiligungsphase aus.
        select_phase_type: Bitte wählen...
        create_phase: Phase erstellen
      create:
        success: Die Beteiligungsphase wurde erfolgreich erstellt.
      update:
        success: Die Beteiligungsphase wurde erfolgreich aktualisiert.
      duration:
        title: Laufzeit
        dates_label: Laufzeit der Phase
        dates_description: Wann soll die Phase beginnen und enden?
      naming:
        title: Benennung
        phase_tab_name_label: Tab-Beschriftung im Footer der Projektseite
        phase_tab_name_description: Legt fest, wie der Tab zum Beteiligungsmodul im unteren Bereich der Projektseite benannt ist.
        cta_button_name_label: Button-Beschriftung auf der Projektseite
        cta_button_name_description: Legt fest, welcher Text im Beteiligungs-Button auf der Projektseite angezeigt wird.
        resource_form_title_label: Überschrift oberhalb des Eingabebereichs
        resource_form_title_description: Wird als einleitende Überschrift ganz oben im Bereich zur Beitragserstellung angezeigt (z. B. ‚Neuen Vorschlag erstellen‘).
        resource_form_intro_label: Hinweistext beim Start der Beitragserstellung
        resource_form_intro_description: Wird oberhalb des Eingabebereichs angezeigt, um Nutzern Hinweise oder Erläuterungen zum Ausfüllen zu geben.
        resource_form_title_placeholder_label: Platzhaltertext für den Titel
        resource_form_title_placeholder_description: Wird im Eingabefeld für den Titel als Platzhalter angezeigt – z. B. “Geben Sie Ihrem Vorschlag einen aussagekräftigen Titel!”
        resource_form_description_placeholder_label: Platzhaltertext für die Beschreibung
        resource_form_description_placeholder_description: Wird im Eingabefeld für die Beschreibung als Platzhalter angezeigt – z. B. “Beschreiben Sie Ihr Anliegen möglichst konkret.“
        welcome_text_in_show_label: Einleitungstext oberhalb der eingereichten Vorschlägen
        welcome_text_in_show_description: Wird oberhalb der veröffentlichten Vorschläge angezeigt und dient zur inhaltlichen Einführung oder Erläuterung.
        labels_name_label: Bezeichnung für Labels
        labels_name_description: Legt fest, wie der Begriff “Labels” im Frontend angezeigt wird – z. B. “Kategorien” oder “Themenbereiche”
        sentiments_name_label: Bezeichnung für Sentimente
        sentiments_name_description: Legt fest, wie der Begriff “Sentimente” im Frontend angezeigt wird – z. B. “Stimmung” oder “Gefühlslage”. Sentimente drücken aus, ob ein Vorschlag positiv, neutral oder negativ bewertet wird.“
        support_button_text_label: Text des Unterstützungsbuttons
        support_button_text_description: Legt fest, welcher Text im Button zur Unterstützung eines Vorschlags angezeigt wird – z. B. “Unterstützen” oder “Ich bin dafür”

        description_label: Description Label 11
        description_description: Description Description
        comment_form_title_label: Comment Form Title Label 12
        comment_form_title_description: Comment Form Title Description
        comment_form_button_label: Comment Form Button Label 13
        comment_form_button_description: Comment Form Button Description
      projekt_phase:
        duration: Laufzeit
        naming: Benennung
        restrictions:
          user_status:
            guest: Gäste
            registered: Registriert
            verified: Verifiziert
