      landing_pages:
        index:
          title: Themenseiten
          hint_title: Hinweis zu den Themenseiten
          hint_text: >
            Themenseiten ermöglichen eine gezielte Ansprache bestimmter Zielgruppen oder Orte innerhalb Ihrer Plattform. So können beispielsweise eigene Seiten für Jugendbeteiligung, Bauleitplanverfahren oder einzelne Ortsteile einer Gemeinde erstellt werden – jeweils mit eigenem Hintergrundbild, Logo und individuellen Texten. Die Gestaltungsmöglichkeiten ähneln denen der allgemeinen Startseite und schaffen Raum für visuelle und sprachliche Differenzierung.
          table:
            header:
              name: Themenseiten
              url: URL
              status: Status
            no_landing_pages: Es wurden noch keine Themenseiten erstellt.
        edit:
          title: Themenseite bearbeiten
          slug_label: URL der Themenseite
          slug_hint: Definiert den letzten Teil der Webadresse (Slug) dieser Themenseite, z. B. "jugendbeteiligung". Die vollständige URL lautet dann z. B. „ihre-domain.de/jugendbeteiligung". Die URL darf keine Leer- oder Sonderzeichen enthalten.
        update:
          success: Der Wert wurde erfolgreich aktualisiert.
      projekts:
        index:
          title: Projektübersicht
          hint_text: >
            Hier verwalten Sie alle Beteiligungsprojekte der Plattform. Jedes Projekt kann mit
            Laufzeit, Beteiligungsphasen, Sichtbarkeit und Projektmanagern konfiguriert werden.
            Über den Status-Toggle können Projekte aktiviert oder deaktiviert werden – deaktivierte
            Projekte sind im Frontend nicht sichtbar. Ein Klick auf den Projekttitel öffnet die
            Einstellungen, ein Klick auf das Vorschaubild führt zur öffentlichen Projektseite.
          new_projekt: Neues Projekt erstellen
          no_projekts_title: Keine Projekte vorhanden
          no_projekts_description: Erstellen Sie ein neues Projekt, um mit der Konfiguration von Beteiligungsphasen und Einstellungen zu beginnen.
          no_results_filtered_title: Keine Projekte für die aktuelle Suche
          no_results_filtered_description: Passen Sie die Suche an oder entfernen Sie sie, um weitere Projekte zu sehen.
          table:
            status: Status
            actions: Aktionen
        new:
          title: Neues Projekt erstellen
          intro_title: Neues Beteiligungsprojekt anlegen
          intro_text: Projekte sind der zentrale Baustein Ihrer Beteiligungsplattform. Jedes Projekt kann mehrere Beteiligungsphasen enthalten – z. B. Umfragen, Vorschläge, Abstimmungen oder Veranstaltungen. Nach der Erstellung konfigurieren Sie Laufzeit, Sichtbarkeit, Beschränkungen und die einzelnen Phasen. Projekte können einer Themenseite zugeordnet oder eigenständig auf der Startseite angezeigt werden.
          name_label: Projektname
          name_hint: Der Projektname wird als Titel auf der Projektseite, in der Projektübersicht und in der Navigation angezeigt. Er sollte das Thema der Beteiligung klar und verständlich benennen, damit Bürger auf einen Blick erkennen, worum es geht. Der Name kann nach der Erstellung jederzeit in den Projekteinstellungen geändert werden.
          name_placeholder: z.B. Bürgerbeteiligung Stadtentwicklung 2026
          create_projekt: Projekt erstellen
        create:
          success: Das Projekt wurde erfolgreich erstellt.
        copy:
          action: Projekt kopieren
          copy_name: Kopie von %{name}
          confirm: >
            Möchten Sie dieses Projekt kopieren? Alle Phasen, Einstellungen, Inhalte und
            von der Verwaltung angelegten Inhalte werden kopiert – Beiträge, Stimmen und
            Abonnements der Teilnehmenden nicht. Die Kopie wird deaktiviert angelegt.
          started: Die Kopie von „%{name}“ wird erstellt. Das kann einen Moment dauern.
          status_processing: Wird kopiert …
          status_failed: Kopieren fehlgeschlagen
        projekt:
          top_level_projekt: Top-Level-Projekt
          frontend_page: Projektseite
          details: Projektdetails
          visibility: Sichtbarkeit & Darstellung
          projekt_managers: Projektmanager
          map: Karte
          projekt_phases: Beteiligungsphasen
          images: Bilder
          documents: Dokumente
          delete: Löschen
          delete_confirm: Sind Sie sicher, dass Sie dieses Projekt löschen möchten? Alle zugehörigen Phasen werden ebenfalls gelöscht.
        tabs:
          frontend_page: Zur Projektseite
          details: Projektdetails
          visibility: Sichtbarkeit
          projekt_managers: Projektmanager
          map: Karte
          phases: Beteiligungsphasen
          images: Bilder
          documents: Dokumente
        details:
          title: Projektdetails
          hint_title: Hinweis zu den Projektdetails
          hint_text: >
            Auf dieser Seite konfigurieren Sie die grundlegenden Einstellungen des Projekts:
            den Titel der Startseite, die Projektlaufzeit, die Zuordnung zu Themenseiten sowie
            die geografische Einordnung. Diese Angaben bestimmen, wie das Projekt auf der Plattform
            dargestellt und gefunden wird.
          duration_label: Projektlaufzeit
          duration_description: Legt den Zeitraum fest, in dem das Projekt auf der Plattform sichtbar und zugänglich ist – unabhängig davon, ob gerade eine aktive Beteiligungsphase läuft. Das Start- und Enddatum bestimmt, wann das Projekt in der öffentlichen Projektübersicht erscheint und von Nutzern aufgerufen werden kann.
          landing_pages_label: Zuordnung zu Themenseiten
          landing_pages_description: Ordnet das Projekt optional einer oder mehreren Themenseiten zu. Themenseiten bündeln thematisch verwandte Projekte auf einer eigenen Einstiegsseite – z. B. für Jugendbeteiligung oder Stadtentwicklung. Ein Projekt kann mehreren Themenseiten gleichzeitig zugeordnet werden.
          parent_projekt_label: Übergeordnetes Projekt
          parent_projekt_description: Ordnet das Projekt optional einem übergeordneten Projekt zu. Im Frontend erscheint das Projekt dadurch als Unterseite unterhalb des zugeordneten Projekts, inklusive Navigation und Breadcrumb-Anzeige. Wählen Sie ein übergeordnetes Projekt aus, um Teilprojekte thematisch einem übergeordneten Rahmenprojekt zuzuordnen.
          no_parent_projekt: Kein übergeordnetes Projekt
          geo_restriction_label: Gebietszuordnung
          geo_restriction_description: Ordnet das Projekt einem geografischen Gebiet zu. Diese Zuordnung wird auf der Projektübersichtsseite als Filteroption angezeigt, sodass Nutzer gezielt nach Projekten in bestimmten Stadtteilen oder dem gesamten Stadtgebiet suchen können. Die Zuordnung hat keinen Einfluss auf die Sichtbarkeit des Projekts.
          geo_restriction:
            geozone_affiliated_no_affiliation: Keine Gebietszuordnung
            geozone_affiliated_entire_city: Stadtweit
            geozone_affiliated_only_geozones: Zuordnung zu Stadtteil
            geozones_label: Gebiete
            geozones_empty: Es sind noch keine Gebiete angelegt. Diese können in den allgemeinen Einstellungen verwaltet werden.
            districts_label: Stadtteile
            districts_empty: Es sind noch keine Stadtteile angelegt. Diese können in den allgemeinen Einstellungen verwaltet werden.
        visibility:
          title: Sichtbarkeit & Darstellung
          hint_title: Hinweis zur Sichtbarkeit
          hint_text: >
            Hier legen Sie fest, wo und für wen das Projekt sichtbar ist. Sie können steuern,
            ob es auf der Projektübersichtsseite, der Startseite oder in individuellen Listen
            erscheint. Zusätzlich lässt sich die Sichtbarkeit auf bestimmte Nutzergruppen
            einschränken und die Indexierung durch Suchmaschinen aktivieren oder deaktivieren.
          individual_groups_label: Sichtbarkeit auf starke Gruppen beschränken
          individual_groups_description: Beschränkt die Sichtbarkeit des Projekts auf ausgewählte Nutzergruppen, die zuvor unter „Starke Gruppen" angelegt wurden. Nur Mitglieder der hier zugewiesenen Gruppen können das Projekt sehen und daran teilnehmen. Ohne Auswahl bleibt das Projekt für alle registrierten Nutzer sichtbar.
        projekt_managers:
          title: Projektmanager
          hint_title: Hinweis zu Projektmanagern
          hint_text: >
            Projektmanager erhalten spezifische Berechtigungen für dieses Projekt, z. B.
            Administration, Moderation oder das Erstellen von Beiträgen im Namen anderer.
            Weisen Sie hier registrierten Projektmanagern individuelle Rechte zu. Neue
            Projektmanager können über den Menüpunkt „Projektmanager" in der Seitenleiste angelegt werden.
          no_managers_title: Keine Projektmanager vorhanden
          no_managers_description: Erstellen Sie einen neuen Projektmanager unter „Projektmanager" in der Seitenleiste, um diesen anschließend dem Projekt zuzuweisen.
          no_managers_link: Projektmanager anlegen
          assignment:
            hint: Legen Sie hier fest, welche Rechte dem ausgewählten Projektmanager für dieses Projekt erteilt werden sollen. Die Auswahl bestimmt, welche Aktionen verfügbar sind — etwa die Projektverwaltung, die Moderation von Inhalten, das Erstellen von Beiträgen im Namen anderer oder das Empfangen von Benachrichtigungen. Mehrere Rechte können kombiniert werden.
            permissions:
              manage: Projekt administrieren
              moderate: Inhalte moderieren
              create_on_behalf_of: Beiträge im Namen anderer erstellen
              get_notifications: Benachrichtigungen erhalten
              access_graphql: GraphQL-Zugriff erhalten
              review: Offline Stimmen hinzufügen
        map:
          title: Karte
          hint_title: Hinweis zur Kartenansicht
          hint_text: >
            Konfigurieren Sie hier die Kartenansicht für dieses Projekt. Beim Erstellen eines neuen Projekts
            werden die Grundeinstellungen der Standardkarte auf Applikationsebene automatisch übernommen.
            Sobald Sie die Karte hier im Projekt anpassen, werden nachträgliche Änderungen an der Standardkarte
            nicht mehr in dieses Projekt übernommen. Zusätzlich lassen sich Kartenebenen hinzufügen, um z. B.
            Geodaten oder Projektstandorte visuell hervorzuheben.
        phases:
          title: Beteiligungsphasen
          intro_title: Hinweis zu den Beteiligungsphasen
          intro_text_p1: "In der nachfolgenden Tabelle verwalten Sie die einzelnen Beteiligungsphasen eines Projekts. Jede Phase ist einem eigenen Tab in der Fußzeile des Projekts zugeordnet und kann individuell ein- oder ausgeblendet werden. Drei zentrale Schieberegler helfen dabei, das Verhalten und die Sichtbarkeit der Phasen zu steuern:"
          intro_text_standard_title: Standard
          intro_text_standard_description: Es kann immer nur eine Phase als Standard markiert sein. Diese Phase wird für neu ankommende Nutzer automatisch geöffnet und beim Aufruf der Projektseite im Vordergrund angezeigt.
          intro_text_active_title: Aktiviert
          intro_text_active_description: Wenn dieser Regler aktiviert ist, ist die jeweilige Beteiligungsphase technisch aktiv und im Frontend für Nutzer direkt aufrufbar.
          intro_text_visible_title: Sichtbarkeit im Projekt
          intro_text_visible_description: Steuert, ob die Phase im Projekt-Footer (Tab-Leiste) angezeigt wird. Wenn deaktiviert, bleibt die Phase zwar technisch aktiv und kann direkt über eine URL aufgerufen werden, wird aber nicht über einen sichtbaren Tab beworben. Dies ist z. B. nützlich bei Sonderformaten wie Gewinnspielen nach einer Abstimmung.
          intro_text_p2: Die Kombination dieser drei Einstellungen erlaubt eine flexible Steuerung von Ablauf, Sichtbarkeit und Nutzerführung innerhalb eines Beteiligungsprojekts.
          new_phase: Neue Phase erstellen
          no_phases_title: Keine Beteiligungsphasen vorhanden
          no_phases_description: Erstellen Sie eine neue Beteiligungsphase, um Bürgern die Teilnahme an diesem Projekt zu ermöglichen.
          table:
            phase_tab_name: Beteiligungsphasen
            start_date: Start
            end_date: Ende
            restriction: Beschränkung
            default: Standard
            active: Aktiv
            visible: Sichtbar
            actions: Aktionen
        images:
          title: Bilder
        documents:
          title: Dokumente
        update:
          success: Projekt erfolgreich aktualisiert.
        notify_reviewers:
          success: Benachrichtigung erfolgreich gesendet.
        destroy:
          success: Projekt erfolgreich gelöscht.