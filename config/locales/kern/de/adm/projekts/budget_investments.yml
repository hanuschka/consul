          title: Administrieren
          phase_2_3_title: "Phase 2 & 3: Prüfung auf Kriterienerfüllung"
          phase_2_3_hint: "Prüfen Sie, ob der Vorschlag den Kriterien entspricht. In Phase 4 (Unterstützungsphase) und Phase 7 (Abstimmungsphase) werden ausschließlich Vorschläge zur Wahl gestellt, die den Kriterien entsprechen und über ein abgeschlossenes Gutachten verfügen. Erst nach Abschluss des Gutachtens werden die Vorschläge zur Wahl freigegeben und die Erläuterung im Frontend veröffentlicht. Zudem kann ein Vorschlag nach Abschluss des Gutachtens vom Autor nicht mehr bearbeitet werden."
          phase_5_title: "Phase 5: Preisgestaltung"
          phase_5_hint: "Definieren Sie den Preis, der ab der Phase 6 öffentlich im Frontend angezeigt wird. Ergänzend dazu können die fortlaufenden Kosten und der Zeitrahmen festgelegt werden, welche ausschließlich für interne Informationen bestimmt sind. Hinweis: Die Preisgestaltung kann auch vor Phase 5 vorgenommen werden, sofern der Vorschlag die Kriterienprüfung bestanden hat."
          phase_5_early_access: Vorzeitig möglich (Entspricht den Kriterien)
          phase_6_title: "Phase 6: Zulassung zur Abstimmung"
          phase_6_hint: "Legen Sie fest, ob dieser Vorschlag für die Phase 7 (Abstimmungsphase) berücksichtigt werden soll."
          phase_8_title: "Phase 8: Gewinnerliste"
          phase_8_hint: "Definieren Sie, ob dieser Vorschlag bei der Berechnung der Gewinnervorschläge (Phase 9) unberücksichtigt bleiben soll. In diesem Fall wird der Vorschlag möglicherweise von der Gewinnerliste ausgeschlossen."
          selected_true: Vorschlag soll für die Abstimmung berücksichtigt werden
          selected_false: Vorschlag soll nicht für die Abstimmung berücksichtigt werden
