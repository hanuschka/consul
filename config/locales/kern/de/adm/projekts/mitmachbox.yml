de:
  adm:
    projekts:
      phases:
        mitmachbox_survey:
          title: Umfrage
          hint_text: >
            Hier erstellen und verwalten Sie die Umfrage, die auf den Mitmachbox-Geräten ausgespielt wird.
            Änderungen erfolgen an einem Entwurf und werden erst mit der Veröffentlichung auf die Geräte übertragen.
          unconfigured_title: Mitmachbox nicht konfiguriert
          unconfigured_text: Die Verbindung zur Mitmachbox-Plattform ist auf dieser Instanz nicht eingerichtet. Bitte wenden Sie sich an Ihren Administrator.
          missing_title: Noch keine Umfrage angelegt
          missing_text: Für diese Phase wurde noch keine Umfrage auf der Mitmachbox-Plattform angelegt.
          lost_title: Umfrage nicht mehr vorhanden
          lost_text: Die verknüpfte Umfrage existiert auf der Mitmachbox-Plattform nicht mehr. Sie können eine neue Umfrage anlegen.
          create_survey_button: Umfrage jetzt anlegen
          recreate_survey_button: Neue Umfrage anlegen
          survey_section_title: Umfrage
          survey_scope_pill: Wirkt sofort auf alle Geräte und die Online-Umfrage
          status_row_title: Status der Umfrage
          status_row_text: Legt fest, ob die Umfrage gerade Antworten annimmt. Der Status gilt gleichzeitig für alle Mitmachbox-Geräte und für die Online-Umfrage auf der Projektseite. Schließen Sie die Umfrage, wenn die Erfassung enden soll; die gesammelten Antworten bleiben erhalten.
          status_badges:
            open: "Geöffnet: nimmt Antworten an"
            closed: "Geschlossen: nimmt keine Antworten an"
            draft: Noch nicht geöffnet
            archived: "Archiviert: nimmt keine Antworten an"
          open_button: Umfrage öffnen
          close_button: Umfrage schließen
          reopen_button: Wieder öffnen
          archive_button: Umfrage archivieren
          open_confirm: Die Umfrage wird für die Datenerfassung auf allen Geräten und in der Online-Umfrage geöffnet.
          close_confirm: Die Datenerfassung wird auf allen Geräten und in der Online-Umfrage beendet. Bereits gesammelte Antworten bleiben erhalten. Sie können die Umfrage später wieder öffnen.
          reopen_confirm: Die Umfrage nimmt wieder Antworten an, auf allen Geräten und in der Online-Umfrage. Es gilt die laufende Version.
          archive_confirm: Die Umfrage wird beendet und aus den aktiven Listen ausgeblendet. Sie lässt sich in der Verwaltung nicht wieder öffnen.
          open_requires_published_hint: Die Umfrage kann erst geöffnet werden, wenn eine Version veröffentlicht wurde.
          responses_total: "Antworten insgesamt: %{count}"
          current_section_title: Laufende Version (Version %{number})
          current_scope_pill: Das sehen die Teilnehmenden gerade
          current_row_title: Fragen der laufenden Version
          current_row_text: Diese Fragen sehen die Teilnehmenden gerade an den Geräten und online. Eine veröffentlichte Version lässt sich nicht mehr bearbeiten. Erstellen Sie einen Entwurf, um Fragen zu ändern.
          current_questions_toggle:
            one: "%{count} Frage anzeigen"
            other: "%{count} Fragen anzeigen"
          new_draft_button: Neuen Entwurf erstellen
          new_draft_confirm: Die laufende Version wird in einen bearbeitbaren Entwurf kopiert. Geräte und Online-Umfrage zeigen weiterhin die laufende Version, bis Sie den Entwurf veröffentlichen.
          test_run_button: Probedurchlauf
          draft_section_title: Entwurf (Version %{number})
          draft_scope_pill: Für Teilnehmende nicht sichtbar
          draft_row_title: Fragen bearbeiten
          draft_row_text: Hier bereiten Sie Änderungen an den Fragen vor. Geräte und Online-Umfrage zeigen weiterhin die laufende Version, bis Sie den Entwurf veröffentlichen. Prüfen Sie den Entwurf vorher mit dem Probedurchlauf.
          add_question_button: Frage hinzufügen
          max_questions_hint: Diese Version hat die maximale Anzahl von 20 Fragen erreicht – mehr kann die Mitmachbox nicht laden.
          publish_row_title: Entwurf veröffentlichen
          publish_row_text: Ersetzt die laufende Version auf allen Geräten und in der Online-Umfrage durch diesen Entwurf, auch während die Umfrage geöffnet ist. Danach lässt sich die Version nicht mehr bearbeiten.
          publish_button: Entwurf veröffentlichen
          publish_confirm_replace: Version %{draft} ersetzt die laufende Version %{current} auf allen Geräten und in der Online-Umfrage.
          publish_confirm_first: Version %{draft} wird auf allen Geräten und in der Online-Umfrage ausgespielt, sobald die Umfrage geöffnet ist.
          publish_confirm_while_open: Die Umfrage ist geöffnet, der Wechsel passiert also während der laufenden Erfassung.
          publish_confirm_locked: Danach lässt sich Version %{draft} nicht mehr bearbeiten.
          no_questions: Noch keine Fragen vorhanden.
          no_published_version: Noch keine Version veröffentlicht.
          end_section_title: Umfrage beenden
          end_scope_pill: Lässt sich nicht rückgängig machen
          archive_row_title: Umfrage archivieren
          archive_row_text: Beendet die Umfrage und blendet sie aus den aktiven Listen aus. Eine archivierte Umfrage lässt sich in der Verwaltung nicht wieder öffnen. Archivieren Sie erst, wenn die Beteiligung abgeschlossen und ausgewertet ist.
          table:
            order: Reihenfolge
            prompt: Frage
            question_type: Fragetyp
            required: Pflichtfrage
            options: Antwortoptionen
            actions: Aktionen
            condition_summary: "Nur bei: %{question} = %{options}"
            condition_options_connector: " oder "
          move_up: Nach oben
          move_down: Nach unten
          edit: Bearbeiten
          delete: Löschen
          delete_confirm: Frage wirklich löschen?
        mitmachbox_test_run:
          title: Probedurchlauf
          hint: Klicken Sie sich durch die Umfrage wie an der Mitmachbox. Ihre Antworten werden nicht gespeichert.
          version_draft: "Entwurf (Version %{number})"
          version_current: "Veröffentlichte Version %{number}"
          step: "Frage %{current} von %{total}"
          next: Weiter
          required: Bitte wählen Sie eine Antwort.
          finished: Vielen Dank für Ihre Teilnahme!
          restart: Erneut starten
          no_questions: Diese Version enthält noch keine Fragen.
        mitmachbox_deployments:
          title: Geräte
          hint_text: >
            Hier sehen Sie die Ihrer Kommune zugewiesenen Mitmachbox-Geräte und steuern,
            in welchem Zeitraum die Umfrage dieser Phase darauf ausgespielt wird.
          assignments_title: Verfügbare Geräte
          assignments_empty: Ihrer Kommune sind derzeit keine Geräte zugewiesen.
          deployments_title: Ausspielungen dieser Umfrage
          deployments_empty: Diese Umfrage wird derzeit auf keinem Gerät ausgespielt.
          assignment_table:
            serial: Seriennummer
            device_status: Gerätestatus
            last_synced_at: Zuletzt synchronisiert
            window: Ausleihzeitraum
            status: Status
            actions: Aktionen
          deployment_table:
            device: Gerät
            location: Standort
            status: Status
            actions: Aktionen
          deploy_button: Dieser Umfrage zuweisen
          showing_this_survey: Zeigt bereits diese Umfrage
          showing_other_survey: "Zeigt derzeit: %{title}"
          adjust_button: Standort bearbeiten
          end_button: Jetzt beenden
          end_confirm: Die Ausspielung wird sofort beendet. Bereits gesammelte Antworten bleiben erhalten. Fortfahren?
          open_ended: unbefristet
          never_synced: noch nie
          statuses:
            scheduled: Geplant
            active: Aktiv
            ended: Beendet
        mitmachbox_results:
          title: Ergebnisse
          latency_hint: Ergebnisse werden von den Geräten gebündelt übertragen und können bis zu einem Tag verzögert erscheinen.
          responses_total: Antworten insgesamt
          version_label: Veröffentlichte Version %{number}
          published_at_label: veröffentlicht am %{date}
          answered_label:
            one: "%{count} Person hat diese Frage beantwortet"
            other: "%{count} Personen haben diese Frage beantwortet"
          reached_label:
            one: "%{count} Durchlauf hat diese Frage erreicht"
            other: "%{count} Durchläufe haben diese Frage erreicht"
          count_label: Anzahl
          option_label: Antwortoption
          source_device_label: Mitmachbox
          source_web_label: Online
          export_button: Als CSV herunterladen
          empty_title: Noch keine Ergebnisse
          empty_text: Es wurde noch keine Version veröffentlicht oder es liegen noch keine Antworten vor.
      mitmachbox:
        go_to_survey_tab: Zur Umfrage wechseln
        survey:
          created: Die Umfrage wurde angelegt.
          state_changed: "Der Status der Umfrage wurde geändert: %{state}."
          draft_created: Ein neuer Entwurf wurde erstellt.
          published: Der Entwurf wurde veröffentlicht.
          states:
            draft: Entwurf
            open: Geöffnet
            closed: Geschlossen
            archived: Archiviert
        questions:
          created: Die Frage wurde hinzugefügt.
          updated: Die Frage wurde aktualisiert.
          destroyed: Die Frage wurde gelöscht.
          prompt_label: Fragetext
          prompt_hint: Wird auf dem Display der Mitmachbox angezeigt. Formulieren Sie die Frage kurz und verständlich.
          question_type_label: Fragetyp
          question_type_hint: "Bestimmt, wie am Gerät geantwortet wird: eine Antwort, mehrere Antworten oder eine Bewertung auf einer Skala."
          question_types:
            single_choice: Einfachauswahl
            multiple_choice: Mehrfachauswahl
            rating: Bewertungsskala
          required_label: Pflichtfrage
          required_hint: Pflichtfragen müssen am Gerät beantwortet werden, bevor die nächste Frage angezeigt wird.
          required_checkbox_label: Antwort erforderlich
          save_button: Speichern
          options_title: Antwortoptionen
          options_hint: Maximal 5 Antwortoptionen – die Mitmachbox hat 5 Auswahltasten.
          add_option_button: Option hinzufügen
          no_options: Noch keine Antwortoptionen vorhanden.
          condition_title: Anzeigebedingung
          condition_hint: Die Frage wird nur angezeigt, wenn bei der gewählten Frage eine der angehakten Antworten gewählt wurde. Fragen dazwischen werden wie gewohnt angezeigt. Zur Auswahl stehen nur vorherige Fragen mit Einfachauswahl.
          condition_question_label: Abhängig von Frage
          condition_none: Keine Bedingung
          condition_source_option: "Frage %{number}: %{prompt}"
          condition_options_legend: "Antworten auf „%{prompt}“"
          condition_unavailable: Eine Anzeigebedingung braucht eine vorherige Frage mit Einfachauswahl und Antwortoptionen.
        options:
          created: Die Antwortoption wurde hinzugefügt.
          updated: Die Antwortoption wurde aktualisiert.
          destroyed: Die Antwortoption wurde gelöscht.
          label_label: Beschriftung
          label_hint: Wird auf dem Gerät neben der Auswahltaste angezeigt.
          value_label: Punktwert
          value_hint: Nur für Bewertungsskalen relevant, z. B. 1 bis 5.
          follow_up_label: Folgefrage
          follow_up_hint: Legt fest, welche Frage nach dieser Antwort angezeigt wird. Ohne Auswahl geht es mit der nächsten Frage weiter. Eine Folgefrage muss in der Reihenfolge weiter hinten liegen.
          follow_up_next: Nächste Frage in der Reihenfolge
          follow_up_end: Umfrage beenden
          follow_up_last_question: Diese Frage steht am Ende der Reihenfolge. Es steht keine Folgefrage zur Auswahl.
          save_button: Speichern
          delete_confirm: Antwortoption wirklich löschen?
          table:
            label: Beschriftung
            value: Punktwert
            follow_up: Folgefrage
            actions: Aktionen
        deployments:
          created: Die Umfrage wird auf dem Gerät ausgespielt.
          updated: Der Standort wurde aktualisiert.
          ended: Die Ausspielung wurde beendet.
          assignment_label: Gerät
          assignment_hint: Zur Auswahl stehen die Ihrer Kommune zugewiesenen Mitmachboxen mit ihrem Ausleihzeitraum.
          location_label: Standort
          location_hint: Optional. Wo steht die Box während dieser Umfrage, z. B. „Rathaus Eingang“?
          save_button: Speichern
          replace_warning: >
            Achtung: Das Zuweisen ersetzt eine ggf. laufende andere Umfrage auf diesem Gerät.
            Deren Zuweisung wird automatisch beendet.
        errors:
          connection: Die Mitmachbox-Plattform ist derzeit nicht erreichbar. Bitte versuchen Sie es später erneut.
          auth: Die Anmeldung an der Mitmachbox-Plattform ist fehlgeschlagen. Bitte prüfen Sie die hinterlegten Zugangsdaten.
          forbidden: Der Zugriff wurde von der Mitmachbox-Plattform abgelehnt. Bitte prüfen Sie die Konfiguration.
          not_found: Der angeforderte Datensatz wurde auf der Mitmachbox-Plattform nicht gefunden.
          conflict: "Die Aktion ist derzeit nicht möglich: %{message}"
          validation: "Die Eingaben wurden von der Mitmachbox-Plattform nicht akzeptiert: %{message}"
          generic: Bei der Kommunikation mit der Mitmachbox-Plattform ist ein Fehler aufgetreten.
          no_draft: Es ist kein bearbeitbarer Entwurf vorhanden. Erstellen Sie zuerst einen neuen Entwurf.
          branch_order: "Die Reihenfolge kann so nicht gespeichert werden: Eine Folgefrage muss hinter der Frage liegen, die auf sie verzweigt."
          condition_order: "Die Reihenfolge kann so nicht gespeichert werden: Eine Frage mit Anzeigebedingung muss hinter der Frage liegen, von der sie abhängt."
          condition_dependency: "Das ist nicht möglich, weil die Anzeigebedingung einer anderen Frage davon abhängt. Entfernen oder ändern Sie zuerst diese Bedingung."
          stale_order: "Die Reihenfolge wurde nicht gespeichert, weil sich die Fragenliste inzwischen geändert hat. Bitte ordnen Sie die Fragen erneut."
          max_options_reached: Es sind maximal 5 Antwortoptionen pro Frage möglich – die Mitmachbox hat 5 Auswahltasten.
          max_questions_reached: Es sind maximal 20 Fragen pro Version möglich – mehr kann die Mitmachbox nicht laden.
          max_questions_reached: Es sind maximal 20 Fragen pro Version möglich – mehr kann die Mitmachbox nicht laden.
          not_configured: Die Mitmachbox-Integration ist auf dieser Instanz nicht konfiguriert.
      mitmachbox_questions:
        new:
          title: Frage hinzufügen
        edit:
          title: Frage bearbeiten
      mitmachbox_options:
        new:
          title: Option hinzufügen
        edit:
          title: Option bearbeiten
      mitmachbox_deployments:
        new:
          title: Gerät dieser Umfrage zuweisen
        edit:
          title: Standort bearbeiten
