          no_follow_up_fields_title: Keine Follow-up Felder vorhanden
          no_follow_up_fields_description: Follow-up Felder werden nach dem Absenden des Hauptformulars in einem zweiten Schritt angezeigt und ermöglichen das Erfassen zusätzlicher Informationen. Typische Anwendungsfälle sind ergänzende Kontaktdaten, detaillierte Beschreibungen oder Rückfragen, die nicht alle Teilnehmer betreffen. Erstellen Sie hier neue Follow-up Felder für das Formular.
