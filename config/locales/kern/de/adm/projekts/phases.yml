de:
  adm:
    projekts:
      phases:
        index:
          intro_title: Hinweis zu den Beteiligungsphasen
          intro_text_p1: "In der nachfolgenden Tabelle verwalten Sie die einzelnen Beteiligungsphasen eines Projekts. Jede Phase ist einem eigenen Tab in der Fußzeile des Projekts zugeordnet und kann individuell ein- oder ausgeblendet werden. Drei zentrale Schieberegler helfen dabei, das Verhalten und die Sichtbarkeit der Phasen zu steuern:"
          intro_text_standard_title: Standard
          intro_text_standard_description: Es kann immer nur eine Phase als Standard markiert sein. Diese Phase wird für neu ankommende Nutzer automatisch geöffnet und beim Aufruf der Projektseite im Vordergrund angezeigt.
          intro_text_active_title: Aktiviert
          intro_text_active_description: Wenn dieser Regler aktiviert ist, ist die jeweilige Beteiligungsphase technisch aktiv und im Frontend für Nutzer direkt aufrufbar.
          intro_text_visible_title: Sichtbarkeit im Projekt
          intro_text_visible_description: Steuert, ob die Phase im Projekt-Footer (Tab-Leiste) angezeigt wird. Wenn deaktiviert, bleibt die Phase zwar technisch aktiv und kann direkt über eine URL aufgerufen werden, wird aber nicht über einen sichtbaren Tab beworben. Dies ist z. B. nützlich bei Sonderformaten wie Gewinnspielen nach einer Abstimmung.
          intro_text_p2: Die Kombination dieser drei Einstellungen erlaubt eine flexible Steuerung von Ablauf, Sichtbarkeit und Nutzerführung innerhalb eines Beteiligungsprojekts.
          title: Beteiligungsphasen
          new_phase: Neue Phase erstellen
          table:
            phase_tab_name: Beteiligungsphasen
            start_date: Start
            end_date: Ende
            restriction: Beschränkung
            default: Standard
            active: Aktiv
            visible: Sichtbar
            actions: Aktionen
            delete: Löschen
            confirm_delete: "Sind Sie sicher? Damit wird die Phase \"%{name}\" und alle zugehörigen Inhalte gelöscht."
        new:
          title: Neue Beteiligungsphase erstellen
          intro_title: Beteiligungsmodul auswählen
          intro_text: Wählen Sie ein Beteiligungsmodul aus, um eine neue Phase für dieses Projekt zu erstellen. Jedes Modul bietet unterschiedliche Funktionen für die Bürgerbeteiligung.
          phase_type_label: Beteiligungsmodul
          phase_type_hint: Jedes Beteiligungsmodul bietet unterschiedliche Funktionen – z. B. Abstimmungen, Vorschläge, Umfragen oder Veranstaltungen. Wählen Sie das Modul, das am besten zum Ziel dieser Beteiligungsphase passt. Nach der Erstellung können Sie die Phase weiter konfigurieren, z. B. mit Laufzeiten, Beschränkungen und Darstellungsoptionen.
          phases_overview_title: Übersicht der Beteiligungsmodule
          phases_overview:
            comment:
              name: Kommentare
              description: "Offenes Diskussionsforum, in dem Nutzer Beiträge verfassen und auf bestehende Kommentare antworten können. Eignet sich für den allgemeinen Meinungsaustausch zu einem Thema oder Projekt. Kommentare können moderiert und ausgeblendet werden. Ideal als niedrigschwelliger Einstieg in die Beteiligung, um Stimmungen und Meinungen zu erfassen."
            proposal:
              name: Vorschläge
              description: "Nutzer können Verbesserungsvorschläge einreichen, die von anderen Teilnehmern unterstützt und kommentiert werden. Vorschläge lassen sich auf einer Karte verorten und mit Labels versehen. Administratoren können Vorschläge moderieren und den Status verfolgen. Geeignet für Ideensammlungen, Bürgerwünsche und partizipative Planungsprozesse."
            point_of_interest:
              name: Orte von Interesse
              description: "Kartenbasierte Beteiligungsphase, in der Nutzer Standorte auf einer interaktiven Karte markieren und mit Kategorien versehen können. Jeder Eintrag kann beschrieben und kommentiert werden. Administratoren legen die Kategorien fest und begrenzen die Anzahl an Pins pro Nutzer. Geeignet für Mängelmeldungen oder räumliche Bestandsaufnahmen."
            question:
              name: Kurzumfrage
              description: "Einfache Frage-Antwort-Formate für schnelles Feedback zu konkreten Fragestellungen. Nutzer wählen aus vorgegebenen Antwortmöglichkeiten, die Ergebnisse werden in Echtzeit angezeigt. Administratoren können mehrere Fragen anlegen und die Darstellung konfigurieren. Ideal für Meinungsabfragen, Stimmungsbilder oder die Priorisierung von Themen."
            voting:
              name: Abstimmung
              description: "Strukturierte Abstimmungen mit verschiedenen Fragetypen wie Einfach- und Mehrfachauswahl, Bewertungsskalen oder Ja/Nein-Entscheidungen. Fragen können in thematischen Bündeln zusammengefasst werden. Unterstützt Online- und Offline-Abstimmungen mit separater Erfassung. Geeignet für verbindliche Entscheidungsprozesse und Bürgervoten."
            iframe:
              name: Iframe
              description: "Einbettung externer Inhalte über einen Iframe direkt in die Projektseite. Damit lassen sich interaktive Karten, externe Umfragetools, 3D-Modelle oder Webanwendungen von Drittanbietern nahtlos integrieren. Die Konfiguration beschränkt sich auf die Angabe der URL. Es werden keine weiteren Inhalte innerhalb der Plattform verwaltet oder gespeichert."
            budget:
              name: Budget
              description: "Mehrstufiger Beteiligungshaushalt von der Einreichung über die Machbarkeitsprüfung bis zur Abstimmung. Nutzer reichen Vorschläge mit Kostenangaben ein, die von der Verwaltung geprüft werden. In der Abstimmungsphase entscheiden die Bürger über die Verteilung des Budgets. Unterstützt Offline-Abstimmungen und automatische Gewinner-Ermittlung."
            legislation:
              name: Textbearbeitung
              description: "Kollaborative Textarbeit mit Versionierung für die gemeinsame Erarbeitung von Dokumenten. Nutzer können Entwürfe lesen, Absätze kommentieren und Änderungsvorschläge einbringen. Administratoren verwalten Entwurfsversionen und ordnen Kommentare Textpassagen zu. Geeignet für Satzungen, Leitlinien oder Verordnungen, die öffentlich diskutiert werden."
            formular:
              name: Formular
              description: "Benutzerdefinierte Formulare mit konfigurierbaren Pflicht- und Folgefeldern für strukturierte Eingaben. Administratoren gestalten das Formular mit verschiedenen Feldtypen und können Folge-E-Mails versenden. Antworten lassen sich einsehen und als CSV exportieren. Eignet sich für Anträge, Bewerbungen oder jede Art von standardisierter Datenerhebung."
            event:
              name: Veranstaltungen
              description: "Ankündigung und Verwaltung von Terminen wie Workshops, Bürgerversammlungen oder Ortsbegehungen. Jede Veranstaltung enthält Datum, Uhrzeit, Ort und Beschreibung. Teilnehmer können per E-Mail über neue Termine benachrichtigt werden. Ideal, um Präsenzformate in den digitalen Beteiligungsprozess einzubinden und Termine zentral zu kommunizieren."
            milestone:
              name: Meilensteine
              description: "Darstellung des Projektfortschritts über Meilensteine und Fortschrittsbalken. Administratoren definieren wichtige Etappen mit Datum und Beschreibung sowie Fortschrittsbalken zur visuellen Darstellung. Nutzer sehen auf einen Blick, welche Schritte abgeschlossen sind und was als Nächstes ansteht. Schafft Transparenz über den Projektverlauf."
            projekt_notification:
              name: Benachrichtigungen
              description: "Versand von Ankündigungen und Mitteilungen an die Nutzer eines Projekts. Administratoren erstellen Benachrichtigungen mit Titel und Inhalt, die im Projekt angezeigt und optional per E-Mail versendet werden. Eignet sich für Statusupdates, Zwischenergebnisse oder Terminänderungen — überall dort, wo aktive Information der Teilnehmer nötig ist."
            livestream:
              name: Livestream
              description: "Einbettung von Live-Videos über YouTube oder Vimeo direkt in die Projektseite. Nutzer können die Übertragung verfolgen und über eine integrierte Fragefunktion Fragen stellen. Per E-Mail können Teilnehmer vorab über den Termin informiert werden. Geeignet für die Übertragung von Ratssitzungen, Bürgerversammlungen oder Informationsveranstaltungen."
            argument:
              name: Stimmen
              description: "Darstellung von Pro- und Contra-Argumenten zu einem Thema, z. B. von Experten oder Interessengruppen. Jedes Argument kann mit Autorenbild, Namen und Begründung versehen werden. Administratoren ordnen die Argumente den Seiten Pro und Contra zu. Eignet sich zur strukturierten Abwägung kontroverser Themen und unterschiedlicher Perspektiven."
            newsfeed:
              name: Newsfeed
              description: "Anzeige von Projektneuigkeiten und Statusmeldungen in chronologischer Reihenfolge. Funktioniert wie ein Nachrichtenfeed, über den Administratoren laufend über Entwicklungen und Entscheidungen berichten können. Geeignet für längerfristige Projekte, bei denen die Teilnehmer regelmäßig über den aktuellen Stand informiert werden sollen."
            mitmachbox:
              name: Mitmachbox
              description: "Offline-Beteiligung über Mitmachbox-Geräte: batteriebetriebene Umfrageterminals mit E-Paper-Display, die an öffentlichen Orten aufgestellt werden. Die Umfrage wird hier erstellt, auf ausgeliehene Geräte ausgespielt und die vor Ort gesammelten Antworten werden gebündelt übertragen. Ergebnisse sind für Administratoren einsehbar und exportierbar. Geeignet, um Menschen ohne Online-Zugang einzubeziehen."
          select_phase_type: Bitte wählen...
          create_phase: Phase erstellen
        create:
          success: Die Beteiligungsphase wurde erfolgreich erstellt.
        update:
          success: Die Beteiligungsphase wurde erfolgreich aktualisiert.
        destroy:
          success: Die Beteiligungsphase und alle zugehörigen Inhalte wurden gelöscht.
        go_live:
          success: Die Abstimmung wurde freigeschaltet. Alle Testdaten wurden gelöscht.
        duration:
          title: Laufzeit
          dates_label: Laufzeit der Phase
          dates_description: Legt den Zeitraum fest, in dem diese Beteiligungsphase aktiv ist. Innerhalb dieser Laufzeit können Nutzer an der Phase teilnehmen. Außerhalb des Zeitraums wird die Phase als abgeschlossen oder noch nicht gestartet angezeigt. Die Laufzeit ist unabhängig von der übergeordneten Projektlaufzeit konfigurierbar.
        naming:
          title: Benennung
          poll_image_label: Bild der Abstimmung
          poll_image_description: "Wird in der Übersicht der Abstimmungen als Vorschaubild neben dem Titel angezeigt und unterstützt die schnelle visuelle Wiedererkennung. Verwenden Sie ein Querformat-Bild mit klarem Motiv, das thematisch zur Abstimmung passt. Empfohlenes Format: mindestens 600 Pixel breit, JPG oder PNG."
        restrictions:
          title: Beteiligungsbeschränkung
          intro_title: Hinweis zur Beteiligungsbeschränkung
          intro_text: |
            <p>Die erweiterten Beteiligungsbeschränkungen, wie die Einschränkung nach geografischen Gebieten oder Altersgruppen, sind ausschließlich für registrierte und verifizierte Nutzer verfügbar. Der Gastnutzerstatus ermöglicht keine derartigen Einschränkungen.</p>
            <p>Um diese erweiterten Beschränkungen anzuwenden, müssen die entsprechenden Daten, wie beispielsweise Wohnort oder Geburtsdatum, vorliegen. Diese Daten können entweder bereits im Rahmen der Registrierung erhoben oder erst im Zuge der Beteiligung in der jeweiligen Phase abgefragt werden. Nutzer, die die notwendigen Daten noch nicht hinterlegt haben, werden aufgefordert, diese vor der Teilnahme anzugeben. Nur wenn die hinterlegten Informationen den Einschränkungskriterien entsprechen, wird die Beteiligung freigeschaltet.</p>
          user_status_label: Teilnahme nach Nutzerstatus
          user_status_hint: "Legt fest, welchen Verifikationsstatus Nutzer mindestens haben müssen, um an dieser Phase teilzunehmen. Es gibt drei Stufen: Gastnutzer (ohne Registrierung), registrierte Nutzer (mit Plattform-Konto) und verifizierte Nutzer (z. B. durch Melderegisterabgleich). Höhere Stufen erfordern entsprechende Nachweise bei der Registrierung."
          geozone_label: Gebietsbeschränkung der Teilnahme
          geozone_hint: "Schränkt die Teilnahme auf Nutzer ein, deren registrierte Adresse in einem bestimmten geografischen Gebiet liegt. Vorab muss eine CSV-Datei mit den relevanten Adressen an demokratie.today übermittelt werden. Nach dem Import können die gewünschten Gebiete hier aktiviert und die Beschränkung für diese Phase zugewiesen werden."
          age_label: Altersbeschränkung der Teilnahme
          age_hint: "Schränkt die Teilnahme auf Nutzer ein, deren Alter innerhalb einer festgelegten Altersgruppe liegt. Die Altersgruppen werden von einem Administrator zentral unter Einstellungen > Altersgruppen verwaltet und müssen dort vorab angelegt werden. Nutzer ohne hinterlegtes Geburtsdatum werden aufgefordert, dieses vor der Teilnahme anzugeben."
          individual_groups_label: Beschränkung auf starke Gruppen
          individual_groups_hint: "Schränkt die Teilnahme auf Mitglieder bestimmter Nutzergruppen ein, die vorab unter Einstellungen > Starke Gruppen angelegt wurden – z. B. Jugendräte, Verwaltungsmitarbeitende oder Projektgruppen. Nur Nutzer, die einer der hier ausgewählten Gruppen zugeordnet sind, können an dieser Beteiligungsphase teilnehmen."
          extended_geozone_label: Erweiterte Gebietsbeschränkung
          extended_geozone_hint: "Ermöglicht eine feinere Gebietsbeschränkung auf Basis registrierter Adressgruppen wie Wahlkreise, Quartiere oder Schulbezirke. Im Gegensatz zur einfachen Gebietsbeschränkung können hier mehrere Gruppen kombiniert werden. Die verfügbaren Gruppen basieren auf importierten Adressdaten und ermöglichen eine präzise Steuerung der Teilnahmeberechtigung."
          user_status:
            guest: Gäste (keine Registrierung erforderlich)
            registered: Registrierte Nutzer
            verified: Verifizierte Nutzer
          geozone:
            no_restriction: Keine Einschränkung
            only_citizens: Nur Bürger
            only_geozones: Nur bestimmte Gebiete
            only_streets: Nur bestimmte Straßen
            search_street: Straße suchen...
          extended_geozone:
            no_restriction: Keine Einschränkung
          age:
            no_restriction: Keine Einschränkung
