        formular:
          title: Formularfelder
          hint_text_p1: >
            Hier konfigurieren Sie die Felder des Formulars, das Nutzern im Frontend zur Eingabe
            angezeigt wird. Es gibt zwei Kategorien von Feldern:
          hint_types:
            primary:
              title: Primäre Felder
              description: "Werden im Hauptformular angezeigt und beim ersten Absenden erfasst. Typische Beispiele sind Textfelder für Name oder Anliegen, Auswahlfelder für Kategorien oder Checkboxen für Zustimmungen. Primäre Felder bilden den Kern des Formulars und sind für alle Nutzer sichtbar. Sie decken die wesentlichen Informationen ab, die für die Bearbeitung nötig ist."
            follow_up:
              title: Follow-up Felder
              description: "Werden nach dem Absenden des Formulars in einem zweiten Schritt angezeigt. Geeignet für ergänzende Angaben, die nicht alle Nutzer betreffen — z. B. Kontaktdaten für Rückfragen oder detaillierte Beschreibungen. Follow-up Felder ermöglichen eine schrittweise Erfassung, ohne das Hauptformular zu überladen und die Einstiegshürde unnötig zu erhöhen."
          hint_text_p2: >
            Die Reihenfolge der Felder in der Tabelle entspricht der Anzeigereihenfolge im Frontend.
            Nutzen Sie die Ziehpunkte, um die Reihenfolge zu ändern. Über den Feldtyp legen Sie fest,
            ob ein Text-, Auswahl-, Datei- oder Kontrollkästchen-Feld erstellt wird.
