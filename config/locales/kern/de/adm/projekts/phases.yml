          select_managers: Abstimmungshelfer zuordnen
          select_managers_hint: "Wählen Sie aus der Liste die Abstimmungshelfer aus, die in dieser Phase Offline-Stimmen erfassen dürfen. Nur ausgewählte Helfer können über das Officing-Modul Stimmen im Namen von Bürgern abgeben. Die Zuordnung kann jederzeit geändert werden. Abstimmungshelfer müssen zuvor von einem Administrator im System angelegt worden sein."
