        poll_questions:
          title: Fragen
          create_question: Normale Frage erstellen
          create_bundle_question: Fragenbündel erstellen
          intro_text_p1: >
            Hier verwalten Sie die Fragen dieser Abstimmungsphase. Es gibt zwei Fragetypen:
          intro_question_types:
            normal:
              title: Normale Frage
              description: >
                Eine eigenständige Frage mit eigenen Antwortoptionen und einem wählbaren Abstimmungsmodus
                (z. B. Einzelstimme, Mehrfachauswahl oder Bewertungsskala). Jede Frage wird den Nutzern im
                Frontend als einzelner Abstimmungsschritt angezeigt.
            bundle:
              title: Fragenbündel
              description: >
                Fasst mehrere thematisch zusammengehörige Unterfragen unter einer gemeinsamen Überschrift
                zusammen. Im Frontend wird das Bündel als zusammenhängender Abschnitt dargestellt. Jede
                Unterfrage kann einen eigenen Abstimmungsmodus und eigene Antwortoptionen haben.
          bundle_intro_text_p1: >
            Ein Fragenbündel fasst mehrere thematisch zusammengehörige Fragen unter einer gemeinsamen
            Überschrift zusammen. Im Frontend wird das Bündel als ein zusammenhängender Abschnitt dargestellt,
            in dem die Nutzer die enthaltenen Unterfragen nacheinander beantworten. Fragenbündel eignen sich
            besonders, wenn ein Thema aus mehreren Perspektiven beleuchtet werden soll.
          bundle_intro_text_p2: >
            Nach dem Erstellen des Fragenbündels können Sie über die Detailansicht einzelne Unterfragen
            hinzufügen. Jede Unterfrage kann eine eigene Fragestellung, Antwortoptionen und einen eigenen
            Abstimmungsmodus haben. Die Reihenfolge der Unterfragen innerhalb des Bündels kann per
            Drag & Drop angepasst werden.
          intro_vote_types_title: Antwortoptionen im Überblick
          intro_vote_types:
            unique:
              title: Einzelne Stimme
              description: >
                Jeder Nutzer kann genau eine Antwort pro Frage auswählen. Dies ist die
                einfachste und häufigste Abstimmungsform – ideal für klare Ja/Nein-Entscheidungen
                oder die Auswahl einer bevorzugten Option aus mehreren Alternativen.
            multiple:
              title: Mehrfachauswahl
              description: >
                Nutzer können ihre Stimmen gleichmäßig auf mehrere Antworten verteilen.
                Geeignet, wenn Teilnehmer mehrere Optionen gleichzeitig befürworten dürfen.
                Die maximale Anzahl der wählbaren Antworten wird beim Erstellen der Frage festgelegt.
            multiple_with_weight:
              title: Gewichtete Mehrfachauswahl
              description: >
                Nutzer verteilen ein festes Stimmbudget auf mehrere Antworten und gewichten
                diese unterschiedlich stark. Besonders geeignet für Priorisierungsfragen,
                z. B. bei Bürgerhaushalten, in denen Mittel auf verschiedene Vorschläge verteilt werden sollen.
            rating_scale:
              title: Bewertungsskala
              description: >
                Nutzer bewerten jede Antwortoption auf einer Skala (z. B. 1–5). Geeignet für
                differenziertes Feedback, bei dem nicht nur eine Auswahl, sondern eine Abstufung
                der Zustimmung oder Ablehnung erfasst werden soll.
          intro_text_p2: >
            Die Reihenfolge der Fragen in der Tabelle entspricht der Anzeigereihenfolge im Frontend.
            Nutzen Sie die Ziehpunkte rechts, um die Reihenfolge zu ändern.
          no_questions: Dieser Abstimmung sind keine Fragen zugeordnet.
          no_questions_title: Keine Fragen vorhanden
          no_questions_description: Erstellen Sie einzelne Fragen oder Fragenbündel, um die Abstimmung inhaltlich zu gestalten. Jede Frage wird im Frontend als eigenständiger Abstimmungsschritt angezeigt.
