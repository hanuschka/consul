        officing_managers:
          title: Abstimmungshelfer
          lock_on: Sperrdatum
          lock_on_hint: Ab diesem Datum können keine Offline-Stimmen mehr abgegeben werden.
          select_managers: Abstimmungshelfer zuordnen
          select_managers_hint: "Wählen Sie aus der Liste die Abstimmungshelfer aus, die in dieser Phase Offline-Stimmen erfassen dürfen. Nur ausgewählte Helfer können über das Officing-Modul Stimmen im Namen von Bürgern abgeben. Die Zuordnung kann jederzeit geändert werden. Abstimmungshelfer müssen zuvor von einem Administrator im System angelegt worden sein."
          no_managers_title: Keine Abstimmungshelfer vorhanden
          no_managers_description: Es sind noch keine Abstimmungshelfer im System registriert. Abstimmungshelfer können von einem Administrator unter „Einstellungen" angelegt werden. Nach der Registrierung können Sie die Helfer hier dieser Phase zuordnen, damit sie berechtigt sind, Offline-Stimmen im Namen von Bürgern über das Officing-Modul zu erfassen.
        poll_questions:
          title: Fragen
          create_question: Normale Frage erstellen
          create_bundle_question: Fragenbündel erstellen
          download_individual_answers: Einzelantworten herunterladen
          test_mode:
            banner_title: Testmodus
            banner_text: Diese Abstimmung befindet sich im Testmodus. Sie können Antworten und Fragen frei bearbeiten und Teststimmen abgeben. Alle Teststimmen werden beim Freischalten unwiderruflich gelöscht.
            go_live: Abstimmung freischalten
            go_live_confirm: Abstimmung freischalten? Alle Teststimmen werden unwiderruflich gelöscht und die Abstimmung wird öffentlich zugänglich. Dies kann nicht rückgängig gemacht werden.
          intro_text_p1: >
            Hier verwalten Sie die Fragen dieser Abstimmungsphase. Es gibt zwei Fragetypen:
          intro_question_types:
            normal:
              title: Normale Frage
              description: "Eine eigenständige Frage mit eigenen Antwortoptionen und einem wählbaren Abstimmungsmodus wie Einzelstimme, Mehrfachauswahl oder Bewertungsskala. Jede Frage wird den Nutzern im Frontend als einzelner Abstimmungsschritt angezeigt. Normale Fragen eignen sich für gezielte Einzelabfragen zu konkreten Themen innerhalb einer Abstimmungsphase."
            bundle:
              title: Fragenbündel
              description: "Fasst mehrere thematisch zusammengehörige Unterfragen unter einer gemeinsamen Überschrift zusammen. Im Frontend wird das Bündel als zusammenhängender Abschnitt dargestellt. Jede Unterfrage kann einen eigenen Abstimmungsmodus und eigene Antwortoptionen haben. Fragenbündel eignen sich, wenn ein Thema aus mehreren Perspektiven beleuchtet werden soll."
          bundle_intro_text_p1: >
            Ein Fragenbündel fasst mehrere thematisch zusammengehörige Fragen unter einer gemeinsamen
            Überschrift zusammen. Im Frontend wird das Bündel als ein zusammenhängender Abschnitt dargestellt,
            in dem die Nutzer die enthaltenen Unterfragen nacheinander beantworten. Fragenbündel eignen sich
            besonders, wenn ein Thema aus mehreren Perspektiven beleuchtet werden soll.
          bundle_intro_text_p2: >
            Nach dem Erstellen des Fragenbündels können Sie über die Detailansicht einzelne Unterfragen
            hinzufügen. Jede Unterfrage kann eine eigene Fragestellung, Antwortoptionen und einen eigenen
            Abstimmungsmodus haben. Die Reihenfolge der Unterfragen innerhalb des Bündels kann per
            Drag & Drop angepasst werden.
          intro_vote_types_title: Antwortoptionen im Überblick
          intro_vote_types:
            unique:
              title: Einzelne Stimme
              description: "Jeder Nutzer kann genau eine Antwort pro Frage auswählen. Dies ist die einfachste und häufigste Abstimmungsform — ideal für klare Ja/Nein-Entscheidungen oder die Auswahl einer bevorzugten Option aus mehreren Alternativen. Die Ergebnisse zeigen transparent, welche Option die meiste Zustimmung erhalten hat, und ermöglichen eine eindeutige Auswertung."
            multiple:
              title: Mehrfachauswahl
              description: "Nutzer können ihre Stimmen gleichmäßig auf mehrere Antworten verteilen. Geeignet, wenn Teilnehmer mehrere Optionen gleichzeitig befürworten dürfen. Die maximale Anzahl wählbarer Antworten wird beim Erstellen der Frage festgelegt. Dieser Modus eignet sich, wenn ein breites Stimmungsbild erfasst oder mehrere Prioritäten abgefragt werden sollen."
            multiple_with_weight:
              title: Gewichtete Mehrfachauswahl
              description: "Nutzer verteilen ein festes Stimmbudget auf mehrere Antworten und gewichten diese unterschiedlich stark. Besonders geeignet für Priorisierungsfragen, z. B. bei Bürgerhaushalten, in denen Mittel auf verschiedene Vorschläge verteilt werden sollen. Im Ergebnis zeigt sich nicht nur die Beliebtheit einer Option, sondern auch deren relative Wichtigkeit."
            rating_scale:
              title: Bewertungsskala
              description: "Nutzer bewerten jede Antwortoption auf einer Skala (z. B. 1–5). Geeignet für differenziertes Feedback, bei dem nicht nur eine Auswahl, sondern eine Abstufung der Zustimmung oder Ablehnung erfasst werden soll. Die Ergebnisse zeigen Durchschnittswerte und Verteilungen je Option, was eine differenzierte Analyse der Meinungsbilder ermöglicht."
          intro_text_p2: >
            Die Reihenfolge der Fragen in der Tabelle entspricht der Anzeigereihenfolge im Frontend.
            Nutzen Sie die Ziehpunkte rechts, um die Reihenfolge zu ändern.
          no_questions: Dieser Abstimmung sind keine Fragen zugeordnet.
