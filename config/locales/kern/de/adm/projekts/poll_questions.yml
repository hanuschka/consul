        destroy:
          success: Frage wurde erfolgreich gelöscht.
        contexted_clones:
          skipped: >
            Die kontextbezogenen Kopien wurden nicht automatisch aktualisiert, da für diese Umfrage
            bereits Stimmen abgegeben wurden. Solange echte Stimmen vorliegen, können die
            kontextbezogenen Fragen nicht mehr automatisch angepasst werden.
        form:
          bundle_title: Themenkomplex
          title_placeholder: "z. B. Welche Maßnahme befürworten Sie?"
          no_contextualization: Keine Kontextualisierung
          contextualize_hint: >
            Wiederholt diese Frage für jede Antwortoption, die der Nutzer zuvor in der ausgewählten
            Mehrfachauswahl-Frage gewählt hat. So lässt sich dieselbe Frage kontextbezogen zu jeder
            einzelnen Auswahl stellen – z. B. eine Bewertung je zuvor ausgewähltem Vorschlag. Zur Auswahl
            stehen nur Fragen mit dem Abstimmungsmodus „Mehrfachauswahl". Wählen Sie „Keine
            Kontextualisierung", wenn die Frage unabhängig gestellt werden soll.
          intro_hint: Wird im Frontend oberhalb der Frage als einleitender Text angezeigt. Nutzen Sie dieses Feld, um den Kontext der Frage zu erläutern, Hintergrundinformationen zu liefern oder den Teilnehmern Orientierung zu geben. Der Text unterstützt Rich-Text-Formatierung und kann Links oder Hervorhebungen enthalten.
          title_hint: >
            Geben Sie die Fragestellung ein, die den Nutzern im Frontend angezeigt wird. Formulieren Sie
            die Frage klar und verständlich, damit Teilnehmer sofort verstehen, worum es geht – z. B.
            „Welche Maßnahme befürworten Sie?" oder „Wie bewerten Sie den Vorschlag?". Halten Sie die
            Formulierung kurz und prägnant.
          bundle_intro_hint: >
            Wird im Frontend oberhalb des Fragenbündels als einleitender Text angezeigt. Nutzen Sie dieses
            Feld, um den thematischen Rahmen des Fragenbündels zu erläutern und den Teilnehmern Orientierung
            zu geben, welche Unterfragen sie erwarten. Der Text unterstützt Rich-Text-Formatierung und kann
            Links oder Hervorhebungen enthalten.
          bundle_title_hint: >
            Geben Sie den Namen des Themenkomplexes ein, der im Frontend als übergeordnete Überschrift
            für die enthaltenen Unterfragen angezeigt wird. Der Themenkomplex fasst mehrere
            zusammengehörige Fragen unter einem gemeinsamen Titel zusammen – z. B. „Mobilität und Verkehr"
            oder „Gestaltung des Marktplatzes".
          bundle_title_placeholder: "z. B. Mobilität und Verkehr"
          bundle_description_hint: >
            Ergänzt das Fragenbündel um eine ausführlichere Beschreibung, die im Frontend unterhalb des
            Titels angezeigt wird. Nutzen Sie dieses Feld, um den thematischen Kontext der enthaltenen
            Unterfragen zu erläutern und Hintergrundinformationen bereitzustellen. Der Text unterstützt
            Rich-Text-Formatierung und kann Links oder Hervorhebungen enthalten.
          description_hint: Ergänzt die Frage um eine ausführlichere Beschreibung oder Erläuterung. Der Text wird im Frontend unterhalb der Fragestellung angezeigt und kann zusätzliche Informationen, Erklärungen oder Hinweise zum Abstimmungsgegenstand enthalten. Der Text unterstützt Rich-Text-Formatierung und kann Links enthalten.
          answer_mandatory_hint: Legt fest, ob die Beantwortung dieser Frage verpflichtend ist, bevor der Nutzer zur nächsten Frage oder zur Abschlussseite gelangen kann. Aktivieren Sie diese Option bei Kernfragen der Beteiligung. Deaktivieren Sie sie für optionale Zusatzfragen, bei denen eine Enthaltung möglich sein soll.
          show_images_hint: Aktiviert die Darstellung von Bildern bei den Antwortoptionen. Im Frontend werden die Bilder oberhalb der jeweiligen Antwortoption angezeigt und helfen Nutzern, die Optionen visuell zu erfassen. Besonders geeignet bei Gestaltungsfragen, Standortvergleichen oder Entwurfsabstimmungen, bei denen visuelle Eindrücke die Entscheidung unterstützen.
          randomize_answers_hint: Zeigt die Antwortoptionen dieser Frage den Teilnehmenden in zufälliger statt fester Reihenfolge an. Im Frontend erscheinen die Antwortmöglichkeiten für jede:n Teilnehmer:in in individueller, aber gleichbleibender Reihenfolge; eine offene Antwortoption bleibt immer an letzter Stelle. Aktivieren Sie diese Option, um Positionseffekte bei sensiblen oder umkämpften Fragen zu vermeiden.
          vote_type_hint: "Legt fest, wie Nutzer bei dieser Frage abstimmen können. Bei 'Einzelne Stimme' wählt jeder Nutzer genau eine Antwort. Bei 'Mehrfachauswahl' können Stimmen auf mehrere Antworten verteilt werden. Bei 'Gewichtete Mehrfachauswahl' können Stimmen unterschiedlich stark gewichtet werden. Die Bewertungsskala eignet sich für Fragen mit Abstufungen."
          min_rating_scale_label_hint: Optionale Beschriftung am linken Ende der Bewertungsskala, z. B. „Stimme nicht zu" oder „Schlecht". Wenn das Feld leer bleibt, wird die Beschriftung automatisch aus der Beschreibung der Frage übernommen. Nutzen Sie dieses Feld nur, wenn Sie eine abweichende oder kürzere Bezeichnung für das Minimum der Skala wünschen.
          min_rating_scale_placeholder: "z. B. Stimme nicht zu"
          max_rating_scale_label_hint: Optionale Beschriftung am rechten Ende der Bewertungsskala, z. B. „Stimme voll zu" oder „Sehr gut". Wenn das Feld leer bleibt, wird die Beschriftung automatisch aus der Beschreibung der Frage übernommen. Nutzen Sie dieses Feld nur, wenn Sie eine abweichende oder kürzere Bezeichnung für das Maximum der Skala wünschen.
          max_rating_scale_placeholder: "z. B. Stimme voll zu"
          max_votes_per_answer_hint: Begrenzt, wie viele Stimmen ein Nutzer auf eine einzelne Antwortoption vergeben kann. Bei gewichteter Mehrfachauswahl können Nutzer ihre Stimmen unterschiedlich stark verteilen – dieser Wert verhindert, dass alle Stimmen auf eine einzige Option konzentriert werden. So wird eine breitere Verteilung der Stimmen gefördert.
          max_votes_hint: Legt die maximale Anzahl an Stimmen fest, die ein Nutzer bei dieser Frage auf die verfügbaren Antwortoptionen verteilen kann. Der Wert muss mindestens 2 betragen. Wählen Sie einen Wert, der zur Anzahl der Antwortoptionen passt – z. B. 3 Stimmen bei 6 Optionen, damit Nutzer priorisieren müssen statt alles auszuwählen.
          show_hint_callout_hint: Zeigt im Frontend eine blaue Infobox oberhalb der Antwortoptionen an, die den Nutzern den gewählten Abstimmungsmodus erklärt – z. B. wie viele Stimmen vergeben werden können. Die Box hilft Teilnehmern, das Abstimmungsverfahren auf einen Blick zu verstehen, und kann bei Bedarf für jede Frage individuell aktiviert werden.
          votation_type_hint_title: Information
          votation_type_hints:
            unique: Nutzer können je Frage eine Stimme vergeben.
            multiple: Nutzer können je Frage ihre Stimmen auf mehrere Antworten gleichmäßig verteilen.
            multiple_with_weight: Nutzer können je Frage ihre Stimmen auf mehrere Antworten gewichtet verteilen.
            rating_scale: Nutzer können eine Stimme pro Bewertungsskala abgeben.
