de:
  adm:
    projekts:
      projekt_questions:
        new:
          title: Frage erstellen
        create:
          success: Frage wurde erfolgreich erstellt.
        edit:
          title: Frage bearbeiten
        update:
          success: Frage wurde erfolgreich aktualisiert.
        destroy:
          success: Frage wurde erfolgreich gelöscht.
        send_notifications:
          success: Benachrichtigungen wurden erfolgreich gesendet.
        form:
          title_label: Fragestellung
          title_hint: Geben Sie den Titel der Kurzumfrage ein. Der Titel wird im Frontend als Frage angezeigt und sollte klar und verständlich formuliert sein – z. B. „Welches Thema ist Ihnen am wichtigsten?" oder „Wie bewerten Sie den Vorschlag?". Halten Sie die Formulierung kurz, damit sie auf allen Endgeräten gut lesbar bleibt.
          question_options_label: Antwortoptionen
          question_options_hint: Definieren Sie die Antwortmöglichkeiten, aus denen Nutzer wählen können. Jede Option wird im Frontend als auswählbare Schaltfläche dargestellt. Fügen Sie mindestens zwei Optionen hinzu und achten Sie auf kurze, eindeutige Formulierungen. Die Reihenfolge der Optionen entspricht der Anzeigereihenfolge im Frontend.
          add_option: Option hinzufügen
          show_answers_count_label: Antwortanzahl anzeigen
          show_answers_count_hint: Aktiviert die Anzeige der bisherigen Antwortverteilung im Frontend. Nutzer sehen nach ihrer Stimmabgabe, wie viele Teilnehmer sich für welche Option entschieden haben. Deaktivieren Sie diese Funktion, wenn die Ergebnisse erst nach Abschluss der Beteiligung veröffentlicht werden sollen, um eine unbeeinflusste Meinungsbildung zu ermöglichen.
          comments_enabled_label: Offene Antwort
          comments_enabled_hint: Aktiviert ein zusätzliches Freitextfeld unterhalb der Antwortoptionen, in dem Nutzer eine eigene Antwort oder Begründung formulieren können. Diese Funktion eignet sich, um neben den vorgegebenen Optionen auch qualitatives Feedback zu erfassen – z. B. Ergänzungen, Anmerkungen oder alternative Vorschläge.
          submit: Speichern
        projekt_question_option_fields:
          value_placeholder: Antwortoption
          remove_option: Entfernen
