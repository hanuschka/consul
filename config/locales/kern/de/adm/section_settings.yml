        intro_text_hint: "Dieser Text wird auf der Startseite des jeweiligen Bereichs angezeigt und dient als kurze Orientierung für Ihr Team. Beschreiben Sie in wenigen Sätzen, wofür der Bereich zuständig ist und welche Aufgaben hier erledigt werden. Der Text sollte neuen Teammitgliedern einen schnellen Überblick geben (max. 350 Zeichen)."
