        notice_message_placeholder: Hinweismeldung eingeben...
        notice_active: Hinweis aktiv
        notice_active_hint: "Steuert, ob die oben eingetragene Hinweismeldung auf der Startseite des Bereichs als gelbe Infobox angezeigt wird. Deaktivieren Sie diese Option, um die Meldung vorübergehend auszublenden, ohne den Text löschen zu müssen. So können Sie wiederkehrende Hinweise einfach ein- und ausschalten, etwa für saisonale Fristen oder projektbezogene Anweisungen."
