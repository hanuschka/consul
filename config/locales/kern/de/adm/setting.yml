de:
  setting:
    feature:
      bund_id_login: "BundID-Anmeldung aktivieren"
      bund_id_login_description: "Zeigt auf der Anmelde- und Registrierungsseite eine BundID-Schaltfläche. Nutzer können sich dann mit ihrem BundID-Konto anmelden und registrieren."
      twitter_login: "Twitter-Anmeldung aktivieren"
      twitter_login_description: "Erlaubt die Anmeldung und Registrierung mit einem Twitter-Konto. Erfordert hinterlegte Twitter-Zugangsdaten in der Serverkonfiguration."
      facebook_login: "Facebook-Anmeldung aktivieren"
      facebook_login_description: "Erlaubt die Anmeldung und Registrierung mit einem Facebook-Konto. Erfordert hinterlegte Facebook-Zugangsdaten in der Serverkonfiguration."
      google_login: "Google-Anmeldung aktivieren"
      google_login_description: "Erlaubt die Anmeldung und Registrierung mit einem Google-Konto. Erfordert hinterlegte Google-Zugangsdaten in der Serverkonfiguration."
      wordpress_login: "Wordpress-Anmeldung aktivieren"
      wordpress_login_description: "Erlaubt die Anmeldung und Registrierung mit einem Wordpress-Konto. Erfordert hinterlegte Wordpress-Zugangsdaten in der Serverkonfiguration."
      kobil_login: "KOBIL-Anmeldung aktivieren"
      kobil_login_description: "Zeigt auf der Anmelde- und Registrierungsseite eine Schaltfläche „Mit KOBIL anmelden“. Nutzer können sich dann über ihr KOBIL-Konto (OpenID Connect) anmelden und registrieren. Erfordert hinterlegte KOBIL-Zugangsdaten in der Serverkonfiguration."
      kobil_address_verification: "KOBIL Adressverifizierung"
      kobil_address_verification_description: "Übernimmt die vom KOBIL-Konto bereitgestellte Adresse (Straße, PLZ, Ort) in das Nutzerprofil. Nur wirksam, wenn die KOBIL-Anmeldung aktiviert ist."
      whatsapp_bot: "WhatsApp-Bot aktivieren"
      whatsapp_bot_description: "Schaltet den WhatsApp-Webhook, die Nummernverbindung im Nutzerkonto und den Versand von Projekt-Benachrichtigungen frei. Wirkt nur, wenn zusätzlich die Zugangsdaten in config/secrets.yml hinterlegt sind."
    whatsapp:
      broadcast_template: "Name der WhatsApp-Nachrichtenvorlage"
      broadcast_template_description: "Name der in 360dialog freigegebenen Vorlage, die für Projekt-Benachrichtigungen verwendet wird. Die Vorlage muss genau zwei Platzhalter im Textkörper haben: 1. Projektname, 2. Projektlink. Ohne freigegebene Vorlage erreichen Benachrichtigungen nur Personen, die in den letzten 24 Stunden geschrieben haben."
      broadcast_template_language: "Sprache der Nachrichtenvorlage"
      broadcast_template_language_description: "Sprachcode der freigegebenen Vorlage, z. B. „de“. Muss exakt dem in 360dialog hinterlegten Sprachcode entsprechen, sonst lehnt WhatsApp den Versand ab."
      transcription_model: "Modell für Sprachnachrichten"
      transcription_model_description: "OpenAI-Modell, mit dem Sprachnachrichten in Text umgewandelt werden. Leer lassen für den Standard „gpt-4o-mini-transcribe“. Die Umwandlung funktioniert nur mit OpenAI-Zugangsdaten."
      message_retention_days: "Aufbewahrung der Chatnachrichten (Tage)"
      message_retention_days_description: "Nach dieser Zeitspanne löscht ein nächtlicher Auftrag die gespeicherten WhatsApp-Nachrichten samt Inhalt. Standard: 90 Tage."
      max_voice_megabytes: "Maximale Größe einer Sprachnachricht (MB)"
      max_voice_megabytes_description: "Größere Sprachnachrichten werden nicht heruntergeladen und nicht umgewandelt; der Bot bittet dann um Text. Standard: 16 MB."
    projekt_option:
      general:
        external_participation_link: Alternativen Link in den Projektressourcen verwenden
        external_participation_link_description: "Hinterlegen Sie eine vollständige (externe) URL, wenn die Projektkacheln und -listen nicht auf die Projektseite, sondern auf eine andere Seite verweisen sollen. Leer lassen, um die normale Verlinkung zum Projekt beizubehalten."
    org_name: "Name der Anwendung"
    org_name_description: "Dieser Name wird an vielen Stellen der Plattform angezeigt, z. B. im Browser-Tab, in E-Mails und in der Fußzeile. Er dient als offizieller Anzeigename Ihrer Beteiligungsplattform und sollte eindeutig und wiedererkennbar sein. Ein guter Name erleichtert es Bürgern, die Plattform auf Anhieb zuzuordnen."
    url: "Haupt-URL der Applikation"
    url_description: "Hauptadresse Ihrer Beteiligungsplattform, z. B. https://beteiligung.meine-stadt.de. Sie wird verwendet, wenn relative Links automatisch zu vollständigen URLs ergänzt werden, etwa in E-Mail-Benachrichtigungen. Bitte ohne abschließenden Schrägstrich angeben. Bei Domain-Änderungen wenden Sie sich an den Support."
    mailer_from_address: "Absender-E-Mail-Adresse"
    mailer_from_address_description: "Diese E-Mail-Adresse erscheint als Absender bei allen automatisch versendeten E-Mails der Plattform (z. B. Benachrichtigungen, Bestätigungen). Die Adresse muss mit der im Mailserver hinterlegten identisch sein. Änderungen sind nicht selbstständig möglich – bitte wenden Sie sich an den Support von demokratie.today."
    mailer_from_name: "Anzeigename des E-Mail-Absenders"
    mailer_from_name_description: "Dieser Name wird Empfängern als Absender in E-Mails angezeigt. Wählen Sie einen aussagekräftigen Namen, der Ihre Kommune eindeutig identifiziert, z. B. 'Beteiligungsplattform Stadt Musterstadt'. Der Anzeigename kann unabhängig von der technischen Absenderadresse frei angepasst werden und hilft beim Wiedererkennen."
    mailer_from_deficiency_report_address: "Absenderadresse für Mängelmelder-E-Mails"
    mailer_from_deficiency_report_address_description: "Diese E-Mail-Adresse wird als Absender für alle automatisch versendeten Mängelmelder-E-Mails verwendet und Bürgerinnen und Bürgern als Kontaktadresse in diesen E-Mails angezeigt. Verwenden Sie eine gültige, für den Versand freigegebene Adresse Ihrer Kommune."
    meta_title: "Seitentitel (Suchmaschinenoptimierung)"
    meta_title_description: "Dieser Titel wird von Suchmaschinen als Hauptüberschrift in den Suchergebnissen verwendet und erscheint auch im Browser-Tab. Ein klar formulierter Titel verbessert die Sichtbarkeit Ihrer Plattform bei Google. Idealerweise enthält er den Namen der Kommune und einen Hinweis auf Bürgerbeteiligung. Empfohlene Länge: 50-60 Zeichen."
    meta_description: "Seitenbeschreibung (Suchmaschinenoptimierung)"
    meta_description_description: "Diese Beschreibung erscheint in Suchmaschinen unterhalb des Seitentitels und gibt Nutzern einen ersten Eindruck Ihrer Plattform. Sie sollte kurz, präzise und ansprechend formuliert sein, um Bürger zum Klicken zu motivieren. Eine gute Meta-Description erhöht die Klickrate in den Suchergebnissen. Empfohlene Länge: 120-160 Zeichen."
    brand_color: "Markenfarbe"
    brand_color_description: "Die Markenfarbe wird als Akzentfarbe auf der gesamten Plattform verwendet – unter anderem für Buttons, Links und Hervorhebungen. Auf einzelnen Landingpages kann diese Farbe individuell überschrieben werden. Wenn kein Wert gesetzt ist, wird die Standard-Markenfarbe aus dem Stylesheet der Plattform verwendet."
    newsletter_brand_color: "Newsletter-Markenfarbe"
    newsletter_brand_color_description: "Diese Farbe wird als Akzentfarbe im Kopf- und Fußbereich der Newsletter-E-Mails verwendet, z. B. für Buttons, Links und dekorative Elemente. Sie kann unabhängig von der Plattform-Markenfarbe gewählt werden, um ein eigenständiges Newsletter-Design zu ermöglichen. Wenn kein Wert gesetzt ist, wird die Standard-Markenfarbe der Plattform verwendet."
    direct_message_max_per_day: "Maximale Anzahl direkter Nachrichten pro Tag"
    direct_message_max_per_day_description: "Begrenzt, wie viele direkte Nachrichten eine Person pro Tag an andere Nutzer*innen senden kann. Die Begrenzung schützt vor Spam und Belästigung. Lassen Sie das Feld leer oder tragen Sie 0 ein, wenn die Anzahl nicht begrenzt werden soll."
    meta_keywords: "Stichwörter (Suchmaschinenoptimierung)"
    meta_keywords_description: "Optionale Stichwörter, die den Inhalt der Seite thematisch beschreiben. Sie werden im HTML-Quelltext als Meta-Keywords eingebunden. Obwohl Suchmaschinen diesen Tag kaum noch auswerten, kann er für interne Zwecke nützlich sein. Trennen Sie Begriffe durch Kommas, z. B. Bürgerbeteiligung, Stadtentwicklung, Projekte."
    facebook_handle: "Facebook-Nutzername"
    facebook_handle_description: "Facebook-Nutzername Ihrer Kommune oder Plattform. Wenn ausgefüllt, erscheint in der Fußzeile automatisch ein Facebook-Logo mit Verlinkung zum Profil. Bitte nur den Nutzernamen ohne @-Zeichen und ohne vollständige URL eintragen. Lassen Sie das Feld leer, wenn kein Facebook-Profil verlinkt werden soll."
    instagram_handle: "Instagram-Nutzername"
    instagram_handle_description: "Instagram-Nutzername Ihrer Kommune oder Plattform. Wenn ausgefüllt, erscheint in der Fußzeile automatisch ein Instagram-Logo mit Verlinkung zum Profil. Bitte nur den Nutzernamen ohne @-Zeichen und ohne vollständige URL eintragen. Lassen Sie das Feld leer, wenn kein Instagram-Profil verlinkt werden soll."
    twitter_handle: "X-Nutzername (ehemals Twitter)"
    twitter_handle_description: "Nutzername Ihres X-Profils (ehemals Twitter). Wenn dieses Feld ausgefüllt ist, erscheint in der Fußzeile automatisch ein X-Logo mit Verlinkung zum Profil. Bitte nur den Nutzernamen ohne @-Zeichen und ohne vollständige URL eintragen. Lassen Sie das Feld leer, wenn kein X-Profil verlinkt werden soll."
    twitter_hashtag: "X-Hashtag"
    twitter_hashtag_description: "Hashtag, der mit der Plattform X verknüpft wird. Er erscheint in der Fußzeile und verlinkt auf die entsprechende Hashtag-Seite bei X. Dies eignet sich besonders für Kampagnen oder zentrale Beteiligungsthemen. Bitte ohne vorangestelltes #-Zeichen eintragen. Lassen Sie das Feld leer, wenn nicht gewünscht."
    telegram_handle: "Telegram-Nutzername"
    telegram_handle_description: "Telegram-Nutzername Ihrer Kommune oder Plattform. Wenn ausgefüllt, erscheint in der Fußzeile automatisch ein Telegram-Logo mit Verlinkung zum Kanal oder Profil. Bitte nur den Nutzernamen ohne @-Zeichen und ohne vollständige URL eintragen. Lassen Sie das Feld leer, wenn kein Telegram-Kanal verlinkt werden soll."
    youtube_handle: "YouTube-Nutzername oder Kanal-ID"
    youtube_handle_description: "YouTube-Nutzername oder Kanal-ID Ihrer Kommune. Wenn ausgefüllt, erscheint in der Fußzeile automatisch ein YouTube-Logo mit Verlinkung zum Kanal. Sie können den benutzerdefinierten Kanalnamen oder die technische Kanal-ID verwenden. Lassen Sie das Feld leer, wenn kein YouTube-Kanal verlinkt werden soll."
    advanced_newsletter: "Erweiterter Newsletter"
    advanced_newsletter_description: "Aktiviert erweiterte Newsletter-Funktionen. Standardmäßig deaktiviert – aktivieren Sie diese Option nur, wenn Sie die erweiterten Funktionen benötigen."
    uploads:
      images:
        max_size: "Maximale Bildgröße"
        max_size_description: "Legt die maximal zulässige Dateigröße (in Megabyte, MB) für hochgeladene Bilder fest. Größere Dateien werden beim Hochladen abgelehnt. Ein moderater Wert hält die Ladezeiten kurz und schont den Speicherplatz."
        content_types: "Erlaubte Bildformate"
        content_types_description: "Bestimmt, welche Dateiformate beim Hochladen von Bildern zulässig sind. Aktivieren Sie nur die Formate, die Sie tatsächlich zulassen möchten. JPEG eignet sich für Fotos, PNG für Grafiken mit transparentem Hintergrund."
        title:
          min_length: "Mindestlänge des Bildtitels"
          min_length_description: "Legt fest, wie viele Zeichen der Titel eines hochgeladenen Bildes mindestens enthalten muss. Der Titel wird als Alternativtext (alt-Attribut) für die Barrierefreiheit verwendet. Ein sinnvoller Mindestwert sorgt für aussagekräftige Bildbeschreibungen."
          max_length: "Maximallänge des Bildtitels"
          max_length_description: "Legt fest, wie viele Zeichen der Titel eines hochgeladenen Bildes höchstens enthalten darf. Der Titel wird als Alternativtext (alt-Attribut) für die Barrierefreiheit verwendet. Eine sinnvolle Obergrenze hält Bildtitel kurz und lesbar."
      documents:
        max_amount: "Maximale Anzahl von Dokumenten"
        max_amount_description: "Legt fest, wie viele Dokumente einem einzelnen Beitrag (z. B. Vorschlag oder Investition) maximal angehängt werden dürfen. So behalten Sie die Menge hochgeladener Anhänge unter Kontrolle."
        max_size: "Maximale Dokumentgröße"
        max_size_description: "Legt die maximal zulässige Dateigröße (in Megabyte, MB) für hochgeladene Dokumente fest. Größere Dateien werden beim Hochladen abgelehnt. Ein moderater Wert schont den Speicherplatz und hält die Ladezeiten kurz."
        content_types: "Erlaubte Dokumentformate"
        content_types_description: "Bestimmt, welche Dateiformate beim Hochladen von Dokumenten zulässig sind. Aktivieren Sie nur die Formate, die Sie tatsächlich zulassen möchten, z. B. PDF für unveränderliche Dokumente."
    welcomepage:
      usage_stats: Nutzerübersicht
      usage_stats_description: "Wenn aktiviert, wird auf der Startseite die Gesamtzahl aller registrierten Nutzer eingeblendet. Zusätzlich erscheint ein öffentlicher Link zur Nutzerübersichtsseite. Diese Funktion eignet sich, um die Reichweite der Plattform transparent darzustellen. Deaktivieren, wenn nicht gewünscht."
      newsletter_subscription: Newsletter-Anmeldung
      newsletter_subscription_description: "Wenn aktiviert, wird auf der Startseite ein gut sichtbares Element zur Newsletter-Anmeldung eingeblendet. Eingeloggte Nutzer können sich direkt anmelden, nicht angemeldete Personen über ein separates Registrierungsformular. Für den tatsächlichen Versand wird ein separat konfigurierter Newsletter-Dienst benötigt."
      platform_activity: Plattformstatistik
      platform_activity_description: "Wenn aktiviert, werden auf der Startseite zentrale Plattform-Kennzahlen eingeblendet – darunter die Anzahl der Projekte, Vorschläge, Abstimmungen und Kommentare. Die Werte aktualisieren sich automatisch und geben Besuchern einen schnellen Überblick über die Aktivität der Plattform."
      projekt_search: Projektsuche
      projekt_search_description: "Wenn aktiviert, erscheint auf der Startseite eine Suchleiste, über die Nutzer gezielt nach Projekten suchen können. Diese Option und der Startseiten-Button schließen sich gegenseitig aus. Die Projektsuche eignet sich besonders bei Plattformen mit vielen laufenden oder geplanten Projekten."
    extended_feature:
      projekts_overview_page_navigation:
        show_index_order_all: Alle Projekte
        show_index_order_all_description: >
          Blendet den Tab „Alle Projekte" in der Navigationsleiste der Projektübersichtsseite ein. Dieser Tab zeigt alle öffentlichen
          Projekte unabhängig von ihrem Status an und bietet Nutzern einen vollständigen Überblick über das gesamte Beteiligungsangebot
          der Plattform. Deaktivieren Sie diese Option, wenn nur gefilterte Ansichten gewünscht sind.
        show_index_order_underway: Aktive Beteiligung
        show_index_order_underway_description: >
          Blendet den Tab „Aktive Beteiligung" ein, der ausschließlich Projekte mit aktuell laufenden Beteiligungsphasen anzeigt. Nutzer
          sehen so auf einen Blick, wo sie sich gerade aktiv einbringen können. Besonders geeignet als Standard-Tab, um die Aufmerksamkeit
          auf aktuelle Mitwirkungsmöglichkeiten zu lenken.
        show_index_order_ongoing: Laufende Projekte
        show_index_order_ongoing_description: >
          Blendet den Tab „Laufende Projekte" ein, der alle Projekte zeigt, deren Laufzeit noch nicht abgelaufen ist – unabhängig davon,
          ob gerade eine aktive Beteiligungsphase stattfindet. Dies umfasst auch Projekte in Vorbereitung oder Zwischenphasen ohne direkte
          Beteiligungsmöglichkeit.
        show_index_order_upcoming: Zukünftige Projektvorhaben
        show_index_order_upcoming_description: >
          Blendet den Tab „Zukünftige Projektvorhaben" ein, der Projekte anzeigt, deren Startdatum in der Zukunft liegt. So können Nutzer
          frühzeitig sehen, welche Beteiligungsmöglichkeiten geplant sind. Dies fördert die Transparenz über kommende Vorhaben und
          ermöglicht frühzeitiges Interesse.
        show_index_order_expired: Archivierte Projektvorhaben
        show_index_order_expired_description: >
          Blendet den Tab „Archivierte Projektvorhaben" ein, der abgeschlossene Projekte zeigt, deren Laufzeit beendet ist. Nutzer können
          so vergangene Beteiligungen nachvollziehen und Ergebnisse einsehen. Deaktivieren Sie diese Option, wenn abgeschlossene Projekte
          nicht mehr öffentlich sichtbar sein sollen.
        show_index_order_individual_list: Individuelle Liste
        show_index_order_individual_list_description: >
          Blendet den Tab „Individuelle Liste" ein, der speziell hervorgehobene Projekte anzeigt, die manuell für diese Liste konfiguriert
          wurden. Im Gegensatz zu den automatisch befüllten Tabs wird der Inhalt dieser Liste über die Sichtbarkeitseinstellungen einzelner
          Projekte gesteuert.
        show_index_order_drafts: Entwürfe
        show_index_order_drafts_description: >
          Blendet den Tab „Entwürfe" ein, der nur für Administratoren sichtbar ist und Projekte im Entwurfsstatus anzeigt. Diese Projekte
          sind im Frontend für normale Nutzer nicht sichtbar. Nutzen Sie diesen Tab, um Projekte vor der Veröffentlichung vorzubereiten
          und zu prüfen.
      projekts_overview_page_footer:
        show_in_index_order_all: Beteiligung für „Alle Projekte"
        show_in_index_order_all_description: >
          Zeigt die Beteiligungsmodule (z. B. aktive Phasen, Abstimmungen) im Footer-Bereich des Tabs „Alle Projekte" an. Wenn aktiviert,
          werden unterhalb der Projektliste die Beteiligungsmöglichkeiten der einzelnen Projekte eingeblendet. Deaktivieren Sie diese
          Option, wenn nur die Projektliste ohne Beteiligungsdetails angezeigt werden soll.
        show_in_index_order_underway: Beteiligung für „Aktive Beteiligung"
        show_in_index_order_underway_description: >
          Zeigt die Beteiligungsmodule im Footer-Bereich des Tabs „Aktive Beteiligung" an. Nutzer sehen so direkt unter der Projektliste
          die aktuellen Beteiligungsmöglichkeiten. Besonders sinnvoll in Kombination mit dem Navigations-Tab, um aktive Phasen
          hervorzuheben.
        show_in_index_order_ongoing: Beteiligung für „Laufende Projekte"
        show_in_index_order_ongoing_description: >
          Zeigt die Beteiligungsmodule im Footer-Bereich des Tabs „Laufende Projekte" an. So werden unterhalb der Projektliste die
          Beteiligungsphasen der laufenden Projekte angezeigt und Nutzer können direkt auf die Beteiligung zugreifen, ohne erst die
          Projektseite öffnen zu müssen.
        show_in_index_order_upcoming: Beteiligung für „Zukünftige Projektvorhaben"
        show_in_index_order_upcoming_description: >
          Zeigt die Beteiligungsmodule im Footer-Bereich des Tabs „Zukünftige Projektvorhaben" an. Da zukünftige Projekte in der Regel
          noch keine aktiven Phasen haben, ist diese Option in den meisten Fällen weniger relevant und kann deaktiviert bleiben.
        show_in_index_order_expired: Beteiligung für „Archivierte Projektvorhaben"
        show_in_index_order_expired_description: >
          Zeigt die Beteiligungsmodule im Footer-Bereich des Tabs „Archivierte Projektvorhaben" an. So können Nutzer auch bei
          abgeschlossenen Projekten sehen, welche Beteiligungsphasen stattgefunden haben und welche Ergebnisse erzielt wurden. Nützlich
          für Transparenz und Nachvollziehbarkeit.
        show_in_index_order_individual_list: Individuelle Liste
        show_in_index_order_individual_list_description: >
          Zeigt die Beteiligungsmodule im Footer-Bereich des Tabs „Individuelle Liste" an. So werden unterhalb der individuell
          zusammengestellten Projektliste die zugehörigen Beteiligungsphasen eingeblendet.
      gdpr:
        gdpr_conformity: "DSGVO-konforme Voreinstellungen"
        gdpr_conformity_description: >
          Aktivieren Sie diese Option, um den E-Mail-Versand der Plattform auf ein Opt-in-Verfahren
          umzustellen. Nutzer erhalten Newsletter und Systembenachrichtigungen dann nur, wenn sie dem
          Empfang aktiv zugestimmt haben. Damit wird das Prinzip „Privacy by Design" umgesetzt: Ohne
          ausdrückliche Einwilligung werden keine E-Mails an Nutzer versendet. Diese Einstellung betrifft
          sowohl Newsletter als auch projektbezogene Benachrichtigungen.
        link_out_warning: "Warnung bei externen Links"
        link_out_warning_description: >
          Wenn diese Option aktiviert ist, erscheint beim Klick auf einen externen Link ein Hinweis-Popup.
          Dieses informiert die Nutzer darüber, dass sie die Plattform verlassen und auf eine externe Webseite
          weitergeleitet werden. So wird sichergestellt, dass Nutzer bewusst entscheiden, ob sie die geschützte
          Umgebung der Beteiligungsplattform verlassen möchten, bevor Daten an Dritte übermittelt werden.
        two_click_iframe_solution: "Zwei-Klick-Lösung für iFrames"
        two_click_iframe_solution_description: "Aktivieren Sie diese Option, um einen datenschutzkonformen Blur-Effekt für eingebettete Inhalte (z. B. Karten oder Videos) zu verwenden. Der Inhalt wird erst nach einem aktiven Klick durch die Nutzer geladen („Zwei-Klick-Lösung“). So stellen Sie sicher, dass keine Daten an Drittanbieter übertragen werden, bevor eine Zustimmung erfolgt ist."
      general:
        enable_google_translate: Google Translate aktivieren
        enable_google_translate_description: "Bevor Sie Google Translate aktivieren, stimmen Sie bitte den Nutzungsbedingungen unter folgendem Link zu: https://docs.google.com/forms/d/e/1FAIpQLSfAyBtxLmBe3s1m-6nkSBcs7W_8EAUmwmPTEXlSqctg1QCRBw/viewform"
        show_guest_login_links: Zeige Gast-Login an
        show_guest_login_links_description: Zeigt den Gast-Login-Link in der Fußzeile
        users_overview_page: Übersicht aller Nutzer*innen
        users_overview_page_description: "Aktiviert eine öffentliche Übersichtsseite mit allen aktiven Nutzer*innen, die ihrer Anzeige zugestimmt haben. Besucher können Profile durchsuchen und die Beteiligungsaktivität anderer Nutzer*innen einsehen, etwa eingereichte Vorschläge, Kommentare und Abstimmungsteilnahmen."
        enable_projekt_events_page: Veranstaltungskalender
        enable_projekt_events_page_description: >
          Aktiviert eine zentrale Übersichtsseite für alle öffentlichen Veranstaltungen aus den Beteiligungsprojekten. Bürger können dort kommende Workshops, Bürgerversammlungen und Informationsveranstaltungen einsehen. Die Seite kann über die Navigation erreichbar gemacht werden.
        enable_investments_overview: Budgetübersicht
        enable_investments_overview_description: >
          Aktiviert eine zentrale Übersichtsseite, die alle Bürgervorschläge aus laufenden und abgeschlossenen Bürgerhaushalten zusammenfasst. Bürger können dort den Stand der Vorschläge, Machbarkeitsbewertungen und Abstimmungsergebnisse projektübergreifend einsehen.
    extended_option:
      general:
        city_name: Name der Stadt/Gemeinde
        city_name_description: "Der hier hinterlegte Name der Stadt oder Gemeinde wird bei der BundID-Verifizierung herangezogen, um den im Melderegister hinterlegten Wohnort der Nutzer abzugleichen. So wird sichergestellt, dass nur Personen mit gemeldetem Wohnsitz in Ihrer Kommune an Beteiligungsverfahren teilnehmen können. Bitte tragen Sie den offiziellen Namen exakt so ein, wie er im Melderegister geführt wird."
        title: Titel der Anwendung
        title_description: "Dieser Titel wird großformatig innerhalb des Hintergrundbildes im oberen Bereich der Startseite angezeigt. Er dient als erster inhaltlicher Ankerpunkt für Besucher. Der Text sollte kurz und prägnant sein – ideal sind ein bis fünf Wörter. Wenn das Feld leer bleibt, wird kein Titel angezeigt."
        subtitle: Untertitel der Anwendung
        subtitle_description: "Der Untertitel erscheint direkt unterhalb des Haupttitels im Hintergrundbild auf der Startseite. Er ermöglicht eine kurze ergänzende Information oder Beschreibung des Beteiligungsangebots. Formulieren Sie ihn als prägnanten Satz, der den Kontext der Plattform auf den Punkt bringt. Wenn das Feld leer bleibt, wird kein Untertitel angezeigt."
        homepage_button_text: Homepage-Button-Text
        homepage_button_text_description: "Text, der auf dem Button im Hero-Bereich der Startseite angezeigt wird. Der Button dient als zentraler Call-to-Action für Besucher. Wählen Sie eine kurze, handlungsorientierte Beschriftung (z. B. 'Jetzt mitmachen' oder 'Projekte entdecken'). Wenn das Feld leer bleibt, wird kein Button angezeigt."
        homepage_button_link: Homepage-Button-Link
        homepage_button_link_description: "Ziel-URL, die beim Klick auf den Homepage-Button aufgerufen wird. Sie können einen internen Pfad (z. B. /projekts) oder eine vollständige externe URL (z. B. https://beispiel.de) angeben. Der Link wird nur wirksam, wenn auch ein Button-Text eingetragen ist. Ohne Button-Text bleibt der Link unsichtbar."
        homepage_navigation_link_color: Farbe der Links in der Top-Navigation
        homepage_navigation_link_color_description: "Legt die Schriftfarbe der Links in der oberen Navigationsleiste der Startseite fest. Das ist wichtig, da das Hintergrundbild dunkel sein kann und die Lesbarkeit sichergestellt sein muss."
      gdpr:
        devise_timeout_min: "Dauer von Nutzer-Sitzungen in Minuten"
        devise_timeout_min_description: >
          Legen Sie fest, wie lange ein Nutzer nach dem Einloggen aktiv bleibt, bevor er automatisch
          abgemeldet wird. Die Dauer wird in Minuten angegeben und betrifft sowohl reguläre Nutzerkonten
          als auch administrative Zugänge. Ein kürzerer Wert erhöht die Sicherheit, insbesondere bei
          öffentlich zugänglichen Endgeräten. Ein längerer Wert verbessert den Komfort bei ausgedehnten
          Beteiligungsprozessen.
        devise_verification_token_validity_days: "Gültigkeit des Verifikationslinks in Tagen"
        devise_verification_token_validity_days_description: >
          Legen Sie fest, wie viele Tage der Verifikationslink gültig bleibt, den Nutzer per E-Mail
          zur Bestätigung ihres Kontos erhalten. Nach Ablauf dieser Frist muss ein neuer Link angefordert
          werden. Ein kürzerer Zeitraum erhöht die Sicherheit, da abgelaufene Links nicht mehr missbraucht
          werden können. Ein längerer Zeitraum gibt Nutzern mehr Spielraum, falls sie den Link nicht
          sofort bestätigen können.
    extra_fields:
      registration:
        extended: Erweiterte Registrierung
        extended_description: "Aktiviert zusätzliche Eingabefelder in der Registrierungsmaske: Vorname, Nachname, Geschlecht, Straße, Hausnummer, PLZ, Stadt und Geburtsdatum. Diese Daten können für projektbezogene Einschränkungen genutzt werden und ermöglichen eine gezieltere Steuerung der Beteiligungsmöglichkeiten je nach Nutzergruppe oder Wohnort."
        check_documents: Dokumentenabfrage in der Registrierung
        check_documents_description: "Aktiviert ein zusätzliches Feld in der Registrierungsmaske zur Eingabe der letzten vier Ziffern eines gültigen Dokuments (Personalausweis oder Reisepass). Diese Information kann für eine spätere manuelle oder automatisierte Verifizierung verwendet werden. Die Abfrage ist optional und unabhängig von der eigentlichen Verifizierungsprüfung."
      verification:
        check_documents: Dokumentenprüfung in der Verifizierung
        check_documents_description: "Aktiviert eine Verifizierungsmethode, bei der die bei der Registrierung hinterlegte Dokumentennummer (letzte vier Ziffern von Personalausweis oder Reisepass) mit einer Referenzliste abgeglichen wird. Diese Prüfung ist unabhängig von der reinen Erfassung in der Registrierungsmaske und setzt eine API-Verbindung zum Melderegister voraus."
        show_data_completeness_status: Datenvollständigkeit im Nutzerkonto
        show_data_completeness_status_description: "Zeigt im Nutzerkonto an, ob alle für bestimmte Beteiligungsphasen erforderlichen Profildaten hinterlegt wurden. Nutzer erkennen so auf einen Blick, ob sie noch Angaben ergänzen müssen, um an einer Phase teilnehmen zu können. Die Anzeige erscheint im Profilbereich und aktualisiert sich automatisch bei Datenänderungen."
        show_verification_status: Verifizierungsstatus im Nutzerkonto
        show_verification_status_description: "Zeigt den aktuellen Verifizierungsstatus des Nutzers direkt im Profilbereich unterhalb des Nutzerbildes an. Dies schafft Transparenz und erleichtert die Einschätzung, ob eine Teilnahme an verifizierungsbeschränkten Beteiligungsphasen möglich ist. Der Status wird automatisch aktualisiert, sobald sich der Verifizierungsstand ändert."
    projekt_feature:
      general:
        show_in_overview_page: Projekt auf Projektübersichtsseite
        show_in_overview_page_description: Steuert, ob dieses Projekt auf der allgemeinen Projektübersichtsseite angezeigt wird. Die Projektübersichtsseite listet alle öffentlichen Projekte der Plattform auf und ist für Nutzer der zentrale Einstiegspunkt, um laufende und abgeschlossene Beteiligungsprojekte zu entdecken und zu filtern.
        show_in_homepage: Projekt auf der Startseite
        show_in_homepage_description: Blendet das Projekt auf der Startseite der Plattform ein, z. B. im Bereich „Aktuelle Projekte” oder unter weiterführenden Ressourcen. So erhalten besonders relevante oder aktuelle Projekte zusätzliche Aufmerksamkeit direkt beim ersten Besuch der Plattform – unabhängig von der Projektübersichtsseite.
        show_in_individual_list: Projekt in individueller Liste
        show_in_individual_list_description: Zeigt das Projekt auf der Projektübersichtsseite in einer eigenständigen, individuellen Liste an – getrennt von den automatisch generierten Listen wie „Laufende Projekte” oder „Abgeschlossene Projekte”. Diese Option eignet sich z. B. für hervorgehobene oder dauerhaft sichtbare Projekte.
        allow_indexing: Suchmaschinen-Indexierung
        allow_indexing_description: Erlaubt Suchmaschinen wie Google, die Projektseite zu indexieren und in Suchergebnissen anzuzeigen. Ist diese Option deaktiviert, wird ein „noindex”-Tag gesetzt, sodass die Seite zwar über die Plattform erreichbar bleibt, aber nicht über externe Suchmaschinen gefunden werden kann.
        consider_underway: Projekt als aktive Beteiligung führen
        consider_underway_description: Stellt sicher, dass das Projekt in der Übersicht stets als aktive Beteiligung aufgeführt wird – auch dann, wenn aktuell keine reguläre Beteiligungsphase läuft. Geeignet z. B. für dauerhaft beworbene Projekte oder solche zwischen zwei Phasen, die für Nutzer weiterhin als aktive Beteiligungsmöglichkeit sichtbar bleiben sollen.
        show_related_projekt_link: Projektlink auf Beitragsseiten
        show_related_projekt_link_description: Zeigt im Kopfbereich der Beiträge dieses Projekts (Vorschläge, Abstimmungen, Debatten usw.) einen Link zurück zum Projekt an. So können Nutzer von einem einzelnen Beitrag zum zugehörigen Projekt navigieren.
    ideas:
      admins_must_assign_officer: Pflicht-Zuweisung an Sachbearbeiter
      admins_must_assign_officer_description: >
        Wenn aktiviert, müssen Administratoren jede neue Idee manuell einem zuständigen Sachbearbeiter zuweisen. Ohne Zuweisung kann die Idee nicht bearbeitet werden. Dies stellt sicher, dass jede Idee eine verantwortliche Person erhält und keine Einreichung ohne klare Zuständigkeit bleibt.
      enable_comments: Kommentarfunktion
      enable_comments_description: >
        Wenn aktiviert, können Nutzer unterhalb einer Idee Kommentare verfassen. Dies ermöglicht einen öffentlichen Austausch zwischen Bürgern und Verwaltung, z.B. für Rückfragen, weiterführende Anregungen oder ergänzende Hinweise zur eingereichten Idee. Kommentare können von Administratoren moderiert werden.
      intro_text: Einleitungstext für Ideen
      intro_text_description: >
        Zeigt einen individuellen Einleitungstext oberhalb der Ideenübersichtsseite an. Nutzen Sie diesen Text, um Bürgern den Zweck des Ideenbereichs zu erklären, Hinweise zur Nutzung zu geben oder auf wichtige Rahmenbedingungen hinzuweisen — z.B. welche Arten von Ideen eingereicht werden können und wie der Bearbeitungsprozess abläuft.
      enable_geoman_controls_in_maps: Kartenzeichnung durch Nutzer
      enable_geoman_controls_in_maps_description: >
        Ermöglicht es Nutzern, geometrische Formen wie Rechtecke, Kreise oder Polygone auf der Karte einzuzeichnen. Dies ist nützlich, wenn eine Idee nicht nur einen einzelnen Punkt, sondern einen Bereich betrifft — z.B. eine Grünfläche, einen Platz oder einen ganzen Straßenzug. Die Zeichnung wird zusammen mit der Idee gespeichert.
      admin_acceptance_required: Administrator-Freigabe
      admin_acceptance_required_description: >
        Wenn aktiviert, müssen Administratoren neue Ideen zunächst prüfen und freigeben, bevor sie öffentlich sichtbar werden. Nicht bestätigte Ideen sind nur für Administratoren einsehbar. Dies verhindert, dass unangemessene, unvollständige oder doppelte Einreichungen ungeprüft auf der Plattform veröffentlicht werden.
      document_upload: Zusätzliche Dokumente
      document_upload_description: >
        Erlaubt es Nutzern, Dokumente wie PDFs, Textdateien oder andere Anhänge zu ihren Ideen hochzuladen. Dies ist hilfreich, wenn ergänzende Unterlagen benötigt werden — z.B. Konzepte, Skizzen, Studien oder detaillierte Beschreibungen, die über die Möglichkeiten eines einfachen Textfeldes hinausgehen.
      external_video: Externes Video einbinden
      external_video_description: >
        Ermöglicht es Nutzern, externe Videos von YouTube oder Vimeo in ihre Ideen einzubetten. So können z.B. Erklärvideos, Visualisierungen oder Anschauungsmaterial direkt in der Idee angezeigt werden, ohne dass große Dateien auf die Plattform hochgeladen werden müssen — und ohne zusätzlichen Speicherbedarf.
    deficiency_reports:
      feature_name: Bezeichnung des Bereichs
      feature_name_description: >
        Eigene Bezeichnung für den Mängelmelder, z.B. "Mängelmelder", "Hinweisportal" oder "Bürgermelder". Diese Bezeichnung erscheint auf der Übersichtsseite, im Hauptmenü und im Browser-Tab. Leer lassen, um die Standardbezeichnung ("Mängelmelder") zu verwenden.
      create_cta: Beschriftung der Melde-Schaltfläche
      create_cta_description: >
        Beschriftung der zentralen Schaltfläche, mit der Bürgerinnen und Bürger auf der Übersichtsseite eine neue Meldung starten (z.B. "Mangel melden", "Hinweis abgeben"). Leer lassen, um die Standardbeschriftung ("Mangel melden") zu verwenden.
      show_in_main_menu: Mängelmelder in der Navigation
      show_in_main_menu_description: >
        Wenn aktiviert, wird der Mängelmelder als eigenständiger Menüpunkt in der Hauptnavigation der Plattform angezeigt. Nutzer können so direkt über das Hauptmenü auf die Mängelübersicht zugreifen, ohne erst ein Projekt aufrufen zu müssen. Deaktivieren Sie diese Option, wenn der Mängelmelder nur innerhalb bestimmter Projekte sichtbar sein soll.
      new_form_title: Überschrift des Meldeformulars
      new_form_title_description: >
        Überschrift am Anfang des Formulars für neue Meldungen (z.B. "Neue Meldung", "Mangel melden"). Leer lassen, um die Plattform-Standardüberschrift zu verwenden.
      new_form_title_placeholder: Platzhalter für den Titel
      new_form_title_placeholder_description: >
        Platzhaltertext im Titel-Feld des Meldeformulars. Geben Sie Bürgerinnen und Bürgern hier ein gutes Beispiel an die Hand (z.B. "Schlagloch in XY-Straße vor Hausnummer 123"). Leer lassen, um den Plattform-Standard zu verwenden.
      admins_must_assign_officer: Pflicht-Zuweisung an Sachbearbeiter
      admins_must_assign_officer_description: >
        Wenn aktiviert, müssen Administratoren jede neue Mangelmeldung manuell einer zuständigen Sachbearbeiterin oder einem Sachbearbeiter zuweisen. Ohne Zuweisung kann die Meldung nicht bearbeitet werden. Dies stellt sicher, dass jede Meldung eine verantwortliche Person erhält und keine Meldung ohne Zuständigkeit bleibt.
      allow_voting: Nutzer-Bewertung pro Mangel
      allow_voting_description: >
        Aktiviert eine Bewertungsfunktion, mit der Nutzer einzelne Mangelmeldungen unterstützen oder priorisieren können. Die Anzahl der Bewertungen wird öffentlich angezeigt und hilft der Verwaltung, häufig gemeldete oder besonders dringende Mängel schneller zu erkennen und zu priorisieren.
      enable_comments: Kommentarfunktion
      enable_comments_description: >
        Wenn aktiviert, können Nutzer unterhalb einer Mangelmeldung Kommentare verfassen. Dies ermöglicht einen öffentlichen Austausch zwischen Bürgern und Verwaltung, z.B. für Rückfragen, Statusupdates oder ergänzende Hinweise zum gemeldeten Mangel. Kommentare können von Administratoren moderiert werden.
      intro_text: Einleitungstext für den Mängelmelder
      intro_text_description: >
        Zeigt einen individuellen Einleitungstext oberhalb der Mängelübersichtsseite an. Nutzen Sie diesen Text, um Bürgern den Zweck des Mängelmelders zu erklären, Hinweise zur Nutzung zu geben oder auf wichtige Rahmenbedingungen hinzuweisen — z.B. welche Arten von Mängeln gemeldet werden können und wie der Bearbeitungsprozess abläuft.
      enable_my_posts_filter: Meine Beiträge
      enable_my_posts_filter_description: >
        Zeigt einen Filter auf der Mängelübersichtsseite, mit dem eingeloggte Nutzer gezielt nur ihre eigenen eingereichten Mangelmeldungen anzeigen lassen können. Dies erleichtert die Übersicht über den Status der eigenen Meldungen, ohne alle Einträge durchsuchen zu müssen.
      show_map: Karte anzeigen
      show_map_description: >
        Zeigt die Karte im Meldeformular an, auf der Nutzer den Standort ihrer Meldung auswählen können. Deaktivieren Sie diese Option, wenn im Formular keine Karte angeboten werden soll.
      enable_geoman_controls_in_maps: Zeichenwerkzeuge in Karten aktivieren
      enable_geoman_controls_in_maps_description: >
        Ermöglicht es Nutzern, geometrische Formen wie Rechtecke, Kreise oder Polygone auf der Karte einzuzeichnen. Dies ist nützlich, wenn ein Mangel nicht nur einen einzelnen Punkt, sondern einen Bereich betrifft — z.B. eine beschädigte Straße oder ein verschmutztes Areal. Die Zeichnung wird zusammen mit der Meldung gespeichert.
      map_location_required: Standort auf Karte erforderlich
      map_location_required_description: >
        Wenn aktiviert, muss vor dem Absenden einer Meldung ein Standort auf der Karte ausgewählt werden. So ist jede Meldung geografisch verortet, was für die Zuordnung zum richtigen Gebiet und Sachbearbeiter entscheidend ist. Deaktivieren Sie die Option, wenn Meldungen auch ohne genauen Standort erstellt werden dürfen.
      admin_acceptance_required: Administrator-Freigabe
      admin_acceptance_required_description: >
        Wenn aktiviert, müssen Administratoren neue Mangelmeldungen zunächst prüfen und freigeben, bevor sie öffentlich sichtbar werden. Nicht bestätigte Meldungen sind nur für Administratoren einsehbar. Dies verhindert, dass unangemessene oder doppelte Meldungen direkt veröffentlicht werden.
      image_upload: Titelbild-Upload
      image_upload_description: >
        Erlaubt es Nutzern, ihrem Anliegen ein Titelbild hinzuzufügen. Deaktivieren Sie diese Option, wenn im Meldeformular kein Titelbild-Upload angeboten werden soll.
      document_upload: Zusätzliche Dokumente
      document_upload_description: >
        Erlaubt es Nutzern, Dokumente wie PDFs, Textdateien oder andere Anhänge zu ihren Mangelmeldungen hochzuladen. Dies ist hilfreich, wenn ergänzende Unterlagen benötigt werden — z.B. Gutachten, Korrespondenz mit Behörden oder detaillierte Beschreibungen, die über ein einfaches Textfeld hinausgehen.
      external_video: Externes Video einbinden
      external_video_description: >
        Ermöglicht es Nutzern, externe Videos von YouTube oder Vimeo in ihre Mangelmeldungen einzubetten. So können z.B. Videoaufnahmen eines Mangels, Erklärvideos oder Dokumentationen direkt in der Meldung angezeigt werden, ohne dass große Dateien hochgeladen werden müssen.
      voice_assistant: Sprachassistent für Mängelmeldungen
      voice_assistant_description: >
        Aktiviert einen KI-unterstützten Sprachassistenten, der Nutzer beim Erstellen von Mangelmeldungen unterstützt. Nutzer können den Mangel per Spracheingabe beschreiben, und der Assistent erstellt daraus automatisch eine strukturierte Meldung mit Titel und Beschreibung. Besonders geeignet für mobile Nutzung und barrierefreien Zugang.
      send_feedback_form_link: Feedback-Formular versenden
      send_feedback_form_link_description: >
        Wenn aktiviert, erhalten Nutzer nach Abschluss ihrer Mangelmeldung per E-Mail einen Link zu einem Feedback-Formular. Damit können sie die Bearbeitung ihres Anliegens bewerten und Rückmeldung zur Zufriedenheit mit dem Prozess geben. Dies hilft der Verwaltung, die Qualität der Mängelbearbeitung zu überwachen und zu verbessern.
      show_create_report_button: Einreichen-Button für Mängelmeldungen
      show_create_report_button_description: >
        Zeigt einen gut sichtbaren Button zum Einreichen neuer Mangelmeldungen in der Seitenleiste der Mängelübersichtsseite an. Der Button erleichtert den Einstieg für Nutzer, die einen neuen Mangel melden möchten. Deaktivieren Sie diese Option, wenn die Einreichung über andere Wege erfolgen soll oder vorübergehend keine neuen Meldungen erwünscht sind.
      show_homepage_cta: Melde-Schaltfläche auf der Startseite
      show_homepage_cta_description: >
        Zeigt im Kopfbereich der Startseite eine zusätzliche Schaltfläche unterhalb der Haupt-Schaltfläche an, die Nutzer direkt zum Formular für ein neues Anliegen führt. Die Beschriftung wird aus der Einstellung "Beschriftung der Melde-Schaltfläche" übernommen. Setzt voraus, dass das Anliegenmanagement aktiviert ist.

    process:
      proposals: Vorschlagsübersicht
      proposals_description: >
        Aktiviert eine zentrale Übersichtsseite für alle eingereichten Vorschläge aus den Beteiligungsprojekten. Bürger können dort Vorschläge durchsuchen, kommentieren, bewerten und unterstützen. Die Seite kann über die Navigation erreichbar gemacht werden.
      polls: Abstimmungsübersicht
      polls_description: >
        Aktiviert eine zentrale Übersichtsseite für alle aktiven und abgeschlossenen Abstimmungen aus den Beteiligungsprojekten. Bürger können dort laufende Abstimmungen aufrufen, ihre Stimme abgeben und Ergebnisse abgeschlossener Abstimmungen einsehen. Die Seite kann über die Navigation erreichbar gemacht werden.
      budgets: Bürgerhaushalt
      budgets_description: >
        Aktiviert den Bürgerhaushalt, bei dem Bürger Investitionsvorschläge einreichen und über die Verteilung eines festgelegten Budgets abstimmen können. Der Prozess umfasst mehrere Phasen: Einreichung, Machbarkeitsprüfung durch die Verwaltung und finale Bürgerabstimmung.
      legislation: Kollaborative Textbearbeitung
      legislation_description: >
        Ermöglicht kollaborative Textarbeit, bei der Bürger Entwürfe lesen, einzelne Absätze kommentieren und Änderungsvorschläge einbringen können. Geeignet für die gemeinsame Erarbeitung von Satzungen, Leitlinien oder Verordnungen im Rahmen von Beteiligungsverfahren.
      projekts: Projektübersicht
      projekts_description: >
        Aktiviert die Projektübersichtsseite, auf der alle laufenden und abgeschlossenen Beteiligungsprojekte für Bürger zugänglich sind. Die Übersicht bietet Filtermöglichkeiten und zeigt den aktuellen Stand jedes Projekts. Einzelne Projekte bleiben auch bei deaktivierter Übersicht über direkte Links erreichbar.
      deficiency_reports: Mängelmelder
      deficiency_reports_description: >
        Aktiviert den Mängelmelder, über den Bürger Schäden, Verschmutzungen oder andere Mängel im öffentlichen Raum melden können. Meldungen werden mit Standort, Kategorie und Beschreibung erfasst und können von Sachbearbeitern bearbeitet und beantwortet werden.
      ideas: Ideenplattform
      ideas_description: >
        Aktiviert die Ideenplattform, auf der Bürger Ideen und Anregungen für die Stadtentwicklung einreichen können. Ideen können von anderen Nutzern bewertet und kommentiert werden. Das Modul eignet sich für offene Ideensammlungen ohne formalen Abstimmungsprozess.

    adm:
      ideas:
        intro_text: "Einleitungstext"
        intro_text_description: "Dieser Text wird auf der Startseite dieses Verwaltungsbereichs als kurze Orientierung für Ihr Team angezeigt. Beschreiben Sie in wenigen Sätzen, wofür der Bereich zuständig ist (max. 350 Zeichen)."
        notice_message: "Hinweismeldung"
        notice_message_description: "Die Hinweismeldung wird als gelbe Infobox ganz oben auf der Startseite des Bereichs angezeigt. Nutzen Sie sie für aktuelle Informationen, Fristen oder Bearbeitungshinweise. Die Meldung kann pro Sitzung ausgeblendet werden."
        notice_active: "Hinweis aktiv"
        notice_active_description: "Steuert, ob die oben eingetragene Hinweismeldung auf der Startseite als gelbe Infobox angezeigt wird. Deaktivieren Sie diese Option, um die Meldung vorübergehend auszublenden, ohne den Text zu löschen."
