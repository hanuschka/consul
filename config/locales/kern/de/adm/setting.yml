de:
  setting:
    org_name: "Name der Anwendung"
    org_name_description: "Dieser Name wird z.B. im Browser-Tab, in E-Mails sowie an anderen Stellen der Plattform angezeigt. Er sollte eindeutig und wiedererkennbar sein."
    url: "Haupt-URL der Applikation"
    url_description: "Dies ist die Hauptadresse (Top-Level-Domain) der Consul-Instanz, z. B. https://beteiligung.meine-stadt.de. Sie wird verwendet, wenn relative Links auf der Plattform automatisch ergänzt oder in Systembenachrichtigungen eingesetzt werden. Hinweis: Bitte ohne abschließenden Schrägstrich angeben."
    mailer_from_address: "Absender-E-Mail-Adresse"
    mailer_from_address_description: "Diese E-Mail-Adresse erscheint als Absender bei allen automatisch versendeten E-Mails der Plattform (z. B. Benachrichtigungen, Bestätigungen).
Hinweis: Die hier eingetragene Adresse muss mit der im Mailserver hinterlegten Adresse identisch sein. Änderungen sind nicht selbstständig möglich – bitte wenden Sie sich in diesem Fall an den Support von demokratie.today."
    mailer_from_name: "Anzeigename des E-Mail-Absenders"
    mailer_from_name_description: "Dieser Name wird den Empfängern als Absender in E-Mails angezeigt, die von der Plattform versendet werden – zum Beispiel „Beteiligungsplattform Stadt Musterstadt“. Der Anzeigename kann unabhängig von der technischen Absenderadresse angepasst werden."
    meta_title: "Seitentitel (Suchmaschinenoptimierung)"
    meta_title_description: "Dieser Titel wird von Suchmaschinen als Hauptüberschrift in den Suchergebnissen verwendet. Ein klar formulierter, suchmaschinenfreundlicher Titel verbessert die Sichtbarkeit Ihrer Anwendung bei Google & Co."
    meta_description: "Seitenbeschreibung (Suchmaschinenoptimierung)"
    meta_description_description: "Diese Beschreibung erscheint in Suchmaschinen unter dem Titel Ihrer Seite. Sie sollte kurz, präzise und ansprechend sein, um Nutzer zum Klicken zu motivieren. Eine gute Meta-Description erhöht die Sichtbarkeit und Klickrate in den Suchergebnissen."
    newsletter_brand_color: "Newsletter Markenfarbe"
    newsletter_brand_color_description: "Diese Farbe wird als Akzentfarbe im Kopf- und Fußbereich der Newsletter-Emails verwendet."
    meta_keywords: "Stichwörter (Suchmaschinenoptimierung)"
    meta_keywords_description: "Hier können Sie optionale Stichwörter eintragen, die den Inhalt der Seite thematisch beschreiben. Diese werden im HTML-Quelltext als Meta-Keywords eingebunden. Obwohl Suchmaschinen diesen Tag heute kaum noch auswerten, kann er für interne Zwecke oder spezifische SEO-Strategien weiterhin nützlich sein. Begriffe durch Kommas trennen."
    facebook_handle: "Facebook-Benutzername"
    facebook_handle_description: "Wenn ausgefüllt, wird ein Facebook-Logo mit Link in der Fußzeile angezeigt."
    instagram_handle: "Instagram-Benutzername"
    instagram_handle_description: "Wenn ausgefüllt, wird ein Instagram-Logo mit Link in der Fußzeile angezeigt."
    twitter_handle: "X-Benutzername (ehemals Twitter)"
    twitter_handle_description: "Wenn ausgefüllt, wird ein X-Logo mit Link in der Fußzeile angezeigt."
    twitter_hashtag: "X-Hashtag"
    twitter_hashtag_description: "Hier kann ein Hashtag eingetragen werden, der mit der Plattform X verlinkt wird – z. B. für Kampagnen oder zentrale Themen. Erscheint ebenfalls in der Fußzeile."
    telegram_handle: "Telegram-Benutzername"
    telegram_handle_description: "Wenn ausgefüllt, wird ein Telegram-Logo mit Link in der Fußzeile angezeigt."
    youtube_handle: "YouTube-Benutzername oder Kanal-ID"
    youtube_handle_description: "Wenn ausgefüllt, wird ein YouTube-Logo mit Link in der Fußzeile angezeigt."
    welcomepage:
      usage_stats: Nutzerübersicht anzeigen
      usage_stats_description: "Wenn aktiviert, wird auf der Startseite die Gesamtzahl aller registrierten Nutzerinnen und Nutzer eingeblendet. Zusätzlich wird ein öffentlicher Link zur Nutzerübersichtsseite angezeigt. Diese Funktion eignet sich, um die Reichweite der Plattform transparent darzustellen. Sie kann deaktiviert werden, wenn diese Informationen nicht öffentlich sichtbar sein sollen."
      newsletter_subscription: Plattformstatistik anzeigen
      newsletter_subscription_description: "Wenn aktiviert, werden auf der Startseite zentrale Kennzahlen zur Plattform eingeblendet – darunter die Anzahl der Projekte, Vorschläge, Abstimmungen und Kommentare. Die Zahlen aktualisieren sich automatisch. Diese Funktion gibt Besucherinnen und Besuchern einen schnellen Überblick über die Aktivität der Plattform. Sie kann deaktiviert werden, wenn keine Statistiken öffentlich sichtbar sein sollen."
      platform_activity: Newsletter-Funktion aktivieren
      platform_activity_description: "Wenn aktiviert, wird auf der Startseite ein gut sichtbares Element zur Newsletter-Anmeldung eingeblendet. Eingeloggte Nutzerinnen und Nutzer können sich direkt anmelden, nicht angemeldete Personen über ein separates Formular. So können Interessierte über neue Projekte und Beteiligungsmöglichkeiten auf dem Laufenden gehalten werden. Für den tatsächlichen Versand wird ein separat konfigurierter Newsletter-Dienst benötigt."
      projekt_search: Projektsuche aktivieren
      projekt_search_description: "Wenn aktiviert, erscheint auf der Startseite eine Suchleiste, über die Nutzerinnen und Nutzer gezielt nach Projekten suchen können. Diese Option und der Startseiten-Button schließen sich gegenseitig aus – ist die Suche aktiv, wird der Button automatisch ausgeblendet. Die Projektsuche ist besonders sinnvoll, wenn die Plattform viele Projekte enthält. Sie kann jederzeit wieder deaktiviert werden."
    extended_feature:
      projekts_overview_page_navigation:
        show_index_order_all: Alle Projekte
        show_index_order_all_description: Zeigt Tab "Alle Projekte" an
        show_index_order_underway: Aktive Beteiligung
        show_index_order_underway_description: Zeigt Tab "Aktive Beteiligung" an
        show_index_order_ongoing: Laufende Projekte
        show_index_order_ongoing_descrition: Zeigt Tab "Laufende Projekte" an
        show_index_order_upcoming: Zukünftige Projektvorhaben
        show_index_order_upcoming_description: Zeigt Tab "Zukünftige Projektvorhaben" an
        show_index_order_expired: Archivierte Projektvorhaben
        show_index_order_expired_description: Zeigt Tab "Archivierte Projektvorhaben" an
        show_index_order_individual_list: Individuelle Liste
        show_index_order_individual_list_description: Zeigt Tab "Individuelle Liste" an
        show_index_order_drafts: Entwürfe
        show_index_order_drafts_description: Zeigt Tab "Entwürfe" an
      projekts_overview_page_footer:
        show_in_index_order_all: Beteiligung für "Alle Projekte"
        show_in_index_order_all_description: Zeigt die Beteiligungsmodule für den Tab "Alle Projekte an"
        show_in_index_order_underway: Beteiligung für "Aktive Beteiligung"
        show_in_index_order_underway_description: Zeigt die Beteiligungsmodule für den Tab "Alle Projekte an"
        show_in_index_order_ongoing: Beteiligung für "Laufende Projekte"
        show_in_index_order_ongoing_descrition: Zeigt die Beteiligungsmodule für den Tab "Alle Projekte an"
        show_in_index_order_upcoming: Beteiligung für "Zukünftige Projektvorhaben"
        show_in_index_order_upcoming_description: Zeigt die Beteiligungsmodule für den Tab "Alle Projekte an"
        show_in_index_order_expired: Beteiligung für "Archivierte Projektvorhaben"
        show_in_index_order_expired_description: Zeigt die Beteiligungsmodule für den Tab "Archivierte Projektvorhaben"
        show_in_index_order_individual_list: Individuelle Liste
        show_in_index_order_individual_list_description: Zeigt Tab "Individuelle Liste" an
      gdpr:
        gdpr_conformity: "DSGVO-konforme Voreinstellungen"
        gdpr_conformity_description: "Aktivieren Sie die DSGVO-konforme Voreinstellungen, um \"privacy by design\" zu gewähren"
        link_out_warning: "Warnung bei externen Links"
        link_out_warning_description: "Wenn diese Option aktiviert ist, erscheint beim Klick auf einen externen Link (außerhalb der Consul-Plattform) ein Hinweis-Popup. Dieses informiert die Nutzer darüber, dass sie die Plattform verlassen und auf eine externe Webseite weitergeleitet werden."
        two_click_iframe_solution: "Zwei-Klick-Lösung für iFrames"
        two_click_iframe_solution_description: "Aktivieren Sie diese Option, um einen datenschutzkonformen Blur-Effekt für eingebettete Inhalte (z. B. Karten oder Videos) zu verwenden. Der Inhalt wird erst nach einem aktiven Klick durch die Nutzer geladen („Zwei-Klick-Lösung“). So stellen Sie sicher, dass keine Daten an Drittanbieter übertragen werden, bevor eine Zustimmung erfolgt ist."
    extended_option:
      general:
        title: Titel der Anwendung
        title_description: "Dieser Titel wird großformatig innerhalb des Hintergrundbildes im oberen Bereich der Startseite angezeigt. Er dient als erster inhaltlicher Ankerpunkt für Besucherinnen und Besucher. Der Text sollte kurz und prägnant sein – ideal sind ein bis fünf Wörter. Wenn das Feld leer bleibt, wird kein Titel angezeigt."
        subtitle: Untertitel der Anwendung
        subtitle_description: "Der Untertitel erscheint direkt unterhalb des Haupttitels im Hintergrundbild auf der Startseite. Er ermöglicht eine kurze ergänzende Information oder Beschreibung des Beteiligungsangebots. Formulieren Sie ihn als prägnanten Satz, der den Kontext der Plattform auf den Punkt bringt. Wenn das Feld leer bleibt, wird kein Untertitel angezeigt."
      gdpr:
        devise_timeout_min: "Dauer von Nutzer-Sitzungen in Minuten"
        devise_timeout_min_description: "Legen Sie fest, wie lange ein Nutzer nach dem Einloggen aktiv bleibt, bevor er automatisch abgemeldet wird. Die Dauer wird in Minuten angegeben. Dies betrifft sowohl angemeldete Nutzerkonten als auch administrative Zugänge."
        devise_verification_token_validity_days: "Gültigkeit des Verifikationslinks in Tagen"
        devise_verification_token_validity_days_description: "Legen Sie fest, wie viele Tage lang der Link gültig ist, den Nutzer per E-Mail zur Verifizierung ihres Accounts erhalten."
    extra_fields:
      registration:
        extended: Erweiterte Registrierung
        extended_description: "Aktiviert zusätzliche Eingabefelder in der Registrierungsmaske: Vorname, Nachname, Geschlecht, Straße, Hausnummer, PLZ, Stadt und Geburtsdatum. Diese Daten können für projektbezogene Einschränkungen genutzt werden."
        check_documents: Dokumentenabfrage in der Registrierung
        check_documents_description: "Aktiviert ein zusätzliches Feld in der Registrierungsmaske zur Eingabe der letzten vier Ziffern eines gültigen Dokuments (Personalausweis oder Reisepass).\nDiese Information kann für eine spätere manuelle oder automatisierte Verifizierung verwendet werden."
      verification:
        check_documents: Dokumentenprüfung in der Verifizierung
        check_documents_description: "Aktiviert eine Verifizierungsmethode, bei der die bei der Registrierung hinterlegte Dokumentennummer (letzte vier Ziffern von Personalausweis oder Reisepass) mit einer Referenzliste (z. B. aus dem Melderegister) abgeglichen wird.\nHinweis: Diese Prüfung ist unabhängig von der reinen Erfassung des Dokuments in der Registrierungsmaske. Sie setzt voraus, dass eine API-Verbindung zum Melderegister mit Referenzdaten besteht."
        show_data_completeness_status: Datenvollständigkeit im Nutzerkonto anzeigen
        show_data_completeness_status_description: Zeigt im Benutzerkonto, ob alle für bestimmte Beteiligungsphasen erforderlichen Profildaten hinterlegt wurden. Nutzer erkennen so, ob sie noch Angaben ergänzen müssen, um teilnehmen zu können.
        show_verification_status: Verifizierungsstatus im Konto anzeigen
        show_verification_status_description: Zeigt den aktuellen Verifizierungsstatus des Nutzers direkt im Profilbereich unterhalb des Nutzerbildes an. Dies schafft Transparenz für die Nutzer und erleichtert die Einschätzung, ob eine Teilnahme an verifizierungsbeschränkten Beteiligungsphasen möglich ist.
    projekt_feature:
      general:
        show_in_overview_page: Projekt auf Projektübersichtsseite anzeigen
        show_in_overview_page_description: Zeigt das Projekt auf der allgemeinen Projektübersichtsseite an.
        show_in_homepage: Projekt auf der Startseite anzeigen
        show_in_homepage_description: Blendet das Projekt unter den weiterführenden Ressourcen auf der Startseite ein - wie z.B. aktuelle Projekte
        show_in_individual_list: Projekt in individueller Liste anzeigen
        show_in_individual_list_description: Zeigt das Projekt auf der Projektübersichtsseite in einer individuellen Liste an. Es erscheint nicht in anderen automatischen Listen wie “Laufende Projekte”.
        allow_indexing: Projektseite für Suchmaschinen freigeben
        allow_indexing_description: Erlaubt die Indexierung der Projektseite durch Google und andere Suchmaschinen.
    ideas:
      show_in_main_menu: Ideen in Navigation anzeigen
      show_in_main_menu_description: Zeigt Ideen in der Hauptnavigation an
      admins_must_assign_officer: Admins müssen Sachbearbeiter*in zuweisen
      admins_must_assign_officer_description: Administratoren weisen Idee an Sachbearbeiter*in zu
      officers_can_administer_assigned_reports: Sachbearbeiter*innen können Ideen administrieren
      officers_can_administer_assigned_reports_description: Sachbearbeiter*innen haben die volle Administrationskontrolle über ihnen zugewiesene Ideen
      officers_can_edit_assigned_reports: Sachbearbeiter*innen können Ideen editieren
      officers_can_edit_assigned_reports_description: Sachbearbeiter*innen haben die volle Kontrolle über ihnen zugewiesene Ideen
      enable_comments: Kommentarfunktion
      enable_comments_description: Nutzer*innen können unterhalb einer Idee kommentieren
      intro_text: Einleitungstext für die Idee
      intro_text_description: Aktivieren Sie einen individuellen Einleitungstext oberhalb der Ideenübersichtsseite
      enable_geoman_controls_in_maps: Nutzer*innen ermöglichen Figuren in die Karte einzuzeichnen
      enable_geoman_controls_in_maps_description: Ermöglicht es den Nutzer*innen Rechtecke, Kreise etc. einzuzeichnen.
      admin_acceptance_required: Bestätigung durch Administratoren
      admin_acceptance_required_description: Administratoren müssen neue Ideen vor der Veröffentlichung zunächst bestätigen.
      document_upload: Zusätzliche Dokumente
      document_upload_description: Ermöglicht es den Nutzer:innen Dokumente den Ideen anzuhängen
      external_video: Externes Video einbinden
      external_video_description: Ermöglicht es den Nutzer:innen externe Videos über YouTube und Vimeo einzubinden
    deficiency_reports:
      show_in_main_menu: Mängelmelder in Navigation anzeigen
      show_in_main_menu_description: Zeigt den Mängelmelder in der Hauptnavigation an
      admins_must_assign_officer: Admins müssen Sachbearbeiter*in zuweisen
      admins_must_assign_officer_description: Administratoren weisen Mangel an Sachbearbeiter*in zu
      officers_can_administer_assigned_reports: Sachbearbeiter*innen können Mangelmeldungen administrieren
      officers_can_administer_assigned_reports_description: Sachbearbeiter*innen haben die volle Administrationskontrolle über ihnen zugewiesene Mängel
      officers_can_edit_assigned_reports: Sachbearbeiter*innen können Mangelmeldungen editieren
      officers_can_edit_assigned_reports_description: Sachbearbeiter*innen haben die volle Kontrolle über ihnen zugewiesene Mängel
      allow_voting: Nutzer*innen Bewertung pro Mangel
      allow_voting_description: Aktiviert die Nutzer*innen-Bewertung für den Mängelmelder
      enable_comments: Kommentarfunktion
      enable_comments_description: Nutzer*innen können unterhalb eines Mangels kommentieren
      intro_text: Einleitungstext für den Mängelmelder
      intro_text_description: Aktivieren Sie einen individuellen Einleitungstext oberhalb der Mängelübersichtsseite
      enable_my_posts_filter: Meine Beiträge
      enable_my_posts_filter_description: Zeigt einen Filter für meine Beiträge in der Diskussionsübersichtsseite
      enable_geoman_controls_in_maps: Nutzer*innen ermöglichen Figuren in die Karte einzuzeichnen.
      enable_geoman_controls_in_maps_description: Ermöglicht es den Nutzer*innen Rechtecke, Kreise etc. einzuzeichnen.
      admin_acceptance_required: Bestätigung durch Administratoren
      admin_acceptance_required_description: Administratoren müssen neue Meldungen vor der Veröffentlichung zunächst bestätigen.
      document_upload: Zusätzliche Dokumente
      document_upload_description: Ermöglicht es den Nutzer:innen Dokumente den Vorschlägen anzuhängen
      external_video: Externes Video einbinden
      external_video_description: Ermöglicht es den Nutzer:innen externe Videos über YouTube und Vimeo einzubinden
      voice_assistant: Sprachassistent zur Erstellung von Mängeln aktivieren
      voice_assistant_description: Aktiviert einen KI-unterstützten Sprachassistenten, der die Nutzer beim Erstellen von Mangelmeldungen unterstützt
      send_feedback_form_link: Feedback-Formular
      send_feedback_form_link_description: Sendet einen Link zu einem Feedback-Formular an die Nutzer*innen, nachdem die Mängelmeldung abgeschlossen wurde
      show_create_report_button: Button zum Einreichen von Mangelmeldungen anzeigen
      show_create_report_button_description: Zeigt einen Button zum Einreichen von Mängelmeldungen in der Seitenleiste der Mängelübersichtsseite an

  site_customization/image:
    header_image: "Hintergrundbild für Desktop"
    header_image_description: "Dieses Bild wird im oberen Bereich der Startseite auf Desktop-Geräten angezeigt. Bitte verwenden Sie ein hochauflösendes Querformat-Bild. Es sollte thematisch zum Beteiligungsprojekt passen.<br>Benötigtes Format: 1920 × 760 Pixel."
    mobile_header_image: "Hintergrundbild für Mobile"
    mobile_header_image_description: "Dieses Bild wird auf Mobilgeräten im oberen Bereich der Startseite angezeigt. Für eine optimale Darstellung bitte ein zentriert gestaltetes Bild verwenden. Empfohlenes Format: ??? Pixel."









