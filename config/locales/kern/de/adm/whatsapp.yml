          settings: "Einstellungen"
        feature_title: "WhatsApp-Bot"
        feature_intro: "Bürger:innen können ihre WhatsApp-Nummer mit ihrem Konto verbinden, per Chat Vorschläge einreichen und Benachrichtigungen zu neuen Projekten erhalten."
