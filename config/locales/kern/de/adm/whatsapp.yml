      show:
        title: WhatsApp
        hint_text: >-
          Allgemeiner Einstieg in den WhatsApp-Bot. Über diesen QR-Code können Bürger:innen ihre Nummer
          verbinden und Benachrichtigungen zu neuen Projekten abonnieren. Zum Einreichen von Vorschlägen
          brauchen sie den QR-Code eines Projekts oder einer Phase.
        unavailable_title: WhatsApp ist für dieses Portal nicht eingerichtet
        unavailable_body: >-
          Die Anbindung an den WhatsApp-Dienst muss serverseitig hinterlegt werden. Wende dich an
          die Administration von Demokratie Today, um die Funktion einrichten und freischalten zu
          lassen.
        explanation_title: Was der WhatsApp-Bot leistet
        explanation_intro: >-
          Der Bot verbindet das Beteiligungsportal mit WhatsApp: Bürger:innen erreichen die Beteiligung
          dort, wo sie ohnehin schreiben – ohne Konto-Anmeldung im Browser.
        explanation_items:
        - title: Nummer mit dem Konto verbinden
          body: >-
            Über einen QR-Code oder Direktlink startet der Chat mit dem Portal. Die Nummer wird dem
            Nutzerkonto zugeordnet und kann jederzeit wieder getrennt werden.
        - title: Vorschläge per Chat einreichen
          body: >-
            In Phasen mit KI-Einreichung schreiben oder sprechen Bürger:innen ihren Vorschlag. Sprachnachrichten
            werden automatisch in Text umgewandelt, der Bot fragt Fehlendes nach und legt den Vorschlag
            im Projekt an.
        - title: Benachrichtigungen zu neuen Projekten
          body: >-
            Wer zustimmt, erhält bei neuen Beteiligungsprojekten eine kurze Nachricht mit Link. Versendet
            wird über eine von Meta freigegebene Nachrichtenvorlage.
        - title: QR-Codes für Plakate und Aushänge
          body: >-
            Für das Portal insgesamt, für einzelne Projekte und für einzelne Phasen stehen QR-Codes
            zum Ausdrucken bereit – ideal für Aushänge vor Ort.
        explanation_outro: >-
          Für den Betrieb wird ein Geschäftskonto beim Anbieter 360dialog benötigt; die Zugangsdaten
          werden serverseitig hinterlegt. Danach erscheinen hier die Einstellungen, der QR-Code, die
          Webhook-Prüfung und der Nachrichtentest.
        tabs:
          connection: Verbindung
          settings: Einstellungen
          templates: Bot-Nachrichtenvorlagen
          qr_code: QR-Code
          reach: Reichweite
          dialogs: Dialoge
          test_message: Testnachricht
        feature_title: WhatsApp-Bot
        feature_intro: >-
          Nach der Aktivierung können Bürger:innen ihre WhatsApp-Nummer mit ihrem Konto verbinden
          – genauso, wie sie sich auch auf der Website anmelden würden. Von dort aus können sie per
          Chat-Nachricht einen neuen Vorschlag oder einen Kommentar einreichen, ganz ohne den Browser
          zu öffnen. Außerdem erhalten sie eine kurze WhatsApp-Nachricht mit direktem Link, sobald
          ein neues Beteiligungsprojekt startet, damit sie sofort mitmachen können.
        settings_title: Einstellungen
        settings_intro: Vorlage, Sprachmodell und Aufbewahrung für den WhatsApp-Bot. Änderungen wirken
          sofort.
        auto_broadcast_title: Automatische Projekt-Benachrichtigung
        auto_broadcast_intro: >-
          Ist dies aktiv, versendet die Plattform die WhatsApp-Benachrichtigung von selbst, sobald
          ein Projekt veröffentlicht wird – also aktiviert ist und eine veröffentlichte Projektseite
          hat. Projekte, die auf einzelne Stadtteile beschränkt sind, werden dabei übersprungen; für
          diese steht die Schaltfläche auf der Projektseite weiterhin zur Verfügung.
        auto_broadcast_missing_template_title: Automatischer Versand ohne Wirkung
        auto_broadcast_missing_template_body: >-
          Solange keine freigegebene Nachrichtenvorlage hinterlegt ist, wird auch bei aktivem Schalter
          nichts versendet. Vorlage oben unter „Name der WhatsApp-Nachrichtenvorlage“ eintragen oder
          im Reiter „Vorlagen“ einreichen.
        template_missing_title: Keine Nachrichtenvorlage hinterlegt
