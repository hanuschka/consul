        entry_title: "Chat-Einstieg"
        entry_intro: >-
          Wer einen QR-Code scannt, landet in einem leeren Chat mit einer vorbereiteten Nachricht,
          die noch abgeschickt werden muss. Diese Einstellungen setzen dort stattdessen antippbare
          Optionen und eine Begrüßung ein, sodass der erste Schritt ein Tippen ist.
        entry_apply: "An WhatsApp übertragen"
        entry_apply_hint: >-
          Die Vorschläge und Befehle liegen bei WhatsApp, nicht auf dieser Plattform. Änderungen
          oben erreichen Bürger:innen erst, wenn du sie hier überträgst.
