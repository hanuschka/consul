          no_eligible_phases_title: "Derzeit keine Phase für WhatsApp-Einreichungen"
          no_eligible_phases_body: >-
            Es läuft keine Vorschlagsphase mit aktivierter KI-Einreichung. Wer diesen QR-Code
            scannt, kann seine Nummer verbinden, aber keinen Vorschlag einreichen.
