        notification_templates_title: Push-Benachrichtigungen
        notification_templates_intro: >-
          Die drei Nachrichten, die die Plattform von selbst verschickt: zweimal rund um das Ende
          einer Vorschlagsphase und einmal, wenn sich beim eigenen Vorschlag etwas tut. Jede braucht
          eine eigene freigegebene Vorlage, eingereicht auf %{language} mit dem Wortlaut unten.
          Solange eine Vorlage hier nicht eingereicht und aktiviert ist, erreicht diese
