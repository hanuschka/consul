de:
  components:
    adm:
      masterportal_collections_list_component:
        title: "Importierte Datensätze"
        description: "Hier verwalten Sie die Datensätze, die bereits aus dem Masterportal in diese Phase importiert wurden – anders als beim Import oben, mit dem Sie ganz neue Datensätze hinzufügen. „Daten abgleichen“ prüft nur, ob sich die Quelle seit dem letzten Import geändert hat (neue oder entfernte Pins), und nimmt selbst keine Änderungen vor. Pro Datensatz stehen zwei Aktionen bereit: „Neue importieren, alte bereinigen“ importiert neue und geänderte Pins und entfernt anschließend Pins – samt der daraus erstellten Vorschläge/Einreichungen –, die es in der Quelle nicht mehr gibt, sodass der Datensatz exakt der Quelle entspricht. „Löschen“ entfernt den gesamten Datensatz mit allen Pins und erstellten Einträgen aus dieser Phase."
        resync: "Daten erneut prüfen"
        resync_tooltip_title: "Daten erneut prüfen"
        resync_tooltip_text: "Prüft für jeden Datensatz die Masterportal-Quelle auf neue oder entfernte Pins seit dem letzten Import. Reine Prüfung – es werden keine Änderungen vorgenommen; nutzen Sie dafür die Aktionen weiter unten."
        update_all: "Alle aktualisieren"
        update_all_tooltip_title: "Alle aktualisieren"
        update_all_tooltip_text: "Importiert alle Datensätze erneut aus dem Masterportal: fügt neue Pins hinzu und übernimmt Änderungen an bestehenden. Bereits erstellte Vorschläge/Einreichungen bleiben unangetastet – diese Aktion fügt nur hinzu und aktualisiert, sie entfernt nichts."
        update_all_confirm: "Alle Datensätze erneut aus dem Masterportal importieren?"
        clean_all: "Alle bereinigen"
        clean_all_tooltip_title: "Alle bereinigen"
        clean_all_tooltip_text: "Entfernt für alle Datensätze Pins – samt der daraus erstellten Vorschläge/Einreichungen –, die in der Masterportal-Quelle nicht mehr vorhanden sind, sodass jeder Datensatz wieder exakt seiner Quelle entspricht. Dies kann nicht rückgängig gemacht werden."
        clean_all_confirm: "Für alle Datensätze die Pins entfernen, die nicht mehr in der Masterportal-Quelle vorhanden sind (inkl. der daraus erstellten Vorschläge/Einreichungen)? Dies kann nicht rückgängig gemacht werden."
