de:
  components:
    adm:
      masterportal_collections_list_component:
        title: "Importierte Datensätze"
        description: "Hier verwalten Sie die Datensätze, die bereits aus dem Masterportal in diese Phase importiert wurden – anders als beim Import oben, mit dem Sie ganz neue Datensätze hinzufügen. „Daten abgleichen“ prüft nur, ob sich die Quelle seit dem letzten Import geändert hat (neue oder entfernte Pins), und nimmt selbst keine Änderungen vor. Pro Datensatz stehen drei Aktionen bereit: „Neue importieren“ importiert neue und geänderte Pins aus der Quelle (vorhandene Einträge bleiben erhalten). „Neue importieren, alte bereinigen“ importiert neue und geänderte Pins und entfernt anschließend Pins – samt der daraus erstellten Vorschläge/Einreichungen –, die es in der Quelle nicht mehr gibt, sodass der Datensatz exakt der Quelle entspricht. „Löschen“ entfernt den gesamten Datensatz mit allen Pins und erstellten Einträgen aus dieser Phase."
        resync: "Daten abgleichen"
        resync_tooltip: "Prüft für alle Datensätze die Masterportal-Quelle auf neue und entfernte Pins"
        update_all: "Alle aktualisieren"
        update_all_tooltip: "Importiert alle Datensätze erneut aus dem Masterportal und übernimmt Änderungen"
        update_all_confirm: "Alle Datensätze erneut aus dem Masterportal importieren?"
        clean_all: "Alle bereinigen"
        clean_all_tooltip: "Entfernt für alle Datensätze Pins (inkl. erstellter Vorschläge/Einreichungen), die nicht mehr in der Quelle vorhanden sind"
        clean_all_confirm: "Für alle Datensätze die Pins entfernen, die nicht mehr in der Masterportal-Quelle vorhanden sind (inkl. der daraus erstellten Vorschläge/Einreichungen)? Dies kann nicht rückgängig gemacht werden."
