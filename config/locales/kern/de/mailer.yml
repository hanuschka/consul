de:
  mailer:
    budget_investment_created:
      title: Bestätigung nach Einreichung
      description: 'Wird in der Budget-Phase „Investitionsvorschläge einreichen" (2. Phase) an den Autor gesendet, sobald sein Bürgervorschlag erfolgreich eingereicht wurde.'
      recipient: Der Nutzer, der den Bürgervorschlag eingereicht hat.
    budget_investment_feasible:
      title: Vorschlag als umsetzbar bewertet
      description: 'Wird in den Budget-Phasen „Bewertung der Umsetzbarkeit" (Phase 2 + 3) an den Autor gesendet, sobald eine Sachbearbeitung den Vorschlag als umsetzbar bewertet und die Bewertung als abgeschlossen markiert hat. Der Versand erfolgt nur einmalig — spätere Änderungen der Bewertung lösen keine erneute E-Mail aus.'
      recipient: Der Nutzer, der den Vorschlag eingereicht hat.
    budget_investment_unfeasible:
      title: Vorschlag als nicht umsetzbar bewertet
      description: 'Wird in den Budget-Phasen „Bewertung der Umsetzbarkeit" (Phase 2 + 3) an den Autor gesendet, sobald eine Sachbearbeitung den Vorschlag als nicht umsetzbar bewertet und die Bewertung als abgeschlossen markiert hat. Der Versand erfolgt nur einmalig — spätere Änderungen der Bewertung lösen keine erneute E-Mail aus.'
      recipient: Der Nutzer, der den Vorschlag eingereicht hat.
    budget_investment_selected:
      title: Vorschlag ausgewählt
      description: 'Wird in der Budget-Phase „Investitionsvorschläge begutachten" (5. Phase) an den Autor gesendet, sobald sein Vorschlag von einer Sachbearbeitung als ausgewählt markiert wurde — und damit für die Abstimmungsphase (7. Phase) qualifiziert ist.'
      recipient: Der Nutzer, der den Vorschlag eingereicht hat.
    budget_investment_unselected:
      title: Vorschlag nicht ausgewählt
      description: 'Wird in der Budget-Phase „Investitionsvorschläge begutachten" (5. Phase) an den Autor gesendet, sobald sein Vorschlag von einer Sachbearbeitung als nicht ausgewählt markiert wurde — und damit nicht in die Abstimmungsphase (7. Phase) übernommen wird.'
      recipient: Der Nutzer, der den Vorschlag eingereicht hat.
    budget_investment_preselected:
      title: Vorschlag vorausgewählt
      description: 'Wird beim Übergang in die Budget-Phase „Investitionsvorschläge begutachten" (5. Phase) an den Autor eines umsetzbaren Vorschlags gesendet, wenn sein Vorschlag auf Basis der in der „Unterstützungsphase" (4. Phase) abgegebenen Stimmen automatisch in die Vorauswahl aufgenommen wurde.'
      recipient: 'Der Nutzer, dessen Vorschlag (1) als umsetzbar markiert wurde und (2) aufgrund der in der „Unterstützungsphase" (4. Phase) abgegebenen Stimmen in die Vorauswahl aufgenommen wurde.'
    budget_investment_not_preselected:
      title: Vorschlag nicht vorausgewählt
      description: 'Wird beim Übergang in die Budget-Phase „Investitionsvorschläge begutachten" (5. Phase) an den Autor eines umsetzbaren Vorschlags gesendet, wenn sein Vorschlag auf Basis der in der „Unterstützungsphase" (4. Phase) abgegebenen Stimmen nicht in die Vorauswahl aufgenommen wurde.'
      recipient: 'Der Nutzer, dessen Vorschlag (1) als umsetzbar markiert wurde, aber (2) aufgrund der in der „Unterstützungsphase" (4. Phase) abgegebenen Stimmen nicht in die Vorauswahl aufgenommen wurde.'
    proposal_created:
      title: Bestätigung nach Einreichung
      description: Wird an den Autor gesendet, wenn ein Vorschlag erfolgreich eingereicht wurde.
      recipient: Der Nutzer, der den Vorschlag eingereicht hat.
    proposal_official_answer:
      title: Offizielle Antwort zum Vorschlag
      description: 'Wird an den Autor gesendet, sobald zu seinem Vorschlag eine offizielle Antwort gespeichert oder geändert wird. Der Versand muss zusätzlich über die Einstellung „E-Mail-Benachrichtigung bei offizieller Antwort (Vorschläge)" auf dieser Seite aktiviert sein.'
      recipient: Der Nutzer, der den Vorschlag eingereicht hat.
    formular_answer_created:
      title: Bestätigung nach Formulareinsendung
      description: Wird an eingeloggte Nutzer gesendet, wenn sie ein Formular erfolgreich ausgefüllt und abgesendet haben.
      recipient: Der eingeloggte Nutzer, der das Formular abgesendet hat (an die im Konto hinterlegte E-Mail-Adresse).
    comment:
      title: Neuer Kommentar
      description: Wird an den Autor gesendet, wenn jemand einen Kommentar zu seinem Beitrag geschrieben hat.
    reply:
      title: Neue Antwort auf Kommentar
      description: Wird an den Kommentarautor gesendet, wenn jemand auf seinen Kommentar geantwortet hat.
    direct_message_for_receiver:
      title: Neue Direktnachricht
      description: Wird an den Empfänger gesendet, wenn eine persönliche Nachricht eingegangen ist.
    resource_hidden:
      title: Beitrag herausmoderiert
      description: Wird an den Autor gesendet, wenn sein Beitrag von einem Moderator herausmoderiert wurde.
    already_confirmed:
      title: E-Mail bereits bestätigt
      description: Wird an den Nutzer gesendet, wenn eine bereits bestätigte E-Mail-Adresse erneut bestätigt werden soll.
    manual_verification_confirmation:
      title: Manuelle Verifizierung bestätigt
      description: Wird an den Nutzer gesendet, wenn seine manuelle Verifizierung erfolgreich abgeschlossen wurde.
    newsletter_subscription_for_existing_user:
      title: Newsletter-Anmeldung
      description: Wird an registrierte Nutzer gesendet, wenn sie sich für den Newsletter anmelden.
    user_invite:
      title: Einladung zur Plattform
      description: Wird an eingeladene Personen gesendet, um sie zur Registrierung auf der Plattform einzuladen.
    pending_role_invite:
      title: Rolleneinladung
      description: Wird an eingeladene Personen gesendet, wenn ihnen eine Rolle auf der Plattform zugewiesen wurde.
    csv_download_ready:
      title: CSV-Download bereit
      description: Wird an den Nutzer gesendet, wenn der angeforderte CSV-Download bereitsteht.
    file_ready:
      title: Datei bereit
      description: Wird an den Nutzer gesendet, wenn eine angeforderte Datei zum Download bereitsteht.
    individual_group_value_users_added:
      title: Gruppenzuordnung
      description: Wird an den Nutzer gesendet, wenn er einer Gruppe zugeordnet wurde.
    existing_stamp_notify_existing_user:
      title: Hinweis auf doppelte Registrierung
      description: Wird an den bereits registrierten Nutzer gesendet, wenn jemand versucht, sich mit denselben Identitätsdaten zu registrieren.
    existing_stamp_notify_new_user:
      title: Registrierung nicht möglich
      description: Wird an die Person gesendet, wenn eine Registrierung aufgrund bereits vorhandener Identitätsdaten abgelehnt wurde.
    user_verification_failed:
      title: Verifizierung fehlgeschlagen
      description: Wird an den Nutzer gesendet, wenn die Identitätsprüfung fehlgeschlagen ist.
  notification_service_mailer:
    new_proposal:
      title: Benachrichtigung über neuen Vorschlag
      description: Wird an Abonnenten gesendet, wenn ein neuer Vorschlag eingereicht wurde.
      recipient: Alle Nutzer, die das Projekt abonniert haben.
    new_poll:
      title: Benachrichtigung über neue Abstimmung
      description: Wird an Abonnenten gesendet, wenn eine neue Abstimmung erstellt wurde.
      recipient: Alle Nutzer, die das Projekt abonniert haben.
    new_comment:
      title: Benachrichtigung über neuen Kommentar
      description: Wird an Abonnenten gesendet, wenn ein neuer Kommentar geschrieben wurde.
      recipient: Alle Nutzer, die das Projekt abonniert haben.
    projekt_questions:
      title: Benachrichtigung über neue Kurzumfrage
      description: Wird an Abonnenten gesendet, wenn eine neue Kurzumfrage erstellt wurde.
      recipient: Alle Nutzer, die das Projekt abonniert haben.
    projekt_arguments:
      title: Benachrichtigung über neue Stimme
      description: Wird an Abonnenten gesendet, wenn eine neue Stimme erstellt wurde.
      recipient: Alle Nutzer, die das Projekt abonniert haben.
    new_projekt_notification:
      title: Benachrichtigung über neue Projektmitteilung
      description: Wird an Abonnenten gesendet, wenn eine neue Projektmitteilung veröffentlicht wurde.
      recipient: Alle Nutzer, die das Projekt abonniert haben.
    new_projekt_event:
      title: Benachrichtigung über neue Veranstaltung
      description: Wird an Abonnenten gesendet, wenn eine neue Veranstaltung erstellt wurde.
      recipient: Alle Nutzer, die das Projekt abonniert haben.
    new_projekt_milestone:
      title: Benachrichtigung über neuen Meilenstein
      description: Wird an Abonnenten gesendet, wenn ein neuer Meilenstein veröffentlicht wurde.
      recipient: Alle Nutzer, die das Projekt abonniert haben.
    new_projekt_livestream:
      title: Benachrichtigung über neuen Livestream
      description: Wird an Abonnenten gesendet, wenn ein neuer Livestream erstellt wurde.
      recipient: Alle Nutzer, die das Projekt abonniert haben.
    new_budget_investment:
      title: Benachrichtigung über neuen Bürgervorschlag
      description: 'Wird in der Budget-Phase „Investitionsvorschläge einreichen" (2. Phase) an Abonnenten gesendet, sobald ein neuer Bürgervorschlag eingereicht wurde.'
      recipient: Alle Nutzer, die das Projekt abonniert haben.
    user_reverification_failed:
      title: Re-Verifizierung fehlgeschlagen
      description: Wird an den Nutzer gesendet, wenn die erneute Identitätsprüfung fehlgeschlagen ist.
      recipient: Der betroffene Nutzer.
    user_reverification_succeeded:
      title: Re-Verifizierung erfolgreich
      description: Wird an den Nutzer gesendet, wenn die erneute Identitätsprüfung erfolgreich war.
      recipient: Der betroffene Nutzer.
    new_deficiency_report:
      title: Neue Mangelmeldung (intern)
      description: Wird bei jeder neu eingereichten Mangelmeldung an Administratoren (sofern sie diese Benachrichtigung aktiviert haben) sowie an die Mängelmelder-Verantwortlichen gesendet.
      recipient: Administratoren und Mängelmelder-Verantwortliche.
    new_comments_for_deficiency_report:
      title: Neue Kommentare zu einer Mangelmeldung
      description: "Wird an den zuständigen Sachbearbeiter gesendet, wenn neue Kommentare zu einer Mangelmeldung eingehen. Voraussetzung: Der Sachbearbeiter hat die Benachrichtigung bei der jeweiligen Mangelmeldung aktiviert."
      recipient: Der zuständige Sachbearbeiter der Mangelmeldung.
    overdue_deficiency_reports:
      title: Überfällige Mangelmeldungen
      description: Automatische Erinnerung an den zuständigen Sachbearbeiter, wenn eine zugewiesene Mangelmeldung nicht innerhalb der für ihren Status festgelegten Frist bearbeitet wurde.
      recipient: Der zuständige Sachbearbeiter der Mangelmeldungen.
    not_assigned_deficiency_reports:
      title: Nicht zugewiesene Mangelmeldungen
      description: Automatische Erinnerung an Administratoren und Mängelmelder-Verantwortliche, wenn Mangelmeldungen über einen längeren Zeitraum keinem Sachbearbeiter zugewiesen wurden.
      recipient: Administratoren.
  deficiency_report_mailer:
    notify_author_about_status_change:
      title: Statusänderung einer Mangelmeldung
      description: Wird an den Verfasser gesendet, sobald ein Administrator oder Sachbearbeiter den Status seiner Mangelmeldung ändert.
      recipient: Der Nutzer, der die Mangelmeldung eingereicht hat.
    notify_officer:
      title: Mangelmeldung einem Sachbearbeiter zugewiesen
      description: Wird an einen Sachbearbeiter gesendet, sobald ihm eine Mangelmeldung zugewiesen wird – automatisch bei der Einreichung oder durch manuelle (Neu-)Zuweisung im Backend.
      recipient: Der zuständige Sachbearbeiter.
    notify_default_officer_group_email:
      title: Mangelmeldung an Sachbearbeitergruppe zugewiesen
      description: "Wird an die Sammeladresse einer Sachbearbeitergruppe gesendet, wenn eine Mangelmeldung der Gruppe statt einem einzelnen Sachbearbeiter zugewiesen wird. Voraussetzung: Für die Gruppe ist eine Standard-E-Mail-Adresse hinterlegt."
      recipient: Die Standard-E-Mail-Adresse der Sachbearbeitergruppe.
    notify_author_about_submission:
      title: Eingangsbestätigung einer Mangelmeldung
      description: Wird als Eingangsbestätigung an den Verfasser gesendet, sobald er eine neue Mangelmeldung erfolgreich eingereicht hat.
      recipient: Der Nutzer, der die Mangelmeldung eingereicht hat.
    send_feedback_form_link:
      title: Feedback-Anfrage zur Mangelmeldung
      description: "Wird etwa 24 Stunden nach Abschluss einer Mangelmeldung (Statuswechsel in einen archivierenden Status) an den Verfasser gesendet und bittet um Feedback. Voraussetzung: Die Feedback-Funktion ist in den %{settings_link} aktiviert."
      recipient: Der Nutzer, der die Mangelmeldung eingereicht hat.
