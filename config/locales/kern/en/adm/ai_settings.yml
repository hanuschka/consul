en:
  adm:
    ai_settings:
      flash:
        updated: AI setting updated successfully
        custom_model_required: >
          Please set a custom model. When an API endpoint is set, the AI will not work without a custom model.
      warnings:
        feature_disabled:
          title: AI feature not enabled
          body: >
            The AI feature is not enabled for this platform. The settings configured here have no effect until the feature is activated. Contact info@demokratie.today to enable the AI feature.
        custom_model_required:
          title: Custom model required
          body: >
            An API endpoint is set but no custom model. The AI will not work until you set a custom model.
          inline: >
            Required because an API endpoint is set. The AI will not work until you set a custom model.
        model_required:
          inline: >
            Required because a provider other than the default is selected. Please choose a model for this provider.
        api_key_required:
          title: API key required
          body: >
            No custom API key is stored. The default API key from demokratie.today does not work with a custom API endpoint or a provider other than the default. Please store your own API key.
          inline: >
            Required because a custom API endpoint or a provider other than the default is used. Please store your own API key.
      resolved_profile:
        title: Active configuration
        intro: >
          How the settings below currently resolve. These values apply immediately to every AI feature on the platform.
        provider: Provider
        endpoint: API endpoint
        endpoint_direct: Directly at the provider
        transport: Interface
        transports:
          responses: OpenAI Responses
          ruby_llm: Chat Completions
        reasoning: Reasoning effort
        reasoning_unset: Not sent
        model_missing: Not configured
        table_caption: Model per tier
        columns:
          tier: Tier
          used_for: Used for
          model: Model
          tools: Function calls
        tiers:
          default:
            name: Standard
            used_for: Evaluations, drafted text and content blocks
          fast:
            name: Fast
            used_for: WhatsApp assistant and short answers
          ultrafast:
            name: Ultra fast
            used_for: Similarity checks on contributions
        tools_supported: Supported
        tools_unsupported: Not supported
        one_model_note: >
          All three tiers run on the same model because a custom provider, endpoint or model is configured. Without those, the platform would pick between three models depending on the task.
      index:
        title: AI settings
        default_model_info:
          title: Default model in use
          body_html: >
            No model is configured for the selected AI provider. The default model %{model} is used automatically.
        default_api_key_info: >
          No custom API key is stored. The default API key from demokratie.today is used.
        intro: >
          Here you configure the connection to an AI provider. The platform uses AI features for, among other things, proposal generation, vote analysis, automatic content generation, and semantic analysis. Choose a provider and a model, and enter your API key to enable these features. Caution: changes to these settings require technical knowledge. Incorrect configurations can cause AI features to stop working correctly. When in doubt, contact demokratie.today.
        setting_name: Setting
        value: Value
        update: Update
        no_settings: No AI settings available
        enter_api_key: Enter API key here
