        feedback_form:
          title: Feedback form
          created_at: Created on
          for_report: For
      subcategories:
        index:
          title: Subcategories
          title_for_category: "Subcategories of \"%{category}\""
          page_hint: "Manage the subcategories of this category, e.g. \"Potholes\" under \"Construction & traffic\". Each subcategory can carry its own default responsibility, which takes precedence over the main category's when new reports are assigned. Drag and drop to set the order of the select list. Categories without subcategories show no selection in the report form."
          new_subcategory: New subcategory
          no_items_title: No subcategories available
          no_items_description: Create a subcategory to break reports within this category down further.
          table:
            name: Name
            default_responsible: Default responsibility
        new:
          title: New subcategory
        create:
          success: Subcategory was created successfully.
        edit:
          title: Edit subcategory
        update:
          success: Subcategory was updated successfully.
        destroy:
          success: Subcategory was deleted successfully.
          cannot_destroy: Subcategory cannot be deleted because reports are still assigned to it.
        form:
          name_label: Name
          name_hint: The name of the subcategory as shown in the report form and the report overview, e.g. "Potholes", "Street lighting" or "Illegal dumping". Choose names citizens understand without prior knowledge.
          ai_hint_label: AI categorization hint
          ai_hint_hint: "This hint goes to the AI categorization only and is never shown to citizens. In one or two sentences, mark the boundary against the other subcategories of the same category — that is where most misclassifications happen. Example: “Holes, cracks and subsidence in the road surface. Not: loose manhole covers, those belong to Sewers and drainage.” Without a hint the AI decides from the name alone."
          ai_hint_placeholder: "e.g. Holes, cracks and subsidence in the road surface. Not: loose manhole covers (Sewers and drainage)."
          default_responsible_label: Default responsibility
          default_responsible_hint: The officer group or person reports in this subcategory are assigned to automatically. It takes precedence over the main category's default, but only applies when the report's district carries no responsibility of its own. Without a value the main category's responsibility applies.
          officer_groups: Officer groups
          officers: Officers
          no_responsible: No responsibility
          submit: Save
      categories:
        index:
          title: Categories
          page_hint: "Here you manage the categories for the deficiency reporter. Categories assign reports to thematic areas, e.g. road damage or lighting. Each category can have its own color, icon, and default officer. Use drag & drop to adjust the order. Categories with assigned reports cannot be deleted."
          new_category: New category
          no_categories: No categories available
          no_items_title: No categories available
          no_items_description: Create a new category to classify reports.
          table:
            name: Name
            color: Color
            icon: Icon
            default_responsible: Default officer
            subcategories: Subcategories
            warning_text: Popup
            actions: Actions
          subcategories_link:
            one: 1 subcategory
            other: "%{count} subcategories"
            zero: None
          manage_subcategories: Manage subcategories
        new:
          title: New category
        create:
          success: Category created successfully.
        edit:
          title: Edit category
        update:
          success: Category updated successfully.
        destroy:
          success: Category deleted successfully.
          cannot_destroy: Category cannot be deleted because it still contains deficiency reports.
        form:
          name_label: Name
          name_hint: The category name is shown on the frontend as a selectable option when creating a report and serves as thematic assignment. Choose a short, commonly understood term like road damage, lighting, or green spaces. The name also appears in the administration overview and in statistics as a filter.
          ai_hint_label: AI categorization hint
          ai_hint_hint: "This hint goes to the AI categorization only and is never shown to citizens. In one or two sentences, describe which reports belong in this category — and above all which do not. Drawing the boundary against similar categories is what improves accuracy most. Example: “Damage to roads, pavements and cycle paths. Not: broken street lamps, those belong to Lighting.” Without a hint the AI decides from the name alone."
          ai_hint_placeholder: "e.g. Damage to roads, pavements and cycle paths. Not: street lamps (Lighting), traffic signs (Signage)."
          color_label: Color
          color_hint: The color is used as a visual marker of the category in the list view and on the map. It helps citizens and officers distinguish reports of different categories at a glance. Choose high-contrast colors that stand out clearly from one another to keep the list view readable.
          icon_label: Icon
          icon_hint: The icon is shown next to the category name in the report overview and on the map. It provides visual support to make the category quickly recognizable. Choose an icon that reflects the theme, e.g. a lightbulb for lighting or a tree for green spaces.
          default_responsible_label: Default officer
          default_responsible_hint: The default officer is automatically assigned as the responsible party when a new report is submitted in this category. This speeds up processing since no manual assignment is needed. If no default officer is set, the default officer of the respective area is used.
          officer_groups: Officer groups
          officers: Officers
          no_responsible: "-- No officer --"
          ai_fallback_label: AI categorization fallback
          ai_fallback_hint: Reports land in this category when AI categorization is enabled but cannot make a confident match, or the AI service is unreachable. Case workers then correct the category manually. Only one category can be the fallback at a time; the marker moves automatically as soon as you mark another one. Without a marker the first category in the order is used.
          warning_text_label: Popup
          warning_text_hint: The popup text is shown to citizens as a notice when they select this category while creating a new report. Use this field to convey important information or warnings, e.g. notes about alternative reporting channels or special responsibilities. The popup appears directly after category selection.
          submit: Save
      statuses:
        index:
          title: Statuses
          page_hint: "Here you manage the status values for the deficiency reporter. Each status has a title, a color, and an optional icon. You can define whether a status automatically archives reports and after how many days a reminder is sent to the officer. Use drag & drop to set the order of the status values."
          new_status: New status
          no_statuses: No statuses available
          no_items_title: No statuses available
          no_items_description: Create a new status to represent the processing progress of reports.
          table:
            title: Title
            icon: Icon
            color: Color
            reminder_delay: Reminder (days)
            archive_reports: Archive
        new:
          title: New status
        create:
          success: Status created successfully.
        edit:
          title: Edit status
        update:
          success: Status updated successfully.
        destroy:
          success: Status deleted successfully.
          cannot_destroy: Status cannot be deleted because it still contains deficiency reports.
        form:
          title_label: Title
          title_hint: The status title is used in the report overview and on the detail page as the status indicator. It should clearly describe the processing state, e.g. "In progress", "Done", or "Rejected". Citizens see this title on the public page, so it should be commonly understandable.
          description_label: Explanation
          description_hint: A short explanation of what this status means. It is shown to citizens as a tooltip in the report overview when they point at the status indicator. Describe in plain language what the processing state means for the report, e.g. "Your report has been received and is currently being reviewed." If left empty, no tooltip is shown.
          color_label: Color
          color_hint: The color is used as a visual marker of the status in lists and on the detail page of the report. It helps distinguish different processing states at a glance. Choose high-contrast colors that stand out clearly from one another to keep the list view readable.
          icon_label: Icon
          icon_hint: The icon is shown next to the status name in the report overview and on the detail page. It provides visual support to make the processing state quickly recognizable. Choose an icon that reflects the status, e.g. a checkmark for completed or a clock for ongoing items.
          reminder_delay_label: Reminder (days)
          reminder_delay_hint: Enter the number of days after which an automatic reminder is sent to the responsible officer if the report remains in this status. A value of 0 disables the reminder. This setting helps track forgotten or stalled reports in time.
          archive_reports_label: Archive
          archive_reports_hint: When this option is enabled, reports are automatically archived as soon as they're moved to this status. Archived reports no longer appear in the active list view but remain stored in the system and can be viewed via the archive view. Typical for end statuses like "Done" or "Rejected".
          notice_text_label: Email notification text
          notice_text_hint: This text is sent as the content of the email notification to the report creator when the report transitions to this status. Phrase the text in a citizen-friendly and informative way so the reporter can understand the current state of their report. Leave the field empty to send no notification.
          submit: Save
      intake_channels:
        index:
          title: Intake channels
          page_hint: "Manage the channels through which reports reach the administration — e.g. phone, email or in person. The channel marked as default is assigned automatically to every report citizens submit themselves via the platform. Drag and drop to set the order of the select list."
          new_intake_channel: New intake channel
          no_items_title: No intake channels available
          no_items_description: Create an intake channel to record how reports came in.
          table:
            name: Name
            default: Default
        new:
          title: New intake channel
        create:
          success: Intake channel was created successfully.
        edit:
          title: Edit intake channel
        update:
          success: Intake channel was updated successfully.
        destroy:
          success: Intake channel was deleted successfully.
          cannot_destroy: Intake channel cannot be deleted because reports are still assigned to it.
        form:
          name_label: Name
          name_hint: The name of the intake channel as shown to case workers in the select field, e.g. "Phone", "Email", "In person" or "Letter". Choose short, unambiguous names so the route a report took is recognizable at a glance.
          default_label: Default channel
          default_hint: The default channel is assigned automatically to every report citizens submit themselves via the platform — usually "Platform". Only one channel can be the default at a time; the marker moves automatically as soon as you mark another channel as default.
          submit: Save
      officers:
        index:
          title: Officers
          page_hint: "Here you manage the officers for the deficiency reporter. Officers can edit submitted reports, update the status, and write official responses. Use the search field to find registered users and assign them the officer role. Only already-registered users can be added as officers."
          search_label: Search users
          search_description: Search by email or username for registered users listed under <a href="/adm/users" target="_blank">Users</a>. Only already-registered users can be added as officers for the deficiency reporter. Officers process submitted reports, communicate with citizens, and update the processing status.
          no_officers: No officers available
          no_items_title: No officers available
          no_items_description: Search for a user and assign the officer role.
          table:
            name: Name
            email: Email
            manage_all: Manage all
        officer:
          add: Add
        search:
          table:
            name: Name
            email: Email
        user_not_found:
          user_not_found: User not found
      districts:
        index:
          title: Areas
          page_hint: "Here you see the areas taken over from registered addresses. A default officer or officer group can be assigned to each area. When a new report is submitted without a category-specific officer, the default officer of the respective area automatically takes responsibility."
          no_districts: No areas available
          no_items_title: No areas available
          no_items_description: Areas are taken over from registered addresses and shown here.
          table:
            default_responsible: Default officer
        edit:
          title: Edit district
          default_responsible_label: Default officer
          default_responsible_hint: Set the default officer or officer group automatically responsible for new reports in this area. When a report is created without a category, or with a category that has no own officer, this default value is used. This ensures every report has an assignment.
          officer_groups: Officer groups
          officers: Officers
          no_responsible: "-- No officer --"
          submit: Save
        update:
          success: District updated successfully.
      official_answer_templates:
        index:
          title: Response templates
          page_hint: "Here you manage response templates for official responses to deficiency reports. Templates speed up answering recurring inquiries by letting officers choose from predefined text blocks when writing a response. The text can be customized before sending."
          new_template: New response template
          no_templates: No response templates available
          no_items_title: No response templates available
          no_items_description: Create a new response template to write frequently used responses faster.
          table:
            title: Title
            text: Text
        new:
          title: New response template
        create:
          success: Response template created successfully.
        edit:
          title: Edit response template
        update:
          success: Response template updated successfully.
        form:
          title_label: Title
          title_hint: The title of the response template serves as an internal label and is shown in the selection list when an officer writes an official response to a report. Choose a meaningful title that briefly describes the content of the template, e.g. "Standard response road damage" or "Feedback green space".
          title_placeholder: e.g. Standard response road damage
          text_label: Text
          text_hint: The text of the response template is inserted as default content into the response field when an officer selects this template. The text can be customized before sending. Phrase the text in a citizen-friendly and factual way, since it appears publicly on the report as the administration's official response.
          text_placeholder: Your response template...
          submit: Save
      officer_groups:
        index:
          title: Officer groups
          page_hint: "Here you manage officer groups for the deficiency reporter. Groups bundle multiple officers and can be assigned to categories or areas as responsible parties. Each group has a default email address for notifications. Reports are then automatically routed to the right team."
          new_officer_group: New officer group
          no_officer_groups: No officer groups available
          no_items_title: No officer groups available
          no_items_description: Create a new officer group to organize officers.
          table:
            name: Name
            officers: Officers
            default_email: Default email
        new:
          title: New officer group
        create:
          success: Officer group created successfully.
        edit:
          title: Edit officer group
        update:
          success: Officer group updated successfully.
        destroy:
          success: Officer group deleted successfully.
        form:
          name_label: Name
          name_hint: The name of the officer group is shown in selection lists when reports are assigned to a responsible processor. Choose a unique and descriptive name, e.g. "Public works office" or "Green space maintenance". The name is visible only internally and is not shown on the public side of the report.
          name_placeholder: e.g. Public works office
          default_email_label: Default email
          default_email_hint: The default email address is used for all notifications sent to this officer group, e.g. for new reports or status changes. Ideally use a functional address like roads@city.com so notifications are delivered independently of individual people.
          default_email_placeholder: e.g. roads@city.com
          officers_label: Officers
          officers_hint: Select the officers who should be members of this group. All selected people can process reports assigned to this group. Group membership influences which reports appear in the officer's personal overview and which notifications they receive.
          no_officers_title: No officers available
          no_officers_description: First create officers under "Officers" before you can assign them to a group.
          submit: Save
      settings:
        title: Configuration
        tabs:
          features: Features
          dashboard: Dashboard settings
          contact_persons: Contact persons
          naming: Naming
          confirmation_popup: Confirmation popup
        dashboard:
