      ai_settings:
        show:
          title: AI voice assistant
          page_hint: "Here you configure the AI assistant for the deficiency reporter. The AI automatically analyzes incoming reports based on the defined questions and criteria. Adjust the questions, evaluation criteria, and closing remarks to tailor the automatic analysis to your needs. Empty fields use the default values."
          questions: Questions
          questions_hint: Define the questions here that the AI assistant should take into account when analyzing incoming reports. These questions control what information is extracted from the report and evaluated. Leave the field empty to use the default questions shown in the placeholder. Multiple questions can be listed one per line.
          criteria: Criteria
          criteria_hint: Set the evaluation criteria the AI assistant uses to categorize and prioritize reports. The criteria determine how the AI assesses the urgency and relevance of a report. Leave the field empty to use the default criteria shown in the placeholder. Clear and precise criteria improve the quality of the analysis.
          parting_words: Closing remarks
          parting_words_hint: The closing remarks are appended by the AI assistant at the end of each automatic analysis. Use this field to provide additional notes or context information that guides the AI when summarizing. Leave the field empty to use the default phrasings shown in the placeholder.
          update_button: Save
          not_connected: AI app is not connected
          not_connected_description: To use this feature, the AI app must first be enabled by demokratie.today. Please contact your demokratie.today representative.
