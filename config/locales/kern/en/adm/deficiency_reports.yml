            on_behalf_of_email: e.g. jane.doe@example.com
            intake_channel: Please select
            subcategory: No subcategory
          labels:
            title: Title
            description: Description
            image: Image
            documents: Documents
            video_url: Video URL
            category: Category
            map_location: Map location
            on_behalf_of: On behalf of
            on_behalf_of_company_name: Company
            on_behalf_of_email: Email address
            intake_channel: Intake channel
            subcategory: Subcategory
          hints:
            title: The title of the entry is shown in the list view and as the heading on the detail page. It should briefly and precisely describe the reported deficiency so officers and citizens can grasp the content at a glance. Changes to the title become visible on the public page immediately.
            description: The description contains all relevant details about the reported deficiency, such as its exact state, possible causes, and impact. This text is displayed publicly on the detail page of the entry. A precise description makes it easier for officers to assess the issue and significantly speeds up processing.
            image: The image visually documents the reported deficiency and is shown on the public detail page of the entry. A meaningful photo helps officers assess the deficiency faster and prioritize processing. Common image formats like JPG and PNG are supported.
            documents: Here you can add supplementary documents like expert reports, plans, or reports to the entry. The files are made available for download on the detail page and are visible to all users. Multiple documents can be uploaded at once to document the matter comprehensively.
            video_url: Enter the URL of a video documenting the reported deficiency. The video is embedded on the public detail page of the entry. Links from common video platforms like YouTube or Vimeo are supported. A video can illustrate the matter better than photos alone.
            on_behalf_of: Enter the name of the person on whose behalf the entry was created. This field is used when an officer or administrator records an entry on behalf of a citizen. The name is shown on the detail page and helps with attribution of the entry.
            on_behalf_of_company_name: Optional. The company or organisation the person is reporting for. It is stored on the profile of the linked account, not on the report itself, and is only saved when the account has no company on file yet.
            on_behalf_of_email: Optional. If you enter an email address, the report is assigned to the account behind it. If no account exists for the address, one is created and receives a confirmation email (double opt-in). An existing account is only linked and receives no confirmation email. Leave empty to keep the report attributed to yourself.
            category: The category assigns the entry to a specific thematic area, e.g. road damage, lighting, or green spaces. It influences automatic assignment to responsible officers and is shown as a colored filter in the list view. Correct assignment speeds up processing.
            intake_channel: The route by which the report reached the administration, e.g. phone, email, or in person. It is mandatory as soon as you file a report on behalf of a third person. Reports citizens submit themselves via the platform automatically receive the configured default channel.
            subcategory: The subcategory breaks the report down further within the chosen category, e.g. "Potholes" under "Construction & traffic". Only subcategories of the category selected above are offered; categories without subcategories show no select at all. If the subcategory carries its own default responsibility, the report is assigned there automatically.
        administer:
          title: Administer
          status: Status
          status_hint: The status shows the current processing state of the report and is visibly displayed on the public detail page. A status change can automatically trigger an email notification to the creator. Certain statuses can also automatically archive the report, depending on the configuration of the status values.
          responsible: Officer
          responsible_hint: Assign a responsible officer or officer group to this report. The assigned officer receives email notifications on changes and can edit the report directly. For group entries, the group's default email is used for notifications.
          no_status: No status
          no_statuses_title: No status values available
          no_statuses_description: First create status values under "Statuses" to be able to assign a processing state to reports.
          officers: Officers
          officer_groups: Officer groups
          no_responsible: "-- No officer --"
          no_officers_title: No officers available
          no_officers_description: First create officers under "Officers" to be able to assign reports.
