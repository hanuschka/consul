en:
  adm:
    features:
      show:
        title: Features
        intro_text: "Global features that don't yet have a dedicated area in the new admin UI. Changes take effect immediately across the entire platform."
        oauth_logins_title: "External login providers"
        oauth_logins_intro: "Each provider adds a button to the sign-in and registration pages. A provider only works once its credentials are configured on the server."
        kobil_title: "KOBIL authentication"
        kobil_credentials_incomplete_title: "KOBIL credentials incomplete"
        kobil_credentials_incomplete_body: "Until all required values are present in config/secrets.yml, signing in via KOBIL will fail — even when the feature below is enabled."
        whatsapp_title: "WhatsApp bot"
        whatsapp_intro: "Citizens can link their WhatsApp number to their account, submit proposals by chat and receive notifications about new projects. The bot only answers when this feature is enabled AND the credentials are configured."
        whatsapp_credentials_incomplete_title: "WhatsApp credentials incomplete"
        whatsapp_credentials_incomplete_body: "Still missing under \"whatsapp\" in config/secrets.yml: %{keys}. Until then the webhook answers 404, even when the feature below is enabled."
        whatsapp_template_missing_title: "No message template configured"
        whatsapp_template_missing_body: "Without an approved 360dialog template no project notifications can be sent. Enter the template name below under \"whatsapp.broadcast_template\"."
