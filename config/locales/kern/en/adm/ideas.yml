          title: Edit idea
          submit: Save
          show_image: Show image
          hide_image: Hide image
          no_category: "-- No category --"
          district_placeholder: "-- Select district --"
          labels:
            title: Title
            title_hint: The title of the idea is shown on the overview page and in the detail view. It should be concise and meaningful so citizens can grasp the content at a glance. Changes to the title become visible on the platform immediately and are reflected in search results.
            description: Description
            description_hint: The description contains all details about the idea and is shown in the detail view. Use text formatting to structure the content clearly. A well-structured description helps citizens better understand the proposal and make an informed decision when voting.
            image: Image
            image_hint: The cover image is shown in the overview and in the detail view of the idea. It serves as a visual hook and draws attention to the submission. Landscape images with a minimum width of 800 pixels are recommended. Supported formats are JPG, PNG, and WebP. Oversized files are compressed automatically.
            documents: Documents
            documents_hint: You can upload supplementary documents for the idea here, such as expert reports, plans, or statements. The files are offered for download in the detail view of the idea. Supported formats are PDF, DOC, DOCX, XLS, XLSX, CSV, and other common file types. Multiple documents can be added at once.
            video_url: Video URL
            video_url_hint: Add a video URL from YouTube or Vimeo to embed an explanatory video in the detail view of the idea. The video is automatically rendered as a player and gives citizens an additional way to understand the proposal visually. Other video platforms are not supported.
            category: Category
            category_hint: The category assigns the idea to a thematic area and enables filtering in the overview. Each category has its own color and an optional icon for visual differentiation. If no category fits, the selection can be left empty. The assignment can be changed later at any time.
            map_location: Map location
            on_behalf_of: On behalf of
            on_behalf_of_hint: This field indicates whether the idea was submitted on behalf of another person or organization. The entered name is displayed publicly in the detail view of the idea. Leave the field empty if the idea was submitted directly by the logged-in user without representation.
