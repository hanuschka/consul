          title: Ideas
          page_hint: "Here you see all submitted ideas. The table shows title, visibility, category, officer, and status of each idea. Use the column headers to sort the list. Click on an idea to view details, assign an officer, write an official response, or edit the idea."
          no_ideas: No ideas available
          no_items_title: No ideas available
          no_items_description: Ideas will be shown here as soon as they are submitted.
