          intro: "Configure the welcome text, notice messages and contact persons that appear on the public ideas platform dashboard."
      categories:
        index:
          title: Categories
          page_hint: "Here you manage categories for ideas. Categories assign ideas to thematic areas and enable filtering in the overview. Each category can have its own color, an icon, and a default officer. Use drag & drop to adjust the order. Categories with assigned ideas cannot be deleted."
          new_category: New category
          no_categories: No categories available
          no_items_title: No categories available
          no_items_description: Create a new category to classify ideas.
