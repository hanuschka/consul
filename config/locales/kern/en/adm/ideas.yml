      officers:
        index:
          title: Officers
          page_hint: "Here you manage the officers for ideas. Officers can edit submitted ideas, assess their feasibility, and write official responses. Use the search field to find registered users and assign them the officer role. Officers can be assigned to categories and areas as default responsible users."
          search_label: Search users
          search_description: Search by email or username for registered users listed under <a href="/adm/users" target="_blank">Users</a>. Only already-registered users can be added as officers for ideas. Officers administer submitted ideas, assess their feasibility, and communicate with submitters.
          no_officers: No officers available
          no_items_title: No officers available
          no_items_description: Search for a user and assign the officer role.
