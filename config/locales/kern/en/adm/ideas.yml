        administer:
          title: Administer
          votes_needed_for_success: Votes required
          votes_needed_for_success_hint: Define how many votes an idea must reach to be considered successful. Once the specified vote count is reached, the idea is marked as successful and can be forwarded for further processing. A value of zero means no minimum vote count is required.
          timeframe: Timeframe (days)
          timeframe_hint: The timeframe determines how many days the idea stays open for voting from the date of publication. After the period ends, no further votes are accepted and the idea's status is updated automatically. A value of zero means no time limit is set for voting.
          officer: Officer
          officer_hint: The officer is the person responsible for processing and responding to this idea. They receive notifications about new comments and status changes and can write an official response. If no officer is assigned, the default officer of the respective category or area applies.
