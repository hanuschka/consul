en:
  adm:
    individual_groups:
      index:
        title: User groups
        intro_title: About user groups
        intro_text_p1: >
          With user groups you can divide users into custom segments that go beyond the standard
          distinction by verification status. User groups act on two levels: at the project level
          they control visibility — only members of the assigned group see the project. At the
          participation-phase level they control participation — only group members can actively
          participate in the phase.
        intro_text_p2: >
          Groups of type "Strong" explicitly exclude users not assigned from visibility and
          participation. Groups of type "Weak" serve as a softer filter without hard exclusions.
          User groups are especially suitable for internal administration projects where access
          should be restricted to a defined group of people — e.g. for employee participation or
          department-specific votes.
        new_individual_group: Create new group
        empty_title: No user groups available
        empty_description: Create a new group to divide users into custom segments.
        table:
          name: Group name
          kind: Group type
          visible: Visibility
          actions: Actions
          edit: Edit
          delete: Delete
          "yes": "Yes"
          "no": "No"
          delete_confirm: Are you sure you want to delete this group?
          kinds:
            hard: Strong
            soft: Weak
      show:
        new_value: Create new value
        table:
          name: Name
          actions: Actions
          edit: Edit
          delete: Delete
          delete_confirm: Are you sure you want to delete this value?
      new:
        title: Create new user group
      edit:
        title: Edit user group
      create:
        success: Group successfully created.
      update:
        success: Group successfully updated.
      destroy:
        success: Group successfully deleted.
      form:
        submit: Save
        kinds:
          hard: Strong
          soft: Weak
        hints:
          name: >
            Enter a meaningful name for the user group, e.g. "Urban Planning Department"
            or "Building Office Staff". This name is shown to administrators when assigning
            projects and participation phases. Choose a label that clearly identifies the
            group of people and allows quick assignment.
          kind: >
            Choose the type of group. Groups of type "Strong" explicitly exclude all users
            who are not members from visibility and participation. Groups of type "Weak"
            serve as a softer recommendation without hard exclusions — non-members can still
            access projects and participation phases.
          visible: >
            Controls whether this user group is visible in the user interface. Disable this
            option if the group should be used only for internal visibility and participation
            control, without users seeing their group membership themselves.
