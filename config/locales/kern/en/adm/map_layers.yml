        hints:
          name: Label of the map layer as shown to users on the frontend.
          protocol: "Type of data source: a WMS service, a tile map (XYZ), or an uploaded GeoJSON file."
          provider: URL of the external map source used to include the layer.
          attribution: "Text shown as source or license notice at the bottom right of the map (e.g. '© Leaflet' or 'Data: OpenStreetMap'). This is often mandatory and should comply with the provider's terms of use."
          layer_names: Technical name of the map layer according to the WMS service's Capabilities file. Multiple layers can be specified comma-separated without spaces. This name is not the same as the label shown to users in the map menu.
          presentation: Configure how this map layer is shown when the map loads. You can set it as base map, show it by default, or mark it as transparent.
          opacity: Marks this map layer as transparent. Underlying base maps or additional layers remain visible when both are displayed at the same time.
          geojson_file: "GeoJSON file with the geometries to display (max. 20 MB). The file is fetched and rendered in the browser when the layer is enabled."
          label_property: Name of the GeoJSON property used as a label (e.g. BEZ_GEM).
          popup_properties: Comma-separated list of properties shown in the popup when a feature is clicked.
          choropleth: Colors the features automatically based on a numeric data field and shows a legend. Overrides the uniform fill color.
          choropleth_property: Name of the numeric GeoJSON data field used for coloring (e.g. "HTTP Downl").
          breaks: Comma-separated, ascending break values (e.g. 10,30,50,100).
          colors: Comma-separated hex colors. There must be exactly one more color than breaks.
          no_data_color: Hex color for features without a valid value.
