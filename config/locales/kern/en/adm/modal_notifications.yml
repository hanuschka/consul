en:
  adm:
    modal_notifications:
      index:
        title: Modal notifications
        intro_text_p1: >
          Modal notifications are shown to users as a modal dialog when visiting the platform.
          They're suitable for important notices, e.g. maintenance announcements, new participation
          opportunities, or time-limited information.
        intro_text_p2: >
          Use the period (Active from/to) to control when the notification is visible.
          Each user sees a modal notification only once per session.
        empty_title: "No modal notifications available"
        empty_description: "Create a new modal notification to alert users to important content."
        new_modal_notification: New modal notification
        table:
          actions: Actions
          edit: Edit
          delete: Delete
          delete_confirm: Are you sure you want to delete this modal notification?
      new:
        title: Create modal notification
      edit:
        title: Edit modal notification
      create:
        success: Modal notification successfully created.
      update:
        success: Modal notification successfully updated.
      destroy:
        success: Modal notification successfully deleted.
      form:
        submit: Save
        hints:
          active_from: "From this date, the modal notification is shown to users when they visit the platform. Leave the field empty if the notification should be visible immediately after creation. The date can be changed later at any time."
          active_to: "From this date, the modal notification is no longer shown. Leave the field empty for the notification to remain visible permanently. Expired notifications are kept in the overview and can be reactivated if needed."
          title: "The title is shown as the heading in the modal dialog. Choose a short, meaningful text that captures the topic of the notification. The title is the first thing users read and should encourage them to read on."
          html_content: "The content is shown below the title in the modal dialog. Use the editor to format text, insert links, or add images. Keep the text as short and action-oriented as possible, since modal dialogs offer little space on mobile devices."
