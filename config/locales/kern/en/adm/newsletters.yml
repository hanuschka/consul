        title: Newsletters
        empty_title: "No newsletters available"
        empty_description: "Create a new newsletter to inform users about current projects."
        intro_text_p1: >
          Here you manage all newsletters for your platform. Newsletters are sent to defined recipient
          groups and inform users about new projects, participation opportunities, or other news.
          Before creating a newsletter, you first need to define the desired target groups under
          "Recipient groups" — these are then available for selection in the newsletter form.
        intro_text_p2: >
          Use the other tabs to manage unregistered subscribers and adjust newsletter settings
          (e.g. sender address and brand color).
