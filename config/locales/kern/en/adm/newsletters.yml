          recipient_group: "Choose the recipient group this newsletter should be sent to. Recipient groups define which users receive the newsletter — e.g. all registered users, subscribers of specific projects, or manually compiled groups. You can create and manage new recipient groups under the tab of the same name."
          respect_newsletter_optout: "When enabled, only users who activated \"Newsletter and system emails\" in their account receive the newsletter. Disable this option only if all recipients of the group should be reached regardless of their newsletter setting."
