en:
  adm:
    projekts:
      phases:
        mitmachbox_survey:
          title: Survey
          hint_text: >
            Create and manage the survey that runs on the Mitmachbox devices.
            Changes are made on a draft and only reach the devices once published.
          unconfigured_title: Mitmachbox not configured
          unconfigured_text: The connection to the Mitmachbox platform is not set up on this instance. Please contact your administrator.
          missing_title: No survey created yet
          missing_text: No survey has been created on the Mitmachbox platform for this phase yet.
          lost_title: Survey no longer exists
          lost_text: The linked survey no longer exists on the Mitmachbox platform. You can create a new survey.
          create_survey_button: Create survey now
          recreate_survey_button: Create new survey
          survey_section_title: Survey
          survey_scope_pill: Takes effect immediately on all devices and the online survey
          status_row_title: Survey status
          status_row_text: Controls whether the survey is currently accepting responses. The status applies to all Mitmachbox devices and to the online survey on the project page at once. Close the survey when collection should end; the responses collected so far are kept.
          status_badges:
            open: "Open: accepting responses"
            closed: "Closed: not accepting responses"
            draft: Not opened yet
            archived: "Archived: not accepting responses"
          open_button: Open survey
          close_button: Close survey
          reopen_button: Reopen
          archive_button: Archive survey
          open_confirm: The survey will be opened for data collection on all devices and in the online survey.
          close_confirm: Data collection will stop on all devices and in the online survey. Responses collected so far are kept. You can reopen the survey later.
          reopen_confirm: The survey will accept responses again, on all devices and in the online survey. The current version applies.
          archive_confirm: The survey will be ended and hidden from active lists. It cannot be reopened in the administration.
          open_requires_published_hint: The survey can only be opened once a version has been published.
          responses_total: "Total responses: %{count}"
          current_section_title: Current version (version %{number})
          current_scope_pill: What participants see right now
          current_row_title: Questions in the current version
          current_row_text: Participants currently see these questions on the devices and online. A published version can no longer be edited. Create a draft to change questions.
          current_questions_toggle:
            one: "Show %{count} question"
            other: "Show %{count} questions"
          new_draft_button: Create new draft
          new_draft_confirm: The current version will be copied into an editable draft. Devices and the online survey keep showing the current version until you publish the draft.
          test_run_button: Test run
          draft_section_title: Draft (version %{number})
          draft_scope_pill: Not visible to participants
          draft_row_title: Edit questions
          draft_row_text: Prepare changes to the questions here. Devices and the online survey keep showing the current version until you publish the draft. Check the draft with a test run first.
          add_question_button: Add question
          max_questions_hint: This version has reached the maximum of 20 questions – the Mitmachbox cannot load more.
          publish_row_title: Publish draft
          publish_row_text: Replaces the current version on all devices and in the online survey with this draft, even while the survey is open. The version can no longer be edited afterwards.
          publish_button: Publish draft
          publish_confirm_replace: Version %{draft} replaces the current version %{current} on all devices and in the online survey.
          publish_confirm_first: Version %{draft} will run on all devices and in the online survey as soon as the survey is opened.
          publish_confirm_while_open: The survey is open, so the switch happens during data collection.
          publish_confirm_locked: Version %{draft} can no longer be edited afterwards.
          no_questions: No questions yet.
          no_published_version: No version published yet.
          end_section_title: End survey
          end_scope_pill: Cannot be undone
          archive_row_title: Archive survey
          archive_row_text: Ends the survey and hides it from active lists. An archived survey cannot be reopened in the administration. Only archive once participation has finished and been evaluated.
          table:
            order: Order
            prompt: Question
            question_type: Question type
            required: Required
            options: Options
            actions: Actions
            condition_summary: "Only if: %{question} = %{options}"
            condition_options_connector: " or "
          move_up: Move up
          move_down: Move down
          edit: Edit
          delete: Delete
          delete_confirm: Really delete this question?
        mitmachbox_test_run:
          title: Test run
          hint: Click through the survey the way a respondent at the Mitmachbox would. Your answers are not saved.
          version_draft: "Draft (version %{number})"
          version_current: "Published version %{number}"
          step: "Question %{current} of %{total}"
          step_open: "Question %{current}"
          next: Next
          required: Please choose an answer.
          finished: Thank you for taking part!
          restart: Start again
          no_questions: This version has no questions yet.
        mitmachbox_deployments:
          title: Devices
          hint_text: >
            See the Mitmachbox devices assigned to your municipality and control
            during which period this phase's survey runs on them.
          assignments_title: Available devices
          assignments_empty: No devices are currently assigned to your municipality.
          deployments_title: Deployments of this survey
          deployments_empty: This survey is currently not running on any device.
          assignment_table:
            serial: Serial number
            device_status: Device status
            last_synced_at: Last synced
            window: Loan period
            status: Status
            actions: Actions
          deployment_table:
            device: Device
            location: Location
            status: Status
            actions: Actions
          deploy_button: Assign to this survey
          showing_this_survey: Already showing this survey
          showing_other_survey: "Currently showing: %{title}"
          adjust_button: Edit location
          end_button: End now
          end_confirm: The deployment will be ended immediately. Collected responses are retained. Continue?
          open_ended: open-ended
          never_synced: never
          statuses:
            scheduled: Scheduled
            active: Active
            ended: Ended
        mitmachbox_results:
          title: Results
          latency_hint: Results are transferred from the devices in batches and may appear with a delay of up to one day.
          responses_total: Total responses
          version_label: Published version %{number}
          published_at_label: published on %{date}
          answered_label:
            one: "%{count} participant answered this question"
            other: "%{count} participants answered this question"
          reached_label:
            one: "%{count} run reached this question"
            other: "%{count} runs reached this question"
          count_label: Count
          option_label: Option
          source_device_label: Mitmachbox
          source_web_label: Online
          export_button: Download as CSV
          empty_title: No results yet
          empty_text: No version has been published yet or no responses have been received.
      mitmachbox:
        go_to_survey_tab: Go to survey
        survey:
          created: The survey has been created.
          state_changed: "The survey status has been changed: %{state}."
          draft_created: A new draft has been created.
          published: The draft has been published.
          states:
            draft: Draft
            open: Open
            closed: Closed
            archived: Archived
        questions:
          created: The question has been added.
          updated: The question has been updated.
          destroyed: The question has been deleted.
          prompt_label: Question text
          prompt_hint: Shown on the Mitmachbox display. Keep the question short and easy to understand.
          question_type_label: Question type
          question_type_hint: "Determines how people answer on the device: one answer, several answers, or a rating on a scale."
          question_types:
            single_choice: Single choice
            multiple_choice: Multiple choice
            rating: Rating scale
          required_label: Required question
          required_hint: Required questions must be answered on the device before the next question is shown.
          required_checkbox_label: Answer required
          save_button: Save
          options_title: Options
          options_hint: A maximum of 5 options – the Mitmachbox has 5 selection buttons.
          add_option_button: Add option
          no_options: No options yet.
          condition_title: Display condition
          condition_hint: The question is only shown if one of the ticked answers was chosen for the selected question. Questions in between are shown as usual. Only earlier single-choice questions can be selected.
          condition_question_label: Depends on question
          condition_none: No condition
          condition_source_option: "Question %{number}: %{prompt}"
          condition_options_legend: "Answers to “%{prompt}”"
          condition_unavailable: A display condition needs an earlier single-choice question with options.
        options:
          created: The option has been added.
          updated: The option has been updated.
          destroyed: The option has been deleted.
          label_label: Label
          label_hint: Shown on the device next to the selection button.
          value_label: Score
          value_hint: Only relevant for rating scales, e.g. 1 to 5.
          follow_up_label: Follow-up question
          follow_up_hint: Sets which question comes after this answer. Without a selection the run continues with the next question. A follow-up must lie further back in the order.
          follow_up_next: Next question in the order
          follow_up_end: End the survey
          follow_up_last_question: This question is last in the order, so there is no follow-up to choose.
          save_button: Save
          delete_confirm: Really delete this option?
          table:
            label: Label
            value: Score
            follow_up: Follow-up question
            actions: Actions
        deployments:
          created: The survey is being deployed to the device.
          updated: The location has been updated.
          ended: The deployment has been ended.
          assignment_label: Device
          assignment_hint: Choose from the Mitmachbox devices assigned to your municipality, shown with their loan period.
          location_label: Location
          location_hint: Optional. Where does the box stand during this survey, e.g. "town hall entrance"?
          save_button: Save
          replace_warning: >
            Attention: Assigning replaces any other survey currently running on this device.
            Its assignment will be ended automatically.
        errors:
          connection: The Mitmachbox platform is currently unreachable. Please try again later.
          auth: Authentication with the Mitmachbox platform failed. Please check the configured credentials.
          forbidden: Access was denied by the Mitmachbox platform. Please check the configuration.
          not_found: The requested record was not found on the Mitmachbox platform.
          conflict: "This action is currently not possible: %{message}"
          validation: "The input was not accepted by the Mitmachbox platform: %{message}"
          generic: An error occurred while communicating with the Mitmachbox platform.
          no_draft: There is no editable draft. Create a new draft first.
          branch_order: "This order cannot be saved: a follow-up question must come after the question that branches to it."
          condition_order: "This order cannot be saved: a question with a display condition must come after the question it depends on."
          condition_dependency: "This is not possible because another question's display condition depends on it. Remove or change that condition first."
          stale_order: "The order was not saved because the question list has changed in the meantime. Please reorder the questions again."
          max_options_reached: A maximum of 5 options per question is possible – the Mitmachbox has 5 selection buttons.
          max_questions_reached: A maximum of 20 questions per version is possible – the Mitmachbox cannot load more.
          not_configured: The Mitmachbox integration is not configured on this instance.
      mitmachbox_questions:
        new:
          title: Add question
        edit:
          title: Edit question
      mitmachbox_options:
        new:
          title: Add option
        edit:
          title: Edit option
      mitmachbox_deployments:
        new:
          title: Assign device to this survey
        edit:
          title: Edit location
