en:
  adm:
    projekts:
      phases:
        index:
          intro_title: About participation phases
          intro_text_p1: "In the table below you manage the individual participation phases of a project. Each phase is assigned to its own tab in the project footer and can be individually shown or hidden. Three central toggles help control the behavior and visibility of phases:"
          intro_text_standard_title: Default
          intro_text_standard_description: Only one phase can be marked as the default at a time. This phase is automatically opened for incoming users and shown in the foreground when the project page is opened.
          intro_text_active_title: Active
          intro_text_active_description: When this toggle is enabled, the respective participation phase is technically active and directly accessible to users on the frontend.
          intro_text_visible_title: Visibility in the project
          intro_text_visible_description: Controls whether the phase is shown in the project footer (tab bar). When disabled, the phase remains technically active and can be accessed directly via a URL but is not advertised via a visible tab. This is useful for special formats like contests after a vote.
          intro_text_p2: The combination of these three settings enables flexible control of flow, visibility, and user guidance within a participation project.
          title: Participation phases
          new_phase: Create new phase
          table:
            phase_tab_name: Participation phases
            start_date: Start
            end_date: End
            restriction: Restriction
            default: Default
            active: Active
            visible: Visible
            actions: Actions
            delete: Delete
            confirm_delete: "Are you sure? This deletes the phase \"%{name}\" and all its content."
        new:
          title: Create new participation phase
          intro_title: Choose participation module
          intro_text: Choose a participation module to create a new phase for this project. Each module offers different functions for citizen participation.
          phase_type_label: Participation module
          phase_type_hint: Each participation module offers different functions — e.g. votes, proposals, polls, or events. Choose the module that best fits the goal of this participation phase. After creation, you can continue to configure the phase, e.g. with durations, restrictions, and display options.
          phases_overview_title: Overview of participation modules
          phases_overview:
            comment:
              name: Comments
              description: "Open discussion forum where users can post and reply to existing comments. Suitable for general exchange of opinions on a topic or project. Comments can be moderated and hidden. Ideal as a low-threshold entry into participation to capture moods and opinions."
            proposal:
              name: Proposals
              description: "Users can submit improvement proposals, which can be supported and commented on by other participants. Proposals can be located on a map and tagged with labels. Administrators can moderate proposals and track their status. Suitable for idea collection, citizen requests, and participatory planning processes."
            point_of_interest:
              name: Points of interest
              description: "Map-based participation phase in which users can mark locations on an interactive map and tag them with categories. Each entry can be described and commented on. Administrators define the categories and limit the number of pins per user. Suitable for deficiency reports or spatial surveys."
            question:
              name: Quick poll
              description: "Simple question-and-answer formats for quick feedback on concrete questions. Users choose from predefined answer options; results are shown in real time. Administrators can create multiple questions and configure the display. Ideal for opinion polls, mood snapshots, or prioritizing topics."
            voting:
              name: Vote
              description: "Structured votes with various question types like single and multiple choice, rating scales, or yes/no decisions. Questions can be bundled into topic groups. Supports online and offline voting with separate capture. Suitable for binding decision processes and citizen votes."
            iframe:
              name: Iframe
              description: "Embed external content via an iframe directly into the project page. This seamlessly integrates interactive maps, external survey tools, 3D models, or third-party web apps. Configuration is limited to providing the URL. No further content is managed or stored within the platform."
            budget:
              name: Budget
              description: "Multi-stage participatory budget from submission through feasibility review to voting. Users submit proposals with cost estimates that are reviewed by the administration. In the voting phase, citizens decide how the budget is distributed. Supports offline voting and automatic winner determination."
            legislation:
              name: Text editing
              description: "Collaborative text work with versioning for jointly developing documents. Users can read drafts, comment on paragraphs, and submit change proposals. Administrators manage draft versions and map comments to passages. Suitable for statutes, guidelines, or regulations that are publicly discussed."
            formular:
              name: Form
              description: "Custom forms with configurable required and follow-up fields for structured input. Administrators design the form with various field types and can send follow-up emails. Responses can be reviewed and exported as CSV. Suitable for applications, submissions, or any kind of standardized data collection."
            event:
              name: Events
              description: "Announcement and management of dates like workshops, town hall meetings, or site visits. Each event contains date, time, location, and description. Participants can be notified by email about new dates. Ideal for integrating in-person formats into the digital participation process and communicating dates centrally."
            milestone:
              name: Milestones
              description: "Display of project progress via milestones and progress bars. Administrators define important stages with date and description as well as progress bars for visual display. Users see at a glance which steps are completed and what comes next. Creates transparency about the project timeline."
            projekt_notification:
              name: Notifications
              description: "Sending of announcements and messages to the users of a project. Administrators create notifications with title and content, which are shown in the project and optionally sent by email. Suitable for status updates, intermediate results, or date changes — wherever active information of participants is needed."
            livestream:
              name: Livestream
              description: "Embed live videos via YouTube or Vimeo directly into the project page. Users can follow the broadcast and submit questions via an integrated question feature. Participants can be notified in advance by email about the date. Suitable for broadcasting council sessions, town hall meetings, or information events."
            argument:
              name: Voices
              description: "Display of pro and contra arguments on a topic, e.g. from experts or interest groups. Each argument can be supplemented with an author image, name, and reasoning. Administrators assign arguments to the pro and contra sides. Suitable for the structured weighing of controversial topics and different perspectives."
            newsfeed:
              name: Newsfeed
              description: "Display of project news and status messages in chronological order. Works like a news feed, through which administrators can continuously report on developments and decisions. Suitable for longer-term projects in which participants should be regularly informed about the current status."
            mitmachbox:
              name: Mitmachbox
              description: "Offline participation via Mitmachbox devices: battery-powered survey terminals with e-paper displays placed in public locations. The survey is authored here, deployed to borrowed devices, and the responses collected on site are transferred in batches. Results can be viewed and exported by administrators. Suitable for including people without online access."
          select_phase_type: Please choose...
          create_phase: Create phase
        create:
          success: The participation phase was created successfully.
        update:
          success: The participation phase was updated successfully.
        destroy:
          success: The participation phase and all its content have been deleted.
        go_live:
          success: The poll is now live. All test data has been deleted.
        duration:
          title: Duration
          dates_label: Phase duration
          dates_description: Defines the period during which this participation phase is active. Within this period, users can participate in the phase. Outside the period, the phase is shown as completed or not yet started. The duration is configurable independently of the overall project duration.
        naming:
          title: Naming
          poll_image_label: Poll image
          poll_image_description: "Shown as a thumbnail next to the title in the polls overview to aid quick visual recognition. Use a landscape image with a clear subject that fits the topic of the poll. Recommended format: at least 600 pixels wide, JPG or PNG."
        restrictions:
          title: Participation restriction
          intro_title: About participation restrictions
          intro_text: |
            <p>Extended participation restrictions, such as restriction by geographic area or age group, are available only for registered and verified users. Guest user status does not allow such restrictions.</p>
            <p>To apply these extended restrictions, the corresponding data, such as place of residence or date of birth, must be available. This data can either be collected during registration or queried later during participation in the respective phase. Users who haven't yet provided the required data will be asked to provide it before participating. Only when the stored information matches the restriction criteria will participation be unlocked.</p>
          user_status_label: Participation by user status
          user_status_hint: "Defines the minimum verification status users must have to participate in this phase. There are three levels: guest users (without registration), registered users (with a platform account), and verified users (e.g. via registration-office comparison). Higher levels require corresponding proofs at registration."
          geozone_label: Area restriction for participation
          geozone_hint: "Restricts participation to users whose registered address lies in a specific geographic area. A CSV file with the relevant addresses must first be provided to demokratie.today. After import, the desired areas can be enabled here and the restriction assigned to this phase."
          age_label: Age restriction for participation
          age_hint: "Restricts participation to users whose age lies within a defined age group. Age groups are managed centrally by an administrator under Settings > Age groups and must be created there beforehand. Users without a stored date of birth will be asked to provide it before participating."
          individual_groups_label: Restriction to strong groups
          individual_groups_hint: "Restricts participation to members of specific user groups previously created under Settings > Strong groups — e.g. youth councils, administration staff, or project teams. Only users assigned to one of the selected groups can participate in this participation phase."
          extended_geozone_label: Extended area restriction
          extended_geozone_hint: "Enables finer area restriction based on registered address groupings such as electoral districts, quarters, or school districts. Unlike the simple area restriction, multiple groupings can be combined here. The available groupings are based on imported address data and enable precise control of participation eligibility."
          user_status:
            guest: Guests (no registration required)
            registered: Registered users
            verified: Verified users
          geozone:
            no_restriction: No restriction
            only_citizens: Citizens only
            only_geozones: Specific areas only
            only_streets: Specific streets only
            search_street: Search street...
          extended_geozone:
            no_restriction: No restriction
          age:
            no_restriction: No restriction
