          masterportal_import_success: Import completed successfully.
        masterportal_pins:
          title: Imported Masterportal pins
        officing_managers:
          title: Polling officers
          lock_on: Lock date
          lock_on_hint: From this date, no more offline votes can be cast.
          select_managers: Assign polling officers
          select_managers_hint: "Select the polling officers from the list who are authorized to record offline votes in this phase. Only selected officers can cast votes on behalf of citizens via the Officing module. The assignment can be changed at any time. Polling officers must first be created in the system by an administrator."
          no_managers_title: No polling officers available
          no_managers_description: No polling officers are registered in the system yet. Polling officers can be created by an administrator under "Settings". After registration, you can assign them to this phase here so they are authorized to record offline votes on behalf of citizens via the Officing module.
        poll_questions:
          title: Questions
          create_question: Create normal question
          create_bundle_question: Create question bundle
          download_individual_answers: Download individual answers
          test_mode:
            banner_title: Test mode
            banner_text: This poll is in test mode. You can freely edit answers and questions and cast test votes. All test votes will be permanently deleted when you go live.
            go_live: Publish poll
            go_live_confirm: Publish this poll? All test votes will be permanently deleted and the poll becomes publicly available. This cannot be undone.
          intro_text_p1: >
            Here you manage the questions of this voting phase. There are two question types:
          intro_question_types:
            normal:
              title: Normal question
              description: "A standalone question with its own answer options and a selectable voting mode such as single vote, multiple choice, or rating scale. Each question is shown to users on the frontend as an individual voting step. Normal questions are suitable for targeted single queries on concrete topics within a voting phase."
            bundle:
              title: Question bundle
              description: "Groups several thematically related sub-questions under a common heading. On the frontend the bundle is shown as a connected section. Each sub-question can have its own voting mode and answer options. Question bundles are suitable when a topic should be illuminated from multiple perspectives."
          bundle_intro_text_p1: >
            A question bundle groups several thematically related questions under a common
            heading. On the frontend the bundle is shown as a connected section,
            in which users answer the contained sub-questions one after another. Question bundles
            are especially suitable when a topic should be illuminated from multiple perspectives.
          bundle_intro_text_p2: >
            After creating the question bundle, you can add individual sub-questions via the
            detail view. Each sub-question can have its own question, answer options, and
            voting mode. The order of sub-questions within the bundle can be adjusted
            by drag & drop.
          intro_vote_types_title: Answer options at a glance
          intro_vote_types:
            unique:
              title: Single vote
              description: "Each user can choose exactly one answer per question. This is the simplest and most common voting form — ideal for clear yes/no decisions or choosing a preferred option from several alternatives. Results transparently show which option received the most support, enabling an unambiguous analysis."
            multiple:
              title: Multiple choice
              description: "Users can distribute their votes evenly across multiple answers. Suitable when participants may support several options at once. The maximum number of selectable answers is defined when creating the question. This mode is suitable when a broad mood snapshot is to be captured or multiple priorities are queried."
            multiple_with_weight:
              title: Weighted multiple choice
              description: "Users distribute a fixed vote budget across multiple answers, weighting them differently. Especially suitable for prioritization questions, e.g. in participatory budgets where funds should be distributed across different proposals. The result shows not only the popularity of an option but also its relative importance."
            rating_scale:
              title: Rating scale
              description: "Users rate each answer option on a scale (e.g. 1–5). Suitable for differentiated feedback, where not only a choice but a gradation of approval or disapproval is to be captured. The results show averages and distributions per option, enabling a differentiated analysis of opinions."
          intro_text_p2: >
            The order of questions in the table matches the display order on the frontend.
            Use the drag handles on the right to change the order.
          no_questions: No questions are assigned to this vote.
          no_questions_title: No questions available
          no_questions_description: Create individual questions or question bundles to shape the content of the vote. Each question is shown on the frontend as a standalone voting step. Various voting modes are available, including single vote, multiple choice, weighted selection, and rating scale.
          table:
            title: Questions
            type: Voting mode
            contextualized_by: "Contextualized by:"
            randomized_position: Randomized position
            bundle_question: Question bundle
            edit_answers: Answer list
            edit_questions: Question list
