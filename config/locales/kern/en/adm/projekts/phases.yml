        formular:
          title: Form fields
          hint_text_p1: >
            Here you configure the fields of the form shown to users on the frontend for input.
            There are two categories of fields:
          hint_types:
            primary:
              title: Primary fields
              description: "Are shown in the main form and captured at first submission. Typical examples are text fields for name or concern, selection fields for categories, or checkboxes for consent. Primary fields form the core of the form and are visible to all users. They cover the essential information needed for processing."
            follow_up:
              title: Follow-up fields
              description: "Are shown after the form is submitted in a second step. Suitable for supplementary information that doesn't apply to all users — e.g. contact details for follow-up questions or detailed descriptions. Follow-up fields enable stepwise capture without overloading the main form and unnecessarily raising the entry barrier."
          hint_text_p2: >
            The order of fields in the table matches the display order on the frontend.
            Use the drag handles to change the order. Via the field type you define
            whether a text, selection, file, or checkbox field is created.
