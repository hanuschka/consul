          no_follow_up_fields_title: No follow-up fields available
          no_follow_up_fields_description: Follow-up fields are shown in a second step after the main form is submitted and allow capturing additional information. Typical use cases are supplementary contact details, detailed descriptions, or follow-up questions that don't apply to all participants. Create new follow-up fields for the form here.
