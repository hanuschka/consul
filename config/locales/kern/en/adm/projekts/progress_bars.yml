        form:
          kind_label: Type
          kind_hint: "Defines whether this is the main progress bar (primary) or a supplementary bar (secondary). The primary bar is prominently displayed on the frontend and shows the overall progress. Secondary bars appear below it and can represent partial aspects of implementation."
