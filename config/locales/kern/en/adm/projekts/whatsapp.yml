en:
  adm:
    projekts:
      projekts:
        whatsapp_broadcast:
          label: WhatsApp notification
          description: >-
            Sends a WhatsApp template message about the project start to all citizens who linked
            their number and enabled notifications.
          send: Send WhatsApp notification
          confirm:
            one: The notification will be sent to 1 person. Continue?
            other: The notification will be sent to %{count} people. Continue?
          missing_template: >-
            No approved WhatsApp template is configured (setting "whatsapp.broadcast_template").
          not_configured: WhatsApp is not fully configured.
          not_published: >-
            This projekt is currently not published. It has to be activated and have a published
            projekt page before a notification can be sent.
          enqueued:
            one: The WhatsApp notification is being sent to 1 person.
            other: The WhatsApp notification is being sent to %{count} people.
