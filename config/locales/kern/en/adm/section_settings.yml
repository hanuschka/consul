      intro_text_defaults:
        projekts: "Here you manage all your participation projects in one central place. Create new projects, configure phases and settings, assign project managers, and keep a clear overview of ongoing, scheduled, and completed participation processes. The quick links above take you directly to the most important actions."
        deficiency_reports: "Here you manage incoming deficiency reports from citizens in one central place and keep track of all submitted cases. Assign reports to the right caseworkers, follow the processing status, document responses, and coordinate the timely resolution of reported issues across the municipality."
        ideas: "Here you manage all submitted citizen ideas of your platform in one central place. Review new submissions, assign proposals to the appropriate caseworkers, categorise topics, and follow the status of each idea from submission through expert review to implementation or official response."
        moderation: "Here you moderate all user-generated content on your platform from one central place. Review reported posts, comments, and user accounts, make decisions about visibility and bans, and ensure a respectful, constructive exchange. The overview helps you spot new reports quickly."
        valuation: "Here you assess the submitted participatory-budget proposals regarding their feasibility. Check the technical and legal viability, estimate costs and effort, document your assessment results in a comprehensible way, and prepare the proposals for further processing or the upcoming citizen vote on the budget."
        landing_pages: "Here you manage all topic pages of your platform from one central place. Create and edit standalone pages on focus topics such as youth participation or urban development, publish or hide content, and shape a clear information architecture with custom backgrounds and logos."
        officing: "As a polling official you record offline votes — for example from citizens who voted in person, by post, or by phone. You verify voting eligibility against the population register and document votes for budgets, proposals, and polls, including via bulk voting. The phases assigned to you appear on the home page."
