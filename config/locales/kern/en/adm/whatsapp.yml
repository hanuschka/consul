      show:
        title: WhatsApp
        hint_text: >-
          General entry point to the WhatsApp bot. This QR code lets citizens link their number and
          subscribe to notifications about new projects. Submitting a proposal requires a project
          or phase QR code.
        unavailable_title: WhatsApp is not set up for this portal
        unavailable_body: >-
          The connection to the WhatsApp service has to be configured on the server. Contact the Demokratie
          Today administrators to have the feature set up and enabled.
        explanation_title: What the WhatsApp bot does
        explanation_intro: >-
          The bot connects the participation platform to WhatsApp: citizens take part where they already
          write, without signing in through a browser.
        explanation_items:
        - title: Link a number to an account
          body: >-
            A QR code or direct link opens the chat with the platform. The number is tied to the user
            account and can be unlinked again at any time.
        - title: Submit proposals by chat
          body: >-
            In phases with AI submission enabled, citizens write or record their proposal. Voice messages
            are transcribed automatically, the bot asks for anything missing and creates the proposal
            in the project.
        - title: Notifications about new projects
          body: >-
            Anyone who opts in receives a short message with a link whenever a new participation project
            starts, sent through a Meta-approved message template.
        - title: QR codes for posters and notices
          body: >-
            Printable QR codes are available for the platform as a whole, for single projects and
            for single phases — made for on-site notices.
        explanation_outro: >-
          Running the bot requires a business account with the provider 360dialog; the credentials
          are configured on the server. Once they are in place, the settings, the QR code, the webhook
          check and the message test appear here.
