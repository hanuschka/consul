          one: "set but does not match (1 character)"
          other: "set but does not match (%{count} characters)"
        webhook_checked_at: "Last checked"
        webhook_auto_hint: "The webhook is registered automatically as soon as the WhatsApp bot above is switched on, using the host you are working on."
        test_title: "Test message"
        test_intro: "Sends a short message to a number. Free-text messages only reach people who wrote in the last 24 hours."
        test_phone_label: "Number"
        test_phone_hint: "Digits only, including country code, e.g. 49177XXXXXXX."
        test_submit: "Send test message"
        test_pending: "Sending message …"
        templates_title: "Bot message templates"
        templates_intro: "Project notifications need a Meta-approved template with exactly two placeholders: project name and project link."
        template_unknown_title: "Configured template does not exist at 360dialog"
        template_unknown_body: >-
          Configured is "%{name}" (%{language}), but no template exists there under that name and
          language. Project notifications would fail. Create the template below or pick an
          existing one.
        template_pending_title: "Template not approved yet"
        template_pending_body: >-
          "%{name}" has the status "%{status}" at Meta. Until it is approved, project
          notifications reach nobody.
