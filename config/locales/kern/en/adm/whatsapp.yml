          immediately.
        auto_broadcast_title: Automatic project notification
        auto_broadcast_intro: >-
          When this is on, the platform sends the WhatsApp notification by itself as soon as a projekt
          is published — that is, activated and backed by a published projekt page. Projekts restricted
          to individual districts are skipped; for those the button on the projekt page remains available.
