        qr_subline: "Opens a general Consul chat."
        webhook_title: "Webhook"
        webhook_ok_title: "Webhook registered correctly"
        webhook_ok_body: "360dialog delivers inbound messages to %{url} with a matching security header."
        webhook_mismatch_title: "Webhook does not match"
        webhook_mismatch_body: "Registered: %{registered}. Expected: %{expected}. Switch the feature off and on again to re-register it."
        webhook_unreachable_title: "Webhook status unavailable"
