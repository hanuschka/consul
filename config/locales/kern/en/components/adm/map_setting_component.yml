en:
  components:
    adm:
      map_setting_component:
        map_label: Set map view
        map_description: >
          The map view can be set by dragging the map with the mouse button held down.
          The mouse wheel adjusts the zoom.
          Use the icons on the right edge of the map to place pins, draw lines, and outline polygons.
          These are displayed in red on the frontend.
          Multiple elements can be drawn at once.
        geojson_import:
          title: Import areas from a GeoJSON file
          hint: Takes the areas from a GeoJSON file over as this phase's marked areas, for example a district or development plan area exported from your geoportal. The imported areas replace everything currently drawn on this map and are kept when you save.
          file_label: GeoJSON file
          messages:
            imported: Areas taken over. Check the map and save it.
            no_polygons: This file contains no area geometries.
            too_many: This file contains too many areas. Please choose a file with fewer areas.
            too_large: "This file is larger than %{size} MB."
            invalid_file: This file could not be read as GeoJSON.
            map_missing: The map is not ready yet. Please reload the page.
