en:
  components:
    adm:
      masterportal_collections_list_component:
        title: "Imported datasets"
        description: "Manage the datasets that have already been imported from Masterportal into this phase — unlike the import above, which brings in brand-new datasets. \"Resync data\" only checks whether the source has changed since the last import (new or removed pins); it makes no changes itself. Each dataset offers two actions: \"Import new and clean old\" imports new and changed pins and then removes pins — along with the proposals/investments created from them — that no longer exist in the source, so the dataset matches the source exactly. \"Delete\" removes the entire dataset with all its pins and created entries from this phase."
        resync: "Re-check data"
        resync_tooltip_title: "Re-check data"
        resync_tooltip_text: "Checks the Masterportal source of every dataset for new or removed pins since the last import. Read-only — it doesn't change anything itself; use the actions below to apply updates."
        update_all: "Update all"
        update_all_tooltip_title: "Update all"
        update_all_tooltip_text: "Re-imports every dataset from Masterportal: adds new pins and applies changes to existing ones. Existing proposals/investments are left untouched — this action only adds and updates, it never removes anything."
        update_all_confirm: "Re-import all datasets from Masterportal?"
        clean_all: "Clean up all"
        clean_all_tooltip_title: "Clean up all"
        clean_all_tooltip_text: "Removes pins — and the proposals/investments created from them — that no longer exist in the Masterportal source, for every dataset, so each one matches its source exactly. This cannot be undone."
        clean_all_confirm: "Remove pins that are no longer present in the Masterportal source — for every dataset — including the proposals/investments created from them? This cannot be undone."
