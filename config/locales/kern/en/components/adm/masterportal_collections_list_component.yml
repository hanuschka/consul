en:
  components:
    adm:
      masterportal_collections_list_component:
        title: "Imported datasets"
        description: "Manage the datasets that have already been imported from Masterportal into this phase — unlike the import above, which brings in brand-new datasets. \"Resync data\" only checks whether the source has changed since the last import (new or removed pins); it makes no changes itself. Each dataset offers three actions: \"Import new\" imports new and changed pins from the source (existing entries are kept). \"Import new and clean old\" imports new and changed pins and then removes pins — along with the proposals/investments created from them — that no longer exist in the source, so the dataset matches the source exactly. \"Delete\" removes the entire dataset with all its pins and created entries from this phase."
        resync: "Resync data"
        resync_tooltip: "Checks the Masterportal source of every dataset for new and removed pins"
        update_all: "Update all"
        update_all_tooltip: "Re-imports all datasets from Masterportal and applies any changes"
        update_all_confirm: "Re-import all datasets from Masterportal?"
        clean_all: "Clean up all"
        clean_all_tooltip: "Removes pins (and their created proposals/investments) that are no longer in the source, for every dataset"
        clean_all_confirm: "Remove pins that are no longer present in the Masterportal source — for every dataset — including the proposals/investments created from them? This cannot be undone."
