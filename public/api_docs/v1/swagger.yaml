  "/api/projekts/{projekt_id}/projekt_phases":
    parameters:
    - name: projekt_id
      in: path
      description: Projekt ID
      required: true
      schema:
        type: integer
    get:
      summary: List projekt phases for a projekt
      tags:
      - Projekt Phases
      security:
      - bearer_auth: []
      description: "Retrieve all phases defined for a specific projekt. Phases define
        different stages of participation (comments, proposals, voting, budgeting,
        etc.) with their own active/inactive periods, visibility settings, and restrictions.
        Returns full details including phase type, dates, and configuration. \n\n*Authorization:
        Available to both `admin` and `public_data` access levels.*"
      parameters:
      - name: page
        in: query
        description: Pagination page number (**default:** 1)
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: 'Number of items per page (**default:** 500, max: 2000)'
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: projekt phases found and returned (public_data sees only visible/active)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projekt_phases:
                        type: array
                        items:
                          "$ref": "#/components/schemas/ProjektPhase"
                    required:
                    - projekt_phases
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
                      per_page:
                        type: integer
                    required:
                    - current_page
                    - total_pages
                    - total_count
                    - per_page
                required:
                - data
                - pagination
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
    post:
      summary: Create a projekt phase
      tags:
      - Projekt Phases
      security:
      - bearer_auth: []
      description: "Create a new phase for a projekt. Phases are time-bounded periods
        that enable specific types of participation (comments, proposals, voting,
        etc.). Supports restrictions by geozone, age range, user status, and demographic
        groups. \n\n*Authorization: Requires `admin` access level. Requests with `public_data`
        access level will receive `403 Forbidden`.*"
      parameters: []
      responses:
        '201':
          description: projekt phase created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projekt_phase:
                        "$ref": "#/components/schemas/ProjektPhase"
                    required:
                    - projekt_phase
                required:
                - data
        '422':
          description: missing required type field
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
        '403':
          description: forbidden - insufficient access
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projekt_phase:
                  type: object
                  properties:
                    type:
                      type: string
                      example: ProjektPhase::CommentPhase
                      enum:
                      - ProjektPhase::CommentPhase
                      - ProjektPhase::ProposalPhase
                      - ProjektPhase::PointOfInterestPhase
                      - ProjektPhase::QuestionPhase
                      - ProjektPhase::VotingPhase
                      - ProjektPhase::IframePhase
                      - ProjektPhase::BudgetPhase
                      - ProjektPhase::LegislationPhase
                      - ProjektPhase::FormularPhase
                      - ProjektPhase::EventPhase
                      - ProjektPhase::MilestonePhase
                      - ProjektPhase::ProjektNotificationPhase
                      - ProjektPhase::LivestreamPhase
                      - ProjektPhase::ArgumentPhase
                      - ProjektPhase::NewsfeedPhase
                      - ProjektPhase::MitmachboxPhase
                      description: Phase type determining participation type. Required
                        for creation.
                    start_date:
                      type: string
                      format: date
                      nullable: true
                      description: Date when the phase becomes active (YYYY-MM-DD).
                        Must be before end_date if both provided.
                    end_date:
                      type: string
                      format: date
                      nullable: true
                      description: Date when the phase becomes inactive (YYYY-MM-DD).
                        Must be after start_date if both provided.
                    active:
                      type: boolean
                      description: Whether the phase is currently active and allowing
                        participation.
                    frontend_visibility:
                      type: boolean
                      description: Whether the phase is visible to users on the frontend
                        interface.
                    given_order:
                      type: integer
                      nullable: true
                      description: Display order of this phase. Lower numbers appear
                        first.
                    geozone_restricted:
                      type: boolean
                      description: Whether participation is restricted to specific
                        geographic zones.
                    age_range_id:
                      type: integer
                      nullable: true
                      description: ID of an age range restriction. If null, there
                        is no age restriction.
                    user_status:
                      type: string
                      nullable: true
                      description: 'Minimum user status required. Valid values: "guest",
                        "registered", "verified".'
                    lock_on:
                      type: string
                      format: date
                      nullable: true
                      description: Date after which the phase becomes locked and no
                        longer editable (YYYY-MM-DD).
                    phase_tab_name:
                      type: string
                      nullable: true
                      description: Display name shown in frontend navigation tabs
                        and phase listings.
                    registered_address_grouping_restriction:
                      type: boolean
                      nullable: true
                      description: Whether participation is restricted based on registered
                        address grouping.
                    registered_address_grouping_restrictions:
                      type: object
                      nullable: true
                      description: 'Restrictions by address grouping as key-value
                        pairs. Example: { "district": ["North", "South"] }.'
                      additionalProperties:
                        type: array
                        items:
                          type: string
                    individual_group_value_ids:
                      type: array
                      items:
                        type: integer
                      description: Array of demographic group IDs allowed to participate.
                    geozone_restriction_ids:
                      type: array
                      items:
                        type: integer
                      description: Array of geographic zone IDs where participation
                        is allowed. Requires geozone_restricted to be true.
                    settings_attributes:
                      type: array
                      description: Configuration settings for the phase. Provide id
                        when updating existing settings.
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            nullable: true
                            description: ID of the setting when updating. Omit when
                              creating new.
                          key:
                            type: string
                            nullable: true
                            description: Setting identifier/key (e.g., "feature.general.newest_first").
                          value:
                            type: string
                            nullable: true
                            description: Setting value (e.g., "active", "inactive",
                              "true", "false").
                          _destroy:
                            type: boolean
                            nullable: true
                            description: Set to true to delete this setting during
                              update.
                  required:
                  - type
              required:
              - projekt_phase
        description: Phase configuration with required type and optional start/end
          dates, visibility, restrictions, and settings
