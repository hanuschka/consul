  "/api/projekt_phases/{projekt_phase_id}/comments":
    parameters:
    - name: projekt_phase_id
      in: path
      description: Projekt Phase ID (CommentPhase)
      required: true
      schema:
        type: integer
    get:
      summary: List comments for a projekt phase
      tags:
      - Comments
      security:
      - bearer_auth: []
      description: "Retrieve all root-level comments for a projekt phase. Comments
        support nested replies (children). Returns paginated results with comment
        hierarchy information. Can be filtered by phase to see all discussion within
        that phase. \n\n*Authorization: Available to both `admin` and `public_data`
        access levels.*"
      parameters:
      - name: sort
        in: query
        required: false
        description: 'Sort comments by. Valid values: ''oldest'' (**default**, oldest
          comments first), ''newest'' (newest comments first), ''most_voted'' (highest
          voted first, then oldest)'
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Pagination page number (**default:** 1)
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: 'Number of items per page (**default:** 5000, max: 5000)'
        schema:
          type: integer
      responses:
        '200':
          description: comments sorted by newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      comments:
                        type: array
                        items:
                          type: object
                    required:
                    - comments
                  pagination:
                    type: object
                required:
                - data
        '403':
          description: forbidden - insufficient access
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
    post:
      summary: Create a comment
      tags:
      - Comments
      security:
      - bearer_auth: []
      description: "Create a new comment on a projekt phase. Supports both root-level
        comments and nested replies. To create a reply, specify the parent_id of the
        comment being responded to. Root comments do not have a parent_id. Comments
        support rich HTML content and are moderated by administrators. \n\n*Authorization:
        Requires `admin` access level. Requests with `public_data` access level will
        receive `403 Forbidden`.*"
      parameters: []
      responses:
        '201':
          description: nested reply to a reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      comment:
                        type: object
                        description: Serialized comment reply with parent_comment
                          reference and ancestry information
                    required:
                    - comment
                required:
                - data
        '422':
          description: invalid reply - empty body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
        '404':
          description: invalid reply - parent comment not found
        '403':
          description: forbidden - admin access required for replies
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: object
                  properties:
                    body:
                      type: string
                      description: Text content of the comment
                    parent_id:
                      type: integer
                      nullable: true
                      description: 'Optional: ID of parent comment for replies. If
                        provided, creates a nested reply.'
                    ancestry:
                      type: string
                      nullable: true
                      description: Ancestry string for hierarchy (auto-generated)
                  required:
                  - body
              required:
              - comment
        description: Comment data with required body text and optional parent_id for
          nested replies
