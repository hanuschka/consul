  "/api/projekt_phases/{projekt_phase_id}/proposals":
    parameters:
    - name: projekt_phase_id
      in: path
      description: Projekt Phase ID
      required: true
      schema:
        type: integer
    get:
      summary: List proposals for a projekt phase
      tags:
      - Proposals
      security:
      - bearer_auth: []
      description: "Retrieve all proposals submitted for a specific projekt phase.
        Proposals are citizen-initiated action items or projects proposed within a
        participation phase. Access filtering: public_data users automatically see
        only published (non-draft) and non-archived proposals. The for_public_render
        parameter is independent and can be used to apply additional filtering. Returns
        paginated results. \n\n*Authorization: Available to both `admin` and `public_data`
        access levels.*"
      parameters:
      - name: sort
        in: query
        required: false
        description: 'Sort proposals by. Valid values: ''created_at'' (**default**,
          oldest first), ''hot_score'' (trending/most activity), ''confidence_score''
          (highest confidence first), ''relevance'' (most voted first), ''archival_date''
          (most recently archived first)'
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Pagination page number (**default:** 1)
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: 'Number of items per page (**default:** 500, max: 2000)'
        schema:
          type: integer
      - name: for_public_render
        in: query
        required: false
        description: 'If true, returns only proposals that are publicly visible and
          ready for rendering on frontend (published, non-archived, non-retired).
          This filter is independent: public_data users will have discard_draft and
          discard_archived applied automatically, and can additionally use for_public_render
          to apply stricter filtering.'
        schema:
          type: boolean
      responses:
        '200':
          description: proposals sorted by hot_score
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      proposals:
                        type: array
                        items:
                          "$ref": "#/components/schemas/Proposal"
                    required:
                    - proposals
                  pagination:
                    type: object
                required:
                - data
        '403':
          description: forbidden - insufficient access
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
    post:
      summary: Create a proposal
      tags:
      - Proposals
      security:
      - bearer_auth: []
      description: "Submit a new proposal within a projekt phase. Proposals are citizen-initiated
        action items that require a responsible party, geozone location, and acceptance
        of terms. Proposals go through an admin review process before being published.
        \n\n*Authorization: Requires `admin` access level. Requests with `public_data`
        access level will receive `403 Forbidden`.*"
      parameters: []
      responses:
        '201':
          description: 'proposal created as draft (published: false)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      proposal:
                        "$ref": "#/components/schemas/Proposal"
                    required:
                    - proposal
                required:
                - data
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
        '403':
          description: forbidden - admin access required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                proposal:
                  type: object
                  properties:
                    responsible_name:
                      type: string
                      description: Name of the person or organization responsible
                        for the proposal
                    video_url:
                      type: string
                      nullable: true
                      description: URL to a video explaining the proposal (YouTube,
                        Vimeo, etc.)
                    geozone_id:
                      type: integer
                      description: ID of the geographic zone where the proposal applies
                    selected:
                      type: boolean
                      nullable: true
                      description: 'Admin-only: Whether this proposal is selected'
                    on_behalf_of:
                      type: string
                      nullable: true
                      description: Name of the organization or group submitting on
                        behalf of
                    sentiment_id:
                      type: integer
                      nullable: true
                      description: ID of the sentiment classification for this proposal
                    official_answer:
                      type: string
                      nullable: true
                      description: Official response or answer from administrators
                    admin_accepted:
                      type: boolean
                      nullable: true
                      description: 'Admin-only: Whether the proposal has been accepted
                        by administrators'
                    tag_list:
                      type: string
                      nullable: true
                      description: Comma-separated list of tags for categorization
                    related_sdg_list:
                      type: string
                      nullable: true
                      description: Comma-separated list of related Sustainable Development
                        Goals
                    resource_terms:
                      type: boolean
                      description: Acceptance of resource terms (required for creation)
                    projekt_label_ids:
                      type: array
                      items:
                        type: integer
                      nullable: true
                      description: Array of projekt label IDs to associate with this
                        proposal
                    published:
                      type: boolean
                      nullable: true
                      description: Whether to publish the proposal immediately on
                        creation, making it visible in the frontend. Defaults to true.
                        Set to false to create the proposal as a draft and publish
                        it later via PATCH /api/proposals/{id}/publish.
                    map_location_attributes:
                      type: object
                      nullable: true
                      description: Geographic location data for mapping the proposal
                      properties:
                        id:
                          type: integer
                          nullable: true
                        latitude:
                          type: number
                          description: Latitude coordinate
                        longitude:
                          type: number
                          description: Longitude coordinate
                        altitude:
                          type: number
                          nullable: true
                        zoom:
                          type: integer
                          nullable: true
                        features:
                          type: string
                          nullable: true
                        rendering_library:
                          type: string
                          nullable: true
                        show_admin_shape:
                          type: boolean
                          nullable: true
                        _destroy:
                          type: boolean
                          nullable: true
                      required:
                      - latitude
                      - longitude
                    image_attributes:
                      type: object
                      nullable: true
                      description: 'Optional: Image to illustrate the proposal. Upload
                        as base64-encoded data.'
                      properties:
                        id:
                          type: integer
                          nullable: true
                        title:
                          type: string
                          nullable: true
                          description: Image caption or alt text
                        attachment:
                          type: string
                          nullable: true
                          description: 'Base64-encoded image file. Supported formats:
                            JPEG, PNG, GIF, WebP'
                        cached_attachment:
                          type: string
                          nullable: true
                        credits:
                          type: string
                          nullable: true
                          description: Image source attribution
                        ai_generated:
                          type: boolean
                          nullable: true
                          description: Set to true when the image was created or edited
                            with AI; the public page then shows the AI disclosure
                            label
                        user_id:
                          type: integer
                          nullable: true
                        _destroy:
                          type: boolean
                          nullable: true
                          description: Set to true to remove the current image
                    documents_attributes:
                      type: array
                      nullable: true
                      description: Array of document attachments
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            nullable: true
                          title:
                            type: string
                            nullable: true
                          attachment:
                            type: string
                            nullable: true
                          cached_attachment:
                            type: string
                            nullable: true
                          user_id:
                            type: integer
                            nullable: true
                          _destroy:
                            type: boolean
                            nullable: true
                    translations_attributes:
                      type: array
                      description: Multilingual content. Provide title and description
                        for each language.
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            nullable: true
                          locale:
                            type: string
                            description: Language code (e.g., en, de, es)
                          title:
                            type: string
                            description: Proposal title in the specified language
                          description:
                            type: string
                            description: Proposal description in the specified language
                          summary:
                            type: string
                            nullable: true
                            description: Brief summary in the specified language
                          retired_explanation:
                            type: string
                            nullable: true
                            description: Explanation for retirement in the specified
                              language
                          _destroy:
                            type: boolean
                            nullable: true
                  required:
                  - title
                  - description
                  - responsible_name
                  - geozone_id
                  - resource_terms
              required:
              - proposal
        description: Proposal submission with required title, description, responsible
          party, geozone, and terms acceptance
