                          nullable: true
                        features:
                          type: string
                          nullable: true
                        rendering_library:
                          type: string
                          nullable: true
                        show_admin_shape:
                          type: boolean
                          nullable: true
                        _destroy:
                          type: boolean
                          nullable: true
                      required:
                      - latitude
                      - longitude
                    image_attributes:
                      type: object
                      nullable: true
                      description: 'Optional: Image documenting the deficiency issue
                        (photo of damage, problem area, etc.). Upload as base64-encoded
                        data. Highly recommended for visual evidence of the reported
                        problem.'
                      properties:
                        id:
                          type: integer
                          nullable: true
                        title:
                          type: string
                          nullable: true
                          description: Image caption, alt text, or brief description.
                            Used for accessibility and displayed with the image. Helps
                            visually-impaired users understand the image content.
                        attachment:
                          type: string
                          nullable: true
                          description: 'Base64-encoded image file. Required when adding
                            a new image. Supported formats: JPEG, PNG, GIF, WebP (recommended
                            max 5MB for optimal performance).'
                        cached_attachment:
                          type: string
                          nullable: true
                        credits:
                          type: string
                          nullable: true
                          description: Image source attribution, photographer/artist
                            name, or copyright information. Displayed with the image
                            to give proper credit.
                        ai_generated:
                          type: boolean
                          nullable: true
                          description: Set to true when the image was created or edited
                            with AI; the public page then shows the AI disclosure
                            label
                        user_id:
                          type: integer
                          nullable: true
                        _destroy:
                          type: boolean
                          nullable: true
                          description: Set to true to remove the current image from
                            the deficiency report. Does not affect other report properties.
                  required:
                  - deficiency_report_category_id
                  - title
                  - resource_terms
                  - map_location_attributes
              required:
              - deficiency_report
        description: Deficiency report with required title, description, location,
          category, and terms acceptance. Optional image attachment for documenting
          the issue.
