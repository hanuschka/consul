    ImageResponse:
      type: object
      nullable: true
      description: Image associated with the resource
      properties:
        id:
          type: integer
          description: Image ID
          example: 1
        title:
          type: string
          nullable: true
          description: Image title or alt text
          example: Cover Image
        credits:
          type: string
          nullable: true
          description: Image attribution or credits
          example: Photo by John Doe
        ai_generated:
          type: boolean
          description: True when the image was created or edited with AI. Drives the
            visible AI disclosure label on public pages.
          example: false
        url:
          type: string
          description: Full URL to the image
          example: https://example.com/uploads/image.jpg
        variants:
          type: object
          nullable: true
          description: 'Pre-generated resized versions of the image, keyed by their
            target maximum width in pixels (plus ''original''). Each numeric key is
            a variant scaled to fit within that width: the width is the upper bound,
            height scales proportionally so the aspect ratio is preserved, and the
            image is never enlarged beyond its original size (a source narrower than
            the key yields the smaller source dimensions, not an upscaled image).
            Pick the key closest to (and at least as large as) the width you will
            render at. By default every version is returned. The projekts list (index)
            endpoint accepts an ''image_variant_versions'' query parameter (comma-separated,
            e.g. ''300,900'') to restrict this object to specific versions and shrink
            the payload; in that case only the requested keys are present.'
          properties:
            '150':
              type: string
              nullable: true
              description: Max 150px wide. Thumbnail (avatars, list rows, tight grids).
              example: https://example.com/uploads/150.jpg
            '300':
              type: string
              nullable: true
              description: Max 300px wide. Small (card teasers, mobile inline images).
              example: https://example.com/uploads/300.jpg
            '450':
              type: string
              nullable: true
              description: Max 450px wide. Medium (sidebar, two-column card images).
              example: https://example.com/uploads/450.jpg
            '600':
              type: string
              nullable: true
              description: Max 600px wide. Medium-large (single-column body images).
              example: https://example.com/uploads/600.jpg
            '900':
              type: string
              nullable: true
              description: Max 900px wide. Large (wide content area, retina cards).
              example: https://example.com/uploads/900.jpg
            '1200':
              type: string
              nullable: true
              description: Max 1200px wide. Extra large (page headers, hero on desktop).
              example: https://example.com/uploads/1200.jpg
            '1920':
              type: string
              nullable: true
              description: Max 1920px wide. Full-width Full HD (full-bleed banners,
                retina hero).
              example: https://example.com/uploads/1920.jpg
            original:
              type: string
              nullable: true
              description: The unmodified uploaded file at its original dimensions
                (no resizing). Largest payload; use only when the exact source is
                required.
              example: https://example.com/uploads/original.jpg
