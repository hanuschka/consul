          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deficiency_report:
                  type: object
                  properties:
                    author_id:
                      type: integer
                      nullable: true
                    deficiency_report_category_id:
                      type: integer
                    deficiency_report_status_id:
                      type: integer
                      nullable: true
                    title:
                      type: string
                    description:
                      type: string
                      nullable: true
                    summary:
                      type: string
                      nullable: true
                      description: Brief summary or overview of the deficiency report
                    official_answer:
                      type: string
                      nullable: true
                      description: Official response or answer from administrators
                        regarding the reported issue
                    on_behalf_of:
                      type: string
                      nullable: true
                      description: Name of the organization or group submitting on
                        behalf of
                    video_url:
                      type: string
                      nullable: true
                      description: URL to a video documenting the deficiency (YouTube,
                        Vimeo, etc.)
                    responsible_id:
                      type: integer
                      nullable: true
                      description: ID of the responsible party (user or organization)
                        assigned to address this deficiency
                    responsible_type:
                      type: string
                      nullable: true
                      description: Type of responsible party (e.g., "User", "Organization")
                    tag_list:
                      type: string
                      nullable: true
                      description: Comma-separated list of tags for categorization
                    resource_terms:
                      type: boolean
                    admin_accepted:
                      type: boolean
                      nullable: true
                    map_location_attributes:
                      type: object
                      nullable: true
                      description: Geographic location data for mapping the deficiency
                        report
