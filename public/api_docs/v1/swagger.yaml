            map_location_attributes:
              type: object
              description: Geographic coordinates and zoom level for map display
              properties:
                latitude:
                  type: number
                  description: Latitude coordinate (-90 to 90)
                longitude:
                  type: number
                  description: Longitude coordinate (-180 to 180)
                zoom:
                  type: integer
