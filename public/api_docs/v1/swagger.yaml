      security:
      - bearer_auth: []
      description: "Submit a new deficiency report for a maintenance issue or infrastructure
        problem. Reports must include a location (latitude/longitude) and category.
        Supports geographic mapping, image attachments for documenting the issue,
        and admin review before publishing. Requires acceptance of terms. \n\n*Authorization:
        Requires `admin` access level. Requests with `public_data` access level will
        receive `403 Forbidden`.*"
      parameters: []
      responses:
        '201':
          description: deficiency report created with base64 image
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deficiency_report:
                        type: object
                    required:
                    - deficiency_report
                required:
                - data
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
