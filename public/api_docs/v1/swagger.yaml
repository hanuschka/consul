                    on_behalf_of:
                      type: string
                      nullable: true
                      description: 'Optional: Organization or group name if the proposal
                        is made on behalf of an entity rather than an individual.'
                    resource_terms:
                      type: boolean
                      description: Must be true. Confirms the submitter accepts the
                        terms and conditions.
                    price:
