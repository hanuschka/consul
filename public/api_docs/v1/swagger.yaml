openapi: 3.0.1
info:
  title: API V1
  version: v1
  description: |-
    # Consul Projekt API

    The Consul Projekt API provides programmatic access to manage participatory budgeting and citizen engagement projects. This API enables you to create and manage various project phases, collect citizen input through proposals, polls, and surveys, and track project progress.

    ## Authentication

    This API uses **Bearer Token** authentication. Every request — including read-only `GET` requests — requires an API client with a valid token; a missing or invalid token returns `401 Unauthorized` (see *HTTP Method Requirements* below).

    ### Creating an API Client

    API clients are created by a platform administrator in the admin area,
    under **Developer area → API clients**. Creating a client there also
    issues its token and sets up the user that will author API content
    (see *Content author* below). This is the main way to create a client.

    ### Creating an API Client via the Rails console

    As an alternative to the admin area, clients can also be created from
    the Rails console. Note that it does **not** build the service user
    automatically — that is only done by the admin form or by calling
    `ApiClients::CreateServiceUserService`:

    ```ruby
    # Publishes content as the shared system user (the default)
    ApiClient.create!(
      name: "Mobile app",
      access_level: "admin"  # Can be "admin" or "public_data"
    )
    ```

    ### Content author

    Every resource created via the API is stored with a real author — the
    API never writes content anonymously. Each client decides which user
    that is through its **"Use system user"** setting:

    - **On (default):** content is authored by the single shared **system
      user** that represents the platform. No extra setup is required.
    - **Off:** content is authored by a **dedicated service user** created
      for that client (its `service_user_email` anchors the account). Use
      this when API content should appear under its own distinct identity.

    A service user exists only to be the visible author of API content; it
    cannot be used to log in. The system user's public name and avatar are
    configured in the admin area under **Application → System user**.

    ### Authentication Header

    Include your API client's authentication token in the `Authorization` header:

    ```
    Authorization: Bearer YOUR_AUTH_TOKEN
    ```

    The access token is automatically generated for each API client and can be obtained via:

    ```ruby
    api_client.access_token
    ```

    The token can be rotated with `api_client.regenerate_access_token`.

    ### Access Levels

    - **Admin**: Full access to create, read, update, and delete resources
    - **Public Data**: Read-only access to public data

    #### HTTP Method Requirements

    Every request — including `GET` — must carry a valid `Authorization: Bearer <token>` header. A missing or unrecognized token returns `401 Unauthorized` **before** any access-level check is evaluated (enforced by `authenticate_api_client!`, which runs as a `before_action` on every endpoint). There is no anonymous/public GET access.

    Once a valid token is presented, the client's access level controls what it may do:

    - **GET**: Available to both `admin` and `public_data` access levels
    - **POST (Create)**: Requires `admin` access level
    - **PATCH (Update)**: Requires `admin` access level
    - **DELETE**: Requires `admin` access level

    Requests with `public_data` access level attempting to use POST, PATCH, or DELETE will receive a `403 Forbidden` error.

    #### Authentication vs. authorization errors

    - **`401 Unauthorized`** — *authentication* failure. A missing or invalid Bearer token rejects the request (all methods, including GET) before any read/admin check. Body:
      ```json
      { "error": { "type": "unauthorized", "messages": ["Invalid or missing API token."] } }
      ```
    - **`403 Forbidden`** — *authorization* failure. A **valid** token whose access level is insufficient (e.g. a `public_data` client attempting POST/PATCH/DELETE). Body:
      ```json
      { "error": { "type": "forbidden", "messages": ["You do not have permission to perform this action. Admin access required."] } }
      ```

    ## Key Features

    - **Project Management**: Create and manage projects with multiple phases
    - **Participatory Budgeting**: Implement budget allocation mechanisms
    - **Citizen Engagement**: Collect ideas, proposals, and feedback from participants
    - **Surveys & Forms**: Deploy custom forms to gather structured input
    - **Event & Livestream Support**: Schedule and manage live events and streams
    - **Milestone Tracking**: Track project progress with status updates
    - **Geospatial Features**: Mark points of interest on maps

    ## Getting Started

    ### API Documentation

    API documentation is automatically generated from test specifications using the Rswag gem. The following documentation formats are available:
    - `/api/docs` - Interactive OpenAPI documentation
    - `/api/docs_alt` - Alternative documentation view

    To regenerate API documentation after making changes to specs, run:

    ```bash
    bin/rails api:generate_docs
    ```

    This generates:
    - `public/api_docs/v1/swagger.yaml` - OpenAPI specification in YAML format

    **Note:** Whenever you modify specs in `spec/requests/api` or `spec/schemas`, you must regenerate the API documentation.

    ### Running API Tests

    To verify that your API specifications are valid, run:

    ```bash
    bundle exec rspec spec/requests/api
    ```

    ## Response Format

    All API responses are in JSON format with the following structure:

    **Success Response:**
    ```json
    {
      "data": {
        "resource_name": { ... }
      },
      "pagination": {
        "current_page": 1,
        "total_pages": 10,
        "total_count": 100,
        "per_page": 10
      }
    }
    ```

    **Error Response:**

    All errors share the envelope `{ "error": { "type": ..., "messages": [...] } }`. The API produces these types:

    ```json
    {
      "error": {
        "type": "forbidden",
        "messages": ["You do not have permission to read this resource."]
      }
    }
    ```

    | HTTP status | `type`         | Example message                                     |
    |-------------|----------------|-----------------------------------------------------|
    | 401         | `unauthorized` | `Invalid or missing API token.`                     |
    | 403         | `forbidden`    | `You do not have permission to read this resource.` |
    | 404         | `not_found`    | `Not found`                                          |

    ## Pagination

    List endpoints support pagination using `page` and `per_page` query parameters:
    - `page`: Page number (default: 1)
    - `per_page`: Results per page (default: 500 for most endpoints, 5000 for comments)

    ## API Sections

    The API is organized into logical groups:
    - **Projekts**: Core project management
    - **Ideas**: Citizen ideas and proposals
    - **Deficiency Reports**: Issue tracking and reporting

    ## Support

    Most questions can be answered without waiting on a reply:

    - **Changelog** — check it (in the sidebar) for recent endpoint and parameter changes.
    - **Endpoint reference** — every endpoint below documents its parameters, request body, and example responses.
    - **Error Handling** — the section above maps each status code (`401`, `403`, `404`, …) to its likely cause.

    If you still need help, contact your platform administrator or demokratie.today support. To speed up diagnosis, please include:

    - the request path and HTTP method (e.g. `GET /api/projekts`);
    - the timestamp of the request;
    - the HTTP status code you received; and
    - your API client name.

    Platform administrators can look up any request — with full timing and response details — under **API → API request logs** in the admin area.

    # Changelog

    Notable changes to the Consul Projekt API, most recent first.

    ## 2026-07-20

    ### Poll questions and answers are now paginated

    `GET /api/polls/{poll_id}/questions` and
    `GET /api/poll_questions/{poll_question_id}/answers` now paginate their
    results by default (previously they returned the full list). Each response
    gains a `pagination` block with `current_page`, `total_pages`, `total_count`
    and `per_page`.

    Pass `page` and `per_page` to page through the results. The default page size
    is **100**; the first page is returned when `page` is omitted.

    ```
    GET /api/polls/42/questions?page=2&per_page=50
    GET /api/poll_questions/17/answers?per_page=25
    ```

    ## 2026-06-29

    ### Projekt list — faster, with pagination, sorting and selective images

    The projekt list endpoint (`GET /api/projekts`) is roughly 4x faster on a
    plain request (~500–700 ms) and gained three new query options. Combining
    pagination with a single image size can make a list request 10–15x faster
    than the full unpaginated response.

    **Pagination** — pass `page` and/or `per_page` to split results. Supplying
    either parameter enables pagination (default page size 20); omit both to
    receive every matching projekt in a single response, as before. Paginated
    responses include a `pagination` block with `current_page`, `total_pages`,
    `total_count` and `per_page`.

    ```
    GET /api/projekts?page=1&per_page=20
    ```

    **Sorting** — order the list with `sort_by` and `sort_direction`.

    ```
    GET /api/projekts?sort_by=name&sort_direction=asc
    ```

    `sort_by` accepts `created_at` (default), `published_at`, `name`,
    `page_title`, `order_number`, `total_duration_start` and
    `total_duration_end`. `sort_direction` is `asc` (default) or `desc`.
    Unrecognized values fall back to the defaults, and sorting combines with
    pagination.

    **Selective image sizes** — by default every projekt image is returned in
    all sizes, and signing each variant URL is the expensive part of the
    response. Request only the sizes you need with `image_variant_versions`
    (comma-separated):

    ```
    GET /api/projekts?image_variant_versions=600
    GET /api/projekts?image_variant_versions=300,600
    ```

    Available widths in px: `150`, `300`, `450`, `600`, `900`, `1200`, `1920`,
    plus `original` for the untouched file. Omit the parameter to receive all
    sizes.

    A typical list view is fastest with pagination and one image size together:

    ```
    GET /api/projekts?page=1&per_page=50&image_variant_versions=600
    ```

    **Monitoring** — request timings (method, path, status, client and total
    duration in milliseconds, plus a database-vs-rendering breakdown per entry)
    are available to administrators under **API → API request logs** in the
    admin area.
paths:
  "/api/projekt_phases/{projekt_phase_id}/arguments":
    parameters:
    - name: projekt_phase_id
      in: path
      description: Projekt Phase ID (ArgumentPhase)
      required: true
      schema:
        type: integer
    get:
      summary: List projekt arguments by phase
      tags:
      - Arguments
      security:
      - bearer_auth: []
      description: "List all arguments (pro and con) for a specific projekt phase.
        Supports pagination for efficient loading of large argument sets. Arguments
        are ordered by creation date with pagination support. \n\n*Authorization:
        Available to both `admin` and `public_data` access levels.*"
      parameters:
      - name: page
        in: query
        required: false
        description: Pagination page number (**default:** 1)
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: 'Number of items per page (**default:** 500, max: 2000)'
        schema:
          type: integer
      responses:
        '200':
          description: projekt arguments list returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      arguments:
                        type: array
                        items:
                          type: object
                    required:
                    - arguments
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
                      per_page:
                        type: integer
                    required:
                    - current_page
                    - total_pages
                    - total_count
                    - per_page
                required:
                - data
                - pagination
        '404':
          description: projekt phase not found
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
    post:
      summary: Create a projekt argument
      tags:
      - Arguments
      security:
      - bearer_auth: []
      description: "Create a new argument (pro or con) for a projekt phase. Arguments
        present reasoning, evidence, or positions on a topic within the ArgumentPhase.
        Can include supporting images with titles and credits. \n\n*Authorization:
        Requires `admin` access level. Requests with `public_data` access level will
        receive `403 Forbidden`.*"
      parameters: []
      responses:
        '201':
          description: projekt argument created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projekt_argument:
                        type: object
                    required:
                    - projekt_argument
                required:
                - data
        '422':
          description: projekt argument with unsupported image content type returns
            validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
        '403':
          description: forbidden - insufficient access
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projekt_argument:
                  type: object
                  properties:
                    name:
                      type: string
                      nullable: true
                      description: Argument title or name. Optional, can be auto-generated
                        if not provided.
                    position:
                      type: integer
                      nullable: true
                      description: Display order among other arguments in the phase.
                        Lower numbers appear first.
                    note:
                      type: string
                      nullable: true
                      description: Detailed argument text explaining the position,
                        evidence, and reasoning.
                    pro:
                      type: boolean
                      nullable: true
                      description: true = pro-argument (in favor), false/null = con-argument
                        (against)
                    image_attributes:
                      type: object
                      description: 'Optional: Image to support the argument (infographic,
                        chart, diagram, evidence photo, etc.). Upload as base64-encoded
                        data. Recommended for presenting visual evidence or data supporting
                        the argument position.'
                      properties:
                        attachment:
                          type: string
                          nullable: true
                          description: 'Base64-encoded image file. Required when adding
                            a new image. Supported formats: JPEG, PNG, GIF, WebP (recommended
                            max 5MB for optimal performance).'
                        title:
                          type: string
                          nullable: true
                          description: Image caption, alt text, or brief description.
                            Used for accessibility and displayed with the image. Helps
                            visually-impaired users understand the image content.
                        credits:
                          type: string
                          nullable: true
                          description: Image source attribution, photographer/artist
                            name, or copyright information. Displayed with the image
                            to give proper credit.
                        ai_generated:
                          type: boolean
                          nullable: true
                          description: Set to true when the image was created or edited
                            with AI; the public page then shows the AI disclosure
                            label
                        _destroy:
                          type: boolean
                          nullable: true
                          description: Set to true to remove the current image from
                            the argument. Does not affect other argument properties.
              required:
              - projekt_argument
        description: Argument details with optional name, position, note, pro/con
          flag, and image attachment
  "/api/arguments/{id}":
    parameters:
    - name: id
      in: path
      description: Projekt Argument ID
      required: true
      schema:
        type: integer
    get:
      summary: Retrieve a projekt argument
      tags:
      - Arguments
      security:
      - bearer_auth: []
      description: "Retrieve a single argument by ID with all its details. Returns
        the argument text, pro/con classification, display position, and any associated
        image with metadata. \n\n*Authorization: Available to both `admin` and `public_data`
        access levels.*"
      responses:
        '200':
          description: projekt argument found and returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projekt_argument:
                        type: object
                    required:
                    - projekt_argument
                required:
                - data
        '404':
          description: projekt argument not found
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
    patch:
      summary: Update a projekt argument
      tags:
      - Arguments
      security:
      - bearer_auth: []
      description: "Update an existing argument with new content, positioning, or
        pro/con classification. Can also add, replace, or remove the supporting image.
        All fields are optional - only provide fields to change. \n\n*Authorization:
        Requires `admin` access level. Requests with `public_data` access level will
        receive `403 Forbidden`.*"
      parameters: []
      responses:
        '200':
          description: projekt argument updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projekt_argument:
                        type: object
                    required:
                    - projekt_argument
                required:
                - data
        '404':
          description: projekt argument not found
        '422':
          description: projekt argument update with unsupported image content type
            returns validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
        '403':
          description: forbidden - insufficient access
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projekt_argument:
                  type: object
                  properties:
                    name:
                      type: string
                      nullable: true
                      description: Argument title or name. Optional, can be auto-generated
                        if not provided.
                    position:
                      type: integer
                      nullable: true
                      description: Display order among other arguments in the phase.
                        Lower numbers appear first.
                    note:
                      type: string
                      nullable: true
                      description: Detailed argument text explaining the position,
                        evidence, and reasoning.
                    pro:
                      type: boolean
                      nullable: true
                      description: true = pro-argument (in favor), false/null = con-argument
                        (against)
                    image_attributes:
                      type: object
                      description: 'Optional: Image to support the argument (infographic,
                        chart, diagram, evidence photo, etc.). Upload as base64-encoded
                        data. Recommended for presenting visual evidence or data supporting
                        the argument position.'
                      properties:
                        attachment:
                          type: string
                          nullable: true
                          description: 'Base64-encoded image file. Required when adding
                            a new image. Supported formats: JPEG, PNG, GIF, WebP (recommended
                            max 5MB for optimal performance).'
                        title:
                          type: string
                          nullable: true
                          description: Image caption, alt text, or brief description.
                            Used for accessibility and displayed with the image. Helps
                            visually-impaired users understand the image content.
                        credits:
                          type: string
                          nullable: true
                          description: Image source attribution, photographer/artist
                            name, or copyright information. Displayed with the image
                            to give proper credit.
                        ai_generated:
                          type: boolean
                          nullable: true
                          description: Set to true when the image was created or edited
                            with AI; the public page then shows the AI disclosure
                            label
                        _destroy:
                          type: boolean
                          nullable: true
                          description: Set to true to remove the current image from
                            the argument. Does not affect other argument properties.
              required:
              - projekt_argument
        description: Argument attributes to update (name, position, note, pro/con
          flag, image). Any field not provided remains unchanged.
    delete:
      summary: Delete a projekt argument
      tags:
      - Arguments
      security:
      - bearer_auth: []
      description: "Delete an argument and all associated data (including any attached
        images). This action is permanent and cannot be undone. \n\n*Authorization:
        Requires `admin` access level. Requests with `public_data` access level will
        receive `403 Forbidden`.*"
      responses:
        '200':
          description: projekt argument deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
        '404':
          description: projekt argument not found
        '422':
          description: unable to delete projekt argument
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: object
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
        '403':
          description: forbidden - insufficient access
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
  "/api/auth/rotate_token":
    post:
      summary: Rotate API access token
      tags:
      - Auth
      security:
      - bearer_auth: []
      description: Regenerates the access token for the authenticated API client.
        The old token is immediately invalidated and the new token is returned. Any
        authenticated client can rotate its own token.
      responses:
        '200':
          description: old token is invalidated after rotation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: sk_abc123...
                    required:
                    - access_token
                required:
                - data
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
  "/api/budgets/{budget_id}/investments":
    parameters:
    - name: budget_id
      in: path
      description: Budget ID
      required: true
      schema:
        type: integer
    get:
      summary: List budget investments
      tags:
      - Budget Investments
      security:
      - bearer_auth: []
      description: |-
        Retrieve all budget investments (project proposals) for a specific participatory budget. Investments can be filtered by category (heading/group), feasibility status, selection status, and sorted by various criteria. Returns paginated results with voting/support information.

        *Authorization: Available to both `admin` and `public_data` access levels.*
      parameters:
      - name: page
        in: query
        required: false
        description: Pagination page number (**default:** 1)
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: 'Number of items per page (**default:** 500, max: 2000)'
        schema:
          type: integer
      - name: heading_id
        in: query
        required: false
        description: Filter results to investments in a specific category heading
        schema:
          type: integer
      - name: group_id
        in: query
        required: false
        description: Filter results to investments in a specific category group
        schema:
          type: integer
      - name: feasibility
        in: query
        required: false
        description: 'Filter by feasibility assessment: "feasible", "unfeasible",
          or "undecided"'
        schema:
          type: string
      - name: selected
        in: query
        required: false
        description: 'Filter by selection status: "true" for selected investments,
          "false" for unselected'
        schema:
          type: string
      - name: order
        in: query
        required: false
        description: 'Sort by: "id" (**default**), "supports" (vote count), "confidence_score",
          "price", "ballots", or "newest"'
        schema:
          type: string
      responses:
        '200':
          description: budget investments found with public_data access
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      budget_investments:
                        type: array
                        items:
                          type: object
                    required:
                    - budget_investments
                  pagination:
                    type: object
                required:
                - data
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
    post:
      summary: Create a budget investment
      tags:
      - Budget Investments
      security:
      - bearer_auth: []
      description: "Submit a new budget investment (project proposal) to a specific
        budget. Investments must be assigned to a category heading and include title,
        description, and estimated budget/price. Supports video attachments, geographic
        location mapping, multilingual descriptions, image attachments for project
        visualization, and tagging. Requires acceptance of terms. \n\n*Authorization:
        Requires `admin` access level. Requests with `public_data` access level will
        receive `403 Forbidden`.*"
      parameters: []
      responses:
        '201':
          description: budget investment created with base64 image
          content:
            application/json:
              schema:
