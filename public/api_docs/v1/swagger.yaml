            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
  "/api/livestreams/{livestream_id}/questions":
    parameters:
    - name: livestream_id
      in: path
      description: Projekt Livestream ID
      required: true
      schema:
        type: integer
    post:
      summary: Create a question for a livestream
      tags:
      - Questions
      security:
      - bearer_auth: []
      description: "Create a question attached to a specific livestream. The question
        is associated with the livestream and its projekt phase automatically. \n\n*Authorization:
        Requires `admin` access level. Requests with `public_data` access level will
        receive `403 Forbidden`.*"
      parameters: []
      responses:
        '201':
          description: projekt question created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projekt_question:
                        type: object
                    required:
                    - projekt_question
                required:
                - data
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
        '403':
          description: forbidden - insufficient access
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projekt_question:
                  type: object
                  properties:
                    title:
                      type: string
                      description: Title of the question
                  required:
                  - title
              required:
              - projekt_question
        description: Projekt question creation payload
  "/api/projekt_phases/{projekt_phase_id}/texts":
    parameters:
    - name: projekt_phase_id
      in: path
      description: Projekt Phase ID (LegislationPhase)
      required: true
      schema:
        type: integer
    get:
      summary: List all texts
      tags:
      - Texts
      security:
      - bearer_auth: []
      description: |-
        Retrieve all texts/legislation documents for a projekt phase. Texts support multi-phase review processes: draft publication, debate period, and allegations/amendments period.

        *Authorization: Available to both `admin` and `public_data` access levels.*
      parameters:
      - name: page
        in: query
        required: false
        description: Pagination page number (**default:** 1)
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: 'Number of items per page (**default:** 500, max: 2000)'
        schema:
          type: integer
      responses:
        '200':
          description: texts found and returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      texts:
                        type: array
                        items:
                          type: object
                    required:
                    - texts
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
                      per_page:
                        type: integer
                required:
                - data
                - pagination
        '401':
          description: unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: array
                        items:
                          type: string
