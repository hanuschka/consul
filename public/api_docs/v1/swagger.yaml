components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: Auth Token
    masterportal_sync_auth:
      type: http
      scheme: bearer
      bearerFormat: Masterportal Sync Token
  schemas:
    Projekt:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the projekt
          example: 1
        name:
          type: string
          description: The name or title of the projekt
          example: Sample Projekt
        title:
          type: string
          nullable: true
          description: The projekt page title (same value as page.title), exposed
            at the top level for convenience.
          example: Sample Projekt Page
        subtitle:
          type: string
          nullable: true
          description: The projekt page subtitle (same value as page.subtitle).
          example: A short tagline for the projekt
        image:
          "$ref": "#/components/schemas/Image"
        text:
          type: string
          description: 'The full projekt page content: the body of all content blocks
            (ordered by position) combined into a single string. Same value as text_html
            (already sanitized at save time, not re-processed here). Only present
            when include_text=true on the list endpoint; always present in the single
            projekt response. Empty string when the projekt has no content blocks.'
          example: "<h2>Welcome</h2><p>About this projekt.</p>"
        text_html:
          type: string
          description: 'The full projekt page content as HTML: the body of all content
            blocks (ordered by position) combined into a single string. Only present
            when include_text=true on the list endpoint; always present in the single
            projekt response. Empty string when the projekt has no content blocks.'
          example: "<h2>Welcome</h2><p>About this projekt.</p>"
        parent_id:
          type: integer
          nullable: true
          description: ID of the parent projekt if this is a sub-projekt. Null if
            this is a top-level projekt.
          example:
        created_at:
          type: string
          format: datetime
          description: Timestamp when the projekt was created
          example: '2024-01-01T00:00:00Z'
        updated_at:
          type: string
          format: datetime
          description: Timestamp when the projekt was last modified
          example: '2024-01-01T00:00:00Z'
        order_number:
          type: integer
          nullable: true
          description: The display order of this projekt among its siblings. Lower
            numbers appear first.
          example: 1
        total_duration_start:
          type: string
          format: datetime
          nullable: true
          description: The project start date. When set, this defines when the projekt
            begins.
          example: '2024-01-01T00:00:00Z'
        total_duration_end:
          type: string
          format: datetime
          nullable: true
          description: The project end date. When set, this defines when the projekt
            concludes.
          example: '2024-12-31T23:59:59Z'
        comments_count:
          type: integer
          nullable: true
          description: The total number of comments on the projekt
          example: 0
        geozone_affiliated:
          type:
          - boolean
          - string
          nullable: true
          description: Indicates if the projekt is restricted to specific geographic
            zones
          example: false
        level:
          type: integer
          nullable: true
          description: The hierarchy level of the projekt. Level 0 is a top-level
            projekt, higher numbers indicate deeper nesting.
          example: 0
        show_start_date_in_frontend:
          type:
          - boolean
          - string
          nullable: true
          description: Whether to display the project start date on the frontend
          example: true
        show_end_date_in_frontend:
          type:
          - boolean
          - string
          nullable: true
          description: Whether to display the project end date on the frontend
          example: true
        top_level_projekt_id:
          type: integer
          nullable: true
          description: ID of the top-level projekt in the hierarchy. Null if this
            is the top level.
          example:
        preview_code:
          type: string
          nullable: true
          description: A unique code used for generating preview links to the projekt
            before publication
          example: abc123
        page:
          type: object
          nullable: true
          description: The associated Projekt page containing content and metadata
          properties:
            title:
              type: string
              nullable: true
              description: The page title displayed in the frontend
              example: Sample Projekt Page
            slug:
              type: string
              nullable: true
              description: URL-friendly identifier for the page
              example: sample-projekt
            image:
              "$ref": "#/components/schemas/Image"
        projekt_settings:
          type: array
          description: Configuration settings for the projekt as key-value pairs.
            Only present when include_projekt_settings=true on the list endpoint;
            always present in the single projekt response.
          items:
            type: object
            properties:
              key:
                type: string
                description: Setting identifier (e.g., show_map, enable_comments)
                example: show_map
              value:
                type: string
                nullable: true
                description: Setting value (e.g., true, false, or other values)
                example: 'true'
          example:
          - key: show_map
            value: 'true'
          - key: enable_comments
            value: 'false'
        projekt_phases:
          type: array
          description: Array of phases this projekt contains (e.g., Comment phase,
            Voting phase)
          items:
            "$ref": "#/components/schemas/ProjektPhase"
        content_blocks:
          type: array
          description: Array of content blocks that compose the projekt page content
          items:
            "$ref": "#/components/schemas/ContentBlock"
      required:
      - id
      - name
      - created_at
      - updated_at
    Image:
      type: object
      nullable: true
      description: An attached image (e.g. the projekt banner/cover) with its responsive
        variants.
      properties:
        id:
          type: integer
          description: Unique identifier for the image
          example: 1
        title:
          type: string
          nullable: true
          description: Image title or alt text
          example: Cover Image
        credits:
          type: string
          nullable: true
          description: Image attribution or credits
          example: Photo by John Doe
        ai_generated:
          type: boolean
          description: True when the image was created or edited with AI. Drives the
            visible AI disclosure label on public pages.
          example: false
        url:
          type: string
          description: URL to the original full-size image
          example: https://example.com/images/page-image.jpg
        variants:
          type: object
          description: URLs of resized variants keyed by maximum width in pixels,
            plus the original.
          properties:
            '150':
              type: string
              nullable: true
              description: Variant limited to 150px width
              example: https://example.com/images/page-image-150.jpg
            '300':
              type: string
              nullable: true
              description: Variant limited to 300px width
              example: https://example.com/images/page-image-300.jpg
            '450':
              type: string
              nullable: true
              description: Variant limited to 450px width
              example: https://example.com/images/page-image-450.jpg
            '600':
              type: string
              nullable: true
              description: Variant limited to 600px width
              example: https://example.com/images/page-image-600.jpg
            '900':
              type: string
              nullable: true
              description: Variant limited to 900px width
              example: https://example.com/images/page-image-900.jpg
            '1200':
              type: string
              nullable: true
              description: Variant limited to 1200px width
              example: https://example.com/images/page-image-1200.jpg
            '1920':
              type: string
              nullable: true
              description: Variant limited to 1920px width
              example: https://example.com/images/page-image-1920.jpg
            original:
              type: string
              description: URL to the original full-size image
              example: https://example.com/images/page-image.jpg
    ImageAttributesApi:
      type: object
      description: 'Attributes for updating the projekt page image. Provide attachment
        (base64-encoded)/title/credits to create/update, or _destroy=true to remove
        the image. Defaults: _destroy=false.'
      properties:
        title:
          type: string
          nullable: true
          description: Human-readable title/alt text for the image. Optional.
          example: Cover Image Title
        attachment:
          type: string
          nullable: true
          description: 'Base64-encoded image file data. Supported formats: JPEG, PNG,
            GIF, WebP. Example: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="'
        credits:
          type: string
          nullable: true
          description: Attribution/credits for the image. Optional.
          example: Photo by John Doe
        ai_generated:
          type: boolean
          nullable: true
          default: false
          description: 'Set to true when the image was created or edited with AI.
            The public page then shows the AI disclosure label. Resets to false when
            the attachment is replaced without passing it again. Default: false.'
          example: false
        _destroy:
          type: boolean
          nullable: true
          default: false
          description: 'If true, deletes the current projekt page image. Default:
            false.'
          example: false
    ProjektImageUpdateParams:
      type: object
      description: 'Body for updating projekt page image. Provide attachment/title/credits
        to create/update, or _destroy=true to remove. Defaults: _destroy=false.'
      properties:
        image:
          "$ref": "#/components/schemas/ImageAttributesApi"
      required:
      - image
    ProjektCreateParams:
      type: object
      properties:
        projekt:
          type: object
          description: Projekt data for creation
          properties:
            name:
              type: string
              description: The name or title of the projekt (required)
            parent_id:
              type: integer
              nullable: true
              description: ID of the parent projekt if creating a sub-projekt. Omit
                for top-level projekts.
            total_duration_start:
              type: string
              format: date_time
              nullable: true
              description: Project start date (ISO 8601 format). Omit for no start
                date.
            total_duration_end:
              type: string
              format: date_time
              nullable: true
              description: Project end date (ISO 8601 format). Omit for no end date.
            show_start_date_in_frontend:
              type: boolean
              description: Whether to display the start date on the frontend
            show_end_date_in_frontend:
              type: boolean
              description: Whether to display the end date on the frontend
            geozone_affiliated:
              type: boolean
              description: Whether this projekt is restricted to specific geographic
                zones
            order_number:
              type: integer
              nullable: true
              description: Display order among sibling projekts. Lower numbers appear
                first. Omit for default ordering.
            tag_list:
              type: string
              nullable: true
              description: Comma-separated list of tags for categorization (e.g.,
                "environment,infrastructure")
            related_sdg_list:
              type: string
              nullable: true
              description: Comma-separated list of related Sustainable Development
                Goal IDs
            landing_page_id:
              type: integer
              nullable: true
              description: ID of the landing page associated with this projekt
            geozone_affiliation_ids:
              type: array
              items:
                type: integer
              description: Array of geographic zone IDs this projekt belongs to
            sdg_goal_ids:
              type: array
              items:
                type: integer
              description: Array of Sustainable Development Goal IDs this projekt
                aligns with
            individual_group_value_ids:
              type: array
              items:
                type: integer
              description: Array of individual group/demographic IDs with special
                restrictions or access
            map_location_attributes:
              type: object
              description: Geographic coordinates and zoom level for map display
              properties:
                latitude:
                  type: number
                  description: Latitude coordinate (-90 to 90)
                longitude:
                  type: number
                  description: Longitude coordinate (-180 to 180)
                zoom:
                  type: integer
                  description: Map zoom level (0-18, where 0 is world view)
            projekt_manager_assignments_attributes:
              type: array
              description: Array of projekt manager role assignments. Omit if no managers
                need to be assigned.
              items:
                type: object
                properties:
                  id:
                    type: integer
                    nullable: true
                    description: ID of existing assignment when updating. Omit for
                      new assignments.
                  projekt_manager_id:
                    type: integer
                    description: ID of the user to assign as projekt manager
                  projekt_id:
                    type: integer
                    description: ID of the projekt (set by API)
                  permissions:
                    type: array
                    items:
                      type: string
                    description: Array of permission names (e.g., ["admin", "edit",
                      "view"])
          required:
          - name
      required:
      - projekt
    ProjektUpdateParams:
      type: object
      properties:
        projekt:
          type: object
          properties:
            name:
              type: string
              description: The name or title of the projekt (required)
            parent_id:
              type: integer
