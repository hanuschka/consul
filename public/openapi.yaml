  "/api/projekts/{id}/update_setting":
    parameters:
    - name: id
      in: path
      description: Projekt ID
      required: true
      schema:
        type: integer
    patch:
      summary: Update a projekt setting
      tags:
      - Projekts
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: setting updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      setting:
                        type: object
                        properties:
                          id:
                            type: integer
                          key:
                            type: string
                          value:
                            type: string
                          projekt_id:
                            type: integer
                        required:
                        - id
                        - key
                        - value
                        - projekt_id
                    required:
                    - setting
                  message:
                    type: string
                required:
                - data
                - message
        '404':
          description: setting not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                setting:
                  type: object
                  properties:
                    key:
                      type: string
                      description: Setting key
                    value:
                      type: string
                      description: Setting value
                  required:
                  - key
                  - value
              required:
              - setting
        description: Key/value to update on projekt settings
  "/api/projekt_phases/{projekt_phase_id}/proposals":
    parameters:
    - name: projekt_phase_id
      in: path
      description: Projekt Phase ID
      required: true
      schema:
        type: integer
    get:
      summary: List proposals for a projekt phase
      tags:
      - Proposals
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        description: Pagination page number
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Items per page (default 100)
        schema:
          type: integer
      - name: for_public_render
        in: query
        required: false
        description: If true, filters to proposals visible for public render
        schema:
          type: boolean
      responses:
        '200':
          description: proposals found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      proposals:
                        type: array
                        items:
                          type: object
                    required:
