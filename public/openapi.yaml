---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/deficiency_reports":
    get:
      summary: List deficiency reports
      tags:
      - Deficiency Reports
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        description: Pagination page number
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Items per page (default 100)
        schema:
          type: integer
      responses:
        '200':
          description: deficiency reports found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deficiency_reports:
                        type: array
                        items:
                          type: object
                    required:
                    - deficiency_reports
                  pagination:
                    type: object
                required:
                - data
    post:
      summary: Create a deficiency report
      tags:
      - Deficiency Reports
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: deficiency report created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deficiency_report:
                        type: object
                    required:
                    - deficiency_report
                required:
                - data
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deficiency_report:
                  type: object
                  properties:
                    author_id:
                      type: integer
                    deficiency_report_category_id:
                      type: integer
                    deficiency_report_status_id:
                      type: integer
                    title:
                      type: string
                    description:
                      type: string
                      nullable: true
                    resource_terms:
                      type: boolean
                    admin_accepted:
                      type: boolean
                    map_location_attributes:
                      type: object
                      properties:
                        latitude:
                          type: number
                        longitude:
                          type: number
                        zoom:
                          type: integer
                      required:
                      - latitude
                      - longitude
                  required:
                  - author_id
                  - deficiency_report_category_id
                  - title
                  - resource_terms
                  - map_location_attributes
              required:
              - deficiency_report
        description: Deficiency Report payload
  "/api/deficiency_reports/{id}":
    parameters:
    - name: id
      in: path
      description: Deficiency Report ID
      required: true
      schema:
        type: integer
    get:
      summary: Retrieve a deficiency report
      tags:
      - Deficiency Reports
      security:
      - bearer_auth: []
      responses:
        '200':
          description: deficiency report found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deficiency_report:
                        type: object
                    required:
                    - deficiency_report
                required:
                - data
        '404':
          description: deficiency report not found
    patch:
      summary: Update a deficiency report
      tags:
      - Deficiency Reports
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: deficiency report updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deficiency_report:
                        type: object
                    required:
                    - deficiency_report
                required:
                - data
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deficiency_report:
                  type: object
                  properties:
                    title:
                      type: string
                    deficiency_report_status_id:
                      type: integer
        description: Attributes to update on the deficiency report
  "/api/projekts/{projekt_id}/projekt_phases":
    parameters:
    - name: projekt_id
      in: path
      description: Projekt ID
      required: true
      schema:
        type: integer
    get:
      summary: List projekt phases for a projekt
      tags:
      - Projekt Phases
      security:
      - bearer_auth: []
      responses:
        '200':
          description: projekt phases found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projekt_phases:
                        type: array
                        items:
                          "$ref": "#/components/schemas/ProjektPhase"
                    required:
                    - projekt_phases
                required:
                - data
    post:
      summary: Create a projekt phase
      tags:
      - Projekt Phases
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: projekt phase created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projekt_phase:
                        "$ref": "#/components/schemas/ProjektPhase"
                    required:
                    - projekt_phase
                required:
                - data
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projekt_phase:
                  type: object
                  properties:
                    type:
                      type: string
                      example: ProjektPhase::CommentPhase
                    active:
                      type: boolean
                    frontend_visibility:
                      type: boolean
                    start_date:
                      type: string
                      format: date
                      nullable: true
                    end_date:
                      type: string
                      format: date
                      nullable: true
                    given_order:
                      type: integer
                      nullable: true
                    phase_tab_name:
                      type: string
                      nullable: true
                      description: Translated attribute
                  required:
                  - type
              required:
              - projekt_phase
        description: Projekt Phase creation payload
  "/api/projekt_phases/{id}":
    parameters:
    - name: id
      in: path
      description: Projekt Phase ID
      required: true
      schema:
        type: integer
    get:
      summary: Retrieve a projekt phase
      tags:
      - Projekt Phases
      security:
      - bearer_auth: []
      responses:
        '200':
          description: projekt phase found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projekt_phase:
                        "$ref": "#/components/schemas/ProjektPhase"
                    required:
                    - projekt_phase
                required:
                - data
        '404':
          description: projekt phase not found
    patch:
      summary: Update a projekt phase
      tags:
      - Projekt Phases
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: projekt phase updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projekt_phase:
                        "$ref": "#/components/schemas/ProjektPhase"
                    required:
                    - projekt_phase
                required:
                - data
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projekt_phase:
                  type: object
                  properties:
                    active:
                      type: boolean
                    frontend_visibility:
                      type: boolean
                    phase_tab_name:
                      type: string
                      nullable: true
        description: Attributes to update on the projekt phase
    delete:
      summary: Delete a projekt phase
      tags:
      - Projekt Phases
      security:
      - bearer_auth: []
      responses:
        '200':
          description: projekt phase deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
        '404':
          description: projekt phase not found
        '422':
          description: unable to delete projekt phase
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: object
  "/api/projekts":
    get:
      summary: List all projekts
      tags:
      - Projekts
      security:
      - bearer_auth: []
      parameters:
      - name: only_visible
        in: query
        required: false
        description: If true, returns only activated projekts with published custom
          pages that are shown in overview
        schema:
          type: boolean
      - name: include_phases
        in: query
        required: false
        description: If false, excludes projekt phases from response. Default is true.
        schema:
          type: boolean
      - name: include_content_blocks
        in: query
        required: false
        description: If false, excludes content blocks from response. Default is true.
        schema:
          type: boolean
      responses:
        '200':
          description: projekts found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projekts:
                        type: array
                        items:
                          "$ref": "#/components/schemas/Projekt"
                    required:
                    - projekts
                required:
                - data
    post:
      summary: Create a projekt
      tags:
      - Projekts
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: projekt created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projekt:
                        "$ref": "#/components/schemas/Projekt"
                    required:
                    - projekt
                required:
                - data
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projekt:
                  type: object
                  properties:
                    name:
                      type: string
                    parent_id:
                      type: integer
                      nullable: true
                    total_duration_start:
                      type: string
                      format: datetime
                      nullable: true
                    total_duration_end:
                      type: string
                      format: datetime
                      nullable: true
                    show_start_date_in_frontend:
                      type: boolean
                    show_end_date_in_frontend:
                      type: boolean
                    geozone_affiliated:
                      type: boolean
                    order_number:
                      type: integer
                    tag_list:
                      type: string
                      nullable: true
                    related_sdg_list:
                      type: string
                      nullable: true
                    landing_page_ids:
                      type: array
                      items:
                        type: integer
                    geozone_affiliation_ids:
                      type: array
                      items:
                        type: integer
                    sdg_goal_ids:
                      type: array
                      items:
                        type: integer
                    individual_group_value_ids:
                      type: array
                      items:
                        type: integer
                    map_location_attributes:
                      type: object
                      properties:
                        latitude:
                          type: number
                        longitude:
                          type: number
                        zoom:
                          type: integer
                    image_attributes:
                      type: object
                      properties:
                        image:
                          type: string
                          nullable: true
                        cached_attachment:
                          type: string
                          nullable: true
                        title:
                          type: string
                          nullable: true
                        user_id:
                          type: integer
                          nullable: true
                    projekt_manager_assignments_attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            nullable: true
                          projekt_manager_id:
                            type: integer
                          projekt_id:
                            type: integer
                          permissions:
                            type: array
                            items:
                              type: string
                  required:
                  - name
              required:
              - projekt
        description: Projekt creation payload
