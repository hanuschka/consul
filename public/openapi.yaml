                required:
                - data
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                proposal:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    responsible_name:
                      type: string
                    geozone_id:
                      type: integer
                    resource_terms:
                      type: boolean
                  required:
                  - title
                  - description
                  - responsible_name
                  - geozone_id
                  - resource_terms
              required:
              - proposal
        description: Proposal creation payload
