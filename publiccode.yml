description:
  de:
    localisedName: Öffentlichkeitsbeteiligung in der Stadt Regensburg
    genericName: Bürgerbeteiligungsplattform
    shortDescription: >-
      Digitale Beteiligungsplattform der Stadt Regensburg für Bürgerhaushalt,
      Vorschläge und weitere Beteiligungsformate.
    longDescription: >-
      Auf der Plattform „Öffentlichkeitsbeteiligung in der Stadt Regensburg“
      können Bürgerinnen und Bürger Vorschläge einreichen, diskutieren und
      über Beteiligungsprojekte wie den Bürgerhaushalt abstimmen.
      Beteiligungsverfahren werden als Projekte mit eigenen Phasen
      abgebildet – von der Ideensammlung über die Diskussion bis zur
      Abstimmung und der Rückmeldung der Verwaltung. Ortsbezogene Anliegen
      und Projekte können auf einer interaktiven Karte verortet werden. Ein
      geschützter Verwaltungsbereich dient der Redaktion, Moderation und
      Auswertung der eingegangenen Beiträge. Die Plattform basiert auf einer
      angepassten Version der Open-Source-Software Consul, ist
      datenschutzfreundlich vorkonfiguriert und wird von demokratie.today
      betrieben, gehostet und weiterentwickelt.
    documentation: 'https://gitlab.opencode.de/regensburg_next/mein.regensburg/-/blob/cli_reg_2/BETRIEBSHANDBUCH.md'
    apiDocumentation: 'https://mein.regensburg.de/api/docs'
    features:
      - Bürgerbeteiligung
      - Bürgerhaushalt
      - Vorschläge und Abstimmungen
      - Diskussionsforen
      - Ortsbezogene Beteiligung auf interaktiver Karte
      - Geschützter Redaktions- und Moderationsbereich
    screenshots:
      - doc/publiccode/screenshot.png
  en:
    localisedName: Public participation in the city of Regensburg
    genericName: Citizen participation platform
    shortDescription: >-
      Digital participation platform of the city of Regensburg for
      participatory budgeting, proposals and further participation formats.
    longDescription: >-
      On the platform "Public participation in the city of Regensburg",
      citizens can submit and discuss proposals and vote on participation
      projects such as the participatory budget. Participation procedures are
      modelled as projects with phases of their own - from collecting ideas
      through discussion to voting and the administration's response.
      Location-based concerns and projects can be placed on an interactive map.
      A protected administration area serves editorial work, moderation and the
      evaluation of the contributions received. The platform is based on a
      customised version of the open source software Consul, comes
      preconfigured in a privacy-friendly way and is operated, hosted and
      further developed by demokratie.today.
    documentation: 'https://gitlab.opencode.de/regensburg_next/mein.regensburg/-/blob/cli_reg_2/BETRIEBSHANDBUCH.md'
    apiDocumentation: 'https://mein.regensburg.de/api/docs'
    features:
      - Citizen participation
      - Participatory budgeting
      - Proposals and voting
      - Discussion forums
      - Location-based participation on an interactive map
      - Protected editorial and moderation area
    screenshots:
      - doc/publiccode/screenshot.png
