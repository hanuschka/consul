  - web

# Nur Werte aus der publiccode-Kategorienliste sind zulässig
# (https://yml.publiccode.tools/categories-list.html); "e-democracy" existiert dort nicht.
categories:
  - digital-citizenship
  - online-community

developmentStatus: stable

softwareType: standalone/web

description:
  de:
    localisedName: Mitmachportal
    genericName: Bürgerbeteiligungsplattform
    shortDescription: >-
      Digitale Beteiligungsplattform der Stadt Würzburg für Bürgerhaushalt,
      Vorschläge und weitere Beteiligungsformate.
    longDescription: >-
      Das Mitmachportal ist die Online-Beteiligungsplattform der Stadt
      Würzburg. Bürgerinnen und Bürger können Vorschläge einreichen,
      diskutieren und über Beteiligungsprojekte wie den Bürgerhaushalt
      abstimmen. Beteiligungsverfahren werden als Projekte mit eigenen
      Phasen abgebildet – von der Ideensammlung über die Diskussion bis
      zur Abstimmung und der Rückmeldung der Verwaltung. Ortsbezogene
      Anliegen und Projekte können auf einer interaktiven Karte verortet
      werden; für die Anmeldung stehen neben der klassischen
      Registrierung auch staatliche Anmeldedienste wie die BundID zur
      Verfügung. Die Plattform basiert auf einer angepassten Version der
      Open-Source-Software Consul, ist datenschutzfreundlich
      vorkonfiguriert und wird von demokratie.today betrieben, gehostet
      und weiterentwickelt.
    features:
      - Bürgerbeteiligung
      - Bürgerhaushalt
      - Vorschläge und Abstimmungen
      - Diskussionsforen
      - Ortsbezogene Beteiligung auf interaktiver Karte
    screenshots:
      - 'https://mitmachportal.wuerzburg.de/assets/screenshot-1.png'  # PLATZHALTER

