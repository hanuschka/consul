publiccodeYmlVersion: '0.4'
name: '{{PORTAL_NAME}}' # Public name of the instance, e.g. "Mitmachportal Würzburg".
url: '{{OPENCODE_REPO_URL}}' # HTTPS URL of the openCoDE repository this file is published in.
landingURL: '{{PORTAL_URL}}'
landingUrl: '{{PORTAL_URL}}'
isBasedOn: 'https://github.com/consuldemocracy/consuldemocracy'
softwareVersion: '{{RELEASE_DATE}}' # Date of the pushed code state, format YYYY-MM-DD. Keep both in sync.
releaseDate: '2026-06-29'
logo: logo.png
platforms:
  - web
categories:
  - digital-citizenship
  - online-community
  - smart-city
developmentStatus: stable
softwareType: standalone/web
description:
  de:
    localisedName: '{{PORTAL_LOCALISED_NAME}}' # Long form of the portal name, e.g. "Mitmachportal der Region Würzburg".
    genericName: Bürgerbeteiligungsplattform
    shortDescription: >-
      Digitale Beteiligungsplattform {{CLIENT_GENITIVE}} für Bürgerhaushalt,
      Vorschläge und weitere Beteiligungsformate.
    longDescription: >-
      {{PORTAL_NAME}} ist die Online-Beteiligungsplattform
      {{CLIENT_GENITIVE}}. Bürgerinnen und Bürger können Vorschläge
      einreichen, diskutieren und über Beteiligungsprojekte wie den
      Bürgerhaushalt abstimmen.
      Beteiligungsverfahren werden als Projekte mit eigenen Phasen
      abgebildet – von der Ideensammlung über die Diskussion bis zur
      Abstimmung und der Rückmeldung der Verwaltung. Ortsbezogene Anliegen
      und Projekte können auf einer interaktiven Karte verortet werden. Ein
      geschützter Verwaltungsbereich dient der Redaktion, Moderation und
      Auswertung der eingegangenen Beiträge. Die Plattform basiert auf einer
      angepassten Version der Open-Source-Software Consul, ist
      datenschutzfreundlich vorkonfiguriert und wird von demokratie.today
      betrieben, gehostet und weiterentwickelt.
    documentation: '{{OPENCODE_REPO_URL}}/-/blob/{{CLIENT_BRANCH}}/BETRIEBSHANDBUCH.md'
    apiDocumentation: '{{PORTAL_URL}}/api/docs'
    features:
      - Bürgerbeteiligung
      - Bürgerhaushalt
      - Vorschläge und Abstimmungen
      - Diskussionsforen
      - Ortsbezogene Beteiligung auf interaktiver Karte
      - Geschützter Redaktions- und Moderationsbereich
    screenshots:
      - doc/publiccode/screenshot.png
legal:
  license: AGPL-3.0
  mainCopyrightOwner: demokratie.today
  repoOwner: '{{CLIENT_NAME}}' # Owner of the openCoDE repository, e.g. "Stadt Würzburg".
maintenance:
  type: contract
  contractors:
    - name: demokratie.today
      email: info@demokratie.today
      website: 'https://demokratie.today'
      until: '{{CONTRACT_UNTIL}}' # End of the current maintenance contract, format YYYY-MM-DD.
localisation:
  localisationReady: true
  availableLanguages:
    - de
intendedAudience:
  countries:
    - de
  scope:
    - local-authorities

usedBy: # Add every public body operating this instance (e.g. city and district).
  - '{{CLIENT_NAME}}'
dependsOn:
  open:
    - name: Ruby on Rails
    - name: PostgreSQL
