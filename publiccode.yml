description:
  de:
    localisedName: Öffentlichkeitsbeteiligung in der Stadt Regensburg
    genericName: Bürgerbeteiligungsplattform
    shortDescription: >-
      Digitale Beteiligungsplattform der Stadt Regensburg für Bürgerhaushalt,
      Vorschläge und weitere Beteiligungsformate.
    longDescription: >-
      Auf der Plattform „Öffentlichkeitsbeteiligung in der Stadt Regensburg“
      können Bürgerinnen und Bürger Vorschläge einreichen, diskutieren und
      über Beteiligungsprojekte wie den Bürgerhaushalt abstimmen.
      Beteiligungsverfahren werden als Projekte mit eigenen Phasen
      abgebildet – von der Ideensammlung über die Diskussion bis zur
      Abstimmung und der Rückmeldung der Verwaltung. Ortsbezogene Anliegen
      und Projekte können auf einer interaktiven Karte verortet werden. Ein
      geschützter Verwaltungsbereich dient der Redaktion, Moderation und
      Auswertung der eingegangenen Beiträge. Die Plattform basiert auf einer
      angepassten Version der Open-Source-Software Consul, ist
      datenschutzfreundlich vorkonfiguriert und wird von demokratie.today
      betrieben, gehostet und weiterentwickelt.
    documentation: 'https://gitlab.opencode.de/regensburg_next/mein.regensburg/-/blob/cli_reg_2/BETRIEBSHANDBUCH.md'
    apiDocumentation: 'https://mein.regensburg.de/api/docs'
    features:
      - Bürgerbeteiligung
      - Bürgerhaushalt
      - Vorschläge und Abstimmungen
      - Diskussionsforen
      - Ortsbezogene Beteiligung auf interaktiver Karte
      - Geschützter Redaktions- und Moderationsbereich
    screenshots:
      - doc/publiccode/screenshot.png
