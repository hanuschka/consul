applicationSuite: demokratie.today
url: 'https://gitlab.opencode.de/wuerzburg/mitmachportal'  # PLATZHALTER - tatsächliche Repo-URL eintragen
landingURL: 'https://mitmachportal.wuerzburg.de'
softwareVersion: '1.0.0'          # PLATZHALTER - aktuelle Versionsnummer eintragen
releaseDate: '2024-01-01'         # PLATZHALTER - tatsächliches Erstveröffentlichungsdatum
