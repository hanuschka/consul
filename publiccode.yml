description:
  de:
    localisedName: Mitmachportal der Region Würzburg
    genericName: Bürgerbeteiligungsplattform
    shortDescription: >-
      Digitale Beteiligungsplattform von Stadt und Landkreis Würzburg für
      Bürgerhaushalt, Vorschläge und weitere Beteiligungsformate.
    longDescription: >-
      Das Mitmachportal ist die Online-Beteiligungsplattform von Stadt und
      Landkreis Würzburg. Bürgerinnen und Bürger können Vorschläge einreichen,
      diskutieren und über Beteiligungsprojekte wie den Bürgerhaushalt
      abstimmen. Beteiligungsverfahren werden als Projekte mit eigenen Phasen
      abgebildet – von der Ideensammlung über die Diskussion bis zur Abstimmung
      und der Rückmeldung der Verwaltung. Ortsbezogene Anliegen und Projekte
      können auf einer interaktiven Karte verortet werden. Ein geschützter
      Verwaltungsbereich dient der Redaktion, Moderation und Auswertung der
      eingegangenen Beiträge. Die Plattform basiert auf einer angepassten
      Version der Open-Source-Software Consul, ist datenschutzfreundlich
      vorkonfiguriert und wird von demokratie.today betrieben, gehostet und
      weiterentwickelt.
    features:
      - Bürgerbeteiligung
      - Bürgerhaushalt
      - Vorschläge und Abstimmungen
      - Diskussionsforen
      - Ortsbezogene Beteiligung auf interaktiver Karte
      - Geschützter Redaktions- und Moderationsbereich
    screenshots:
      - doc/publiccode/screenshot.png
    documentation: >-
      https://gitlab.opencode.de/wuerzburg/mitmachportal/mitmachportal/-/blob/cli_wur_2/BETRIEBSHANDBUCH.md
    apiDocumentation: 'https://mitmachportal.wuerzburg.de/api/docs'
  en:
    localisedName: Mitmachportal der Region Würzburg
    genericName: Citizen participation platform
    shortDescription: >-
      Digital participation platform by the City and District of Würzburg for
      citizen budgeting, proposals, and other participation formats.
    longDescription: >-
      The Mitmachportal is the online participation platform of the City and
      District of Würzburg. Citizens can submit proposals, engage in
      discussions, and vote on participation projects such as the citizen
      budget. Participation processes are structured as projects with distinct
      phases—from idea collection and discussion to voting and administrative
      feedback. Location-based concerns and projects can be pinned on an
      interactive map. A secure administrative area is used for editing,
      moderating, and evaluating submitted contributions. The platform is based
      on a customized version of the open-source software Consul, comes
      pre-configured with privacy-friendly settings, and is operated, hosted,
      and further developed by demokratie.today.
    features:
      - Citizen participation
      - Citizen budget (participatory budgeting)
      - Proposals and voting
      - Discussion forums
      - Location-based participation on an interactive map
      - Secure editorial and moderation area