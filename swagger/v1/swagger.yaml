        blockable_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: datetime
          example: '2024-01-01T00:00:00Z'
        updated_at:
          type: string
          format: datetime
          example: '2024-01-01T00:00:00Z'
      required:
