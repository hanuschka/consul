components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Projekt:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Sample Projekt
        parent_id:
          type: integer
          nullable: true
          example:
        created_at:
          type: string
          format: datetime
          example: '2024-01-01T00:00:00Z'
        updated_at:
          type: string
          format: datetime
          example: '2024-01-01T00:00:00Z'
        order_number:
          type: integer
          nullable: true
          example: 1
        total_duration_start:
          type: string
          format: datetime
          nullable: true
          example: '2024-01-01T00:00:00Z'
        total_duration_end:
          type: string
          format: datetime
          nullable: true
          example: '2024-12-31T23:59:59Z'
        comments_count:
          type: integer
          nullable: true
          example: 0
        geozone_affiliated:
          type:
          - boolean
          - string
          nullable: true
          example: false
        level:
          type: integer
          nullable: true
          example: 0
        show_start_date_in_frontend:
          type:
          - boolean
          - string
          nullable: true
          example: true
        show_end_date_in_frontend:
          type:
          - boolean
          - string
          nullable: true
          example: true
        top_level_projekt_id:
          type: integer
          nullable: true
          example:
        tsv:
          type: string
          nullable: true
          example:
        preview_code:
          type: string
          nullable: true
          example: abc123
        page:
          type: object
          nullable: true
          properties:
            title:
              type: string
              nullable: true
              example: Sample Projekt Page
            slug:
              type: string
              nullable: true
              example: sample-projekt
        projekt_settings:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                example: show_map
              value:
                type: string
                nullable: true
                example: 'true'
          example:
          - key: show_map
            value: 'true'
          - key: enable_comments
            value: 'false'
        projekt_phases:
          type: array
          items:
            "$ref": "#/components/schemas/ProjektPhase"
        content_blocks:
          type: array
          items:
            "$ref": "#/components/schemas/ContentBlock"
      required:
      - id
      - name
      - created_at
      - updated_at
    ImageAttributesApi:
      type: object
      description: 'Attributes for updating the projekt page image. Provide attachment
        (base64-encoded)/title/credits to create/update, or _destroy=true to remove
        the image. Defaults: _destroy=false.'
      properties:
        title:
          type: string
          nullable: true
          description: Human-readable title/alt text for the image. Optional.
          example: Cover Image Title
        attachment:
          type: string
          nullable: true
          description: 'Base64-encoded image file data. Supported formats: JPEG, PNG,
            GIF, WebP. Example: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="'
        credits:
          type: string
          nullable: true
          description: Attribution/credits for the image. Optional.
          example: Photo by John Doe
        _destroy:
          type: boolean
          nullable: true
          default: false
          description: 'If true, deletes the current projekt page image. Default:
            false.'
          example: false
    ProjektImageUpdateParams:
      type: object
      description: 'Body for updating projekt page image. Provide attachment/title/credits
        to create/update, or _destroy=true to remove. Defaults: _destroy=false.'
      properties:
        image:
          "$ref": "#/components/schemas/ImageAttributesApi"
      required:
      - image
    ProjektCreateParams:
      type: object
      properties:
        projekt:
          type: object
          properties:
            name:
              type: string
            parent_id:
              type: integer
              nullable: true
            total_duration_start:
              type: string
              format: date_time
              nullable: true
            total_duration_end:
              type: string
              format: date_time
              nullable: true
            show_start_date_in_frontend:
              type: boolean
            show_end_date_in_frontend:
              type: boolean
            geozone_affiliated:
              type: boolean
            order_number:
              type: integer
              nullable: true
            tag_list:
              type: string
              nullable: true
            related_sdg_list:
              type: string
              nullable: true
            landing_page_ids:
              type: array
              items:
                type: integer
            geozone_affiliation_ids:
              type: array
              items:
                type: integer
            sdg_goal_ids:
              type: array
              items:
                type: integer
            individual_group_value_ids:
              type: array
              items:
                type: integer
            map_location_attributes:
              type: object
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
                zoom:
                  type: integer
            projekt_manager_assignments_attributes:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    nullable: true
                  projekt_manager_id:
                    type: integer
                  projekt_id:
                    type: integer
                  permissions:
                    type: array
                    items:
                      type: string
          required:
          - name
      required:
      - projekt
    ProjektUpdateParams:
      type: object
      properties:
        projekt:
          type: object
          properties:
            name:
              type: string
            parent_id:
              type: integer
              nullable: true
            total_duration_start:
              type: string
              format: date_time
              nullable: true
            total_duration_end:
              type: string
              format: date_time
              nullable: true
            show_start_date_in_frontend:
              type: boolean
            show_end_date_in_frontend:
              type: boolean
            geozone_affiliated:
              type: boolean
            order_number:
              type: integer
              nullable: true
            tag_list:
              type: string
              nullable: true
            related_sdg_list:
              type: string
              nullable: true
            landing_page_ids:
              type: array
              items:
                type: integer
            geozone_affiliation_ids:
              type: array
              items:
                type: integer
            sdg_goal_ids:
              type: array
              items:
                type: integer
            individual_group_value_ids:
              type: array
              items:
                type: integer
            map_location_attributes:
              type: object
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
                zoom:
                  type: integer
            projekt_manager_assignments_attributes:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    nullable: true
                  projekt_manager_id:
                    type: integer
                  projekt_id:
                    type: integer
                  permissions:
                    type: array
                    items:
                      type: string
      required:
      - projekt
    ProjektPhase:
      type: object
      properties:
        id:
          type: integer
          example: 1
        phase_tab_name:
          type: string
          example: Planning Phase
        type:
          type: string
          example: ProjektPhase::InformationPhase
        projekt_id:
          type: integer
          example: 1
        active:
          type: boolean
          example: true
        visible:
          type: boolean
          example: true
        position:
          type: integer
          example: 0
        start_date:
          type: string
          format: datetime
          nullable: true
          example: '2024-01-01T00:00:00Z'
        end_date:
          type: string
          format: datetime
          nullable: true
          example: '2024-03-31T23:59:59Z'
        created_at:
          type: string
          format: datetime
          example: '2024-01-01T00:00:00Z'
        updated_at:
