      - position
      - blockable_type
      - blockable_id
    ProjektPhaseSetting:
      type: object
      properties:
        id:
          type: integer
          example: 1
        key:
          type: string
          example: feature.general.newest_first
        value:
          type: string
          nullable: true
          example: active
      required:
      - id
      - key
    Poll:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Community Vote
        summary:
          type: string
