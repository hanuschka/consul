                        items:
                          type: string
        '403':
          description: forbidden - admin access required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: object
                  properties:
                    body:
                      type: string
                    parent_id:
                      type: integer
                      nullable: true
                    ancestry:
                      type: string
                      nullable: true
                  required:
