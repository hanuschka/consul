---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/budget_investments":
    get:
      summary: List budget investments
      tags:
      - Budget Investments
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        description: Pagination page number
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Items per page (default 100)
        schema:
          type: integer
      - name: budget_id
        in: query
        required: false
        description: Filter by budget ID
        schema:
          type: integer
      - name: heading_id
        in: query
        required: false
        description: Filter by heading ID
        schema:
          type: integer
      - name: group_id
        in: query
        required: false
        description: Filter by group ID
        schema:
          type: integer
      - name: feasibility
        in: query
        required: false
        description: Filter by feasibility (feasible, unfeasible, undecided)
        schema:
          type: string
      - name: selected
        in: query
        required: false
        description: Filter by selection status (true, false)
        schema:
          type: string
      - name: order
        in: query
        required: false
        description: Sort order (id, supports, confidence_score, price, ballots, newest)
        schema:
          type: string
      responses:
        '200':
          description: budget investments found with public_data access
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      budget_investments:
                        type: array
                        items:
                          type: object
                    required:
                    - budget_investments
                  pagination:
                    type: object
                required:
                - data
        '403':
          description: forbidden - insufficient access
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: string
    post:
      summary: Create a budget investment
      tags:
      - Budget Investments
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: budget investment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      budget_investment:
                        type: object
                    required:
                    - budget_investment
                required:
                - data
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
        '403':
          description: forbidden - admin access required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                budget_investment:
                  type: object
                  properties:
                    heading_id:
                      type: integer
                    title:
                      type: string
                    description:
                      type: string
                    video_url:
                      type: string
                      nullable: true
                    on_behalf_of:
                      type: string
                      nullable: true
                    resource_terms:
                      type: boolean
                    price:
                      type: number
                      nullable: true
                    map_location_attributes:
                      type: object
                      properties:
                        latitude:
                          type: number
                        longitude:
                          type: number
                        zoom:
                          type: integer
                      required:
                      - latitude
                      - longitude
                    translations_attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          locale:
                            type: string
                          title:
                            type: string
                          description:
                            type: string
                    tag_list:
                      type: array
                      items:
                        type: string
                  required:
                  - heading_id
                  - title
                  - description
                  - resource_terms
              required:
              - budget_investment
        description: Budget investment payload
  "/api/budget_investments/{id}":
    parameters:
    - name: id
      in: path
      description: Budget Investment ID
      required: true
      schema:
        type: integer
    get:
      summary: Retrieve a budget investment
      tags:
      - Budget Investments
      security:
      - bearer_auth: []
      responses:
        '200':
          description: budget investment found with public_data access
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      budget_investment:
                        type: object
                    required:
                    - budget_investment
                required:
                - data
        '404':
          description: budget investment not found
        '403':
          description: forbidden - insufficient access
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: string
    patch:
      summary: Update a budget investment
      tags:
      - Budget Investments
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: budget investment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      budget_investment:
                        type: object
                    required:
                    - budget_investment
                required:
                - data
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          type: string
        '403':
          description: forbidden - admin access required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      messages:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                budget_investment:
                  type: object
                  properties:
                    title:
                      type: string
                      nullable: true
                    description:
                      type: string
                      nullable: true
                    video_url:
                      type: string
                      nullable: true
                    on_behalf_of:
                      type: string
                      nullable: true
                    price:
                      type: number
                      nullable: true
                    feasibility:
                      type: string
                      nullable: true
                      enum:
                      - feasible
                      - unfeasible
                      - undecided
                    valuation_finished:
                      type: boolean
                      nullable: true
                    selected:
                      type: boolean
                      nullable: true
                    translations_attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          locale:
                            type: string
                          title:
                            type: string
                            nullable: true
                          description:
                            type: string
                            nullable: true
                    tag_list:
                      type: array
                      items:
                        type: string
        description: Attributes to update on the budget investment
